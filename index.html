    g.beginPath(); g.moveTo(S * 0.66, S * 0.44); g.quadraticCurveTo(S * 0.78, S * 0.38, S * 0.79, S * 0.26); g.stroke();
    g.fillStyle = body;
    g.beginPath(); g.ellipse(S * 0.81, S * 0.23, S * 0.07, S * 0.05, 0.5, 0, 6.283); g.fill();
    g.strokeStyle = dark; g.lineWidth = S * 0.022;
    g.beginPath(); g.moveTo(S * 0.83, S * 0.19); g.lineTo(S * 0.90, S * 0.07); g.moveTo(S * 0.86, S * 0.13); g.lineTo(S * 0.94, S * 0.14); g.stroke();
    g.fillStyle = dark;
    for (var m = 0; m < 4; m++) g.fillRect(S * (0.30 + m * 0.105), S * 0.60, S * 0.035, S * 0.26);
  }
  return tex(c, false);
}
function buildHerd(scene, P, R, U, H) {
  if (P.weather.rain > 0.5 || P.timeA === 'night') return;
  var opts = [];
  for (var k in HERDS) if (HERDS[k].biomes.indexOf(P.biomeKey) >= 0) opts.push(k);
  if (!opts.length || R.f() > 0.62) return;
  var kind = R.pick(opts), Hd = HERDS[kind];
  var n = R.int(Hd.n[0], Hd.n[1]);
  /* the herd keeps together: one centre, animals scattered around it */
  var hlim = visibleHalfAngle(P) * 0.85;
  var ha = R.range(-hlim, hlim), hr = R.range(45, 210);
  var hx = Math.sin(ha) * hr, hz = -Math.cos(ha) * hr;
  if (P.waterY != null && H(hx, hz) < P.waterY + 0.6) return;
  var spread = R.range(9, 30);
  var quad = new THREE.PlaneGeometry(1, 1);
  quad.translate(0, 0.5, 0);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var iPos = new Float32Array(n * 3), iAttr = new Float32Array(n * 4), made = 0;
  for (var i = 0; i < n; i++) {
    var a = R.range(0, 6.283), rr = Math.sqrt(R.f()) * spread;
    var x = hx + Math.cos(a) * rr, z = hz + Math.sin(a) * rr;
    if (P.waterY != null && H(x, z) < P.waterY + 0.3) continue;
    if (!plantable(P, H, x, z)) continue;
    iPos[made * 3] = x; iPos[made * 3 + 1] = H(x, z); iPos[made * 3 + 2] = z;
    iAttr[made * 4] = R.range(Hd.size[0], Hd.size[1]) * (R.f() < 0.18 ? 0.62 : 1);   /* the odd youngster */
    iAttr[made * 4 + 1] = R.range(0, 6.283);
    iAttr[made * 4 + 2] = R.range(0.7, 1.3);
    iAttr[made * 4 + 3] = R.f() < 0.5 ? 1 : -1;                                       /* which way it faces */
    made++;
  }
  if (!made) return;
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = made;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uCamPos: U.uCamPos, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow,
      uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
      uMap: { value: makeHerdTexture(kind, Hd) },
      uGraze: { value: Hd.graze }, uSpeed: { value: Hd.speed }
    },
    alphaTest: 0.25, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr;',
      'uniform float uTime, uFogDensity, uShadow, uGraze, uSpeed;',
      'uniform vec3 uCamPos, uSunDir, uSunCol, uAmbCol, uFogCol;',
      'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
      GLSL_COMMON,
      'void main(){',
      '  float size = iAttr.x, ph = iAttr.y, rate = iAttr.z, face = iAttr.w;',
      '  float t = uTime * uSpeed * rate + ph;',
      /* it wanders a few metres, taking its time about it */
      '  vec3 wp = iPos;',
      '  wp.x += sin(t) * 3.4 + sin(t * 0.37 + ph) * 2.1;',
      '  wp.z += cos(t * 0.81 + ph) * 3.0 + cos(t * 0.29) * 1.8;',
      /* head down to graze for long stretches, up now and then to look around */
      '  float look = step(0.82, fract(t * 0.6 + ph * 0.13));',
      '  float head = mix(uGraze, 0.0, look);',
      '  vec3 toCam = normalize(vec3(uCamPos.x - wp.x, 0.0, uCamPos.z - wp.z));',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam)) * face;',
      /* grazing tips the whole body forward a little */
      '  float lean = head * 0.22;',
      '  float lc = cos(lean), ls = sin(lean);',
      '  vec2 q = vec2(position.x * lc - position.y * ls, position.x * ls + position.y * lc);',
      '  vec3 lp = right * q.x * size * 1.15 + vec3(0.0, q.y * size, 0.0);',
      '  vec3 p = wp + lp;',
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.35, 1.0, baked(wp.xz));',
      '  vTint = uAmbCol * 1.05 + uSunCol * 0.8 * sh;',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vFog = fogAmtH(-mv.z, uFogDensity, p.y);',
      '  vHaze = hazeToward(uFogCol, normalize(p - cameraPosition), uSunDir, uSunCol);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap;',
      'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
      'void main(){',
      '  vec4 t = texture2D(uMap, vUv);',
      '  if (t.a < 0.25) discard;',
      '  gl_FragColor = vec4(tone(mix(t.rgb * vTint, vHaze, vFog)), smoothstep(0.3, 0.7, t.a));',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  scene.add(m);
  App.propMeshes.push(m);
  P.herdKind = kind;
  P.herdCount = made;
}

/* ---------- life on the water ----------
   A moored boat, ducks paddling, a heron standing still in the shallows. Water
   surfaces were completely bare. */
function makeWaterLifeTexture(kind) {
  var S = 96, c = cnv(S, S), g = c.getContext('2d');
  if (kind === 'duck') {
    g.fillStyle = '#4a4038';
    g.beginPath(); g.ellipse(S * 0.48, S * 0.58, S * 0.22, S * 0.12, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(S * 0.70, S * 0.44, S * 0.085, S * 0.09, 0, 0, 6.283); g.fill();
    g.fillStyle = '#2e5a3e';
    g.beginPath(); g.ellipse(S * 0.70, S * 0.42, S * 0.075, S * 0.078, 0, 0, 6.283); g.fill();
    g.fillStyle = '#c8a233';
    g.beginPath(); g.ellipse(S * 0.80, S * 0.47, S * 0.055, S * 0.028, 0.2, 0, 6.283); g.fill();
    g.fillStyle = '#6e6055';
    g.beginPath(); g.ellipse(S * 0.38, S * 0.55, S * 0.13, S * 0.07, -0.2, 0, 6.283); g.fill();
  } else { /* heron: tall, still, patient */
    g.strokeStyle = '#8e9298'; g.lineWidth = S * 0.035; g.lineCap = 'round';
    g.beginPath(); g.moveTo(S * 0.46, S * 0.95); g.lineTo(S * 0.47, S * 0.62); g.stroke();
    g.beginPath(); g.moveTo(S * 0.54, S * 0.95); g.lineTo(S * 0.53, S * 0.62); g.stroke();
    g.fillStyle = '#a9adb2';
    g.beginPath(); g.ellipse(S * 0.50, S * 0.56, S * 0.15, S * 0.11, -0.1, 0, 6.283); g.fill();
    g.strokeStyle = '#a9adb2'; g.lineWidth = S * 0.055;
    g.beginPath(); g.moveTo(S * 0.53, S * 0.50); g.quadraticCurveTo(S * 0.62, S * 0.36, S * 0.56, S * 0.22); g.stroke();
    g.fillStyle = '#b6babf';
    g.beginPath(); g.ellipse(S * 0.56, S * 0.19, S * 0.055, S * 0.045, 0, 0, 6.283); g.fill();
    g.fillStyle = '#d8b03a';
    g.beginPath(); g.moveTo(S * 0.60, S * 0.18); g.lineTo(S * 0.78, S * 0.21); g.lineTo(S * 0.60, S * 0.22); g.fill();
    g.fillStyle = '#3a4048';
    g.beginPath(); g.ellipse(S * 0.44, S * 0.55, S * 0.09, S * 0.06, 0.2, 0, 6.283); g.fill();
  }
  return tex(c, false);
}
function boatGeo(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  var len = R.range(1.5, 2.2);
  /* a hull as a shallow shell, pointed at both ends */
  var segs = 9;
  for (var i = 0; i < segs; i++) {
    var t = i / (segs - 1) - 0.5;
    var w = (1 - t * t * 3.4) * 0.42;
    if (w < 0.04) continue;
    pushBox(B, t * len, 0.12, 0, len / segs * 0.6, 0.13, w, 0);
  }
  pushBox(B, 0, 0.26, 0, len * 0.16, 0.04, 0.36, 0);        /* a thwart */
  pushBox(B, len * 0.30, 0.26, 0, len * 0.12, 0.04, 0.30, 0);
  return finishGeo(B);
}
function buildWaterLife(scene, P, R, U, H) {
  if (P.waterY == null || !P.biome.water) return;
  if (P.biome.water === 'sea' || P.biome.water === 'mirror') return;
  var wy = P.waterY;
  /* find open water somewhere ahead */
  var spots = [], guard = 0;
  while (spots.length < 40 && guard < 1200) {
    guard++;
    var wlim = visibleHalfAngle(P) * 0.88;
    var a = R.range(-wlim, wlim), rr = R.range(14, 130);
    var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
    if (H(x, z) < wy - 0.35) spots.push([x, z]);
  }
  if (spots.length < 6) return;

  /* a boat, moored or drifting */
  if (R.f() < 0.5) {
    var bs = spots[R.int(0, spots.length - 1)];
    var bmat = solidMat(U, R.pick(['#7a6448', '#8d6f4e', '#5f5a54', '#a8452f', '#3f5a72']), { rib: 0, grain: 1, spines: 0, barkN: 26, barkPlate: 9 });
    instanceSolid(scene, boatGeo(R), [[bs[0], wy - 0.10, bs[1], R.range(1.6, 2.6), R.range(0, 6.283), 1, 1]], bmat);
    P.hasBoat = true;
    App._features.push(['boat', bs[0], bs[1]]);
  }

  var kinds = [];
  if (R.f() < 0.7) kinds.push('duck');
  if (/marsh|lakefront|river|oasis/.test(P.biomeKey) && R.f() < 0.55) kinds.push('heron');
  for (var ki = 0; ki < kinds.length; ki++) {
    var kind = kinds[ki];
    var n = kind === 'duck' ? R.int(3, 9) : R.int(1, 2);
    var quad = new THREE.PlaneGeometry(1, 1);
    quad.translate(0, 0.5, 0);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);
    var iPos = new Float32Array(n * 3), iAttr = new Float32Array(n * 4), made = 0;
    /* ducks keep loosely together; herons stand alone at the edge */
    var cen = spots[R.int(0, spots.length - 1)];
    for (var i = 0; i < n; i++) {
      var s2 = kind === 'duck'
        ? [cen[0] + R.gauss() * 4.5, cen[1] + R.gauss() * 4.5]
        : spots[R.int(0, spots.length - 1)];
      if (kind === 'heron' && H(s2[0], s2[1]) < wy - 1.1) continue;   /* it needs to stand */
      iPos[made * 3] = s2[0];
      iPos[made * 3 + 1] = kind === 'heron' ? Math.max(H(s2[0], s2[1]), wy - 0.5) : wy - 0.04;
      iPos[made * 3 + 2] = s2[1];
      iAttr[made * 4] = kind === 'duck' ? R.range(0.30, 0.42) : R.range(1.0, 1.25);
      iAttr[made * 4 + 1] = R.range(0, 6.283);
      iAttr[made * 4 + 2] = kind === 'duck' ? R.range(0.5, 1.0) : R.range(0.05, 0.12);
      iAttr[made * 4 + 3] = R.f() < 0.5 ? 1 : -1;
      made++;
    }
    if (!made) continue;
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
    geo.instanceCount = made;
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uCamPos: U.uCamPos, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
        uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
        uMap: { value: makeWaterLifeTexture(kind) },
        uSwim: { value: kind === 'duck' ? 1.0 : 0.0 }
      },
      alphaTest: 0.25, side: THREE.DoubleSide,
      vertexShader: [
        'attribute vec3 iPos; attribute vec4 iAttr;',
        'uniform float uTime, uFogDensity, uSwim;',
        'uniform vec3 uCamPos, uSunDir, uSunCol, uAmbCol, uFogCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
        GLSL_COMMON,
        'void main(){',
        '  float size = iAttr.x, ph = iAttr.y, rate = iAttr.z, face = iAttr.w;',
        '  float t = uTime * rate * 0.10 + ph;',
        '  vec3 wp = iPos;',
        /* ducks paddle in slow arcs and bob; a heron barely moves at all */
        '  wp.x += (sin(t) * 2.6 + sin(t * 0.43 + ph) * 1.5) * uSwim;',
        '  wp.z += (cos(t * 0.77 + ph) * 2.2 + cos(t * 0.31) * 1.2) * uSwim;',
        '  wp.y += sin(uTime * 0.5 + ph) * 0.012 * uSwim;',
        '  vec3 toCam = normalize(vec3(uCamPos.x - wp.x, 0.0, uCamPos.z - wp.z));',
        '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam)) * face;',
        '  vec3 lp = right * position.x * size * 1.1 + vec3(0.0, position.y * size, 0.0);',
        '  vec3 p = wp + lp;',
        '  vTint = uAmbCol * 1.1 + uSunCol * 0.85 * max(uSunDir.y, 0.0);',
        '  vUv = uv;',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  vFog = fogAmt(-mv.z, uFogDensity);',
        '  vHaze = hazeToward(uFogCol, normalize(p - cameraPosition), uSunDir, uSunCol);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        GLSL_TONE,
        'uniform sampler2D uMap;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
        'void main(){',
        '  vec4 t = texture2D(uMap, vUv);',
        '  if (t.a < 0.25) discard;',
        '  gl_FragColor = vec4(tone(mix(t.rgb * vTint, vHaze, vFog)), smoothstep(0.3, 0.7, t.a));',
        '}'
      ].join('\n')
    });
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
    P.waterLife = (P.waterLife || '') + kind + ' ';
  }
}

/* ---------- roofs, for the view down from a tower ----------
   Seen from above, roofs are most of what there is, and they were flat lids. */
function buildRoofs(scene, P, R, U, items) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  pushCyl(B, 0, 0, 0, 0.5, 0.42, 1.0, 12);            /* a timber water tank */
  pushCone(B, 0, 1.0, 0, 0.55, 0.30, 12);
  for (var l = 0; l < 4; l++) {
    var la = l * 1.5708 + 0.785;
    pushBox(B, Math.cos(la) * 0.38, -0.55, Math.sin(la) * 0.38, 0.045, 0.55, 0.045, 0);
  }
  var tank = finishGeo(B);
  var C = { pos: [], nor: [], idx: [], rib: [] };
  pushBox(C, 0, 0.5, 0, 0.5, 0.5, 0.5, 0);            /* a plant room */
  var hut = finishGeo(C);
  var D = { pos: [], nor: [], idx: [], rib: [] };
  pushCyl(D, 0, 0, 0, 0.035, 0.02, 1.0, 6);           /* an aerial */
  pushBox(D, 0, 0.62, 0, 0.02, 0.02, 0.24, 0);
  pushBox(D, 0, 0.80, 0, 0.02, 0.02, 0.17, 0);
  var mast = finishGeo(D);

  var tanks = [], huts = [], masts = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var top = it[1] + it[3] * it[5];                  /* base + width * (height/width) */
    var w = it[3] * 0.5;
    var d = Math.sqrt(it[0] * it[0] + it[2] * it[2]);
    if (d > 700) continue;
    var r = R.f();
    if (r < 0.30) tanks.push([it[0] + R.range(-w * 0.4, w * 0.4), top, it[2] + R.range(-w * 0.4, w * 0.4), R.range(2.6, 4.6), R.range(0, 6.283), 1, 1]);
    if (r > 0.25 && r < 0.75) huts.push([it[0] + R.range(-w * 0.5, w * 0.5), top, it[2] + R.range(-w * 0.5, w * 0.5), R.range(3, 7), it[4], R.range(0.5, 1.0), R.range(0.7, 1.4)]);
    if (r > 0.7) masts.push([it[0] + R.range(-w * 0.6, w * 0.6), top, it[2] + R.range(-w * 0.6, w * 0.6), R.range(4, 11), R.range(0, 6.283), 1, 1]);
  }
  var mt = solidMat(U, '#8a7a62', { rib: 0, grain: 1, spines: 0, barkN: 20, barkPlate: 6 });
  var mh = solidMat(U, '#9a9a98', { rib: 0, grain: 0, spines: 0, body2: '#7d7d7b' });
  var mm = solidMat(U, '#6f7276', { rib: 0, grain: 0, spines: 0 });
  if (tanks.length) instanceSolid(scene, tank, tanks, mt);
  if (huts.length) instanceSolid(scene, hut, huts, mh);
  if (masts.length) instanceSolid(scene, mast, masts, mm);
}

/* ---------- ridges stacked into the distance ----------
   Real distance comes in layers, each paler and bluer than the one in front.
   A single fading noise field cannot do that; these can. */
function buildRidges(scene, P, R, U) {
  if (P.biomeKey === 'penthouse') return;
  var layers = R.int(2, 4);
  for (var i = 0; i < layers; i++) {
    /* Beyond the terrain's own relief (it reaches 2400 m) so the two do not
       interleave, and inside the sky sphere (3000 m) or the sky would be
       nearer than the ridge and cover it. */
    var dist = Math.min(2900, 2480 + i * R.range(90, 150));
    var height = dist * R.range(0.035, 0.075) * (1 + i * 0.22);
    var segs = 128, width = dist * 3.2;
    var g = new THREE.PlaneGeometry(width, height * 2.4, segs, 1);
    var pos = g.attributes.position;
    var seed = R.int(1, 9999), rough = R.range(0.5, 1.0);
    for (var v = 0; v < pos.count; v++) {
      var x = pos.getX(v);
      if (pos.getY(v) > 0) {
        /* the skyline: a ridged profile with a few summits standing above it */
        var n = ridged(x * 0.0016 + seed, seed * 0.1, seed, 4);
        var n2 = fbm2(x * 0.0005, seed * 0.3, seed + 7, 2);
        pos.setY(v, (n * 0.75 + Math.abs(n2) * 0.55) * height * rough - height * 0.15);
      } else pos.setY(v, -height * 1.4);
    }
    g.computeVertexNormals();
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uFogCol: U.uFogCol, uSunCol: U.uSunCol, uSunDir: U.uSunDir, uHazeK: U.uHazeK,
        uZenith: App.skyU.uZenith,
        uDepth: { value: 0.55 + i * 0.16 }
      },
      side: THREE.DoubleSide, depthWrite: true, transparent: true,
      vertexShader: [
        'varying vec3 vW; varying float vTop;',
        'void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; vTop = position.y;',
        '  gl_Position = projectionMatrix * viewMatrix * wp; }'
      ].join('\n'),
      fragmentShader: [
        GLSL_TONE,
        'uniform vec3 uFogCol, uSunCol, uSunDir, uZenith; uniform float uDepth, uHazeK;',
        'varying vec3 vW; varying float vTop;',
        'void main(){',
        /* each ridge is mostly the colour of the air in front of it, a little
           darker at its foot where less air intervenes */
        '  float low = clamp(1.0 - (vTop + 40.0) / 140.0, 0.0, 1.0);',
        '  vec3 c = mix(uFogCol, uFogCol * vec3(0.90, 0.94, 1.06), uDepth);',
        '  c *= 1.0 - 0.13 * (1.0 - uDepth) * (1.0 - low);',
        '  float f = pow(max(dot(normalize(vW - cameraPosition), normalize(uSunDir)), 0.0), 3.0) * uHazeK;',
        '  c += uSunCol * f * 0.06;',
        '  gl_FragColor = vec4(tone(c), 1.0);',
        '}'
      ].join('\n')
    });
    var m = new THREE.Mesh(g, mat);
    m.position.set(0, height * 0.15, -dist);
    m.renderOrder = 890 + i;                    /* behind the land, in front of the sky */
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
  }
}
/* ---------- motes: specks turning in the light just outside the glass ----------
   These used to be drawn on the overlay above everything, which put them in
   front of the frame and made them look like they were in the room. As part of
   the scene they are occluded by the mullions like anything else. */
function buildMotes(scene, P, R, U, H) {
  if (App.reduceMotion) return;
  var N = Math.round(90 * (Q().precipMul || 1));
  var quad = new THREE.PlaneGeometry(1, 1);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index; geo.setAttribute('position', quad.attributes.position); geo.setAttribute('uv', quad.attributes.uv);
  var iPos = new Float32Array(N * 3), iAttr = new Float32Array(N * 4);
  for (var i = 0; i < N; i++) {
    var a = R.range(-1.15, 1.15), r = 4.5 + Math.pow(R.f(), 1.4) * 16;
    var x = Math.sin(a) * r, z = -Math.cos(a) * r;
    iPos[i * 3] = x;
    iPos[i * 3 + 1] = H(x, z) + R.range(0.2, 3.4);
    iPos[i * 3 + 2] = z;
    iAttr[i * 4] = R.range(0.012, 0.030);       /* size */
    iAttr[i * 4 + 1] = R.range(0, 6.283);       /* phase */
    iAttr[i * 4 + 2] = R.range(0.10, 0.34);     /* drift speed */
    iAttr[i * 4 + 3] = R.range(0.5, 1.0);       /* brightness */
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = N;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uCamPos: U.uCamPos, uWind: U.uWind, uWindDir: U.uWindDir,
      uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uFogCol: U.uFogCol
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr;',
      'uniform float uTime, uWind, uFogDensity;',
      'uniform vec2 uWindDir; uniform vec3 uCamPos, uSunDir, uSunCol, uAmbCol, uFogCol;',
      'varying vec2 vUv; varying float vA;',
      GLSL_COMMON,
      'void main(){',
      '  float t = uTime * iAttr.z + iAttr.y;',
      '  vec3 wp = iPos;',
      '  wp.x += sin(t * 0.7) * 0.5 + sin(t * 0.23 + iAttr.y) * 0.9;',
      '  wp.y += sin(t * 0.41 + iAttr.y * 1.7) * 0.35;',
      '  wp.z += cos(t * 0.53) * 0.6;',
      '  wp.xz += uWindDir * uWind * 0.3;',
      '  wp.z = min(wp.z, -3.0);',
      '  vec3 toCam = normalize(uCamPos - wp);',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 up = normalize(cross(toCam, right));',
      '  float size = iAttr.x;',
      '  vec3 p = wp + right * position.x * size + up * position.y * size;',
      /* a speck only shows when it catches the light nearly edge-on to the sun */
      '  float glint = pow(max(dot(toCam, normalize(uSunDir)), 0.0), 3.0);',
      '  vA = iAttr.w * (0.10 + 0.90 * glint) * (0.35 + 0.65 * length(uSunCol));',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vA *= 1.0 - fogAmt(-mv.z, uFogDensity);',
      '  vUv = uv;',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec2 vUv; varying float vA;',
      'void main(){',
      '  float d = length(vUv - 0.5) * 2.0;',
      '  float core = 1.0 - smoothstep(0.0, 1.0, d);',
      '  float a = core * vA * 0.55;',
      '  if (a < 0.004) discard;',
      '  gl_FragColor = vec4(vec3(1.0, 0.97, 0.90) * a, a);',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 7;
  scene.add(m);
  App.propMeshes.push(m);
}

/* ---------- small life ----------
   A lizard holds still for half a minute, then darts a body-length or two
   and holds again. A scorpion does the same, slower. It is all on a
   per-creature clock in the vertex shader, so nothing runs on the CPU. */
function makeCritterTexture(kind) {
  var S = 64, c = cnv(S, S), g = c.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'lizard') {
    g.fillStyle = '#6d6a4c'; g.strokeStyle = '#6d6a4c';
    g.beginPath(); g.ellipse(S * 0.42, S * 0.5, S * 0.18, S * 0.075, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(S * 0.64, S * 0.5, S * 0.07, S * 0.055, 0, 0, 6.283); g.fill();
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(S * 0.25, S * 0.5); g.quadraticCurveTo(S * 0.12, S * 0.46, S * 0.04, S * 0.56); g.stroke();
    g.lineWidth = 2;
    var legs = [[0.34, -1, -0.6], [0.34, 1, -0.6], [0.52, -1, 0.5], [0.52, 1, 0.5]];
    for (var q = 0; q < legs.length; q++) { var l = legs[q];
      g.beginPath(); g.moveTo(S * l[0], S * 0.5); g.lineTo(S * (l[0] + l[2] * 0.06), S * (0.5 + l[1] * 0.14)); g.lineTo(S * (l[0] + l[2] * 0.02), S * (0.5 + l[1] * 0.20)); g.stroke(); }
    g.fillStyle = '#4a4834';
    for (var d = 0; d < 6; d++) { g.beginPath(); g.arc(S * (0.28 + d * 0.06), S * 0.5, 1.2, 0, 6.283); g.fill(); }
  } else {
    g.fillStyle = '#3a2f24'; g.strokeStyle = '#3a2f24';
    g.beginPath(); g.ellipse(S * 0.5, S * 0.5, S * 0.14, S * 0.07, 0, 0, 6.283); g.fill();
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(S * 0.36, S * 0.5); g.quadraticCurveTo(S * 0.18, S * 0.5, S * 0.14, S * 0.3);
    g.quadraticCurveTo(S * 0.13, S * 0.2, S * 0.2, S * 0.2); g.stroke();
    g.lineWidth = 2;
    for (var lg = 0; lg < 4; lg++) for (var sd = -1; sd <= 1; sd += 2) {
      var x0 = S * (0.42 + lg * 0.05);
      g.beginPath(); g.moveTo(x0, S * 0.5); g.lineTo(x0 + S * 0.02, S * (0.5 + sd * 0.13)); g.lineTo(x0 + S * 0.05, S * (0.5 + sd * 0.17)); g.stroke();
    }
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(S * 0.62, S * 0.46); g.lineTo(S * 0.74, S * 0.36); g.lineTo(S * 0.80, S * 0.40); g.stroke();
    g.beginPath(); g.moveTo(S * 0.62, S * 0.54); g.lineTo(S * 0.74, S * 0.64); g.lineTo(S * 0.80, S * 0.60); g.stroke();
  }
  return tex(c, false);
}

function buildCritters(scene, P, R, U, H) {
  if (!P.biome.critters || P.weather.rain > 0.3 || P.timeA === 'night') return;
  var kinds = [['lizard', R.int(1, 3)], ['scorpion', R.chance(0.6) ? 1 : 0]];
  for (var ki = 0; ki < kinds.length; ki++) {
    var kind = kinds[ki][0], n = kinds[ki][1];
    if (!n) continue;
    var quad = new THREE.PlaneGeometry(1, 1); quad.rotateX(-Math.PI / 2);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index; geo.setAttribute('position', quad.attributes.position); geo.setAttribute('uv', quad.attributes.uv);
    var iPos = new Float32Array(n * 3), iAttr = new Float32Array(n * 4), iDart = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      var a = R.range(-0.9, 0.9), rr = R.range(2.2, 9);
      var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
      iPos[i * 3] = x; iPos[i * 3 + 1] = H(x, z) + 0.035; iPos[i * 3 + 2] = z;
      iAttr[i * 4] = kind === 'lizard' ? R.range(0.16, 0.24) : R.range(0.09, 0.13);
      iAttr[i * 4 + 1] = R.range(0, 1);
      iAttr[i * 4 + 2] = kind === 'lizard' ? R.range(22, 48) : R.range(30, 70);
      iAttr[i * 4 + 3] = kind === 'lizard' ? 0.35 : 1.4;
      var da = R.range(0, 6.283), dl = kind === 'lizard' ? R.range(0.5, 1.2) : R.range(0.25, 0.5);
      iDart[i * 3] = Math.cos(da) * dl; iDart[i * 3 + 1] = da; iDart[i * 3 + 2] = Math.sin(da) * dl;
    }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
    geo.setAttribute('iDart', new THREE.InstancedBufferAttribute(iDart, 3));
    geo.instanceCount = n;
    var mat = new THREE.ShaderMaterial({
      uniforms: { uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol, uMap: { value: makeCritterTexture(kind) } },
      transparent: true, depthWrite: false, alphaTest: 0.02, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
      vertexShader: [
        'attribute vec3 iPos; attribute vec4 iAttr; attribute vec3 iDart;',
        'uniform float uTime; uniform vec3 uSunDir, uSunCol, uAmbCol;',
        'varying vec2 vUv; varying vec3 vTint;',
        'void main(){',
        '  float len = iAttr.x, period = iAttr.z, dur = iAttr.w;',
        '  float t = uTime + iAttr.y * period;',
        '  float cyc = floor(t / period);',
        '  float ph = clamp((t - cyc * period) / dur, 0.0, 1.0);',
        '  float ease = ph * ph * (3.0 - 2.0 * ph);',
        '  float dir = mod(cyc, 2.0) < 0.5 ? 1.0 : -1.0;',
        '  float from = dir > 0.0 ? 0.0 : 1.0;',
        '  float at = from + dir * ease;',
        '  vec3 wp = iPos + vec3(iDart.x, 0.0, iDart.z) * at;',
        '  float heading = iDart.y + (dir > 0.0 ? 0.0 : 3.14159);',
        '  float c = cos(heading), s = sin(heading);',
        '  vec3 lp = vec3(position.x * c - position.z * s, 0.0, position.x * s + position.z * c) * len;',
        '  vTint = uAmbCol * 1.1 + uSunCol * max(uSunDir.y, 0.0) * 1.1;',
        '  vUv = uv;',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(wp + lp, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: [
        GLSL_TONE,
        'uniform sampler2D uMap; varying vec2 vUv; varying vec3 vTint;',
        'void main(){ vec4 t = texture2D(uMap, vUv); if (t.a < 0.02) discard;',
        '  gl_FragColor = vec4(tone(t.rgb * vTint), t.a); }'
      ].join('\n')
    });
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
  }
}

/* ---------- near-field clutter ----------
   Everything within a dozen metres is where the eye actually lands, so it gets
   its own scatter of stones, litter and tufts lying flat on the ground. */
function makeSprayTexture(kind, P, R) {
  var S = 128, c = cnv(S, S), g = c.getContext('2d');
  var base, lite, lw = 0.038, ll = 0.064, n = 125;
  if (kind === 'pine') { base = new THREE.Color('#1f3a2a').multiplyScalar(P.treeTint); lite = base.clone().lerp(new THREE.Color('#7fa066'), 0.5); lw = 0.013; ll = 0.085; n = 150; }
  else if (kind === 'olive') { base = new THREE.Color('#6f7d5c'); lite = new THREE.Color('#b9c2a0'); lw = 0.017; ll = 0.054; n = 140; }
  else if (kind === 'blossom') { base = new THREE.Color(P.blossomCol || '#f2d3de'); lite = new THREE.Color('#ffffff'); lw = 0.023; ll = 0.028; n = 150; }
  else if (kind === 'acacia') { base = new THREE.Color('#4e5a2e').multiplyScalar(P.treeTint); lite = base.clone().lerp(new THREE.Color('#b3ba78'), 0.5); lw = 0.012; ll = 0.022; n = 180; }
  else { base = new THREE.Color(P.leafDark || P.grass.base).multiplyScalar(0.9 * P.treeTint); lite = new THREE.Color(P.leafLight || P.grass.tip).multiplyScalar(0.95 * P.treeTint); }
  /* twigs radiating from the middle, then the leaves on top of them */
  g.strokeStyle = '#4b3a2b'; g.lineWidth = 2.2; g.lineCap = 'round';
  for (var tw = 0; tw < 5; tw++) {
    var ta = R.f() * 6.283, tl = S * R.range(0.22, 0.42);
    g.beginPath(); g.moveTo(S * 0.5, S * 0.5); g.lineTo(S * 0.5 + Math.cos(ta) * tl, S * 0.5 + Math.sin(ta) * tl); g.stroke();
  }
  leafSpray(g, S / 2, S / 2, S * 0.44, base.clone().multiplyScalar(0.7), lite, n, S * lw, S * ll, R);
  return tex(c, false);
}

function makeClutterTexture(kind, P, R) {
  var S = 128, c = cnv(S, S), g = c.getContext('2d');
  var rgb = function (col) {
    return 'rgb(' + Math.round(col.r * 255) + ',' + Math.round(col.g * 255) + ',' + Math.round(col.b * 255) + ')';
  };
  if (kind === 'stones') {
    var rc = new THREE.Color(P.rockCol);
    for (var i = 0; i < 7; i++) {
      var x = R.range(0.2, 0.8) * S, y = R.range(0.2, 0.8) * S;
      var w = S * R.range(0.07, 0.17), h = w * R.range(0.6, 1.0);
      var col = rc.clone().offsetHSL(0, R.range(-0.05, 0.05), R.range(-0.14, 0.16));
      g.fillStyle = rgb(col);
      g.beginPath(); g.ellipse(x, y, w, h, R.range(0, 3.14), 0, 6.283); g.fill();
      g.fillStyle = rgb(col.clone().multiplyScalar(1.22));
      g.beginPath(); g.ellipse(x - w * 0.22, y - h * 0.24, w * 0.5, h * 0.42, 0, 0, 6.283); g.fill();
    }
  } else if (kind === 'litter') {
    if (P.season.blossom && P.blossomCol) {
      var pc = new THREE.Color(P.blossomCol).lerp(new THREE.Color(P.grass.base), 0.35);
      for (var j = 0; j < 70; j++) {
        var pcc = pc.clone().offsetHSL(0, 0, R.range(-0.08, 0.06));
        g.fillStyle = 'rgba(' + Math.round(pcc.r * 255) + ',' + Math.round(pcc.g * 255) + ',' + Math.round(pcc.b * 255) + ',' + R.range(0.55, 0.85) + ')';
        g.save();
        g.translate(R.f() * S, R.f() * S); g.rotate(R.f() * 6.283);
        g.beginPath(); g.ellipse(0, 0, S * R.range(0.012, 0.022), S * R.range(0.009, 0.015), 0, 0, 6.283); g.fill();
        g.restore();
      }
    } else {
      var lc = new THREE.Color(P.leafDark || P.leafLight || P.grass.dry).lerp(new THREE.Color(P.grass.soil), 0.25);
      for (var j2 = 0; j2 < 26; j2++) {
        g.fillStyle = rgb(lc.clone().offsetHSL(R.range(-0.05, 0.05), R.range(-0.1, 0.1), R.range(-0.15, 0.12)));
        g.save();
        g.translate(R.f() * S, R.f() * S); g.rotate(R.f() * 6.283);
        g.beginPath(); g.ellipse(0, 0, S * R.range(0.03, 0.065), S * R.range(0.012, 0.028), 0, 0, 6.283); g.fill();
        g.restore();
      }
    }
  } else { /* tuft: a rosette of broad leaves seen from above */
    var tc = new THREE.Color(P.grass.ct || P.grass.tip);
    for (var k = 0; k < 22; k++) {
      var a = R.f() * 6.283, len = S * R.range(0.14, 0.30);
      g.fillStyle = rgb(tc.clone().offsetHSL(0, 0, R.range(-0.18, 0.10)));
      g.save(); g.translate(S / 2, S / 2); g.rotate(a);
      g.beginPath(); g.ellipse(len * 0.55, 0, len * 0.55, S * R.range(0.035, 0.06), 0, 0, 6.283); g.fill();
      g.restore();
    }
  }
  return tex(c, false);
}

function buildClutter(scene, P, R, U, H) {
  if ((P.terrainKind || P.biome.terrain) === 'salt') return;
  var kinds = ['stones', 'tufts'];
  if (P.leafFall || P.seasonKey === 'autumn') kinds.push('litter');
  var perKind = Math.round(520 * Q().propMul);
  for (var ki = 0; ki < kinds.length; ki++) {
    var kind = kinds[ki];
    var quad = new THREE.PlaneGeometry(1, 1);
    quad.rotateX(-Math.PI / 2);                 /* lying flat on the ground */
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);
    var items = [], guard = 0;
    while (items.length < perKind && guard < perKind * 25) {
      guard++;
      var a = R.range(-1.30, 1.30);
      var rr = 1.6 + Math.pow(R.f(), 1.9) * 17;   /* everything inside ~19 m */
      var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
      if (z > -0.9) continue;
      if (P.waterY != null && H(x, z) < P.waterY + 0.2) continue;
      items.push([x, H(x, z) + 0.03, z, R.range(0.22, 0.85) * (kind === 'tufts' ? 1.5 : 1), R.range(0, 6.283)]);
    }
    if (!items.length) continue;
    var iPos = new Float32Array(items.length * 3);
    var iAttr = new Float32Array(items.length * 2);
    for (var i = 0; i < items.length; i++) {
      iPos[i * 3] = items[i][0]; iPos[i * 3 + 1] = items[i][1]; iPos[i * 3 + 2] = items[i][2];
      iAttr[i * 2] = items[i][3]; iAttr[i * 2 + 1] = items[i][4];
    }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 2));
    geo.instanceCount = items.length;
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
        uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
        uSnow: U.uSnow, uSnowCol: U.uSnowCol, uCamPos: U.uCamPos,
        uMap: { value: makeClutterTexture(kind, P, R) }
      },
      /* lying flat and seen at a grazing angle, these are mostly partial alpha;
         blended, their edges are smooth and hold still. Dithered, they sparkle. */
      transparent: true, depthWrite: false, alphaTest: 0.02, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
      vertexShader: [
        'attribute vec3 iPos; attribute vec2 iAttr;',
        'uniform float uTime, uFogDensity, uShadow, uSnow;',
        'uniform vec3 uSunDir, uSunCol, uAmbCol, uSnowCol, uCamPos;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying float vNear;',
        GLSL_COMMON,
        'void main(){',
        '  float sc = iAttr.x, rot = iAttr.y;',
        '  float c = cos(rot), s = sin(rot);',
        '  float dN = length(iPos - cameraPosition);',
        '  float keep = (1.0 - smoothstep(11.0, 18.0, dN)) * (1.0 - smoothstep(0.15, 0.45, uSnow));',
        '  vec3 lp = vec3(position.x * c - position.z * s, 0.0, position.x * s + position.z * c) * sc * keep;',
        '  vec3 wp = iPos + lp;',
        '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.30, 1.0, baked(wp.xz));',
        '  float diff = max(uSunDir.y, 0.0);',
        '  vTint = mix(uAmbCol * 1.1 + uSunCol * diff * 1.15 * sh, uSnowCol, uSnow * 0.8);',
        '  vUv = uv;',
        '  vNear = 1.0;',
        '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
        '  vFog = fogAmt(-mv.z, uFogDensity);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
      GLSL_TONE,
        'uniform sampler2D uMap; uniform vec3 uFogCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying float vNear;',
        'void main(){',
        '  vec4 t = texture2D(uMap, vUv);',
        '  if (t.a < 0.25) discard;',
        '  gl_FragColor = vec4(mix(t.rgb * vTint, uFogCol, vFog), t.a);',
        '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
      ].join('\n')
    });
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
  }
}

/* ---------- props: trees, palms, cacti, rocks, bushes ---------- */
/* the same curve the ground shader draws, so plants and paint agree */
function onPathAt(P, x, z) {
  if (!P.pathKind) return 0;
  var cx = P.pathX + P.pathBend * (Math.sin(z * 0.0042 + P.pathPhase) - Math.sin(P.pathPhase));
  var off = Math.abs(x - cx);
  if (P.pathGauge > 0.01) off = Math.min(Math.abs(off - P.pathGauge * 0.5), Math.abs(off + P.pathGauge * 0.5));
  return 1 - smoothstep(P.pathW, P.pathW * 1.5, off);
}

function plantable(P, H, x, z) {
  if (P.waterY != null && H(x, z) < P.waterY + 0.25) return false;
  if (P.pathKind && onPathAt(P, x, z) > 0.55) return false;
  return true;
}

/* the billboard material every planted prop shares */
function propMat(U, P, R, kind, swayMul, far) {
  return new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uWind: U.uWind, uGust: U.uGust, uWindDir: U.uWindDir,
        uSunCol: U.uSunCol, uAmbCol: U.uAmbCol, uFogCol: U.uFogCol, uSunDir: U.uSunDir,
        uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale, uSnow: U.uSnow,
        uCamPos: U.uCamPos, uSway: { value: swayMul },
        uMap: { value: makePropTexture(kind, P, R, { far: !!far }) }
      },
      alphaToCoverage: true, alphaTest: 0.4,
      side: THREE.DoubleSide,
      vertexShader: [
        'attribute vec3 iPos; attribute vec2 iAttr;',
        'uniform float uTime, uWind, uGust, uFogDensity, uShadow, uSnow, uSway;',
        'uniform vec2 uWindDir; uniform vec3 uCamPos, uSunCol, uAmbCol, uFogCol, uSunDir;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
        GLSL_COMMON,
        'void main(){',
        '  float size = iAttr.x;',
        '  vec3 toCam = normalize(vec3(uCamPos.x - iPos.x, 0.0, uCamPos.z - iPos.z));',
        '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
        '  vec3 lp = right * position.x * size * 0.62 + vec3(0.0, position.y * size, 0.0);',
        '  float sway = sin(uTime * 0.62 + iAttr.y) * 0.5 + sin(uTime * 0.27 + iAttr.y * 2.1) * 0.5;',
        '  lp.xz += uWindDir * sway * uWind * (0.35 + 0.75 * uGust) * position.y * position.y * size * uSway;',
        '  vec3 wp = iPos + lp;',
        '  vUv = uv;',
        '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.30, 1.0, baked(wp.xz));',
        '  float back = pow(max(dot(-toCam, normalize(uSunDir)), 0.0), 3.0) * 0.35;',
        '  vTint = (uAmbCol * 0.9 + uSunCol * (0.6 + back) * sh) * (1.0 - uSnow * 0.25);',
        '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
        '  vFog = fogAmtH(-mv.z, uFogDensity, wp.y);',
        '  vHaze = hazeToward(uFogCol, normalize(wp - cameraPosition), uSunDir, uSunCol);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
      GLSL_TONE,
        'uniform sampler2D uMap; uniform vec3 uFogCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
        'void main(){',
        '  vec4 t = texture2D(uMap, vUv);',
        '  if (t.a < 0.25) discard;',
        '  gl_FragColor = vec4(mix(t.rgb * vTint, vHaze, vFog), smoothstep(0.3, 0.7, t.a));',
        '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
      ].join('\n')
    });
}

function buildProps(scene, P, R, U, H) {
  App.propMeshes = [];
  var specs = P.props.slice();
  if (P.treeline) {
    specs.push({ kind: P.treelineKind, count: R.int(26, 60), size: [9, 18],
                 r: [150, 430], line: true });
  }
  for (var si = 0; si < specs.length; si++) {
    var spec = specs[si];
    if (!spec.count) continue;
    if (spec.kind === 'cactus') { buildCacti(scene, P, R, U, H, spec); continue; }
    if (spec.kind === 'wall') { buildWalls(scene, P, R, U, H, spec); continue; }
    if (spec.kind === 'city') { buildCity(scene, P, R, U, H); continue; }
    if (spec.kind === 'blocks') { buildBlocks(scene, P, R, U, H); continue; }
    if (spec.kind === 'bridge') { buildBridge(scene, P, R, U, H); continue; }
    if (spec.kind === 'bale') { buildBales(scene, P, R, U, H, spec); continue; }
    if (spec.kind === 'rock') { buildRocks(scene, P, R, U, H, spec); continue; }
    var items = [];
    var guard = 0;
    var lineR = spec.line ? R.range(spec.r[0], spec.r[1]) : 0;
    while (items.length < spec.count && guard < spec.count * 60) {
      guard++;
      var a = R.range(-1.22, 1.22);
      var rr = spec.line ? lineR * R.range(0.85, 1.3)
                         : spec.r[0] + Math.pow(R.f(), 1.35) * (spec.r[1] - spec.r[0]);
      var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
      if (spec.rows && P.rowSpacing) {
        var A3 = P.rowAngle, sp3 = P.rowSpacing * (spec.rowMul || 1);
        var pp3 = x * Math.cos(A3) + z * Math.sin(A3);
        var sn3 = Math.round(pp3 / sp3) * sp3;
        x += (sn3 - pp3) * Math.cos(A3);
        z += (sn3 - pp3) * Math.sin(A3);
      }
      if (!plantable(P, H, x, z)) continue;
      /* pines and broadleaves stop at the snow line */
      if ((spec.kind === 'pine' || spec.kind === 'broadleaf') && P.snowLine != null
          && H(x, z) > P.snowLine * R.range(0.6, 0.95)) continue;
      items.push([x, z, R.range(spec.size[0], spec.size[1])]);
    }
    if (!items.length) continue;

    /* the nearest trees are built solid; everything beyond stays a billboard */
    var treeish = /broadleaf|olive|blossom|acacia|pine/.test(spec.kind);
    var nearItems = [];
    if (treeish) {
      var farItems = [];
      for (var ni = 0; ni < items.length; ni++) (Math.hypot(items[ni][0], items[ni][1]) < 42 ? nearItems : farItems).push(items[ni]);
      items = farItems;
      if (!items.length && !nearItems.length) continue;
    }

    var quad = new THREE.PlaneGeometry(1, 1);
    quad.translate(0, 0.5, 0);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);
    var iPos = new Float32Array(items.length * 3);
    var iAttr = new Float32Array(items.length * 2);
    for (var i = 0; i < items.length; i++) {
      iPos[i * 3] = items[i][0];
      iPos[i * 3 + 1] = H(items[i][0], items[i][1]) - items[i][2] * (spec.line ? 0.09 : 0.03) + (spec.lift || 0) * items[i][2];
      iPos[i * 3 + 2] = items[i][1];
      iAttr[i * 2] = items[i][2];
      iAttr[i * 2 + 1] = R.range(0, 6.283);
    }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 2));
    geo.instanceCount = items.length;

    /* rocks don't sway; palms and fronds do, a lot */
    var swayMul = spec.kind === 'rock' ? 0.0 : (spec.kind === 'palm' ? 0.09
                : (spec.kind === 'cactus' ? 0.004 : 0.035));
    var mat = propMat(U, P, R, spec.kind, swayMul, spec.line);

    mat.uniforms.uFogCol = U.uFogCol;
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
    /* remember how to make this kind's material, for leaf cards */
    App._cardMat = App._cardMat || function () { return null; };
    (function (kind, mk) { var prev = App._cardMat; App._cardMat = function (k) { return k === kind ? mk() : prev(k); }; })(
      spec.kind, function () {
        var mm = mat.clone();
        mm.uniforms = {};
        for (var uk in mat.uniforms) mm.uniforms[uk] = mat.uniforms[uk];
        mm.uniforms.uMap = { value: makePropTexture(spec.kind, P, R, { crownOnly: true }) };
        mm.uniforms.uSway = { value: 0.05 };
        return mm;
      });
    if (nearItems.length) buildNearTrees(scene, P, R, U, H, spec.kind, nearItems, spec);
    for (var si2 = 0; si2 < items.length; si2++) {
      App._shadows.push([items[si2][0], H(items[si2][0], items[si2][1]), items[si2][1],
                         items[si2][2] * (spec.kind === 'rock' ? 0.55 : 0.34),
                         spec.kind === 'rock' ? 0.8 : 1.0, items[si2][2] * (spec.kind === 'rock' ? 0.6 : 0.85)]);
    }
  }
}

/* ---------- dust drifting low over the ground ----------
   Tumbleweeds read as comedy props. Sheets of blown dust are what actually
   moves in a desert, and they move slowly. */
function buildDust(scene, P, R, U, H) {
  if (!P.dust) return;
  var COUNT = P.dust;
  var quad = new THREE.PlaneGeometry(1, 1);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var iPos = new Float32Array(COUNT * 3);
  var iAttr = new Float32Array(COUNT * 4);
  for (var i = 0; i < COUNT; i++) {
    var a = R.range(-1.0, 1.0), rr = R.range(18, 130);
    var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
    iPos[i * 3] = x; iPos[i * 3 + 1] = H(x, z); iPos[i * 3 + 2] = z;
    iAttr[i * 4] = R.range(9, 30);            /* width */
    iAttr[i * 4 + 1] = R.range(1.4, 4.2);     /* height */
    iAttr[i * 4 + 2] = R.range(0, 200);       /* phase */
    iAttr[i * 4 + 3] = R.range(0.5, 1.2);     /* speed */
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = COUNT;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uWind: U.uWind, uGust: U.uGust, uWindDir: U.uWindDir,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uCamPos: U.uCamPos,
      uAmbCol: U.uAmbCol, uSunCol: U.uSunCol,
      uMap: { value: makeCloudTexture(R.int(1, 99999)) }
    },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr;',
      'uniform float uTime, uWind, uGust, uFogDensity;',
      'uniform vec2 uWindDir; uniform vec3 uCamPos;',
      'varying vec2 vUv; varying float vFog; varying float vFade; varying float vScroll;',
      GLSL_COMMON,
      'void main(){',
      '  float speed = (0.5 + 0.9 * uGust) * uWind * iAttr.w;',
      '  float span = 220.0;',
      '  float run = mod(uTime * speed + iAttr.z, span) - span * 0.5;',
      '  vec3 wp = iPos + vec3(uWindDir.x, 0.0, uWindDir.y) * run;',
      '  wp.y += iAttr.y * 0.55 + sin(uTime * 0.21 + iAttr.z) * 0.12;',
      '  vec3 toCam = normalize(vec3(uCamPos.x - wp.x, 0.0, uCamPos.z - wp.z));',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 pp = wp + right * position.x * iAttr.x + vec3(0.0, position.y * iAttr.y, 0.0);',
      '  vUv = uv;',
      '  vScroll = uTime * 0.012 + iAttr.z * 0.01;',
      '  vFade = 1.0 - smoothstep(span * 0.28, span * 0.49, abs(run));',
      '  vec4 mv = modelViewMatrix * vec4(pp, 1.0);',
      '  vFog = fogAmt(-mv.z, uFogDensity);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uFogCol, uAmbCol, uSunCol;',
      'varying vec2 vUv; varying float vFog; varying float vFade; varying float vScroll;',
      'void main(){',
      '  float n = texture2D(uMap, vec2(vUv.x * 0.5 + vScroll, vUv.y * 0.5)).r;',
      '  n = n * 0.65 + texture2D(uMap, vec2(vUv.x * 1.3 - vScroll * 1.7, vUv.y * 0.9 + 0.4)).r * 0.35;',
      '  float body = smoothstep(0.30, 0.72, n);',
      '  float soft = smoothstep(0.0, 0.35, vUv.x) * smoothstep(1.0, 0.65, vUv.x)',
      '             * (1.0 - smoothstep(0.15, 1.0, vUv.y));',
      '  float a = body * soft * vFade * 0.30 * (1.0 - vFog * 0.6);',
      '  vec3 col = mix(uFogCol, uAmbCol * 0.6 + uSunCol * 0.7, 0.45);',
      '  gl_FragColor = vec4(col, a);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  mat.uniforms.uFogCol = U.uFogCol;
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 2;
  scene.add(m);
  App.dust = m;
}

/* ---------- waterfalls on the steep ground ---------- */
function buildFalls(scene, P, R, U, H) {
  if (!P.falls) return;
  var picks = [], guard = 0;
  while (picks.length < P.falls && guard < 900) {
    guard++;
    var flim = visibleHalfAngle(P) * 0.92;
    var a = R.range(-flim, flim), rr = R.range(90, 340);
    var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
    var top = H(x, z);
    if (P.waterY != null && top < P.waterY + 12) continue;
    /* look downhill toward the viewer: a fall needs a real drop */
    var stepX = -x / rr * 26, stepZ = -z / rr * 26;
    var below = H(x + stepX, z + stepZ);
    var drop = top - below;
    if (drop < 14) continue;
    picks.push([x + stepX * 0.25, z + stepZ * 0.25, top, Math.min(drop * 0.95, 120), R.range(2.5, 7)]);
    App._features.push(['waterfall', x, z]);
  }
  if (!picks.length) return;
  var quad = new THREE.PlaneGeometry(1, 1);
  quad.translate(0, -0.5, 0);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var iPos = new Float32Array(picks.length * 3);
  var iAttr = new Float32Array(picks.length * 3);
  for (var i = 0; i < picks.length; i++) {
    iPos[i * 3] = picks[i][0]; iPos[i * 3 + 1] = picks[i][2]; iPos[i * 3 + 2] = picks[i][1];
    iAttr[i * 3] = picks[i][3];
    iAttr[i * 3 + 1] = picks[i][4];
    iAttr[i * 3 + 2] = R.range(0, 6.283);
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 3));
  geo.instanceCount = picks.length;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uCamPos: U.uCamPos, uFogCol: U.uFogCol,
      uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uAmbCol: U.uAmbCol, uSunCol: U.uSunCol,
      uMap: { value: makeCloudTexture(R.int(1, 99999)) }
    },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec3 iAttr;',
      'uniform vec3 uCamPos; uniform float uFogDensity;',
      'varying vec2 vUv; varying float vFog; varying float vLen;',
      GLSL_COMMON,
      'void main(){',
      '  vec3 toCam = normalize(vec3(uCamPos.x - iPos.x, 0.0, uCamPos.z - iPos.z));',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 wp = iPos + right * position.x * iAttr.y + vec3(0.0, position.y * iAttr.x, 0.0);',
      '  vUv = uv; vLen = iAttr.x;',
      '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
      '  vFog = fogAmt(-mv.z, uFogDensity);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uFogCol, uAmbCol, uSunCol;',
      'uniform float uTime;',
      'varying vec2 vUv; varying float vFog; varying float vLen;',
      'void main(){',
      '  float fall = uTime * (0.55 + vLen * 0.006);',
      '  float n = texture2D(uMap, vec2(vUv.x * 0.7, vUv.y * 0.35 + fall)).r;',
      '  n = n * 0.6 + texture2D(uMap, vec2(vUv.x * 1.7 + 0.3, vUv.y * 0.8 + fall * 1.7)).r * 0.4;',
      '  float edge = smoothstep(0.0, 0.22, vUv.x) * smoothstep(1.0, 0.78, vUv.x);',
      '  float spread = mix(1.0, 0.55, vUv.y);',
      '  float a = edge * spread * smoothstep(0.28, 0.72, n) * 0.85;',
      '  a += edge * (1.0 - smoothstep(0.0, 0.14, vUv.y)) * 0.35;',
      '  vec3 col = mix(vec3(0.86, 0.92, 0.95), uSunCol * 0.6 + uAmbCol * 0.8, 0.35);',
      '  gl_FragColor = vec4(mix(col, uFogCol, vFog), a * (1.0 - vFog * 0.85));',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  mat.uniforms.uFogCol = U.uFogCol;
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 1;
  scene.add(m);
  App.falls = m;
}


/* ---------- visitors ----------
   One thing at a time, crossing slowly, minutes apart. The reward is catching
   it, so nothing here is frequent enough to become scenery. */
function makeVisitorTexture(kind, R) {
  var S = 256, c = cnv(S, S), g = c.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'balloon') {
    var band = [R.pick(['#c8443a', '#d98b2b', '#e0d15a', '#3f7fae', '#7a4b8e']), '#f2ece0'];
    var cx = S / 2, cy = S * 0.40, rx = S * 0.27, ry = S * 0.31;
    for (var i = 0; i < 7; i++) {
      g.fillStyle = band[i % 2];
      g.beginPath();
      g.moveTo(cx, cy + ry);
      g.bezierCurveTo(cx - rx + i * rx * 2 / 7, cy + ry * 0.4, cx - rx + i * rx * 2 / 7, cy - ry, cx, cy - ry);
      g.bezierCurveTo(cx - rx + (i + 1) * rx * 2 / 7, cy - ry, cx - rx + (i + 1) * rx * 2 / 7, cy + ry * 0.4, cx, cy + ry);
      g.fill();
    }
    g.strokeStyle = '#5a4a38'; g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(cx - S * 0.06, cy + ry * 0.96); g.lineTo(cx - S * 0.045, S * 0.80);
    g.moveTo(cx + S * 0.06, cy + ry * 0.96); g.lineTo(cx + S * 0.045, S * 0.80); g.stroke();
    g.fillStyle = '#7a5a34';
    g.fillRect(cx - S * 0.055, S * 0.80, S * 0.11, S * 0.075);
  } else if (kind === 'boat') {
    g.fillStyle = '#f4f1e8';
    g.beginPath(); g.moveTo(S * 0.50, S * 0.18); g.lineTo(S * 0.50, S * 0.62);
    g.lineTo(S * 0.26, S * 0.62); g.closePath(); g.fill();
    g.fillStyle = '#e6e0d2';
    g.beginPath(); g.moveTo(S * 0.52, S * 0.24); g.lineTo(S * 0.52, S * 0.62);
    g.lineTo(S * 0.70, S * 0.62); g.closePath(); g.fill();
    g.strokeStyle = '#4a4038'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(S * 0.51, S * 0.16); g.lineTo(S * 0.51, S * 0.64); g.stroke();
    g.fillStyle = R.pick(['#39424c', '#5c4632', '#2f4a44']);
    g.beginPath();
    g.moveTo(S * 0.22, S * 0.64); g.lineTo(S * 0.78, S * 0.64);
    g.lineTo(S * 0.70, S * 0.72); g.lineTo(S * 0.30, S * 0.72); g.closePath(); g.fill();
  } else if (kind === 'deer') {
    g.fillStyle = 'rgba(74,56,38,0.94)';
    g.beginPath(); g.ellipse(S * 0.50, S * 0.56, S * 0.19, S * 0.10, 0, 0, 6.283); g.fill();
    g.fillRect(S * 0.36, S * 0.62, S * 0.035, S * 0.20);
    g.fillRect(S * 0.44, S * 0.62, S * 0.035, S * 0.20);
    g.fillRect(S * 0.57, S * 0.62, S * 0.035, S * 0.20);
    g.fillRect(S * 0.64, S * 0.62, S * 0.035, S * 0.20);
    g.beginPath(); g.moveTo(S * 0.64, S * 0.52); g.lineTo(S * 0.74, S * 0.36);
    g.lineTo(S * 0.79, S * 0.38); g.lineTo(S * 0.70, S * 0.53); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(S * 0.78, S * 0.35, S * 0.055, S * 0.035, -0.4, 0, 6.283); g.fill();
    g.strokeStyle = 'rgba(74,56,38,0.94)'; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(S * 0.79, S * 0.32); g.lineTo(S * 0.83, S * 0.22); g.moveTo(S * 0.80, S * 0.27); g.lineTo(S * 0.87, S * 0.25);
    g.moveTo(S * 0.75, S * 0.32); g.lineTo(S * 0.73, S * 0.21); g.stroke();
  } else { /* geese: a skein */
    g.strokeStyle = 'rgba(38,40,46,0.9)'; g.lineWidth = 4; 
    for (var b = 0; b < 7; b++) {
      var t = b / 6;
      var bx = S * (0.14 + t * 0.72), by = S * (0.32 + Math.abs(t - 0.5) * 0.36);
      g.beginPath();
      g.moveTo(bx - S * 0.045, by + S * 0.02);
      g.quadraticCurveTo(bx, by - S * 0.03, bx + S * 0.045, by + S * 0.02);
      g.stroke();
    }
  }
  return tex(c, false);
}

function buildVisitors(scene, P, R, U, H) {
  var kinds = [];
  var wet = P.waterY != null;
  var calm = P.weather.rain < 0.5 && P.weather.snow < 0.5;
  if (wet && calm && P.biomeKey !== 'saltflat' && P.biomeKey !== 'marsh') kinds.push('boat');
  if (calm && P.weather.cover > 0.3 && !wet) kinds.push('balloon');
  if (['meadow','autumn','moor','alpine','farmland','orchard','blossom','lakefront','river','tundra'].indexOf(P.biomeKey) >= 0) kinds.push('deer');
  if (calm) kinds.push('geese');
  if (!kinds.length || !R.chance(0.72)) return;
  var kind = R.pick(kinds);
  P.visitor = kind;

  var quad = new THREE.PlaneGeometry(1, 1);
  quad.translate(0, kind === 'deer' ? 0.5 : 0, 0);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var n = kind === 'deer' ? R.int(2, 4) : 1;
  var iAttr = new Float32Array(n * 4);
  for (var i = 0; i < n; i++) {
    iAttr[i * 4] = R.range(0, 1);                       /* start of its own crossing */
    iAttr[i * 4 + 1] = R.range(0.9, 1.15) + i * 0.04;   /* stagger within a group */
    iAttr[i * 4 + 2] = i * R.range(3, 9);
    iAttr[i * 4 + 3] = R.range(-0.35, 0.35);
  }
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = n;

  var cfg = {
    balloon: { size: R.range(11, 20), dist: R.range(180, 420), height: R.range(45, 110), period: R.range(300, 620), cross: 0.42 },
    boat:    { size: R.range(5, 12),  dist: R.range(70, 260),  height: 0,                period: R.range(280, 560), cross: 0.45 },
    deer:    { size: R.range(1.1, 1.7), dist: R.range(38, 120), height: 0,               period: R.range(240, 520), cross: 0.30 },
    geese:   { size: R.range(9, 17),  dist: R.range(130, 320), height: R.range(55, 130), period: R.range(260, 540), cross: 0.24 }
  }[kind];
  var groundY = kind === 'boat' ? (P.waterY || 0) - 0.1 : 0;
  App.visitorInfo = { kind: kind, period: cfg.period, phase: iAttr[0], cross: cfg.cross, side: iAttr[3] > 0 ? 1 : -1 };

  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uCamPos: U.uCamPos, uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
      uAmbCol: U.uAmbCol, uSunCol: U.uSunCol, uWindDir: U.uWindDir,
      uMap: { value: makeVisitorTexture(kind, R) },
      uSize: { value: cfg.size }, uDist: { value: cfg.dist }, uHeight: { value: cfg.height },
      uPeriod: { value: cfg.period }, uCross: { value: cfg.cross },
      uGround: { value: groundY }, uWalks: { value: kind === 'deer' ? 1 : 0 }
    },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec4 iAttr;',
      'uniform float uTime, uFogDensity, uSize, uDist, uHeight, uPeriod, uCross, uGround, uWalks;',
      'uniform vec3 uCamPos;',
      'varying vec2 vUv; varying float vFade;',
      GLSL_COMMON,
      'void main(){',
      '  float cyc = fract(uTime / uPeriod + iAttr.x + iAttr.z * 0.004);',
      '  float span = uCross;',
      '  float u = cyc / span;',
      '  vFade = step(cyc, span) * smoothstep(0.0, 0.10, u) * smoothstep(1.0, 0.88, u);',
      '  float side = iAttr.w > 0.0 ? 1.0 : -1.0;',
      '  float travel = mix(-1.15, 1.15, u) * side;',
      '  float d = uDist * iAttr.y + iAttr.z * 2.0;',
      '  vec3 wp = vec3(travel * d * 0.75 + iAttr.z, uGround + uHeight + sin(uTime * 0.07 + iAttr.x * 6.0) * uHeight * 0.05, -d);',
      '  float bob = uWalks * abs(sin(uTime * 1.6 + iAttr.x * 9.0)) * uSize * 0.045;',
      '  wp.y += bob;',
      '  vec3 toCam = normalize(vec3(uCamPos.x - wp.x, 0.0, uCamPos.z - wp.z));',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 up = uWalks > 0.5 ? vec3(0.0,1.0,0.0) : normalize(cross(toCam, right));',
      '  vec3 p = wp + right * position.x * uSize * side + up * position.y * uSize;',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vFade *= 1.0 - fogAmt(-mv.z, uFogDensity) * 0.9;',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uFogCol, uAmbCol, uSunCol;',
      'varying vec2 vUv; varying float vFade;',
      'void main(){',
      '  vec4 t = texture2D(uMap, vUv);',
      '  if (t.a < 0.05 || vFade <= 0.001) discard;',
      '  vec3 c = t.rgb * (uAmbCol * 0.9 + uSunCol * 0.55);',
      '  gl_FragColor = vec4(mix(c, uFogCol, 0.25), t.a * vFade);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  mat.uniforms.uFogCol = U.uFogCol;
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 2;
  scene.add(m);
  App.visitor = m;
}

/* ---------- birds ---------- */
function buildBirds(scene, P, R, U) {
  if (!P.birds) return;
  var COUNT = P.birds;
  var quad = new THREE.PlaneGeometry(1, 1);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var iAttr = new Float32Array(COUNT * 4);
  for (var i = 0; i < COUNT; i++) {
    iAttr[i * 4] = R.range(0, 6.283);          /* phase */
    iAttr[i * 4 + 1] = R.range(28, 95);        /* height */
    iAttr[i * 4 + 2] = R.range(1.4, 3.4);      /* size */
    /* a negative speed marks a bird that circles rather than crosses */
    iAttr[i * 4 + 3] = (P.biome.raptors && R.chance(0.75)) ? -R.range(0.5, 0.9) : R.range(0.6, 1.5);
  }
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = COUNT;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
      uMap: { value: makeBirdTexture() }, uCamPos: U.uCamPos,
      uDrift: { value: R.range(-1, 1) }
    },
    transparent: true, depthWrite: false,
    vertexShader: [
      'attribute vec4 iAttr;',
      'uniform float uTime, uFogDensity, uDrift; uniform vec3 uCamPos;',
      'varying vec2 vUv; varying float vFog;',
      GLSL_COMMON,
      'void main(){',
      '  vec3 wp; float flap;',
      '  if (iAttr.w < 0.0) {',
      '    float ang = uTime * 0.045 * abs(iAttr.w) + iAttr.x;',
      '    float orbit = 34.0 + 46.0 * fract(iAttr.x * 0.37);',
      '    wp = vec3(sin(ang) * orbit, iAttr.y + sin(ang * 0.7) * 5.0,',
      '              -95.0 - 60.0 * fract(iAttr.x * 0.61) + cos(ang) * orbit);',
      '    flap = 0.86 + 0.14 * sin(uTime * 1.6 + iAttr.x);',
      '  } else {',
      '    float t = uTime * 0.05 * iAttr.w + iAttr.x;',
      '    float loop = 300.0;',
      '    float px = mod(t * 250.0, loop) - loop * 0.5;',
      '    float pz = -120.0 - 70.0 * sin(iAttr.x) - 30.0 * sin(t * 0.7);',
      '    wp = vec3(px * (uDrift > 0.0 ? 1.0 : -1.0), iAttr.y + sin(t * 1.7) * 4.0, pz);',
      '    flap = 0.55 + 0.45 * sin(uTime * 7.0 + iAttr.x * 5.0);',
      '  }',
      '  vec3 toCam = normalize(uCamPos - wp);',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 up = normalize(cross(toCam, right));',
      '  vec3 p = wp + right * position.x * iAttr.z + up * position.y * iAttr.z * flap;',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vFog = fogAmt(-mv.z, uFogDensity);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uFogCol;',
      'varying vec2 vUv; varying float vFog;',
      'void main(){',
      '  vec4 t = texture2D(uMap, vUv);',
      '  gl_FragColor = vec4(mix(t.rgb, uFogCol, vFog), t.a * (1.0 - vFog) * 0.85);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  mat.uniforms.uFogCol = U.uFogCol;
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 2;
  scene.add(m);
  App.birdMesh = m;
}

/* ---------- rain & snow ---------- */
function buildPrecip(scene, P, R, U) {
  var W = P.weather;
  if (W.rain > 0) {
    var COUNT = Math.round((2600 * W.rain + 700) * Q().precipMul);
    var quad = new THREE.PlaneGeometry(1, 1);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);
    var iPos = new Float32Array(COUNT * 3);
    var iAttr = new Float32Array(COUNT * 3);
    for (var i = 0; i < COUNT; i++) {
      iPos[i * 3] = R.range(-45, 45);
      iPos[i * 3 + 1] = R.range(0, 34);
      iPos[i * 3 + 2] = R.range(-58, -1.5);
      iAttr[i * 3] = R.range(0.35, 1.05) * (0.6 + W.rain * 0.8);
      iAttr[i * 3 + 1] = R.range(0.008, 0.019);
      iAttr[i * 3 + 2] = R.range(0.6, 1.5);
    }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 3));
    geo.instanceCount = COUNT;
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uWindDir: U.uWindDir, uWind: U.uWind, uGust: U.uGust,
        uCamPos: U.uCamPos, uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
        uAmbCol: U.uAmbCol, uSunCol: U.uSunCol,
        uIntensity: { value: W.rain }
      },
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      vertexShader: [
        'attribute vec3 iPos; attribute vec3 iAttr;',
        'uniform float uTime, uWind, uGust, uFogDensity, uIntensity;',
        'uniform vec2 uWindDir; uniform vec3 uCamPos;',
        'varying float vA;',
        GLSL_COMMON,
        'void main(){',
        '  float speed = 15.0 + iAttr.z * 12.0 + uGust * 6.0;',
        '  float range = 34.0;',
        '  float y = mod(iPos.y - uTime * speed, range);',
        '  float slant = uWind * (0.35 + 0.5 * uGust) * 0.5;',
        '  vec3 wp = vec3(iPos.x + uWindDir.x * (range - y) * slant * 0.35, y, iPos.z + uWindDir.y * (range - y) * slant * 0.35);',
        /* an on-shore wind must not blow a drop through the glass: wrap the
           drift back into the outdoor band, as the flakes do */
        '  wp.z = mod(wp.z + 58.0, 56.5) - 58.0;',
        '  vec3 dir = normalize(vec3(uWindDir.x * slant, -1.0, uWindDir.y * slant));',
        '  vec3 toCam = normalize(uCamPos - wp);',
        '  vec3 right = normalize(cross(dir, toCam));',
        '  float dr = length(wp - cameraPosition);',
        '  float grow = 1.0 + smoothstep(6.0, 40.0, dr) * 3.2;',
        '  vec3 p = wp + right * position.x * iAttr.y * grow + dir * position.y * iAttr.x * 2.2;',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  float d = -mv.z;',
        '  vA = (1.0 - fogAmt(d, uFogDensity)) * uIntensity * (0.30 + 0.5 * smoothstep(2.0, 16.0, d)) * 0.75',
        '     / grow * (1.0 - smoothstep(30.0, 46.0, dr));',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
      GLSL_TONE,
        'varying float vA;',
        'uniform vec3 uAmbCol, uSunCol;',
        'void main(){',
        '  vec3 lit = vec3(0.80, 0.85, 0.92) * clamp(uAmbCol * 1.6 + uSunCol * 0.5, 0.10, 1.0);',
        '  gl_FragColor = vec4(lit, vA);',
        '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
      ].join('\n')
    });
    var rain = new THREE.Mesh(geo, mat);
    rain.frustumCulled = false;
    rain.renderOrder = 3;
    scene.add(rain);
    App.rain = rain;
  }

  if (P.leafFall) buildFlakes(scene, P, R, U, {
    count: Math.round(P.leafFall * Q().precipMul), colour: P.fallCol,
    size: [0.05, 0.13], fall: [0.28, 0.6], sway: 1.8, intensity: 0.85
  });
  if (W.snow > 0) buildFlakes(scene, P, R, U, {
    count: Math.round((2000 * W.snow + 600) * Q().precipMul),
    colour: '#f5f8ff', size: [0.025, 0.075], fall: [0.55, 1.4],
    sway: 1.0, intensity: W.snow, snow: true
  });
}

/* anything that drifts down: snow, autumn leaves, blossom */
function buildFlakes(scene, P, R, U, o) {
  var CN = o.count;
  if (!CN) return;
  var q2 = new THREE.PlaneGeometry(1, 1);
  var g2 = new THREE.InstancedBufferGeometry();
  g2.index = q2.index;
  g2.setAttribute('position', q2.attributes.position);
  g2.setAttribute('uv', q2.attributes.uv);
  var sPos = new Float32Array(CN * 3);
  var sAttr = new Float32Array(CN * 3);
  for (var j = 0; j < CN; j++) {
    sPos[j * 3] = R.range(-40, 40);
    sPos[j * 3 + 1] = R.range(0, 30);
    sPos[j * 3 + 2] = R.range(-52, -1.5);
    sAttr[j * 3] = R.range(o.size[0], o.size[1]);
    sAttr[j * 3 + 1] = R.range(0, 6.283);
    sAttr[j * 3 + 2] = R.range(o.fall[0], o.fall[1]);
  }
  g2.setAttribute('iPos', new THREE.InstancedBufferAttribute(sPos, 3));
  g2.setAttribute('iAttr', new THREE.InstancedBufferAttribute(sAttr, 3));
  g2.instanceCount = CN;
  var m2 = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uWindDir: U.uWindDir, uWind: U.uWind, uGust: U.uGust,
      uCamPos: U.uCamPos, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uFogCol: U.uFogCol,
      uAmbCol: U.uAmbCol, uSunCol: U.uSunCol,
      uMap: { value: makeSoftDot() },
      uColour: { value: new THREE.Color(o.colour) },
      uSway: { value: o.sway },
      uSpin: { value: o.snow ? 0.0 : 1.0 },
      uIntensity: { value: o.intensity }
    },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec3 iAttr;',
      'uniform float uTime, uWind, uGust, uFogDensity, uIntensity, uSway, uSpin;',
      'uniform vec2 uWindDir; uniform vec3 uCamPos;',
      'varying vec2 vUv; varying float vA;',
      GLSL_COMMON,
      'void main(){',
      '  float range = 30.0;',
      '  float fall = iAttr.z;',
      '  float y = mod(iPos.y - uTime * fall, range);',
      '  float age = range - y;',
      '  float drift = uWind * (0.4 + 0.6 * uGust);',
      '  vec3 wp = vec3(iPos.x, y, iPos.z);',
      '  wp.x += sin(uTime * 0.45 * uSway + iAttr.y) * 0.9 * uSway + uWindDir.x * age * drift * 0.42;',
      '  wp.z += cos(uTime * 0.37 * uSway + iAttr.y * 1.7) * 0.9 * uSway + uWindDir.y * age * drift * 0.42;',
      '  wp.x = mod(wp.x + 45.0, 90.0) - 45.0;',
      '  wp.z = mod(wp.z + 57.0, 56.0) - 57.0;',
      '  vec3 toCam = normalize(uCamPos - wp);',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 up = normalize(cross(toCam, right));',
      '  float sp = uSpin * (uTime * 2.1 + iAttr.y * 4.0);',
      '  vec2 q = vec2(position.x * cos(sp) - position.y * sin(sp),',
      '               position.x * sin(sp) + position.y * cos(sp));',
      '  float squash = mix(1.0, 0.35 + 0.65 * abs(sin(uTime * 1.7 + iAttr.y)), uSpin);',
      '  float df = length(wp - cameraPosition);',
      '  float grow = 1.0 + smoothstep(6.0, 36.0, df) * 2.2;',
      '  vec3 p = wp + right * q.x * iAttr.x * grow + up * q.y * iAttr.x * squash * grow;',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  float d = -mv.z;',
      '  vA = (1.0 - fogAmt(d, uFogDensity)) * uIntensity * smoothstep(1.2, 5.0, d)',
      '     / (0.6 + 0.4 * grow) * (1.0 - smoothstep(28.0, 44.0, df));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uColour, uAmbCol, uSunCol;',
      'uniform float uSpin;',
      'varying vec2 vUv; varying float vA;',
      'void main(){',
      '  float a = texture2D(uMap, vUv).a;',
      '  if (uSpin > 0.5) a = smoothstep(0.25, 0.6, a);',
      '  vec3 c = uColour * clamp(uAmbCol * 1.5 + uSunCol * 0.6, 0.12, 1.0);',
      '  gl_FragColor = vec4(c, a * vA * 0.9);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  var mesh = new THREE.Mesh(g2, m2);
  mesh.frustumCulled = false;
  mesh.renderOrder = 3;
  scene.add(mesh);
  if (o.snow) App.snow = mesh; else App.leaves = mesh;
}

/* ---------- the room, the window ---------- */
function openingPoints(P, e, cw) {
  var w = P.win.w, h = P.win.h, cy = P.win.cy;
  var arch = P.win.arch;
  var x0 = -w / 2 - e, x1 = w / 2 + e;
  var y0 = cy - h / 2 - e, y1 = cy + h / 2 + e;
  var r = w / 2 + e;
  var springY = cy + h / 2 - w / 2;
  var pts = [];
  pts.push(new THREE.Vector2(x0, y0));
  if (arch) {
    pts.push(new THREE.Vector2(x0, springY));
    var seg = 26;
    for (var i = 0; i <= seg; i++) {
      var a = Math.PI - Math.PI * (i / seg);
      pts.push(new THREE.Vector2(Math.cos(a) * r, springY + Math.sin(a) * r));
    }
  } else {
    pts.push(new THREE.Vector2(x0, y1));
    pts.push(new THREE.Vector2(x1, y1));
  }
  pts.push(new THREE.Vector2(x1, y0));
  if (!cw) pts.reverse();
  return pts;
}

function buildRoom(scene, P, U) {
  var R = RNG(P.base + '/room');
  var g = new THREE.Group();
  var w = P.win.w, h = P.win.h, cy = P.win.cy;
  var arch = P.win.arch;
  var springY = cy + h / 2 - w / 2;
  var wallW = 40, wallH = 26;

  /* --- wall with the opening cut out, extruded to give the reveal --- */
  var shape = new THREE.Shape([
    new THREE.Vector2(-wallW / 2, cy - wallH / 2),
    new THREE.Vector2(wallW / 2, cy - wallH / 2),
    new THREE.Vector2(wallW / 2, cy + wallH / 2),
    new THREE.Vector2(-wallW / 2, cy + wallH / 2)
  ]);
  shape.holes.push(new THREE.Path(openingPoints(P, 0, true)));
  var wallGeo = new THREE.ExtrudeGeometry(shape, { depth: P.win.wallDepth, bevelEnabled: false, steps: 1, curveSegments: 24 });
  wallGeo.translate(0, 0, -P.win.wallDepth);
  var wallTex = makeWallTexture(P, R, wallW, wallH);
  wallTex.repeat.set(1 / wallW, 1 / wallH);
  wallTex.offset.set(0.5, 0.5 - cy / wallH);
  var wallMat = new THREE.MeshLambertMaterial({
    color: new THREE.Color(P.win.wallTint),
    map: wallTex,
    side: THREE.DoubleSide
  });
  var wall = new THREE.Mesh(wallGeo, wallMat);
  g.add(wall);

  /* --- interior casing --- */
  var casingShape = new THREE.Shape(openingPoints(P, P.win.casing, false));
  casingShape.holes.push(new THREE.Path(openingPoints(P, 0.004, true)));
  var casingGeo = new THREE.ExtrudeGeometry(casingShape, { depth: P.win.casingDepth, bevelEnabled: false, steps: 1, curveSegments: 24 });
  var finTex = makeFinishTexture(P.win.finish, R);
  var frameMat = new THREE.MeshLambertMaterial({ map: finTex, side: THREE.DoubleSide });
  var casing = new THREE.Mesh(casingGeo, frameMat);
  g.add(casing);

  /* --- sash frame, set back into the reveal --- */
  var zSash = -P.win.wallDepth * P.win.setback;
  var sashShape = new THREE.Shape(openingPoints(P, -0.012, false));
  sashShape.holes.push(new THREE.Path(openingPoints(P, -0.012 - P.win.frame, true)));
  var sash = new THREE.Group();
  /* hinged on one jamb, so opening it reads at a glance */

  var sashGeo = new THREE.ExtrudeGeometry(sashShape, { depth: 0.055, bevelEnabled: false, steps: 1, curveSegments: 24 });
  sashGeo.translate(w / 2, 0, 0);

  var innerX0 = -w / 2 + P.win.frame, innerX1 = w / 2 - P.win.frame;
  var innerY0 = cy - h / 2 + P.win.frame;

  var barMat = frameMat;
  var i, cnvY;
  for (i = 1; i < cols; i++) {
    var bx = innerX0 + (innerX1 - innerX0) * (i / cols);
    var bh = innerY1 - innerY0;
    var vb = new THREE.Mesh(new THREE.BoxGeometry(bar, bh, bd), barMat);
    vb.position.set(bx + w / 2, (innerY0 + innerY1) / 2, 0.027);
    sash.add(vb);
  }
  for (i = 1; i < rows; i++) {
    cnvY = innerY0 + (innerY1 - innerY0) * (i / rows);
    var thick = (P.win.meetingRow && i === P.win.meetingRow) ? bar * 3.1 : bar;
    var hb = new THREE.Mesh(new THREE.BoxGeometry(innerX1 - innerX0, thick, bd * (thick > bar ? 1.25 : 1)), barMat);
    hb.position.set(w / 2, cnvY, 0.027);
    sash.add(hb);
  }
  if (arch && !P.win.clear) {
    /* transom at the spring line + radial bars in the fan light */
    var tr = new THREE.Mesh(new THREE.BoxGeometry(innerX1 - innerX0, bar * 1.6, bd), barMat);
    tr.position.set(w / 2, springY, 0.027);
    sash.add(tr);
    var rr = w / 2 - P.win.frame;
    var fan = cols > 1 ? 3 : 2;
    for (i = 1; i <= fan; i++) {
      var ang = Math.PI * (i / (fan + 1));
      var rb = new THREE.Mesh(new THREE.BoxGeometry(bar, rr, bd), barMat);
      rb.position.set(w / 2 + Math.cos(ang) * rr / 2, springY + Math.sin(ang) * rr / 2, 0.027);
      rb.rotation.z = ang - Math.PI / 2;
      sash.add(rb);
    }
  }

  /* --- sill + apron --- */
  var sillW = w + P.win.casing * 2 + 0.14;
  var sillGeo = new THREE.BoxGeometry(sillW, 0.055, P.win.wallDepth + P.win.sillDepth);
  var sill = new THREE.Mesh(sillGeo, frameMat);
  sill.position.set(0, cy - h / 2 - 0.027, -P.win.wallDepth / 2 + P.win.sillDepth / 2);
  g.add(sill);
  var apron = new THREE.Mesh(new THREE.BoxGeometry(sillW * 0.86, 0.10, 0.028), frameMat);
  apron.position.set(0, cy - h / 2 - 0.115, 0.014);
  g.add(apron);

  /* --- glass --- */
  var glassGeo = new THREE.PlaneGeometry(w * 1.02, h * 1.02);
  var glassMat = new THREE.MeshBasicMaterial({
    map: makeGlassTexture(R),
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  var glass = new THREE.Mesh(glassGeo, glassMat);
  glass.position.set(w / 2, cy, 0.01);
  glass.renderOrder = 6;
  sash.add(glass);
  /* frost forms on the glass itself, so the glazing bars sit in front of it
     and it reads as outside the pane rather than a film over the window */
  if (P.weather.snow > 0 || P.baseSnow > 0.3) {
    var frostMat = new THREE.MeshBasicMaterial({
      map: tex(makeFrostCanvas(P), false), transparent: true, opacity: 0, depthWrite: false
    });
    var frost = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.02, h * 1.02), frostMat);
    frost.position.set(w / 2, cy, 0.014);
    frost.renderOrder = 5;
    sash.add(frost);
    App.frostMat = frostMat;
    App.frostTarget = clamp(0.18 + (P.weather.snow || 0) * 0.28 + (P.baseSnow || 0) * 0.12, 0, 0.55);
  } else { App.frostMat = null; App.frostTarget = 0; }
  App.glass = glass;
  App.glassMat = glassMat;

  g.visible = !App.bare;
  scene.add(g);
  App.room = g;
  App.sashAngle = App.sashAngle || 0;
}


/* ---------- post ----------
   The scene is drawn to a target, its highlights blurred at quarter size and
   added back, then graded and given grain. One extra full-screen pass. */
function setupPost() {
  var r = App.renderer;
  if (!r) return;

     4x multisampling: fine moving detail gets ten-odd samples a pixel and
     stops crawling when the view shifts. */

  /* An offscreen target has no anti-aliasing unless it is multisampled, and
     that needs WebGL2. Without it, bloom is not worth every edge in the scene
     shimmering, so the pass is skipped and the scene draws straight to screen. */
  if (!r.capabilities.isWebGL2 || !THREE.WebGLMultisampleRenderTarget) return;

     buffer; without it the depth is 16-bit and the near field z-fights */

  var quarter = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false };
  var qw = Math.max(2, w >> 2), qh = Math.max(2, h >> 2);
