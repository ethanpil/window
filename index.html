<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0d">
<title>A window, somewhere</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0a0b;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
  }
  #gl, #fx {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  }
  #fx { pointer-events: none; }
  #vig {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(130% 100% at 50% 44%, rgba(0,0,0,0) 42%, rgba(0,0,0,.34) 78%, rgba(0,0,0,.62) 100%);
    mix-blend-mode: multiply;
  }
  #curtain {
    position: fixed; inset: 0; background: #0a0a0b; pointer-events: none;
    transition: opacity 620ms ease;
  }
  #curtain.gone { opacity: 0; }

  /* ---- controls: a small brass plate resting at the bottom of the room ---- */
  #hud {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: stretch;
    gap: 6px;
    padding: 9px 16px 8px;
    border-radius: 2px;
    background: rgba(16,15,14,.5);
    --hudbg: #1b1917;
    border: 1px solid rgba(214,199,170,.16);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    backdrop-filter: blur(9px) saturate(.9);
    -webkit-backdrop-filter: blur(9px) saturate(.9);
    color: #ddd3c2;
    opacity: 0;
    pointer-events: none;
    transition: opacity 900ms ease;
    z-index: 5;
    width: min(96vw, 1040px);
  }
  #hud.awake, #hud:focus-within { opacity: 1; pointer-events: auto; transition: opacity 200ms ease; }
  #hud .row {
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 7px 13px;
  }
  /* The description changes length with every seed. On its own line it cannot
     push the controls around, and each control is sized for its longest label
     so toggling one never nudges its neighbours. */
  #hud .row.desc { padding: 0 20px 1px; }   /* clear of the close button */
  #hud .row.controls button { text-align: left; display: inline-flex; align-items: center; gap: 7px; }
  #hud .row.controls button svg { width: 13px; height: 13px; flex: none; opacity: .85; }
  #hud .row.controls button:hover svg { opacity: 1; }
  #bNew    { min-width: 11.5ch; }
  #bShuffle{ min-width: 12.5ch; }
  #bPanes  { min-width: 14.5ch; }
  #bQual   { min-width: 21.5ch; }
  #bAuto   { min-width: 14.5ch; font-variant-numeric: tabular-nums; }
  #bSound  { min-width: 14.5ch; }
  #bMotion { min-width: 15.5ch; }
  #bCopy, #bCode { min-width: 0; }
  #hud .row.sub {
    justify-content: space-between; flex-wrap: wrap;
    gap: 6px 10px;
    padding-top: 6px;
    border-top: 1px solid rgba(214,199,170,.12);
  }
  #hud .grp { display: inline-flex; align-items: center; gap: 8px; }
  #hud .grp.right { margin-left: auto; }
  #codeval {
    font: 400 10.5px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .05em; color: #e6dcc8; user-select: all; -webkit-user-select: all;
  }
  #paste {
    position: fixed; inset: 0; z-index: 8; display: grid; place-items: center;
    background: rgba(8,8,9,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  #paste[hidden] { display: none; }
  #paste .box {
    width: min(92vw, 520px); padding: 16px 18px 14px; border-radius: 2px;
    background: rgba(22,21,19,.96); border: 1px solid rgba(214,199,170,.22);
    box-shadow: 0 18px 50px rgba(0,0,0,.5); color: #ddd3c2;
  }
  #paste label { display: block; font-size: 13px; font-style: italic; margin-bottom: 8px; }
  #pasteIn {
    width: 100%; font: 400 12.5px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #efe6d4; background: rgba(0,0,0,.35); border: 1px solid rgba(214,199,170,.28);
    border-radius: 2px; padding: 8px 9px; outline: none;
  }
  #pasteIn:focus { border-color: #d8c9a4; }
  #paste .acts { display: flex; gap: 14px; justify-content: flex-end; margin-top: 10px; }
  #pasteMsg { font-size: 11.5px; color: #d9a08e; min-height: 1.2em; margin-top: 4px; }
  .lbl {
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    opacity: .48; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #hud .row.sub button { font-size: 10.5px; opacity: .8; }
  #hud.notools .row.controls { display: none; }
  #bPin.pinned .pinhead { fill: currentColor; }
  #bPin.pinned { color: #f0e4c8; }
  #bTools[aria-expanded="false"] { opacity: .55; }
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 3px; min-width: 0; border-bottom: 0; line-height: 0;
  }
  .iconbtn svg { width: 14px; height: 14px; display: block; }
  #bPick svg { transition: transform 320ms ease; }
  #bPick[aria-expanded="true"] { color: #fff5e2; }
  #bPick[aria-expanded="true"] svg { transform: rotate(60deg); }
  .iconbtn:hover, .iconbtn:focus-visible { color: #fff5e2; border-bottom: 0; }
  #bClose { position: absolute; top: 2px; right: 4px; opacity: .45; }
  #bClose svg { width: 12px; height: 12px; }
  #bClose:hover, #bClose:focus-visible { opacity: 1; }
  .iconbtn.done { color: #b9d6a8; }
  #hud .row.sub button:hover { opacity: 1; }
  #note {
    font-size: 13.5px; letter-spacing: .01em; color: #cfc3ad; font-style: italic;
    white-space: normal; text-align: center; max-width: 100%;
  }
  #note b { font-weight: 400; font-style: normal; color: #efe6d4; }
  .rule { width: 1px; height: 20px; background: rgba(214,199,170,.2); flex: none; }
  button {
    font-family: inherit; font-size: 13px; color: #cfc3ad;
    background: none; border: 0; padding: 4px 2px; cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  button:hover, button:focus-visible { color: #fff5e2; border-bottom-color: rgba(216,201,164,.55); outline: none; }
  #hud small { font-size: 11px; opacity: .55; }

  @media (prefers-reduced-motion: reduce) { #curtain { transition: none; } }
  #pick {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(146px, 1fr));
    gap: 8px 14px; padding: 10px 14px 6px; margin: 6px 6px 0;
    border-top: 1px solid rgba(214,199,170,.12);
  }
  #hud:not(.awake) #pick { display: none; }
  #pick[hidden] { display: none; }
  #pick label {
    display: flex; flex-direction: column; gap: 3px;
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    opacity: .55; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #pick select {
    font-family: inherit; font-size: 12px; letter-spacing: 0; text-transform: none;
    color: #e6dcc8; background: rgba(28,26,24,.9);
    border: 1px solid rgba(214,199,170,.22); border-radius: 2px;
    padding: 3px 4px; outline: none; opacity: 1;
  }
  #pick select:focus { border-color: #d8c9a4; }
  #pick > button { align-self: end; min-width: 8ch; }
  #err {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    max-width: min(920px, 92vw); padding: 8px 12px; z-index: 9;
    font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #f3d9c9; background: rgba(60,18,12,.88); border: 1px solid rgba(255,170,140,.35);
    border-radius: 2px; white-space: pre-wrap; word-break: break-word; cursor: pointer;
  }
  #err[hidden] { display: none; }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    color: #cfc3ad; padding: 32px; font-size: 16px; line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="vig"></div>
<div id="curtain"></div>

<div id="hud">
  <button id="bClose" class="iconbtn" aria-label="Hide this bar" title="Hide this bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="row desc"><span id="note" aria-live="polite"></span></div>
  <div class="row controls" id="rowControls">
    <button id="bNew" title="Open a different window (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg><span>new view</span></button>
    <button id="bShuffle" title="Same scene, new arrangement"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg><span>reshuffle</span></button>
    <button id="bPanes" title="Show or hide the glazing bars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="12" y1="3" x2="12" y2="21"/></svg><span>panes: on</span></button>
    <button id="bQual" title="Detail level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg><span>detail: auto</span></button>
    <button id="bAuto" title="Change the view on a timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg><span>auto: off</span></button>
    <button id="bSound" title="Ambient sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>sound: off</span></button>
    <button id="bMotion" title="View drifts with the pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg><span>motion: on</span></button>
  </div>
  <div class="row sub">
    <span class="grp">
      <button id="bPin" class="iconbtn" aria-pressed="false" aria-label="Keep this bar on screen" title="Keep this bar on screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="pinhead" d="M9.5 3h5v5l3 3.2v2h-11v-2L9.5 8V3z"/><path d="M12 13.2V21"/></svg></button>
      <button id="bRefresh" class="iconbtn" aria-label="New view" title="A new view (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg></button>
      <button id="bTools" class="iconbtn" aria-expanded="true" aria-controls="rowControls" aria-label="Show or hide the controls" title="Show or hide the controls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button id="bPick" class="iconbtn" aria-expanded="false" aria-controls="pick" aria-label="Choose the ingredients" title="Choose the ingredients yourself"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 13h18M3 19h18"/><circle cx="9" cy="7" r="2.3" fill="var(--hudbg)"/><circle cx="16" cy="13" r="2.3" fill="var(--hudbg)"/><circle cx="7" cy="19" r="2.3" fill="var(--hudbg)"/></svg></button>
    </span>
    <span class="grp right">
      <span class="lbl">Ingredients-Seed:</span>
      <span id="codeval" title="Everything that decides this scene, and the seed"></span>
      <button id="bCopy" class="iconbtn" aria-label="Copy the Ingredients-Seed" title="Copy the Ingredients-Seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button id="bPaste" class="iconbtn" aria-label="Paste an Ingredients-Seed" title="Paste an Ingredients-Seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 13h6M9 17h4"/></svg></button>
    </span>
  </div>
  <div id="pick" hidden>
    <label>landscape<select id="selBiome"></select></label>
    <label>weather<select id="selWeather"></select></label>
    <label>light<select id="selTime"></select></label>
    <label>window<select id="selWindow"></select></label>
    <label>frame<select id="selFinish"></select></label>
    <label>night<select id="selNight"><option value="">allowed</option><option value="off">never</option></select></label>
    <label>clock<select id="selClock"><option value="">from the seed</option><option value="live">my local time</option></select></label>
    <label>view<select id="selView"><option value="">window</option><option value="open">window open</option><option value="bare">no window at all</option></select></label>
    <label>season<select id="selSeason"></select></label>
    <button id="bClear">clear all</button>
  </div>
</div>

<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;color:#cfc3ad;
  font:16px/1.6 Georgia,serif;text-align:center;padding:32px">
  This window is drawn with JavaScript, which is currently turned off.</div></noscript>

<div id="paste" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="pasteLbl">
    <label id="pasteLbl" for="pasteIn">Paste an Ingredients-Seed, or a seed</label>
    <input id="pasteIn" spellcheck="false" autocomplete="off" placeholder="2032518e88dc13480000-3fa9c21e">
    <div class="acts"><button id="pasteGo">open</button><button id="pasteNo">cancel</button></div>
    <div id="pasteMsg"></div>
  </div>
</div>
<div id="err" hidden></div>
<div id="fallback">This window needs WebGL, and your browser isn&rsquo;t offering it.<br>Try a different browser, or enable hardware acceleration.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* Anything that goes wrong is written to the screen, so it can be read and
   reported. Shader failures come through console.error, so that is hooked too. */
var ERRLOG = [];
function showError(msg) {
  msg = String(msg || '').slice(0, 600);
  if (ERRLOG.indexOf(msg) >= 0) return;
  ERRLOG.push(msg);
  var el = document.getElementById('err');
  if (!el) return;
  el.textContent = ERRLOG.slice(-4).join('\n\n') + '\n\n(click to dismiss)';
  el.hidden = false;
}
window.addEventListener('error', function (e) {
  showError((e.message || 'error') + (e.filename ? '' : '') + (e.lineno ? '  @' + e.lineno + ':' + (e.colno || 0) : ''));
});
window.addEventListener('unhandledrejection', function (e) {
  showError('unhandled: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
(function () {
  var orig = console.error;
  console.error = function () {
    try { showError(Array.prototype.map.call(arguments, function (a) { return typeof a === 'string' ? a : (a && a.message) || String(a); }).join(' ')); } catch (x) {}
    return orig.apply(console, arguments);
  };
})();
document.addEventListener('DOMContentLoaded', function () {
  var el = document.getElementById('err');
  if (el) el.addEventListener('click', function () { el.hidden = true; });
});

/* ============================================================
   1. seeded randomness
   ============================================================ */
function xmur3(str) {
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function RNG(seedStr) {
  var seedFn = xmur3(String(seedStr));
  var r = mulberry32(seedFn());
  var api = {
    f: r,
    range: function (a, b) { return a + r() * (b - a); },
    int: function (a, b) { return Math.floor(a + r() * (b - a + 1)); },
    pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
    chance: function (p) { return r() < p; },
    sign: function () { return r() < 0.5 ? -1 : 1; },
    gauss: function () {
      var u = 0, v = 0;
      while (u === 0) u = r();
      while (v === 0) v = r();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * v);
    },
    weighted: function (pairs) {
      var total = 0, i;
      for (i = 0; i < pairs.length; i++) total += pairs[i][1];
      var x = r() * total;
      for (i = 0; i < pairs.length; i++) { x -= pairs[i][1]; if (x <= 0) return pairs[i][0]; }
      return pairs[pairs.length - 1][0];
    },
    sub: function (tag) { return RNG(seedStr + '/' + tag); }
  };
  return api;
}

/* integer hash → value noise, used for terrain + textures */
function ihash(x, y, s) {
  var h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 362437);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  var x0 = Math.floor(x), y0 = Math.floor(y);
  var fx = x - x0, fy = y - y0;
  var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  var a = ihash(x0, y0, s), b = ihash(x0 + 1, y0, s);
  var c = ihash(x0, y0 + 1, s), d = ihash(x0 + 1, y0 + 1, s);
  return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
}
function fbm2(x, y, s, oct) {
  var v = 0, amp = 0.5, f = 1, norm = 0;
  for (var i = 0; i < oct; i++) {
    v += vnoise(x * f, y * f, s + i * 131) * amp;
    norm += amp; amp *= 0.5; f *= 2.02;
  }
  return (v / norm) * 2 - 1;
}
/* tileable fbm on a square grid, for repeating canvas textures */
function tnoise(x, y, period, s) {
  var x0 = Math.floor(x), y0 = Math.floor(y);
  var fx = x - x0, fy = y - y0;
  var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  var xa = ((x0 % period) + period) % period, ya = ((y0 % period) + period) % period;
  var xb = (xa + 1) % period, yb = (ya + 1) % period;
  var a = ihash(xa, ya, s), b = ihash(xb, ya, s);
  var c = ihash(xa, yb, s), d = ihash(xb, yb, s);
  var t = a + (b - a) * sx;
  return t + ((c + (d - c) * sx) - t) * sy;
}
function tileFBM(size, seed, octaves, basePeriod) {
  var out = new Float32Array(size * size);
  var amp = 1, norm = 0, o, y, x, p, f;
  for (o = 0; o < octaves; o++) {
    p = basePeriod * Math.pow(2, o);
    f = p / size;
    for (y = 0; y < size; y++) {
      for (x = 0; x < size; x++) {
        out[y * size + x] += tnoise(x * f, y * f, p, seed + o * 977) * amp;
      }
    }
    norm += amp; amp *= 0.52;
  }
  for (var i = 0; i < out.length; i++) out[i] /= norm;
  return out;
}

var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
var lerp = function (a, b, t) { return a + (b - a) * t; };
function smoothstep(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }

/* ============================================================
   2. seeds
   ============================================================ */
/* A seed is 32 bits written as hex. Up to eight hex characters are accepted
   and padded on the left; anything else is not a seed. */
function seedHex(str) {
  str = String(str == null ? '' : str).replace(/\s+/g, '');
  if (!/^[0-9a-f]{1,8}$/i.test(str)) return null;
  return ('00000000' + str.toLowerCase()).slice(-8);
}
function randomSeed() {
  var v;
  try { var a = new Uint32Array(1); window.crypto.getRandomValues(a); v = a[0]; }
  catch (e) { v = (Math.random() * 4294967296) >>> 0; }
  return ('00000000' + v.toString(16)).slice(-8);
}

function makeFlowerTexture(sp, R) {

     as the quad they will be drawn on, so nothing is stretched. Each is seen
     from a different angle: face on, three-quarter, side, and a bud. The head
     is about a third of the card's width, on a stem as tall as the grass: a
     head two-thirds of it on a short stalk read as a lollipop. */
  var W = 96, Hh = 360, c = cnv(W * 4, Hh), g = c.getContext('2d');
  g.clearRect(0, 0, W * 4, Hh);
  var views = [
    { squash: 1.0,  scale: 1.0,  petals: 0,  bud: false },
    { squash: 0.72, scale: 0.95, petals: 1,  bud: false },
    { squash: 0.42, scale: 0.9,  petals: -1, bud: false },
    { squash: 0.8,  scale: 0.55, petals: 0,  bud: true }
  ];
  for (var v = 0; v < 4; v++) {
    var V = views[v], ox = v * W;
    var cx = ox + W / 2, cy = Hh * 0.075, rr = W * 0.21 * V.scale * (sp.kind === 'spike' ? 1.6 : 1);
    g.strokeStyle = 'rgba(74,92,45,0.95)'; g.lineWidth = W * 0.035; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx + R.range(-3, 3), Hh);
    g.quadraticCurveTo(cx + R.range(-8, 8), Hh * 0.62, cx, cy + rr * 0.3); g.stroke();
    g.fillStyle = 'rgba(86,110,52,0.9)';
    for (var lf = 0; lf < 1 + (R.f() < 0.6 ? 1 : 0); lf++) {
      var ly = Hh * R.range(0.45, 0.85), side = R.f() < 0.5 ? -1 : 1;
      g.save(); g.translate(cx, ly); g.rotate(side * R.range(0.5, 1.1));
      g.beginPath(); g.ellipse(side * W * 0.08, 0, W * 0.11, W * 0.035, 0, 0, 6.283); g.fill(); g.restore();
    }
    g.save(); g.translate(cx, cy); g.scale(1, V.squash); g.translate(-cx, -cy);
    g.fillStyle = sp.petal;
    if (V.bud) {
      g.fillStyle = sp.mid;
      g.beginPath(); g.ellipse(cx, cy, rr * 0.45, rr * 0.6, 0, 0, 6.283); g.fill();
      g.fillStyle = sp.petal;
      g.beginPath(); g.ellipse(cx, cy - rr * 0.15, rr * 0.32, rr * 0.45, 0, 0, 6.283); g.fill();
    } else if (sp.kind === 'round') {
      var n = 7 + Math.floor(R.f() * 4) + V.petals, rot = R.f() * 6.283;
      for (var i = 0; i < n; i++) {
        var a = rot + (i / n) * 6.283 + R.f() * 0.1;
        g.beginPath();
        g.ellipse(cx + Math.cos(a) * rr * 0.55, cy + Math.sin(a) * rr * 0.55, rr * 0.46, rr * 0.28, a, 0, 6.283);
        g.fill();
      }
      g.fillStyle = sp.mid;
      g.beginPath(); g.arc(cx, cy, rr * 0.30, 0, 6.283); g.fill();
    } else if (sp.kind === 'puff') {
      for (var j = 0; j < 22; j++) {
        var aa = R.f() * 6.283, rad = Math.sqrt(R.f()) * rr * 0.85;
        g.fillStyle = j % 3 === 0 ? sp.mid : sp.petal;
        g.beginPath(); g.arc(cx + Math.cos(aa) * rad, cy + Math.sin(aa) * rad * 0.85, rr * 0.20, 0, 6.283); g.fill();
      }
    } else if (sp.kind === 'flat') {
      for (var k = 0; k < 26; k++) {
        var ax = cx + (R.f() - 0.5) * rr * 2.0, ay = cy + (R.f() - 0.5) * rr * 0.8;
        g.fillStyle = k % 4 === 0 ? sp.mid : sp.petal;
        g.beginPath(); g.arc(ax, ay, rr * 0.16, 0, 6.283); g.fill();
      }
    } else {
      for (var m = 0; m < 16; m++) {
        var t = m / 16;
        var sy = cy - rr * 0.9 + t * rr * 2.2;
        var sw = rr * (0.75 - t * 0.35);
        g.fillStyle = m % 2 ? sp.mid : sp.petal;
        g.beginPath(); g.ellipse(cx + (R.f() - 0.5) * 3, sy, sw * 0.5, rr * 0.16, 0, 0, 6.283); g.fill();
      }
    }
    g.restore();
  }
  return tex(c, false);
}


/* ---------- foliage ----------
   A crown is branches with sprays of leaves on them, not a pile of circles.
   Sprays are drawn dark-to-light so the back of the crown recedes, the sun
   side is brighter, and the silhouette is ragged with gaps that show sky. */
function leafSpray(g, x, y, r, col, lite, n, leafW, leafL, R) {
  for (var i = 0; i < n; i++) {
    var a = R.f() * 6.283, d = Math.sqrt(R.f()) * r;
    var lx = x + Math.cos(a) * d, ly = y + Math.sin(a) * d * 0.8;
    var c = col.clone().lerp(lite, R.range(0, 0.6) * (0.4 + 0.6 * (1 - d / r)));
    g.fillStyle = 'rgb(' + ((c.r * 255) | 0) + ',' + ((c.g * 255) | 0) + ',' + ((c.b * 255) | 0) + ')';
    g.save(); g.translate(lx, ly); g.rotate(R.f() * 6.283);
    g.beginPath(); g.ellipse(0, 0, leafL, leafW, 0, 0, 6.283); g.fill();
    g.restore();
  }
}
function drawBranches(g, S, x0, y0, len, ang, width, depth, R, col, tips) {
  if (depth <= 0 || width < 0.6) { if (tips) tips.push([x0, y0]); return; }
  var x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len;
  g.strokeStyle = col; g.lineWidth = width; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x0, y0);
  g.quadraticCurveTo(x0 + Math.cos(ang + R.range(-0.3, 0.3)) * len * 0.5, y0 + Math.sin(ang) * len * 0.5, x1, y1);
  g.stroke();
  var forks = depth > 1 ? 2 + (R.f() < 0.4 ? 1 : 0) : 0;
  if (!forks) { if (tips) tips.push([x1, y1]); return; }
  for (var f = 0; f < forks; f++) {
    /* a limb may spread but never turn back down: a downward fork ends up
       outside the crown, where no leaves are drawn, and reads as a bare stick */
    var na = ang + R.range(-0.75, 0.75) - 0.18;
    na = Math.max(Math.min(na, -0.12), -Math.PI + 0.12);
    drawBranches(g, S, x1, y1, len * R.range(0.55, 0.75), na, width * 0.62, depth - 1, R, col, tips);
  }
}
function drawCrown(g, S, kind, P, R, cx, cy, rx, ry, base, lite, opts) {
  var dark = base.clone().multiplyScalar(0.55);
  var sprays = [];
  var n = opts.sprays || 60;
  /* every branch end gets its own foliage, so no limb is left bare */
  var tips = opts.tips || [];
  for (var ti = 0; ti < tips.length; ti++) {
    var tp = tips[ti];
    /* lighter toward the outside of the crown, where leaves see the sky;
       which side the sun is on is the shader's business */
    var side0 = Math.abs(tp[0] - cx) / Math.max(rx, 1);
    var lit0 = 0.42 + 0.32 * (1 - (tp[1] - (cy - ry)) / (2 * ry)) + 0.12 * side0;
    sprays.push([tp[0], tp[1], lit0 + R.range(-0.1, 0.1), 1]);
    if (R.f() < 0.75) sprays.push([tp[0] + R.range(-1, 1) * S * 0.035, tp[1] + R.range(-1, 1) * S * 0.035, lit0 + R.range(-0.15, 0.1), 1]);
  }
  for (var i = 0; i < n; i++) {
    var a = R.f() * 6.283, d = Math.pow(R.f(), 0.55);
    var px = cx + Math.cos(a) * d * rx, py = cy + Math.sin(a) * d * ry;
    if (opts.flatTop && py < cy - ry * 0.15) py = cy - ry * 0.15 + (py - cy + ry * 0.15) * 0.25;
    var lit = 0.35 + 0.35 * (1 - (py - (cy - ry)) / (2 * ry)) + 0.20 * d;
    sprays.push([px, py, lit + R.range(-0.12, 0.12), d]);
  }
  sprays.sort(function (p, q) { return p[2] - q[2]; });
  for (var k = 0; k < sprays.length; k++) {
    var sp = sprays[k], l = clamp(sp[2], 0, 1);
    var col = dark.clone().lerp(base, Math.min(1, l * 1.4));
    var lt = base.clone().lerp(lite, clamp((l - 0.5) * 2, 0, 1));
    leafSpray(g, sp[0], sp[1], S * (opts.sprayR || 0.06), col, lt, opts.leaves || 12, S * (opts.leafW || 0.010), S * (opts.leafL || 0.018), R);
  }
}

/* One sprite of a kind, drawn into an S square at the context's origin. */
function drawPropSprite(g, S, kind, P, R, opts) {
  var rgb = function (col) {
    return 'rgb(' + Math.round(col.r * 255) + ',' + Math.round(col.g * 255) + ',' + Math.round(col.b * 255) + ')';
  };
  g.lineCap = 'round'; g.lineJoin = 'round';

  if (kind === 'cactus') {
    var gc = new THREE.Color(R.pick(['#4e7f4a', '#427043', '#59864e', '#3e6b3f']).replace(' ', ''));
    var outline = gc.clone().multiplyScalar(0.42);
    var limbs = [];
    if (R.f() < 0.26) {
      /* prickly pear: a cluster of pads */
      var pads = R.int(4, 8);
      for (var q = 0; q < pads; q++) {
        var t = q / pads;
        limbs.push({ pad: true,
          x: S / 2 + R.range(-0.26, 0.26) * S * (0.4 + t),
          y: S * (0.94 - t * R.range(0.28, 0.62)),
          w: S * R.range(0.085, 0.15), h: S * R.range(0.11, 0.20),
          rot: R.range(-0.6, 0.6) });
      }
    } else {
      /* saguaro: a ribbed column with arms that elbow out and turn up */
      var tw = S * R.range(0.125, 0.185);
      var topY = S * R.range(0.05, 0.19);
      limbs.push({ w: tw, pts: [[S / 2, S + tw * 0.2], [S / 2, topY + tw / 2]] });
      var arms = R.int(0, 3), used = [];
      for (var ai = 0; ai < arms; ai++) {
        var side = (ai === 0) ? (R.f() < 0.5 ? -1 : 1) : (used.indexOf(-1) < 0 ? -1 : (used.indexOf(1) < 0 ? 1 : (R.f() < 0.5 ? -1 : 1)));
        used.push(side);
        var ay = S * R.range(0.44, 0.72);
        var reach = S * R.range(0.14, 0.27);
        var rise = S * R.range(0.20, 0.44);
        var aw = tw * R.range(0.58, 0.8);
        limbs.push({ w: aw, curve: true, pts: [
          [S / 2 + side * tw * 0.15, ay],
          [S / 2 + side * reach * 0.95, ay + S * 0.015],
          [S / 2 + side * reach, ay - rise * 0.30],

          if (L.curve) g.bezierCurveTo(L.pts[1][0], L.pts[1][1], L.pts[2][0], L.pts[2][1], L.pts[3][0], L.pts[3][1]);

    lg.addColorStop(0.00, 'rgba(0,0,0,0.42)');
    lg.addColorStop(0.33, 'rgba(255,255,255,0.24)');
    lg.addColorStop(0.60, 'rgba(0,0,0,0.10)');
    lg.addColorStop(1.00, 'rgba(0,0,0,0.44)');

    g.strokeStyle = 'rgba(18,38,20,0.20)'; g.lineWidth = 1.7;
    for (var rb = 0; rb < 16; rb++) {
      var rx = (rb + 0.5) / 16 * S;
      g.beginPath(); g.moveTo(rx, 0); g.lineTo(rx, S); g.stroke();
    }
    g.fillStyle = 'rgba(242,234,198,0.45)';
    for (var sp2 = 0; sp2 < 150; sp2++) g.fillRect(R.f() * S, R.f() * S, 1.7, 1.7);
    g.globalCompositeOperation = 'source-over';

  } else if (kind === 'palm') {
    var lean = R.range(-0.20, 0.20);
    var crownX = S / 2 + lean * S * 0.8, crownY = S * 0.38;
    g.strokeStyle = '#6b5740'; g.lineWidth = S * 0.042;
    g.beginPath(); g.moveTo(S / 2, S);
    g.quadraticCurveTo(S / 2 + lean * S * 0.35, S * 0.68, crownX, crownY);
    g.stroke();
    g.strokeStyle = 'rgba(96,80,56,0.55)'; g.lineWidth = 2;
    for (var r0 = 0; r0 < 7; r0++) {
      var ft = r0 / 7, fx = S / 2 + (crownX - S / 2) * (1 - ft) * 0.9, fy = S - (S - crownY) * (1 - ft) * 0.92;
      g.beginPath(); g.moveTo(fx - 6, fy); g.lineTo(fx + 6, fy); g.stroke();
    }
    var base = new THREE.Color(P.grass.ct || P.grass.tip);
    var fronds = 9 + Math.floor(R.f() * 4);
    for (var i2 = 0; i2 < fronds; i2++) {
      var a = -Math.PI * 0.06 - (i2 / (fronds - 1)) * Math.PI * 0.88 + R.range(-0.08, 0.08);
      var len = S * R.range(0.24, 0.35);
      var midx = crownX + Math.cos(a) * len * 0.55;
      var midy = crownY + Math.sin(a) * len * 0.5 - len * 0.16;
      var tipx = crownX + Math.cos(a) * len;
      var tipy = crownY + Math.sin(a) * len * 0.88 + len * 0.30;
      var shade = base.clone().lerp(new THREE.Color('#1c3a1f'), R.range(0.05, 0.55));
      g.strokeStyle = rgb(shade);
      g.lineWidth = S * R.range(0.030, 0.05);

      g.quadraticCurveTo(midx, midy, tipx, tipy);
      g.stroke();

      g.lineWidth = 1.8;
      for (var lf = 1; lf < 6; lf++) {
        var u = lf / 6;
        var bx = crownX + (midx - crownX) * 2 * u * (1 - u) + (tipx - crownX) * u * u;
        var by = crownY + (midy - crownY) * 2 * u * (1 - u) + (tipy - crownY) * u * u;
        g.beginPath(); g.moveTo(bx, by);
        g.lineTo(bx + Math.cos(a + 1.5) * len * 0.10, by + Math.sin(a + 1.5) * len * 0.10);

  } else if (kind === 'pine') {

    g.beginPath(); g.moveTo(S / 2, S); g.lineTo(S / 2, S * 0.10); g.stroke();
    var pdark = new THREE.Color(R.pick(['#1b3324', '#203a2a', '#182f22'])).multiplyScalar(P.treeTint);

      for (var side = -1; side <= 1; side += 2) {

        var nn = 10 + Math.floor(span / S * 40);
        for (var q = 0; q < nn; q++) {
          var t = q / nn, bx = S / 2 + side * span * t, by = yb + t * t * span * 0.35;
          var pc = pdark.clone().lerp(plite, clamp(lit2 + R.range(-0.2, 0.15), 0, 1));
          g.strokeStyle = 'rgb(' + ((pc.r * 255) | 0) + ',' + ((pc.g * 255) | 0) + ',' + ((pc.b * 255) | 0) + ')';
          g.lineWidth = R.range(1.1, 2.2);
          var na = 1.2 + R.range(-0.5, 0.5), nl = S * R.range(0.03, 0.06) * (1 - t * 0.4);
          g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + side * Math.cos(na) * nl * 0.3, by + Math.sin(na) * nl); g.stroke();
          g.beginPath(); g.moveTo(bx, by); g.lineTo(bx + side * nl * 0.5, by - nl * 0.25); g.stroke();
        }
      }
    }
  } else if (kind === 'olive' || kind === 'blossom') {
    var isB = kind !== 'olive';
    g.strokeStyle = isB ? '#5a4736' : '#6b6152'; g.lineWidth = S * 0.05; g.lineCap = 'round';
    g.beginPath(); g.moveTo(S / 2, S);
    g.quadraticCurveTo(S / 2 + R.range(-14, 14), S * 0.8, S / 2 + R.range(-8, 8), S * 0.60); g.stroke();
    var nb2 = 4 + R.int(0, 2);
    var otips = [];
    for (var b2 = 0; b2 < nb2; b2++) {
      var ba2 = -Math.PI * (0.2 + (b2 / (nb2 - 1)) * 0.6) + R.range(-0.2, 0.2);
      drawBranches(g, S, S / 2, S * R.range(0.55, 0.64), S * R.range(0.14, 0.22), ba2, S * 0.02, 3, R, isB ? '#5a4736' : '#6b6152', otips);
    }
    var ocol = new THREE.Color(isB ? (P.blossomCol || '#f2d3de') : '#6f7d5c');
    var olite = new THREE.Color(isB ? '#ffffff' : '#b9c2a0');
    drawCrown(g, S, kind, P, R, S / 2, S * 0.40, S * 0.34, S * 0.27, ocol, olite,
      isB ? { sprays: 90, sprayR: 0.05, leaves: 14, leafW: 0.007, leafL: 0.009, tips: otips }
          : { sprays: 60, sprayR: 0.06, leaves: 14, leafW: 0.005, leafL: 0.016, tips: otips });
  } else if (kind === 'vine' || kind === 'hedge' || kind === 'shrub') {
    var vc = new THREE.Color(kind === 'hedge' ? '#2f4a2c' : (kind === 'shrub' ? '#54603c' : '#4a6234'));
    var vl = vc.clone().lerp(new THREE.Color('#a8bd7e'), 0.45);
    var wide = kind === 'hedge' ? 0.46 : 0.30;
    var tall = kind === 'hedge' ? 0.55 : 0.42;
    if (kind === 'vine') {
      g.strokeStyle = '#6a5540'; g.lineWidth = S * 0.03;
      g.beginPath(); g.moveTo(S / 2, S); g.lineTo(S / 2, S * 0.62); g.stroke();

    for (var vb = 0; vb < 90; vb++) {

      var vy = S * (1 - R.f() * tall) - S * 0.02;

       the card (a creosote stands one to three metres), with small dark
       olive leaves in loose clusters along their upper part: you see through
       it to the ground behind. */
    var cc = new THREE.Color(R.pick(['#4f5a30', '#58643a', '#4a552e']));
    var cl = cc.clone().lerp(new THREE.Color('#a3ab68'), 0.45);
    g.lineCap = 'round';

    for (var st = 0; st < nst; st++) {

      g.strokeStyle = '#6e6250'; g.lineWidth = R.range(1.0, 2.2);
      g.beginPath(); g.moveTo(x0, S); g.quadraticCurveTo(mx2, my2, ex2, ey2); g.stroke();
      for (var lc = 0; lc < 4; lc++) {

        var ly2 = (1 - tq) * (1 - tq) * S + 2 * (1 - tq) * tq * my2 + tq * tq * ey2;

       stalks; dry brown stalks the rest of the year */
    var bc = new THREE.Color('#8e9a80'), bl2 = new THREE.Color('#d5d9c0');
    var drx = S * R.range(0.40, 0.46), dry = S * R.range(0.62, 0.78);
    for (var bs = 0; bs < 110; bs++) {
      var ba2 = -Math.PI * R.f(), bd = Math.sqrt(R.f());
      var bx3 = S / 2 + Math.cos(ba2) * bd * drx, by3 = S - Math.sin(ba2) * bd * dry * 0.95;
      leafSpray(g, bx3, by3, S * 0.05, bc.clone().multiplyScalar(0.62 + 0.38 * (S - by3) / dry), bl2, 9, S * 0.009, S * 0.016, R);
    }
    var bloom = P.seasonKey === 'spring' ? 1 : (P.seasonKey === 'summer' ? 0.35 : 0);
    for (var fl = 0; fl < 22; fl++) {

  '  b = mix(1.0, b, e.x * e.y); return b * b * 8.0; }',
  /* Clear air thins light by Beer-Lambert, a straight exponential: a far hill
     is paler, not gone. Mist and falling rain or snow close in as a wall, which
     the old squared exponent drew well, so each weather blends the two
     (uFogShape 0 = clear air, 1 = mist). The land's own edge always fades out. */
  'uniform float uFogShape, uFogH;',
  'float fogT(float t){ return mix(1.0 - exp(-0.6 * t), 1.0 - exp(-t * t), uFogShape); }',
  'float fogAmt(float d, float density){ return max(fogT(density * d), smoothstep(1900.0, 2400.0, d)); }',
  /* Haze is densest low down and thins with height (scale height uFogH). The
     optical depth along a ray between two heights has a closed form: the
     density at the lower end times the mean of the exponential over the climb. */
  'float fogAmtH(float d, float density, float y){',
  '  float ya = max(cameraPosition.y, 0.0), k = (max(y, 0.0) - ya) / uFogH;',
  '  float g = exp(-ya / uFogH) * (abs(k) < 1e-3 ? 1.0 : (1.0 - exp(-k)) / k);',
  '  return max(fogT(density * d * g), smoothstep(1900.0, 2400.0, d)); }',
  /* The horizon is the colour of the sky toward the sun (uFogCol) and cooler,
     pinker, away from it when the sun is low. Land and sky both read it here,
     so the far ground still meets the sky without a seam all the way round. */
  'uniform vec3 uFogAway, uInScat, uGroundCol;',
  'uniform float uWet;',             /* 0 dry, 1 just rained */
  'vec3 horizonAt(vec3 dir, vec3 fogCol, vec3 sunDir){',
  '  float w = dot(normalize(dir.xz + vec2(1e-5)), normalize(sunDir.xz + vec2(1e-5))) * 0.5 + 0.5;',
  '  return mix(uFogAway, fogCol, smoothstep(0.0, 1.0, w)); }',
  'uniform float uHazeK;',
  'vec3 hazeToward(vec3 fogCol, vec3 viewDir, vec3 sunDir, vec3 sunCol){ float f = pow(max(dot(viewDir, normalize(sunDir)), 0.0), 3.0) * uHazeK; return horizonAt(viewDir, fogCol, sunDir) + sunCol * f * 0.12; }',
  /* The first few hundred metres of air add the sky's own blue before the
     haze turns to the horizon's colour: dark things go blue with distance. The
     result is the colour to mix toward with the same amount f. */
  'vec3 hazeAt(vec3 fogCol, vec3 viewDir, vec3 sunDir, vec3 sunCol, float f){',
  '  return mix(uInScat, hazeToward(fogCol, viewDir, sunDir, sunCol), 0.35 + 0.65 * f); }',
  /* Ambient from a sky above and the lit ground below, by which way a surface
     faces: an underside sees the ground's bounce, a top sees the sky. */
  'vec3 hemi(vec3 n, vec3 amb){ return mix(uGroundCol, amb, n.y * 0.5 + 0.5); }',
  /* A gust front across a field: a wave running downwind, its crest bent and
     its strength varied across the wind, so it arrives as patches (cat's
     paws) rather than ruled lines. k is the wavenumber along the wind, w its
     rate, ph a phase. Grass, flowers, sprays and the far field all use it. */
  'float gustWave(vec2 p, vec2 dir, float t, float k, float w, float ph){',
  '  float a = dot(p, vec2(-dir.y, dir.x)), u = dot(p, dir);',
  '  float bendA = 1.7 * sin(a * 0.043 + 0.6) + 0.9 * sin(a * 0.11 - t * 0.07);',
  '  return sin(u * k - t * w + ph + bendA) * (0.65 + 0.35 * sin(a * 0.071 + u * 0.019 - t * 0.21));',
  '}',
  /* Cloud shadows are the sky's own clouds: from a point on the ground, follow
     the sun up to the deck (about 1000 m) and read the cloud texture there
     with the sky's mapping, so a shadow lies under a cloud you can see. The
     sky maps direction d to d.xz / d.y; a deck point is the same thing in
     units of the deck height. uCloudShift = sun.xz / sun.y. Two fetches, no
     branch; t is kept for the callers, the drift is in the offsets. */
  'uniform sampler2D uSkyCloud; uniform float uSkyScale, uSkyCover, uSkySoft, uSkyOp;',
  'uniform vec2 uSkyOff, uSkyOff2, uCloudShift;',
  'float cloudShade(vec2 p, float t){',
  '  vec2 uv = ((p - cameraPosition.xz) / 1000.0 + uCloudShift) * uSkyScale;',
  '  float n = texture2D(uSkyCloud, uv * 0.55 + uSkyOff).r * 0.58 + texture2D(uSkyCloud, uv * 1.37 + uSkyOff2).r * 0.42;',
  '  return 1.0 - smoothstep(uSkyCover, uSkyCover + uSkySoft, n) * uSkyOp;',
  '}',
  /* The sky as water or a wet surface sees it along r: the dome's own
     gradient and cloud deck, by the dome's own mapping, two fetches and no
     sun (the caller adds its glint). zen, cl, cd: the sky's zenith and cloud
     colours, which the callers already carry. Sky only: no geometry is
     mirrored, which was tried once and went badly. */
  'vec3 skyMirror(vec3 r, vec3 fogCol, vec3 sunDir, vec3 zen, vec3 cl, vec3 cd){',
  '  float h = max(r.y, 0.0);',
  '  vec3 hor = horizonAt(r, fogCol, sunDir);',
  '  vec3 s = mix(hor, zen, pow(h, 0.45));',
  '  s = mix(s, hor * 1.04, smoothstep(0.22, 0.0, h) * 0.40);',
  '  vec2 uv = r.xz / max(h, 0.055) * uSkyScale;',
  '  float n = texture2D(uSkyCloud, uv * 0.55 + uSkyOff).r * 0.58 + texture2D(uSkyCloud, uv * 1.37 + uSkyOff2).r * 0.42;',
  '  float far = 1.0 - smoothstep(0.03, 0.22, h);',
  '  float covM = smoothstep(uSkyCover - 0.35, uSkyCover + uSkySoft + 0.25, 0.5);',
  '  float cov = mix(smoothstep(uSkyCover, uSkyCover + uSkySoft, n), covM, far) * uSkyOp;',
  '  vec3 cc = mix(cl, cd * 0.92, smoothstep(uSkyCover - 0.06, uSkyCover + 0.34, n) * 0.95);',
  '  cc = mix(cc, mix(mix(cl, cd, 0.45), hor, 0.55), far);',
  '  return mix(s, cc, clamp(cov, 0.0, 1.0)); }'
].join('\n');

/* ---------- preferences ----------
   localStorage first, a cookie second, memory last. A sandboxed frame has an
   opaque origin and will throw on both, so nothing here may be assumed. */
var Prefs = {
  key: 'window-prefs-v1', mem: null,
  read: function () {
    if (this.mem) return this.mem;
    var out = null;
    try { var raw = window.localStorage.getItem(this.key); if (raw) out = JSON.parse(raw); } catch (e) {}
    if (!out) {
      try {
        var m = document.cookie.match(/(?:^|;\s*)windowprefs=([^;]*)/);
        if (m) out = JSON.parse(decodeURIComponent(m[1]));
      } catch (e2) {}
    }
    this.mem = out || {};
    return this.mem;
  },
  write: function () {
    var json = JSON.stringify(this.mem || {});
    try { window.localStorage.setItem(this.key, json); return 'local'; } catch (e) {}
    try {
      document.cookie = 'windowprefs=' + encodeURIComponent(json) + ';path=/;max-age=31536000;SameSite=Lax';
      if (document.cookie.indexOf('windowprefs=') >= 0) return 'cookie';
    } catch (e2) {}
    return 'memory';
  },
  set: function (k, v) { this.read(); this.mem[k] = v; return this.write(); },
  get: function (k, dflt) { var o = this.read(); return o[k] === undefined ? dflt : o[k]; }
};

/* ============================================================
   7. the world
   ============================================================ */
var App = {};

/* The page may be running somewhere the URL can't be touched (a sandboxed
   iframe, a file:// document). Seeds still work; they just live in memory. */
function readSeedFromUrl() {
  try {
    var q = new URLSearchParams(location.search);
    var code = q.get('code');
    if (code) { var d = decodeScene(code); if (d) { App.pendingT = d.t; App.qAuto = d.qAuto; App.qTier = d.qTier; App.clearPanes = d.panes; return d.seed; } }
    var sd = q.get('seed');
    return sd && parseSeed(sd).valid ? sd : null;
  } catch (e) { return null; }
}
function writeSeedToUrl(seed) {
  try {
    var code = App.P ? encodeScene() : null;
    history.replaceState({}, '', code ? '?code=' + code : '?seed=' + encodeURIComponent(seed));
    App.urlOk = true;
  } catch (e) {
    App.urlOk = false;
  }
}

function disposeDeep(obj, seen) {
  seen = seen || App._disposed || (App._disposed = []);
  var once = function (t) {
    if (!t || seen.indexOf(t) >= 0) return;
    seen.push(t);
    if (t.userData && t.userData.cacheKey) return;   /* shared across worlds */
    t.dispose();
  };
  obj.traverse(function (n) {
    if (n.geometry) n.geometry.dispose();
    var mats = n.material ? (Array.isArray(n.material) ? n.material : [n.material]) : [];
    for (var i = 0; i < mats.length; i++) {
      var m = mats[i], k;
      for (k in m) { if (m[k] && m[k].isTexture) once(m[k]); }
      if (m.uniforms) {
        for (k in m.uniforms) {
          var v = m.uniforms[k] && m.uniforms[k].value;
          if (v && v.isTexture) once(v);
        }
      }
      m.dispose();
    }
  });
}

function clearWorld() {
  var scene = App.scene;
  if (!scene) return;
  App._disposed = [];
  while (scene.children.length) {
    var c = scene.children[0];
    scene.remove(c);
    disposeDeep(c);
  }
  App.sky = App.terrain = App.grass = App.birdMesh = App.water = null;
  App.rain = App.snow = App.room = App.glass = App.glassMat = null;
  App.dust = App.falls = App.leaves = App.visitor = App.shadows = null;
  App.visitorInfo = null;
  App.flowerMeshes = App.propMeshes = null;
}

/* GLSL_COMMON declares the air and light every lit shader shares. Rather than
   list them in each material, they are handed to every shader material once
   the world is built, before anything compiles: three only binds a uniform the
   material carries, and an unbound one reads as zero. */
function shareCommon(scene) {
  var U = App.U, S = App.skyU;
  var common = {
    uFogShape: U.uFogShape, uFogH: U.uFogH, uFogAway: U.uFogAway, uInScat: U.uInScat,
    uGroundCol: U.uGroundCol, uHazeK: U.uHazeK, uWet: U.uWet,
    uSkyCloud: S.uCloudTex, uSkyScale: S.uScale, uSkyCover: S.uCover, uSkySoft: S.uSoft,
    uSkyOp: S.uCloudOp, uSkyOff: S.uOff1, uSkyOff2: S.uOff2, uCloudShift: U.uCloudShift,
    uNearMap: U.uNearMap, uNearR: U.uNearR
  };
  scene.traverse(function (o) {
    var m = o.material;
    if (!m || !m.isShaderMaterial || !m.uniforms) return;
    for (var k in common) if (!(k in m.uniforms)) m.uniforms[k] = common[k];
  });
}

function buildWorld(seed) {
  clearWorld();
  var P = buildParams(seed);
  App.P = P;
  App.locks = P.locks;                     /* keep the dropdowns in step */
  applyView();

  var scene = App.scene;
  App._shadows = [];
  App._casters = [];
  App._nearH = null;
  App._boxes = [];
  App._ao = null;
  App._bake = null;
  App._features = [];
  App._cardMat = null;
  sizeWindow(P, window.innerWidth / window.innerHeight);
  var R = RNG(P.base + '/build' + (P.nonce ? '/' + P.nonce : ''));
  var H = makeHeightField(P);
  App.H = H;
  if (P.waterY != null) {
    P.shoreZ = -30;
    for (var sz = -4; sz > -260; sz -= 2) {
      if (H(0, sz) < P.waterY) { P.shoreZ = sz; break; }
    }
  }
  /* how high does this land actually reach in view? snow and rock follow from that */
  var maxH = 0;
  for (var mz = -20; mz > -700; mz -= 22) {
    for (var mx = -420; mx <= 420; mx += 28) {
      var hh = H(mx, mz);
      if (hh > maxH) maxH = hh;
    }
  }
  P.rockLine = P.rockFrac != null ? maxH * P.rockFrac : 1e6;
  P.snowLine = P.snowFrac != null ? maxH * P.snowFrac : 1e6;

  var U = {
    uTime:      { value: 0 },
    uWind:      { value: P.windBase },
    uGust:      { value: 0.5 },
    uWindDir:   { value: new THREE.Vector2(Math.cos(P.windAngle), Math.sin(P.windAngle)) },
    uSunDir:    { value: new THREE.Vector3(0, 0.6, -0.8) },
    uSunCol:    { value: new THREE.Color(0xffffff) },
    uAmbCol:    { value: new THREE.Color(0x808080) },
    uFogCol:    { value: new THREE.Color(0xc8d8e4) },
    uFogDensity:{ value: P.weather.fogD * P.hazeMul },
    uShadow:    { value: P.weather.shadow },
    /* a winter snowfall has been going a while: start well covered */
    uSnow:      { value: (P.weather.snow > 0 && P.seasonKey === 'winter')
                  ? Math.max(P.baseSnow || 0, snowTarget(P.weather)) : (P.baseSnow || 0) },
    uSnowCol:   { value: new THREE.Color(0xeef2f7) },
    uCamPos:    { value: new THREE.Vector3() },
    uHazeK:     { value: 1.0 },
    uFogShape:  { value: P.weather.fogShape || 0 },
    uFogH:      { value: P.weather.fogH || 160 },
    uFogAway:   { value: new THREE.Color(0xc8d8e4) },
    uInScat:    { value: new THREE.Color(0xa8c0dc) },
    uGroundCol: { value: new THREE.Color(0x303428) },
    uCloudShift: { value: new THREE.Vector2() },
    uWet:       { value: 0 },
    uMirage:    { value: 0 },
    uShadowMap: { value: (function () {
      var t = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1, THREE.RGBAFormat);
      t.needsUpdate = true; return t;
    })() },
    uNearMap: { value: (function () {
      var t = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1, THREE.RGBAFormat);
      t.needsUpdate = true; return t;
    })() },
    uNearR: { value: new THREE.Vector4(NEAR.x0, NEAR.z0, 1 / (NEAR.x1 - NEAR.x0), 1 / (NEAR.z1 - NEAR.z0)) },
    uShadowOrigin: { value: new THREE.Vector2(SHADOW.x0, SHADOW.z0) },
    uShadowScale: { value: new THREE.Vector2(1 / (SHADOW.x1 - SHADOW.x0), 1 / (SHADOW.z1 - SHADOW.z0)) }
  };
  App.U = U;
  /* what the ground reflects back up, roughly: the bare earth and the plants'
     colour weighted by how much they cover it */
  /* bare sand is the colour of the sand, not of the soil under a sward: a
     dune or a salt pan throws a bright warm light back up under things */
  var sandy = { coast: 1, desert: 1, oasis: 1, saltflat: 1, canyon: 1 }[P.biomeKey];
  App.albedo = new THREE.Color(sandy ? P.grass.base : P.grass.soil).lerp(new THREE.Color(sandy ? P.grass.tip : P.grass.soil), 0.4).lerp(new THREE.Color(P.grass.cb || P.grass.base)
    .lerp(new THREE.Color(P.grass.ct || P.grass.tip), 0.5), clamp((P.coverCount || 0) / 26000, 0, 1) * 0.8);

  buildSky(scene, P, R, U);
  buildTerrain(scene, P, R, U, H);
  H = App.Hm;                              /* the drawn surface, for everything that follows */
  App.H = H;
  buildWater(scene, P, R, U);
  buildGrass(scene, P, R, U, H);
  buildFlowers(scene, P, R, U, H);
  buildProps(scene, P, R, U, H);
  buildClutter(scene, P, R, U, H);
  buildCritters(scene, P, R, U, H);
  buildLandmark(scene, P, R, U, H);
  if (P.hasCamp && P.oasisX != null) {
    /* a few tents pitched at the water's edge, with a fire going */
    var tb = { pos: [], nor: [], idx: [], rib: [] };
    pushCone(tb, 0, 0, 0, 0.62, 1.0, 4);
    var ttpl = finishGeo(tb);
    var tmat = solidMat(U, R.pick(['#c8b48c', '#b8a179', '#8d7d5e']), { rib: 0, grain: 0, spines: 0 });
    var tents = [], tg = 0;
    while (tents.length < R.int(2, 5) && tg < 200) {
      tg++;
      var ta = R.range(0, 6.283), tr = P.oasisW * R.range(0.75, 1.15);
      var tx = P.oasisX + Math.cos(ta) * tr, tz = P.oasisZ + Math.sin(ta) * tr;
      if (H(tx, tz) < P.waterY + 0.4) continue;
      var ts = R.range(2.4, 3.6);
      tents.push([tx, H(tx, tz), tz, ts, R.range(0, 6.283), 1, 1]);
      App._shadows.push([tx, H(tx, tz), tz, ts * 0.5, 0.8, ts]);
    }
    if (tents.length) {
      instanceSolid(scene, ttpl, tents, tmat);
      buildSmoke(scene, P, R, U, tents[0][0] + 4, tents[0][1] + 0.5, tents[0][2] + 3, 4.5);
    }
  }
  if ((P.terrainKind || P.biome.terrain) === 'cascade') buildCascadeFall(scene, P, R, U, H);
  buildBoundaries(scene, P, R, U, H);
  buildTerraceWall(scene, P, U, H);
  buildHerd(scene, P, R, U, H);
  buildWaterLife(scene, P, R, U, H);
  buildRidges(scene, P, R, U);
  buildFlyers(scene, P, R, U, H);
  buildMotes(scene, P, R, U, H);
  buildDust(scene, P, R, U, H);
  buildFalls(scene, P, R, U, H);
  buildBirds(scene, P, R, U);
  buildVisitors(scene, P, R, U, H);
  buildPrecip(scene, P, R, U);
  buildRoom(scene, P, U);

  var sun = new THREE.DirectionalLight(0xffffff, 0.85);
  scene.add(sun); scene.add(sun.target);
  App.sun = sun;
  var fill = new THREE.DirectionalLight(0xffffff, 0.55);
  fill.position.set(0.4, 0.55, 1);
  scene.add(fill);
  App.fill = fill;
  var amb = new THREE.AmbientLight(0xffffff, 0.34);
  scene.add(amb);
  App.amb = amb;
  /* the sky seen through the opening: it lights the sill top and the two
     reveals from outside, one light leaning to each side */
  App.skyLights = [-0.55, 0.55].map(function (sx) {
    var l = new THREE.DirectionalLight(0xffffff, 0.3);
    l.position.set(sx, 0.6, -1);
    scene.add(l);
    return l;
  });
  shareCommon(scene);

  /* This world's clock before the bake: baked under the last world's sun,
     the map was thrown away and baked again on the first frame. The builder
     stream draws these in the same order as before. */
  App.t = App.pendingT != null ? App.pendingT : R.range(0, 500);
  App.pendingT = null;
  App._wxT = null;
  App.elapsed = 0;
  App.nextFlash = null; App.flash = 0; App.flashAgain = null;
  App.wetness = P.weather.rain > 0 ? 1 : (R.f() < 0.18 ? R.range(0.4, 1) : 0);
  App.bowTarget = 0; App.skyU.uBow.value = 0;
  updateWeather(App.t);
  applyShadowMap(bakeShadows(P, H, U.uSunDir.value));
  FX.init(P, R);
  Sound.reset(P);

  writeSeedToUrl(P.seed);                  /* now that the clock is set, the code is complete */
  layout();
  updateHUD(P);
  updateWeather(App.t);
}

function start() {
  var canvas = document.getElementById('gl');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas, antialias: true, alpha: false,
      powerPreference: 'high-performance', stencil: false, depth: true
    });
  } catch (e) { renderer = null; }
  if (!renderer) {
    document.getElementById('fallback').style.display = 'grid';
    document.getElementById('curtain').style.display = 'none';
    return;
  }
  App.renderer = renderer;
  try { App.maxAniso = Math.min(16, renderer.capabilities.getMaxAnisotropy() || 4); } catch (e) { App.maxAniso = 4; }
  renderer.setClearColor(0x0a0a0b, 1);

  App.scene = new THREE.Scene();
  App.camera = new THREE.PerspectiveCamera(52, 1, 0.3, 7000);
  App.clock = new THREE.Clock();
  App.quality = 0;
  App.frameAvg = 16;
  App.lastChange = 0;
  App.urlOk = false;
  App.elapsed = 0;
  App.clearPanes = !!Prefs.get('panes', false);
  App.autoMin = Prefs.get('autoMin', 0);
  App.pinned = !!Prefs.get('pinned', false);
  App.showTools = Prefs.get('tools', true);
  App.wantSound = !!Prefs.get('sound', false);
  App.noNight = false;
  App.liveClock = false;
  App.sashOpen = false;
  App.bare = false;
  App.sashAngle = 0;
  App.locks = { biome: null, weather: null, time: null, window: null, finish: null,
                season: null, view: null, night: null };
  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  App.reduceMotion = !!(rm && rm.matches);
  App.mouseMotion = App.reduceMotion ? false : !!Prefs.get('motion', true);
  if (rm && rm.addEventListener) rm.addEventListener('change', function (e) {
    App.reduceMotion = e.matches;
    if (e.matches) { App.mouseMotion = false; App.pointer.tx = 0; App.pointer.ty = 0; }
    updateHUD(App.P);
  });
  App.qTier = clamp(Prefs.get('qTier', 1), 0, QUALITY.length - 1);
  App.qAuto = Prefs.get('qAuto', true);
  App.qChanges = 0;
  App.qSettle = 0;
  App.pointer = { x: 0, y: 0, tx: 0, ty: 0 };

  window.addEventListener('resize', layout);
  window.addEventListener('pointermove', function (e) {
    if (App.mouseMotion) {
      App.pointer.tx = (e.clientX / window.innerWidth - 0.5) * 2;
      App.pointer.ty = (e.clientY / window.innerHeight - 0.5) * 2;
    }
    wake();
  }, { passive: true });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) App.clock.getDelta();
  });
  bindUI();
  document.getElementById('hud').classList.toggle('notools', !App.showTools);
  document.getElementById('bTools').setAttribute('aria-expanded', App.showTools ? 'true' : 'false');

  /* a stored "sound on" cannot start itself: browsers want a gesture first */
  if (App.wantSound) {
    var arm = function () {
      window.removeEventListener('pointerdown', arm);
      window.removeEventListener('keydown', arm);
      if (!Sound.on) { Sound.toggle(); updateHUD(App.P); }
    };
    window.addEventListener('pointerdown', arm);
    window.addEventListener('keydown', arm);
  }

  buildWorld(readSeedFromUrl() || randomSeed());

  /* first frame, then lift the curtain */
  renderFrame();
  requestAnimationFrame(function () {
    document.getElementById('curtain').classList.add('gone');
  });
  loop();
}

/* ---------- terrain height ---------- */
function ridged(x, y, s, oct) {
  var v = 0, amp = 0.5, f = 1, norm = 0;
  for (var i = 0; i < oct; i++) {
    var n = 1 - Math.abs(vnoise(x * f, y * f, s + i * 131) * 2 - 1);
    v += n * n * amp; norm += amp; amp *= 0.5; f *= 2.03;
  }
  return v / norm;
}

/* The dune field (P.dune, see buildParams): the height of the dunes at x,z.
   u runs downwind, v across it. The phase counts wavelengths downwind, its
   crest lines bent by sums of sines across the wind and its spacing by one
   along it. Each wavelength rises over 1 - sf of its length (a smoothstep:
   gentle off the trough, level at the brink) and falls straight down the slip

      h += 0.35 * (1 - smoothstep(0, 26, d));            /* a low dry bank under the window */
      h += Math.pow(ridged(x * 0.0035, z * 0.0035, s + 9, 3), 1.3) * far * 1.6 * smoothstep(230, 700, d);
      return h;
    };
  }
  if (kind === 'alpine') {
    var pk = P.peakH;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var near = smoothstep(5, 44, d);
      var h = fbm2(x * f, z * f, s, 4) * amp * near;
      var r1 = Math.pow(ridged(x * f * 0.085, z * f * 0.085, s + 11, 5), 1.55);
      h += r1 * pk * smoothstep(60, 470, d);
      var r2 = Math.pow(ridged(x * f * 0.026 + 5.3, z * f * 0.026, s + 213, 4), 1.4);
      h += r2 * pk * 1.35 * smoothstep(300, 1000, d);
      /* the valley sides, close in either hand and running away up the view */
      var vs = Math.abs(x - P.valleyX + fbm2(z * 0.004, 7.7, s + 5, 2) * P.valleyW * 0.6);
      var wallUp = smoothstep(P.valleyW, P.valleyW * 3.2, vs) * (0.55 + 0.45 * ridged(x * 0.006, z * 0.006, s + 61, 3));
      h += wallUp * pk * P.valleyLift * smoothstep(12, 90, d);
      return h;
    };
  }
  if (kind === 'fjord') {
    var ch = P.channelW, wh = P.wallH;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var ax = Math.abs(x);
      var ramp = smoothstep(22, 95, d);
      var wall = smoothstep(ch * 0.45, ch * 1.3, ax);
      var rough = 0.55 + 0.45 * ridged(x * 0.0045 + 1.7, z * 0.0045, s, 4);
      var h = wall * wh * rough * ramp;
      h -= 5.5 * smoothstep(16, 70, d) * (1 - wall);        /* the channel floor */
      h += fbm2(x * 0.016, z * 0.016, s + 31, 3) * 3.2 * ramp;
      h += Math.pow(ridged(x * 0.004, z * 0.004, s + 91, 4), 1.3) * wh * 0.75 * smoothstep(330, 780, d);
      return h;
    };
  }
  /* rolling meadow */
  return function (x, z) {
    var d = Math.sqrt(x * x + z * z);
    var near = smoothstep(5, 46, d);
    var h = fbm2(x * f, z * f, s, 4) * amp * near;
    h += fbm2(x * f * 0.18 + 31.7, z * f * 0.18 - 12.3, s + 51, 3) * far * smoothstep(55, 420, d);
    h += fbm2(x * f * 0.055 - 7.1, z * f * 0.055 + 4.4, s + 707, 2) * far * 1.5 * smoothstep(260, 900, d);
    return h;
  };
}

/* Fair-weather cumulus are heaped, not smoke: the finer octaves are folded
   (1 - |2n - 1|) so they crease into cauliflower lobes, and the lookup is
   pushed about by a slow warp so the edges curl. The result is matched to the
   plain field's mean and spread, so the sky's cover thresholds mean the same. */
function billowClouds(f, S, seed) {
  var wx = tileFBM(S, seed + 17, 2, 2), wy = tileFBM(S, seed + 31, 2, 2);
  var out = new Float32Array(S * S), x, y, o, i;
  for (y = 0; y < S; y++) for (x = 0; x < S; x++) {
    i = y * S + x;
    var px = x + (wx[i] - 0.5) * S * 0.07, py = y + (wy[i] - 0.5) * S * 0.07;
    var acc = 0, amp = 1, norm = 0;
    for (o = 0; o < 5; o++) {
      var p = 3 * Math.pow(2, o), n = tnoise(px * p / S, py * p / S, p, seed + o * 977);
      acc += (o < 2 ? n : 1 - Math.abs(2 * n - 1)) * amp;
      norm += amp; amp *= 0.52;
    }
    out[i] = acc / norm;
  }
  var m0 = 0, m1 = 0, s0 = 0, s1 = 0, N = S * S;
  for (i = 0; i < N; i++) { m0 += f[i]; m1 += out[i]; }
  m0 /= N; m1 /= N;
  for (i = 0; i < N; i++) { s0 += (f[i] - m0) * (f[i] - m0); s1 += (out[i] - m1) * (out[i] - m1); }
  var k = Math.sqrt(s0 / Math.max(s1, 1e-9));
  for (i = 0; i < N; i++) out[i] = m0 + (out[i] - m1) * k;
  return out;
}

/* ---------- sky ---------- */
function buildSky(scene, P, R, U) {
  var geo = new THREE.SphereGeometry(3000, 32, 20);
  var uni = {
    uZenith: { value: new THREE.Color(0x3f7ec9) },
    uHorizon: { value: new THREE.Color(0xc3daea) },
    uHorizonAway: { value: new THREE.Color(0xc3daea) },
    uSunCol: { value: new THREE.Color(0xfff2d8) },
    uSunDir: U.uSunDir,
    uSunVis: { value: 1 },
    uBow: { value: 0 },
    uNight: { value: 0 },
    uMoonDir: { value: new THREE.Vector3(0, 0.6, -0.8) },
    uMoonPhase: { value: R.range(0.15, 1.0) },
    uTime: U.uTime,
    uCover: { value: P.weather.cover },
    uSoft: { value: P.weather.soft },
    uCloudOp: { value: P.weather.op },
    uCloudL: { value: new THREE.Color(0xffffff) },
    uCloudD: { value: new THREE.Color(0xa7b1bf) },
    uScale: { value: R.range(0.030, 0.062) },
    uOff1: { value: new THREE.Vector2() },
    uOff2: { value: new THREE.Vector2() },
    uCloudTex: { value: (function () {
      var cseed = R.int(1, 99999);
      var puffy = P.weatherKey === 'clear' || P.weatherKey === 'fair' || P.weatherKey === 'breezy';
      return cached('cloud|' + cseed + '|' + Q().tex + (puffy ? '|puffy' : ''), function () { return makeCloudTexture(cseed, Q().tex, puffy); });
    })() }
  };
  App.skyU = uni;
  var mat = new THREE.ShaderMaterial({
    uniforms: uni,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: true,      /* drawn last among opaques: early-z skips covered pixels */
    fog: false,
    vertexShader: [
      'varying vec3 vDir;',
      'void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform vec3 uZenith, uHorizon, uHorizonAway, uSunCol, uSunDir, uCloudL, uCloudD, uMoonDir;',
      'uniform float uTime, uCover, uSoft, uCloudOp, uScale, uSunVis, uNight, uMoonPhase, uBow;',
      'float starHash(vec3 c){ return fract(sin(dot(c, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }',
      'uniform vec2 uOff1, uOff2;',
      'uniform sampler2D uCloudTex;',
      'varying vec3 vDir;',
      'void main(){',
      '  vec3 d = normalize(vDir);',
      '  float h = max(d.y, 0.0);',
      /* the same horizon the land fades to (horizonAt in GLSL_COMMON) */
      '  float wAz = dot(normalize(d.xz + vec2(1e-5)), normalize(uSunDir.xz + vec2(1e-5))) * 0.5 + 0.5;',
      '  vec3 hor = mix(uHorizonAway, uHorizon, smoothstep(0.0, 1.0, wAz));',
      '  vec3 sky = mix(hor, uZenith, pow(h, 0.45));',
      '  sky = mix(sky, hor * 0.86, smoothstep(0.0, -0.14, d.y));',
      '  float sd = max(dot(d, normalize(uSunDir)), 0.0);',
      '  float ang = acos(clamp(sd, -1.0, 1.0));',
      '  float disk = 1.0 - smoothstep(0.0085, 0.017, ang);',
      /* Mie: a broad warm glow spreads from the sun, strongest low in the sky */
      '  sky += uSunCol * (pow(sd, 220.0) * 0.55 + pow(sd, 12.0) * 0.16 + pow(sd, 3.0) * 0.10 * (1.2 - h) + disk * 1.5) * uSunVis;',
      '  sky = mix(sky, hor * 1.04, smoothstep(0.22, 0.0, d.y) * 0.40);',
      '  if (uNight > 0.01) {',
      /* Stars live in a coarse lattice so they hold still as the view drifts.
         The hash that decides whether a cell holds a star at all lands in a
         sliver just below 1.0 for every star that exists, so taking the
         twinkle from that same number gave the whole sky one rate to within
         a third of a per cent and one phase to within ten degrees: every
         star flashed at once. Rate, phase, brightness and size each get
         their own draw now, and a star is a round point of its own size
         rather than a whole lattice cell. */
      '    vec3 sp = d * 260.0;',
      '    vec3 sc = floor(sp);',
      '    float hStar = starHash(sc);',
      '    float hSize = starHash(sc + 31.7);',
      '    float hRate = starHash(sc + 57.3);',
      '    float hPhase = starHash(sc + 91.1);',
      /* a few bright ones and many faint, rather than all alike */
      '    float mag = smoothstep(0.9958, 1.0, hStar) * (0.30 + 0.70 * hSize * hSize);',
      '    vec3 jit = 0.28 + 0.44 * vec3(starHash(sc + 3.1), starHash(sc + 11.7), starHash(sc + 23.9));',
      '    float rad = 0.26 + 0.40 * hSize;',
      '    float shape = 1.0 - smoothstep(rad * 0.30, rad, length(sp - sc - jit));',
      '    float twinkle = 0.58 + 0.42 * sin(uTime * (0.5 + 3.6 * hRate) + hPhase * 62.83);',
      '    vec3 tint = mix(vec3(0.75, 0.83, 1.0), vec3(1.0, 0.92, 0.78), starHash(sc + 7.0));',
      '    sky += tint * mag * shape * twinkle * uNight * smoothstep(-0.02, 0.16, d.y) * 2.6;',
      /* the moon, with a terminator so it shows a phase */
      '    float md = dot(d, normalize(uMoonDir));',
      '    float mAng = acos(clamp(md, -1.0, 1.0));',
      '    float disc = 1.0 - smoothstep(0.020, 0.030, mAng);',
      '    vec3 up = normalize(cross(normalize(uMoonDir), vec3(0.0, 1.0, 0.0)));',
      '    float across = dot(normalize(d - normalize(uMoonDir) * md), up);',
      '    float lit = step(across, uMoonPhase * 2.0 - 1.0 + 0.55);',
      '    sky += vec3(0.95, 0.94, 0.88) * disc * mix(0.10, 1.35, lit) * uNight;',
      '    sky += vec3(0.55, 0.60, 0.72) * pow(max(md, 0.0), 90.0) * 0.35 * uNight;',
      '  }',
      '  float band = smoothstep(0.005, 0.20, d.y);',
      /* Toward the horizon the deck is too far to resolve: instead of fading
         it out (which left a clear band under every overcast), it turns into
         its own average cover, hazed toward the horizon colour. */
      '  float far = 1.0 - smoothstep(0.03, 0.22, d.y);',
      '  float above = smoothstep(-0.03, 0.004, d.y);',
      '  vec2 p = d.xz / max(d.y, 0.055);',
      '  vec2 uv = p * uScale;',
      /* the deck: two octaves at one height */
      '  float n = texture2D(uCloudTex, uv * 0.55 + uOff1).r * 0.58',
      '          + texture2D(uCloudTex, uv * 1.37 + uOff2).r * 0.42;',
      /* a lower, faster, darker scud in front of it: the parallax is in the
         different drift rates and the different projection scale */
      '  vec2 uvLo = p * uScale * 1.9 + uOff2 * 2.6 + vec2(0.27, 0.71);',
      '  float nLo = texture2D(uCloudTex, uvLo).r;',
      '  float scud = smoothstep(uCover + 0.22, uCover + 0.40, nLo) * band * 0.55 * uCloudOp * smoothstep(0.02, 0.35, d.y);',
      '  float covM = smoothstep(uCover - 0.35, uCover + uSoft + 0.25, 0.5);',
      '  float cov = mix(smoothstep(uCover, uCover + uSoft, n), covM, far) * above * uCloudOp;',
      '  float thick = smoothstep(uCover - 0.06, uCover + 0.34, n);',
      /* sample the cloud again a little toward the sun; where density falls
         off in that direction we are on the lit face, else in its own shadow */
      '  vec2 toSun = normalize(uSunDir.xz + vec2(1e-4)) * 0.011;',
      '  float n2 = texture2D(uCloudTex, uv * 0.55 + uOff1 + toSun).r * 0.58',
      '           + texture2D(uCloudTex, uv * 1.37 + uOff2 + toSun * 2.5).r * 0.42;',
      /* Lit faces: density falling off toward the sun, and Beer-Lambert through
         the cloud between here and the sun, with a powder term so thin wisps
         are not the brightest part */
      '  float beer = exp(-max(n2 - uCover, 0.0) * 6.0);',
      '  float powder = 1.0 - exp(-max(n - uCover, 0.0) * 8.0);',
      '  float litFace = (smoothstep(-0.03, 0.09, n - n2) * 0.5 + beer * mix(0.55, 1.0, powder) * 0.5) * uSunVis;',
      '  vec2 uvHi = p * uScale * 0.36 + uOff1 * 0.55 + vec2(0.61, 0.13);',
      '  float nHi = texture2D(uCloudTex, uvHi).r;',
      '  float cirrus = smoothstep(uCover + 0.14, uCover + 0.36, nHi) * band * 0.5 * uCloudOp;',
      '  sky = mix(sky, mix(uCloudL, uSunCol, 0.12) * 1.02, cirrus);',
      /* the thick middle of a cloud is its flat underside, darker */
      '  vec3 cc = mix(uCloudL, uCloudD * 0.92, thick * 0.95);',
      '  cc = mix(cc * 0.82, cc * 1.10 + uSunCol * 0.08, litFace);',
      '  cc += uSunCol * pow(sd, 7.0) * 0.30 * (1.0 - thick) * uSunVis;',
      '  cc = mix(cc, mix(mix(uCloudL, uCloudD, 0.45), hor, 0.55), far);',
      '  sky = mix(sky, cc, clamp(cov, 0.0, 1.0));',
      '  sky = mix(sky, uCloudD * 0.82, scud);',
      /* A rainbow stands opposite the sun at forty-two degrees, so it only
         shows when the sun is low, behind you, and there is still rain in the
         air. Red outside, violet in, with a fainter second bow beyond it. */
      '  if (uBow > 0.001) {',
      '    float ca = dot(d, -normalize(uSunDir));',
      '    float ang = degrees(acos(clamp(ca, -1.0, 1.0)));',
      '    float band = smoothstep(40.0, 41.2, ang) * (1.0 - smoothstep(42.4, 43.6, ang));',
      '    float t2 = clamp((ang - 40.6) / 2.2, 0.0, 1.0);',
      '    vec3 bow = vec3(0.55 + 0.45 * cos((t2 - 0.05) * 6.2832), 0.5 + 0.5 * cos((t2 - 0.38) * 6.2832), 0.5 + 0.5 * cos((t2 - 0.72) * 6.2832));',
      '    float band2 = smoothstep(51.0, 52.4, ang) * (1.0 - smoothstep(54.0, 55.6, ang));',
      '    float t3 = 1.0 - clamp((ang - 51.7) / 2.8, 0.0, 1.0);',
      '    vec3 bow2 = vec3(0.55 + 0.45 * cos((t3 - 0.05) * 6.2832), 0.5 + 0.5 * cos((t3 - 0.38) * 6.2832), 0.5 + 0.5 * cos((t3 - 0.72) * 6.2832));',
      '    float above = smoothstep(-0.02, 0.10, d.y);',
      '    sky += (bow * band * 0.30 + bow2 * band2 * 0.10) * uBow * above;',
      '  }',
      '  gl_FragColor = vec4(sky, 1.0);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  var sky = new THREE.Mesh(geo, mat);
  sky.renderOrder = 900;
  sky.frustumCulled = false;
  scene.add(sky);
  App.sky = sky;
}

/* ---------- terrain ---------- */
function buildTerrain(scene, P, R, U, H) {
  /* An even grid wastes vertices on the horizon and starves the foreground, so
     this one is warped: about a metre across near the window, tens of metres out. */
  var SIZE = 4800, SEG = Q().grid;
  var pos = [], idx = [], i, j;
  var warp = function (u) {
    var a = Math.abs(u);
    return (u < 0 ? -1 : 1) * (0.028 * a + 0.972 * a * a * a) * SIZE * 0.5;
  };
  var axis = [];
  for (i = 0; i <= SEG; i++) axis.push(warp((i / SEG) * 2 - 1));
  for (j = 0; j <= SEG; j++) {
    for (i = 0; i <= SEG; i++) {
      var x = axis[i], z = axis[j];
      pos.push(x, H(x, z), z);
    }
  }
  for (j = 0; j < SEG; j++) {
    for (i = 0; i < SEG; i++) {
      var a = j * (SEG + 1) + i, b = a + 1, c = a + SEG + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  /* a sampler of the mesh itself, bilinear across the warped grid: from here on,
     anything placed on the ground uses this, so a tree at 300 m sits on the
     surface you can see rather than on a bump the mesh never drew */
  (function () {
    var find = function (v) { var lo = 0, hi = SEG; while (hi - lo > 1) { var m = (lo + hi) >> 1; if (axis[m] <= v) lo = m; else hi = m; } return lo; };
    App.Hm = function (x, z) {
      if (x <= axis[0] || x >= axis[SEG] || z <= axis[0] || z >= axis[SEG]) return H(x, z);
      var i = find(x), j = find(z);
      var tx = (x - axis[i]) / (axis[i + 1] - axis[i]), tz = (z - axis[j]) / (axis[j + 1] - axis[j]);
      var a = pos[(j * (SEG + 1) + i) * 3 + 1], b = pos[(j * (SEG + 1) + i + 1) * 3 + 1];
      var c = pos[((j + 1) * (SEG + 1) + i) * 3 + 1], d = pos[((j + 1) * (SEG + 1) + i + 1) * 3 + 1];
      return (a * (1 - tx) + b * tx) * (1 - tz) + (c * (1 - tx) + d * tx) * tz;
    };
  })();
  var CP = cityPlan(P);
  var TKt = P.terrainKind || P.biome.terrain;
  var desertK = TKt === 'dunes' ? (P.erg ? 1 : 2) : 0, DU = (desertK === 1 && P.dune) || {};
  var BT = (TKt === 'canyon' || desertK === 2) ? bedTable(P) : [], BT16 = [];
  for (var bq = 0; bq < 16; bq++) BT16.push(BT[bq] || null);
  var uni = {
    uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
    uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale, uSnow: U.uSnow,
    uSnowCol: U.uSnowCol,
    uTex: { value: (function () {
      var gseed = R.int(1, 99999);
      return cached('ground|' + P.grass.name + '|' + gseed + '|' + Q().tex + '|' + P.patchiness.toFixed(3),
        function () { return makeGroundTexture(P, gseed, Q().tex); });
    })() },
    uTip: { value: new THREE.Color(P.grass.tip) },
    /* heather is brown stems with a band of bells on top: from afar it is
       brown touched with purple, not a purple wash */
    uCoverCol: { value: P.terrainKind === 'skyline' ? new THREE.Color('#3b3c3e') : new THREE.Color(P.grass.cb || P.grass.base)
      .lerp(new THREE.Color(P.grass.ct || P.grass.tip), P.coverStyle === 'heather' ? 0.32 : 0.62) },
    uWindDir: U.uWindDir, uWind: U.uWind,
    /* flowers too small to draw past twenty metres or so still colour the
       field: the species' colours, speckled where their patches are */
    uFlw0: { value: new THREE.Color(P.species && P.species[0] ? P.species[0].petal : '#ffffff') },
    uFlw1: { value: new THREE.Color(P.species && P.species[1 % P.species.length] ? P.species[1 % P.species.length].petal : '#ffffff') },
    uFlw2: { value: new THREE.Color(P.species && P.species[2 % P.species.length] ? P.species[2 % P.species.length].petal : '#ffffff') },
    uFlwK: { value: P.flowerCount && P.species && P.species.length ? clamp(P.flowerCount / 900, 0.35, 1) : 0 },
    /* how much of the ground the blades actually hide, and the lowest ground
       they grow on: the far field only takes the plant colour where plants are */
    uCoverK: { value: clamp((P.coverCount || 0) / 26000, 0, 1) },
    /* a heather moor is a carpet of bushes: the drawn ones are too few to
       hide the ground, so close in the ground takes their colour too */
    uCoverNear: { value: P.coverStyle === 'heather' ? 0.6 : 0.0 },
    /* farmed country: fields, hedge lines and woods drawn into the far ground */
    uPatch: { value: { meadow: 1, farmland: 1, hayfield: 1, river: 1, lakefront: 1, flowerfield: 1, autumn: 1,
      blossom: 1, bridge: 1, cliffcoast: 1, lavender: 1 }[P.biomeKey] ? 1.0 : 0.0 },
    uDryC: { value: new THREE.Color(P.grass.dry) },
    uWoodCol: { value: new THREE.Color(P.leafDark || '#2c3a24').multiplyScalar(0.75 * (P.treeTint || 1)) },
    uCoverMinY: { value: P.waterY != null ? P.waterY + Math.max(P.coverMinH || -1, P.coverWet ? -0.30 : 0.25) : -1e6 },
    /* at an oasis things grow only near the water: the green stops a few
       metres above it (lo, hi), and the sand round about stays sand */
    uPlantY: { value: TKt === 'oasis' ? new THREE.Vector2(P.waterY + 1.0, P.waterY + 4.5) : new THREE.Vector2(1e6, 2e6) },
    uCamPos: U.uCamPos,
    uRock: { value: new THREE.Color(P.rockCol) },
    uHigh: { value: new THREE.Color(P.highCol) },
    uRockLine: { value: P.rockLine != null ? P.rockLine : 1e6 },
    uSnowLine: { value: P.snowLine != null ? P.snowLine : 1e6 },
    uWaterY: { value: P.waterY != null ? P.waterY : -1e6 },
    uBeach: { value: (P.terrainKind || P.biome.terrain) === 'beach' ? 1.0 : 0.0 },
    uSwash: { value: P.waterKind === 'sea' ? 1.0 : 0.0 },
    /* rain soaks into sand; puddles stand on soil and paths */
    uPuddle: { value: ((P.terrainKind || P.biome.terrain) === 'beach' || ARID[P.biomeKey]) ? 0.0 : 1.0 },
    uPaddy: { value: (P.terrainKind || P.biome.terrain) === 'terrace' ? 1.0 : 0.0 },
    uStepH: { value: P.stepH || 1.0 },
    /* the planted rows carry on past the last plant, drawn into the ground on
       the same spacing and angle, so they run to the horizon */
    uRowSp: { value: (P.rowSpacing && P.coverRows) ? P.rowSpacing : 0.0 },
    uRowDir: { value: new THREE.Vector2(Math.cos(P.rowAngle || 0), Math.sin(P.rowAngle || 0)) },
    uRowCol: { value: new THREE.Color(P.rowColour || P.grass.ct || P.grass.tip) },
    uRowSoil: { value: new THREE.Color(P.grass.cb || P.grass.base) },
    /* horizontal beds of rock, each its own shade, laid through the walls */
    uPathW: { value: P.pathKind ? P.pathW : 0.0 },
