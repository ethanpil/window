      '  float trans = pow(max(dot(-N, sd), 0.0), 2.5) * 0.42 * smoothstep(0.1, 0.8, yN) * (1.0 - far * 0.8);',
      /* a satin sheen where the sun glances off the blade: keyed to the gust,
         so it sweeps the field in waves and no single blade twinkles */
      '  vec3 Ng = normalize(vec3(-s, 0.62, c) + vec3(uWindDir.x, 0.0, uWindDir.y) * gustBend * 1.6);',
      '  float sheen = pow(max(dot(reflect(-sd, Ng), normalize(cameraPosition - wp)), 0.0), 12.0) * 0.20 * yN * (1.0 - far);',
      '  float ao = mix(0.42, 1.0, smoothstep(0.0, 0.55, yN));',
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.30, 1.0, baked(wp.xz));',
      '  vec3 col = mix(uBase, uTip, clamp(yN * 1.05, 0.0, 1.0));',
      '  col = mix(col, uDry, smoothstep(0.55, 1.0, iAttr.w) * 0.45);',
      '  col *= 0.78 + 0.44 * iAttr.w;',
      '  vec3 lit = col * (uAmbCol * 1.15 + uSunCol * (diff * 1.15 + trans + sheen) * sh) * ao;',
      /* one steady colour for the far field: no per-blade variation left to alias */
      '  vec3 mass = mix(uBase, uTip, 0.62) * (uAmbCol * 1.15 + uSunCol * 0.70 * sh) * 0.94;',
      '  lit = mix(lit, mass, far);',
      /* whitened along the whole blade, so nothing dark pokes through the snow */
      '  lit = mix(lit, uSnowCol * (0.80 + 0.20 * yN), clamp(uSnow * 1.6, 0.0, 0.96));',
      '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
      '  float fg = fogAmt(-mv.z, uFogDensity);',
      '  vColor = mix(lit, uFogCol, fg);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'varying vec3 vColor;',
      'void main(){ gl_FragColor = vec4(tone(vColor), 1.0); }'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  scene.add(m);
  App.grass = m;
  App.grassMax = COUNT;
}

/* ---------- flowers ---------- */
function buildFlowers(scene, P, R, U, H) {
  if (!P.flowerCount) return;
  App.flowerMeshes = [];
  var perSpecies = Math.floor(P.flowerCount / P.species.length);
  for (var si = 0; si < P.species.length; si++) {
    var sp = P.species[si];
    var COUNT = perSpecies;
    var quad = new THREE.PlaneGeometry(1, 1);
    quad.translate(0, 0.5, 0);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);

    var iPos = new Float32Array(COUNT * 3);
    var iAttr = new Float32Array(COUNT * 3);
    var iVar = new Float32Array(COUNT * 2);
    var patches = [];
    for (var p = 0; p < 26; p++) {
      var pa = R.range(-1.14, 1.14), pr = 1.8 + Math.pow(R.f(), 1.5) * (Math.min(P.flowerReach || 44, 36) - 6);
      patches.push([Math.sin(pa) * pr, -Math.cos(pa) * pr, R.range(0.8, 3.4)]);
    }
    var made = 0, guard = 0;
    while (made < COUNT && guard < COUNT * 40) {
      guard++;
      var x, z;
      if (R.f() < 0.75) {
        var pc = patches[Math.floor(R.f() * patches.length)];
        x = pc[0] + R.gauss() * pc[2];
        z = pc[1] + R.gauss() * pc[2];
      } else {
        var a = R.range(-1.14, 1.14), r = 1.8 + Math.pow(R.f(), 1.6) * (Math.min(P.flowerReach || 44, 36) - 4);
        x = Math.sin(a) * r; z = -Math.cos(a) * r;
      }
      if (P.rowSpacing) {
        var A2 = P.rowAngle;
        var pp2 = x * Math.cos(A2) + z * Math.sin(A2);
        var sn2 = Math.round(pp2 / P.rowSpacing) * P.rowSpacing + R.gauss() * 0.09;
        x += (sn2 - pp2) * Math.cos(A2);
        z += (sn2 - pp2) * Math.sin(A2);
      }
      var d = Math.sqrt(x * x + z * z);
      if (d < 1.4 || d > Math.min(P.flowerReach || 44, 36) || z > -1.0) continue;
      if (Math.abs(Math.atan2(x, -z)) > 1.15) continue;
      if (P.waterY != null) {
      var gh = H(x, z);
      /* reeds stand in the shallows; grass keeps its feet dry */
      if (gh < P.waterY + (P.coverWet ? -0.30 : 0.25)) continue;
      if (P.coverMinH && gh < P.waterY + P.coverMinH) continue;
    }
      iPos[made * 3] = x;
      iPos[made * 3 + 1] = H(x, z);
      iPos[made * 3 + 2] = z;
      var sz = R.range(sp.size[0], sp.size[1]) * (1 + smoothstep(12, 40, d) * 1.5);
      iAttr[made * 3] = sz;
      iAttr[made * 3 + 1] = x * 3.1 + z * 2.6 + R.range(-1.1, 1.1);
      iAttr[made * 3 + 2] = R.range(0.7, 1.25);
      var vr = R.f(); var variant = vr < 0.45 ? 0 : (vr < 0.75 ? 1 : (vr < 0.9 ? 2 : 3));
      iVar[made * 2] = variant + (R.f() < 0.5 ? 4 : 0);
      iVar[made * 2 + 1] = R.range(-0.22, 0.22);
      made++;
    }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 3));
    geo.setAttribute('iVar', new THREE.InstancedBufferAttribute(iVar, 2));
    geo.instanceCount = made;

    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uWind: U.uWind, uGust: U.uGust, uWindDir: U.uWindDir,
        uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
        uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale, uSnow: U.uSnow,
        uMap: { value: makeFlowerTexture(sp, R) },
        uCamPos: U.uCamPos
      },
      transparent: false,
      alphaTest: 0.45,
      side: THREE.DoubleSide,
      vertexShader: [
        'attribute vec3 iPos; attribute vec3 iAttr; attribute vec2 iVar;',
        'uniform float uTime, uWind, uGust, uFogDensity, uShadow, uSnow;',
        'uniform vec2 uWindDir; uniform vec3 uCamPos, uSunDir, uSunCol, uAmbCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint;',
        GLSL_COMMON,
        'void main(){',
        '  float dF = length(iPos - cameraPosition);',
        '  float gone = smoothstep(20.0, 34.0, dF);',
        '  float size = iAttr.x * (1.0 - uSnow * 0.55) * (1.0 - gone);',
        '  if (uSnow > 0.30) size = 0.0;',
        '  vec3 toCam = normalize(vec3(uCamPos.x - iPos.x, 0.0, uCamPos.z - iPos.z));',
        '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
        '  float lc = cos(iVar.y), ls = sin(iVar.y);',
        '  vec2 q = vec2(position.x * lc - position.y * ls, position.x * ls + position.y * lc);',
        '  vec3 lp = right * q.x * size * 0.8 + vec3(0.0, q.y * size * 1.5, 0.0);',
        '  float wave = sin(dot(iPos.xz, uWindDir) * 0.22 - uTime * 1.55 + iAttr.y * 0.6);',
        '  float flut = sin(uTime * 2.3 + iAttr.y) * 0.24 + sin(uTime * 1.1 + iAttr.y * 1.6) * 0.12;',
        '  float drive = uWind * (0.46 + 0.95 * uGust) * iAttr.z;',
        '  float bf = drive * max(0.55 + 0.4 * wave + flut, 0.0) * 0.45;',
        '  bf = bf / (1.0 + bf);',
        '  float bend = bf * size * 1.1 * position.y * position.y * (1.0 - gone);',
        '  vec3 wp = iPos + lp;',
        '  wp.xz += uWindDir * bend;',
        '  float vi = mod(iVar.x, 4.0); float flip = step(3.5, iVar.x);',
        '  float ux = mix(uv.x, 1.0 - uv.x, flip);',
        '  vUv = vec2((vi + ux) * 0.25, uv.y);',
        '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.30, 1.0, baked(wp.xz));',
        '  vTint = uAmbCol * 0.85 + uSunCol * 0.75 * sh;',
        '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
        '  vFog = fogAmtH(-mv.z, uFogDensity, wp.y);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
      GLSL_TONE,
        'uniform sampler2D uMap; uniform vec3 uFogCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint;',
        'void main(){',
        '  vec4 t = texture2D(uMap, vUv);',
        '  if (t.a < 0.02) discard;',
        '  gl_FragColor = vec4(mix(t.rgb * vTint, uFogCol, vFog), t.a);',
        '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
      ].join('\n')
    });
    mat.uniforms.uFogCol = U.uFogCol;
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.flowerMeshes.push(m);
  }
}


/* ---------- cacti, built as actual geometry ----------
   A saguaro is a ribbed column with arms that elbow out and turn up. Painted on
   a flat billboard it always reads as cardboard, so these are real tubes. */
function pushTube(B, path, radii, seg, ribs) {
  var start = B.pos.length / 3, i, j;
  var rn = ribs ? ribs.n : 0, ra = ribs ? ribs.amp : 0;
  var ref = new THREE.Vector3(1, 0, 0);
  var T = new THREE.Vector3(), N = new THREE.Vector3(), Bi = new THREE.Vector3(), prev = null;
  for (i = 0; i < path.length; i++) {
    var a = path[Math.max(i - 1, 0)], b = path[Math.min(i + 1, path.length - 1)];
    T.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    if (T.lengthSq() < 1e-9) T.set(0, 1, 0);
    T.normalize();
    if (prev) {
      /* Carry the frame along the path. Built afresh from a fixed axis it
         swings through 140 degrees in one ring where a limb turns from level
         to upright, which shears the tube apart at the elbow. */
      N.copy(prev).addScaledVector(T, -prev.dot(T));
      if (N.lengthSq() < 1e-10) { ref.set(Math.abs(T.y) > 0.94 ? 1 : 0, Math.abs(T.y) > 0.94 ? 0 : 1, 0); N.crossVectors(ref, T); }
    } else {
      ref.set(Math.abs(T.y) > 0.94 ? 1 : 0, Math.abs(T.y) > 0.94 ? 0 : 1, 0);
      N.crossVectors(ref, T);
    }
    N.normalize();
    Bi.crossVectors(T, N).normalize();
    prev = (prev || new THREE.Vector3()).copy(N);
    /* the ring closes on a repeated vertex, as pushCyl does, so the stripe
       coordinate can reach 1 instead of falling back to 0 across the last
       face and running the whole bark pattern backwards down one seam */
    for (j = 0; j <= seg; j++) {
      var ang = (j / seg) * 6.283185;
      var cx = Math.cos(ang), sy = Math.sin(ang);
      var nx = N.x * cx + Bi.x * sy, ny = N.y * cx + Bi.y * sy, nz = N.z * cx + Bi.z * sy;
      var rr = radii[i] * (rn ? (1 + ra * Math.cos(rn * ang)) : 1);
      B.pos.push(path[i][0] + nx * rr, path[i][1] + ny * rr, path[i][2] + nz * rr);
      B.nor.push(nx, ny, nz);
      B.rib.push(j / seg);
    }
  }
  var ring = seg + 1;
  for (i = 0; i < path.length - 1; i++) {
    for (j = 0; j < seg; j++) {
      var j2 = j + 1;
      var r0 = start + i * ring, r1 = start + (i + 1) * ring;
      B.idx.push(r0 + j, r1 + j, r0 + j2);
      B.idx.push(r0 + j2, r1 + j, r1 + j2);
    }
  }
}

/* a straight or curved limb with a domed top */
function limbPath(from, to, ctrl, radius, steps) {
  var path = [], radii = [], i;
  for (i = 0; i <= steps; i++) {
    var t = i / steps, mt = 1 - t;
    path.push([
      mt * mt * from[0] + 2 * mt * t * ctrl[0] + t * t * to[0],
      mt * mt * from[1] + 2 * mt * t * ctrl[1] + t * t * to[1],
      mt * mt * from[2] + 2 * mt * t * ctrl[2] + t * t * to[2]
    ]);
    radii.push(radius * (1 - 0.12 * t));
  }
  /* dome the tip */
  var tip = path[path.length - 1], prev = path[path.length - 2];
  var dx = tip[0] - prev[0], dy = tip[1] - prev[1], dz = tip[2] - prev[2];
  var dl = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
  dx /= dl; dy /= dl; dz /= dl;
  var rEnd = radii[radii.length - 1];
  for (i = 1; i <= 4; i++) {
    var u = i / 4;
    path.push([tip[0] + dx * rEnd * u, tip[1] + dy * rEnd * u, tip[2] + dz * rEnd * u]);
    radii.push(rEnd * Math.sqrt(Math.max(1 - u * u, 0.0001)));
  }
  return { path: path, radii: radii };
}

function finishGeo(B) {
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(B.pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(B.nor, 3));
  geo.setAttribute('rib', new THREE.Float32BufferAttribute(B.rib, 1));
  geo.setIndex(B.idx);
  geo.computeVertexNormals();
  return geo;
}

/* Five things that actually grow in a desert, each with its own shape: the
   pleated column, the squat barrel, the flat pads, the rosette of blades, the
   whip-stemmed ocotillo. The ribs are geometry, so light catches them. */
var CACTI = {
  saguaro:  { body: '#5b7f55', spine: '#efe7c6', ribs: 16, spines: 1.0, tip: null, w: 5 },
  barrel:   { body: '#7c8d3d', spine: '#d9a33a', ribs: 20, spines: 1.6, tip: '#c0552f', tipMix: 0.35, w: 3 },
  pear:     { body: '#5e7e5b', spine: '#efe7c6', ribs: 0,  spines: 0.7, tip: null, w: 4 },
  agave:    { body: '#6e8f89', spine: '#bfa88a', ribs: 0,  spines: 0.0, tip: '#4a2f22', tipMix: 0.55, w: 3 },
  ocotillo: { body: '#6a6150', spine: '#a89878', ribs: 0,  spines: 0.4, tip: '#c9402a', tipMix: 0.7, w: 2 },
  cholla:   { body: '#8c9b74', spine: '#f2eedb', ribs: 6,  spines: 2.2, tip: null, w: 2 }
};
function cactusTemplate(R, kind) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  var a, th, k;
  if (kind === 'saguaro') {
    var h = R.range(0.72, 1.0), r = R.range(0.058, 0.082);
    var trunk = limbPath([0, -0.06, 0], [0, h, 0], [R.range(-0.02, 0.02), h * 0.5, 0], r, 7);
    for (k = 0; k < trunk.radii.length; k++) { var t = k / (trunk.radii.length - 1); trunk.radii[k] *= (1 + 0.35 * Math.exp(-t * 10)) * (1 + 0.12 * Math.sin(t * 3.14)); }
    pushTube(B, trunk.path, trunk.radii, 24, { n: 16, amp: 0.085 });
    var arms = R.int(0, 4), az = R.range(0, 6.283);
    for (a = 0; a < arms; a++) {
      th = az + a * (6.283 / Math.max(arms, 2)) + R.range(-0.5, 0.5);
      var y0 = h * R.range(0.28, 0.58), reach = R.range(0.14, 0.24), rise = R.range(0.22, 0.46);
      var ex = Math.cos(th) * reach, ez = Math.sin(th) * reach;
      var ar = r * R.range(0.62, 0.82);
      /* a rounded elbow out, then straight up, then a dome */
      var path = [], radii = [];
      for (k = 0; k <= 5; k++) { var u = k / 5; path.push([ex * 0.15 + (ex - ex * 0.15) * Math.sin(u * 1.5708), y0 + reach * 0.35 * (1 - Math.cos(u * 1.5708)), ez * 0.15 + (ez - ez * 0.15) * Math.sin(u * 1.5708)]); radii.push(ar); }
      var up = limbPath([ex, y0 + reach * 0.35, ez], [ex, y0 + reach * 0.35 + rise, ez], [ex, y0 + reach * 0.35 + rise * 0.5, ez], ar, 4);
      for (k = 1; k < up.path.length; k++) { path.push(up.path[k]); radii.push(up.radii[k]); }
      pushTube(B, path, radii, 20, { n: 13, amp: 0.085 });
    }
  } else if (kind === 'barrel') {
    var bh = R.range(0.42, 0.7), br = R.range(0.22, 0.34);
    var bp = [], brd = [];
    for (k = 0; k <= 8; k++) { var t2 = k / 8; bp.push([0, -0.04 + bh * t2, 0]); brd.push(br * Math.sin(0.25 + t2 * 2.55) * (t2 < 0.15 ? 0.75 + t2 * 1.7 : 1)); }
    brd[8] = br * 0.18;
    pushTube(B, bp, brd, 26, { n: 20, amp: 0.10 });
  } else if (kind === 'pear') {
    var pads = R.int(4, 9);
    var padAt = function (x, y, z, ang, tilt, size) {
      var pth = [], prd = [];
      for (k = 0; k <= 6; k++) {
        var t3 = k / 6;
        pth.push([x + Math.cos(ang) * Math.sin(tilt) * t3 * size, y + Math.cos(tilt) * t3 * size, z + Math.sin(ang) * Math.sin(tilt) * t3 * size]);
        prd.push(size * 0.42 * Math.sin(t3 * 3.14159) + 0.012);
      }
      pushTube(B, pth, prd, 18, { n: 2, amp: 0.62 });
      return pth[pth.length - 1];
    };
    for (a = 0; a < pads; a++) {
      var pa = R.range(0, 6.283), sz = R.range(0.22, 0.34);
      var tip = padAt(0, 0.02, 0, pa, R.range(0.25, 0.75), sz);
      if (R.f() < 0.55) padAt(tip[0], tip[1], tip[2], pa + R.range(-0.9, 0.9), R.range(0.1, 0.6), sz * R.range(0.7, 0.95));
    }
  } else if (kind === 'agave') {
    var blades = R.int(12, 20);
    for (a = 0; a < blades; a++) {
      th = a * 6.283 / blades + R.range(-0.15, 0.15);
      var lean = R.range(0.35, 1.05), len = R.range(0.36, 0.56);
      var pth2 = [], prd2 = [];
      for (k = 0; k <= 6; k++) {
        var t4 = k / 6;
        pth2.push([Math.cos(th) * Math.sin(lean) * t4 * len, 0.03 + Math.cos(lean) * t4 * len - t4 * t4 * 0.05, Math.sin(th) * Math.sin(lean) * t4 * len]);
        prd2.push(0.058 * (1 - t4) * (1 - t4 * 0.3) + 0.003);
      }
      pushTube(B, pth2, prd2, 10, { n: 2, amp: 0.45 });
    }
  } else if (kind === 'ocotillo') {
    var stems = R.int(7, 13);
    for (a = 0; a < stems; a++) {
      th = a * 6.283 / stems + R.range(-0.3, 0.3);
      var splay = R.range(0.18, 0.42), tall = R.range(0.9, 1.4);
      var wh = limbPath([Math.cos(th) * 0.04, -0.02, Math.sin(th) * 0.04], [Math.cos(th) * splay, tall, Math.sin(th) * splay],
        [Math.cos(th) * splay * 0.35, tall * 0.55, Math.sin(th) * splay * 0.35], 0.014, 8);
      pushTube(B, wh.path, wh.radii, 6);
    }
  } else {
    var ct = limbPath([0, -0.04, 0], [0, 0.42, 0], [0, 0.2, 0], 0.045, 4);
    pushTube(B, ct.path, ct.radii, 10, { n: 6, amp: 0.15 });
    var joints = R.int(9, 16);
    for (a = 0; a < joints; a++) {
      th = R.range(0, 6.283);
      var jy = R.range(0.22, 0.42), jr = R.range(0.12, 0.26), jl = R.range(0.14, 0.26);
      var jp = limbPath([Math.cos(th) * 0.03, jy, Math.sin(th) * 0.03],
        [Math.cos(th) * jr, jy + jl, Math.sin(th) * jr], [Math.cos(th) * jr * 0.5, jy + jl * 0.3, Math.sin(th) * jr * 0.5], 0.035, 4);
      pushTube(B, jp.path, jp.radii, 8, { n: 6, amp: 0.18 });
    }
  }
  return finishGeo(B);
}

function solidMat(U, colour, opts) {
  opts = opts || {};
  return new THREE.ShaderMaterial({
    extensions: { derivatives: true },
    uniforms: {
      uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
      uBody: { value: new THREE.Color(colour) },
      uSpine: { value: new THREE.Color(opts.spineCol || '#e8dfb4') },
      uRib: { value: opts.rib == null ? 1 : opts.rib },
      uRibN: { value: opts.ribN || 16 },
      uSpines: { value: opts.spines || 0 },
      uTipCol: { value: new THREE.Color(opts.tipCol || '#000000') },
      uTipMix: { value: opts.tipMix || 0 },
      uBody2: { value: new THREE.Color(opts.body2 || colour) },
      uBarkN: { value: opts.barkN || 18 },
      uBarkPlate: { value: opts.barkPlate || 5.0 },
      uLichen: { value: new THREE.Color(opts.lichen || '#8f9a3c') },
      uNodes: { value: opts.nodes || 0 },
      uGrain: { value: opts.grain || 0 },
      uSpin: { value: opts.spin || 0 }
    },
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr; attribute float rib;',
      'uniform float uTime, uFogDensity, uShadow, uSpin;',
      'uniform vec3 uSunDir, uSunCol, uAmbCol, uBody, uFogCol;',
      'varying vec3 vCol; varying float vRib; varying float vUp; varying float vSeed; varying vec3 vLocal; varying vec3 vNrm;',
      GLSL_COMMON,
      'void main(){',
      '  float sc = iAttr.x, rot = iAttr.y;',
      '  float c = cos(rot), s = sin(rot);',
      '  vec3 lp = position * vec3(sc, sc * iAttr.z, sc * iAttr.w);',
      '  vec3 nl = normal;',
      /* a turning part spins about its own z before it is placed, so a set of
         windmill sails keeps its hub while it goes round */
      '  if (uSpin != 0.0) {',
      '    float sa = uSpin * uTime, cs = cos(sa), ss = sin(sa);',
      '    lp.xy = vec2(lp.x * cs - lp.y * ss, lp.x * ss + lp.y * cs);',
      '    nl.xy = vec2(nl.x * cs - nl.y * ss, nl.x * ss + nl.y * cs);',
      '  }',
      '  vec3 wp = iPos + vec3(lp.x * c - lp.z * s, lp.y, lp.x * s + lp.z * c);',
      '  vec3 n = normalize(vec3(nl.x * c - nl.z * s, nl.y, nl.x * s + nl.z * c));',
      '  float diff = max(dot(n, normalize(uSunDir)), 0.0);',
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.30, 1.0, baked(wp.xz));',
      '  float ao = uSpin != 0.0 ? 1.0 : mix(0.55, 1.0, smoothstep(0.0, 0.35, position.y));',
      /* Ambient light carried no direction, so anything the sun did not reach
         came out evenly lit: a trunk read as a flat plank. The sky is
         brightest toward the sun, so lean the ambient that way. Averaged over
         a sphere the factor is 1.0, so nothing changes in overall brightness,
         but a cylinder now turns from light to dark around its girth. */
      '  float sky = 0.72 + 0.56 * (dot(n, normalize(uSunDir)) * 0.5 + 0.5);',
      '  vCol = uBody * (uAmbCol * 1.1 * sky + uSunCol * (diff * 1.15 + 0.10) * sh) * ao;',
      '  vRib = rib; vUp = position.y; vSeed = iAttr.y; vLocal = position; vNrm = n;',
      '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
      '  vCol = mix(vCol, hazeToward(uFogCol, normalize(wp - cameraPosition), uSunDir, uSunCol), fogAmtH(-mv.z, uFogDensity, wp.y));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform vec3 uSpine, uTipCol, uBody2, uLichen, uBody; uniform float uRib, uNodes, uGrain, uRibN, uSpines, uTipMix, uBarkN, uBarkPlate;',
      /* A computed pattern has no mip chain, so once its stripes are finer than
         a pixel it turns to moire. This measures how fast the pattern's own
         coordinate moves per pixel and fades the pattern out as it nears that
         limit, which is what a mip-map would have done for a texture. */
      'float bandLimit(float x, float freq){ float w = fwidth(x) * freq; return 1.0 - smoothstep(0.30, 0.85, w); }',
      'varying vec3 vCol; varying float vRib; varying float vUp; varying float vSeed; varying vec3 vLocal; varying vec3 vNrm;',
      'float h3(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }',
      /* smooth value noise: a hash alone is constant across its cell, which
         is what made lichen come out as flat squares */
      'float vn3(vec3 p){',
      '  vec3 i = floor(p), f = fract(p);',
      '  f = f * f * (3.0 - 2.0 * f);',
      '  return mix(mix(mix(h3(i), h3(i + vec3(1,0,0)), f.x), mix(h3(i + vec3(0,1,0)), h3(i + vec3(1,1,0)), f.x), f.y),',
      '             mix(mix(h3(i + vec3(0,0,1)), h3(i + vec3(1,0,1)), f.x), mix(h3(i + vec3(0,1,1)), h3(i + vec3(1,1,1)), f.x), f.y), f.z);',
      '}',
      'void main(){',
      '  vec3 c = vCol;',
      '  float rr = vRib * 6.2832 * uRibN;',
      '  float kRib = bandLimit(vRib, uRibN);',
      '  if (uRib > 0.01) c *= 1.0 + 0.16 * uRib * cos(rr) * kRib;',
      '  if (uSpines > 0.01) {',
      '    float kSpine = min(kRib, bandLimit(vUp, 26.0 * uSpines));',
      '    float onRib = uRib > 0.01 ? smoothstep(0.80, 1.0, abs(cos(rr))) : smoothstep(0.7, 1.0, fract(sin(floor(vRib * 40.0) * 7.1 + vSeed) * 43758.5));',
      '    float row = smoothstep(0.40, 0.62, fract(vUp * 26.0 * uSpines));',
      /* past the limit the spines average into a slight overall paleness
         rather than vanishing or crawling */
      '    float amt = clamp(onRib * row * 0.45 * uSpines, 0.0, 0.85);',
      '    c = mix(c, uSpine * (0.35 + 0.65 * length(vCol)), mix(0.10 * uSpines, amt, kSpine));',
      '  }',
      '  c = mix(c, uTipCol * (0.4 + 0.6 * length(vCol)), uTipMix * smoothstep(0.72, 1.0, vUp));',
      '  if (uNodes > 0.5) {',
      '    float seg = fract(vUp * 7.0 + vSeed * 0.3);',
      '    c *= 0.78 + 0.22 * smoothstep(0.02, 0.13, seg);',
      '    c *= 1.0 + 0.10 * cos(vRib * 25.13) * bandLimit(vRib, 4.0);',
      '  }',
      '  if (uGrain > 1.5) {',
      /* stone: two tones mottled at two scales, a fine speckle, dark seams,
         and lichen on the faces that see the sky */
      '    vec3 q = vLocal + vSeed;',
      '    float w = max(fwidth(vLocal.x), fwidth(vLocal.z));',
      '    float k9 = 1.0 - smoothstep(0.30, 0.85, w * 9.0);',
      '    float k31 = 1.0 - smoothstep(0.30, 0.85, w * 31.0);',
      '    float kSeam = 1.0 - smoothstep(0.30, 0.85, w * 20.0);',
      '    float m1 = h3(floor(q * 3.2)), m2 = h3(floor(q * 9.0)), m3 = h3(floor(q * 31.0));',
      '    float mottle = m1 * 0.55 + mix(0.5, m2, k9) * 0.45;',
      '    vec3 ratio = uBody2 / max(uBody, vec3(0.02));',
      '    c = mix(c, c * ratio, mottle);',
      '    c *= 1.0 + 0.28 * (m3 - 0.5) * k31;',
      /* a product of two sines is a woven grid, which reads as banding. Cracks
         are the borders between irregular cells instead: pick the two nearest
         of a set of jittered points and darken where they are equally close. */
      '    vec2 cp = vLocal.xz * 13.0 + vLocal.y * 4.2;',
      '    vec2 cell = floor(cp);',
      '    float d1 = 8.0, d2 = 8.0;',
      '    for (int oy = -1; oy <= 1; oy++) for (int ox = -1; ox <= 1; ox++) {',
      '      vec2 g2 = cell + vec2(float(ox), float(oy));',
      '      vec2 jit = vec2(h3(vec3(g2, 3.1)), h3(vec3(g2, 7.7)));',
      '      float dd = length(g2 + jit - cp);',
      '      if (dd < d1) { d2 = d1; d1 = dd; } else if (dd < d2) { d2 = dd; }',
      '    }',
      '    float crack = 1.0 - smoothstep(0.02, 0.14, d2 - d1);',
      '    c *= 1.0 - 0.30 * crack * kSeam;',
      '    c *= 1.0 + 0.12 * (h3(vec3(cell, 1.7)) - 0.5) * kSeam;',   /* each facet its own shade */
      '    float upFace = smoothstep(0.35, 0.8, vNrm.y);',
      /* Lichen was a hard step on a grid about three cells wide on a boulder,
         so it read as yellow squares painted on the stone. Grow it on smooth
         noise at two scales instead, and thin the fine one with distance. */
      '    float lf = vn3(q * 3.4) * 0.66 + mix(0.5, vn3(q * 9.0), k9) * 0.34;',
      '    float lich = smoothstep(0.54, 0.78, lf);',
      '    c = mix(c, uLichen * (0.4 + 0.6 * length(vCol) / max(length(uBody), 0.05)), lich * upFace * 0.70);',
      '  } else if (uGrain > 0.5) {',
      /* Bark runs UP the trunk in ridges and fissures. The old pattern was a
         grid of horizontal bands, which read as a painted road. These ridges
         wander as they climb, split into plates, and carry a fine grain. */
      '    float wob = sin(vUp * 8.0 + vSeed) * 0.020 + sin(vUp * 21.0 + vSeed * 2.3) * 0.008;',
      '    float u = vRib + wob;',
      '    float kB = bandLimit(u, uBarkN);',
      '    float fis = abs(fract(u * uBarkN) - 0.5) * 2.0;',
      '    c *= 1.0 - 0.40 * smoothstep(0.45, 1.0, fis) * kB;',
      '    float plate = h3(vec3(floor(u * uBarkN), floor(vUp * uBarkPlate + vSeed), 1.0));',
      '    c *= 1.0 + 0.20 * (plate - 0.5) * min(kB, bandLimit(vUp, uBarkPlate));',
      '    float gn = h3(vec3(floor(u * uBarkN * 3.0), floor(vUp * 70.0), 3.0));',
      '    c *= 1.0 + 0.16 * (gn - 0.5) * bandLimit(vUp, 70.0);',
      '  }',
      '  gl_FragColor = vec4(c, 1.0);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
}

function instanceSolid(scene, tpl, items, mat) {
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = tpl.index;
  geo.setAttribute('position', tpl.attributes.position);
  geo.setAttribute('normal', tpl.attributes.normal);
  geo.setAttribute('rib', tpl.attributes.rib);
  var iPos = new Float32Array(items.length * 3);
  var iAttr = new Float32Array(items.length * 4);
  for (var i = 0; i < items.length; i++) {
    iPos[i * 3] = items[i][0]; iPos[i * 3 + 1] = items[i][1]; iPos[i * 3 + 2] = items[i][2];
    iAttr[i * 4] = items[i][3];
    iAttr[i * 4 + 1] = items[i][4];
    iAttr[i * 4 + 2] = items[i][5] == null ? 1 : items[i][5];
    iAttr[i * 4 + 3] = items[i][6] == null ? 1 : items[i][6];
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = items.length;
  geo.userData.tips = tpl.userData && tpl.userData.tips;
  geo.userData.shape = tpl.userData && tpl.userData.shape;
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  scene.add(m);
  App.propMeshes.push(m);
  return m;
}

/* ---------- drystone walls along field edges ---------- */
function buildWalls(scene, P, R, U, H, spec) {
  var box = new THREE.BoxGeometry(1, 1, 1);
  box.translate(0, 0.5, 0);
  var tpl = new THREE.BufferGeometry();
  tpl.setAttribute('position', box.attributes.position);
  tpl.setAttribute('normal', box.attributes.normal);
  tpl.setAttribute('rib', new THREE.Float32BufferAttribute(box.attributes.uv.array.length / 2 > 0
    ? Array.prototype.slice.call(box.attributes.uv.array).filter(function (_, i) { return i % 2 === 0; })
    : [], 1));
  tpl.setIndex(box.index);
  var mat = solidMat(U, R.pick(['#8b8578', '#7d7a70', '#948d7e']), { rib: 0, grain: 1 });
  var items = [];
  var lines = R.int(2, 5);
  for (var l = 0; l < lines; l++) {
    var ang = R.range(-1.2, 1.2);
    var dist = R.range(25, 150);
    var dirA = ang + Math.PI / 2 + R.range(-0.5, 0.5);
    var cx = Math.sin(ang) * dist, cz = -Math.cos(ang) * dist;
    var segs = R.int(14, 40);
    var step = R.range(1.6, 2.6);
    for (var q = 0; q < segs; q++) {
      var off = (q - segs / 2) * step;
      var wx = cx + Math.cos(dirA) * off, wz = cz + Math.sin(dirA) * off;
      if (!plantable(P, H, wx, wz)) continue;
      /* long, low, and only a couple of stones thick */
      items.push([wx, H(wx, wz) - 0.1, wz, step * 1.02, dirA,
                  R.range(0.5, 0.85) / (step * 1.02), R.range(0.32, 0.5) / (step * 1.02)]);
    }
  }
  if (items.length) instanceSolid(scene, tpl, items, mat);
}
function buildCacti(scene, P, R, U, H, spec) {
  var kinds = Object.keys(CACTI), pairs = [];
  for (var ki = 0; ki < kinds.length; ki++) pairs.push([kinds[ki], CACTI[kinds[ki]].w]);
  var buckets = {};
  var guard = 0, placed = 0;
  while (placed < spec.count && guard < spec.count * 60) {
    guard++;
    var a = R.range(-1.22, 1.22);
    var rr = spec.r[0] + Math.pow(R.f(), 1.35) * (spec.r[1] - spec.r[0]);
    var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
    if (!plantable(P, H, x, z)) continue;
    var kind = R.weighted(pairs);
    var sz = R.range(spec.size[0], spec.size[1]) * ({ saguaro: 1, ocotillo: 0.72, barrel: 0.15, pear: 0.30, agave: 0.28, cholla: 0.30 }[kind] || 0.3);
    (buckets[kind] = buckets[kind] || []).push([x, z, sz, R.range(0.85, 1.15)]);
    App._shadows.push([x, H(x, z), z, sz * (kind === 'saguaro' ? 0.16 : 0.3), 1.0, sz]);
    placed++;
  }
  for (var kind2 in buckets) {
    var items = buckets[kind2], C = CACTI[kind2];
    var mat = solidMat(U, C.body, { rib: C.ribs ? 1 : 0, ribN: C.ribs || 16, spineCol: C.spine, spines: C.spines, tipCol: C.tip, tipMix: C.tipMix || 0 });
    for (var t = 0; t < 2; t++) {
      var part = items.filter(function (_, idx) { return idx % 2 === t; });
      if (!part.length) continue;
      var tpl = cactusTemplate(R, kind2);
      var solids = [];
      for (var i = 0; i < part.length; i++)
        solids.push([part[i][0], H(part[i][0], part[i][1]) - 0.03, part[i][1], part[i][2], R.range(0, 6.283), part[i][3], 1]);
      instanceSolid(scene, tpl, solids, mat);
    }
  }
}

/* ---------- a city ----------
   Blocks of instanced boxes with a window grid computed per face. At night the
   lit windows carry the whole scene, so they are seeded per building and per
   cell and a few of them shift over the hour. */
function buildCity(scene, P, R, U, H) {
  var box = new THREE.BoxGeometry(1, 1, 1);
  box.translate(0, 0.5, 0);
  var items = [], guard = 0;
  /* the near neighbourhood: low roofs and gardens before the city proper */
  if (P.cityFront === 'houses') {
    var hb = { pos: [], nor: [], idx: [], rib: [] };
    pushBox(hb, 0, 0.5, 0, 0.5, 0.5, 0.38, 0);
    pushCone(hb, 0, 1.0, 0, 0.62, 0.42, 4);
    pushBox(hb, -0.28, 1.32, 0.10, 0.07, 0.22, 0.07, 0);
    var htpl = finishGeo(hb);
    var hmat = solidMat(U, R.pick(['#c9b7a2', '#b8a894', '#cbbfae', '#a9917c']), { rib: 0, grain: 0, spines: 0, body2: '#7a5c48' });
    var houses = [], hg = 0;
    while (houses.length < R.int(26, 52) && hg < 900) {
      hg++;
      var ha = R.range(-1.15, 1.15), hr = 60 + Math.pow(R.f(), 0.9) * 150;
      var hx = Math.sin(ha) * hr, hz = -Math.cos(ha) * hr;
      if (!plantable(P, H, hx, hz)) continue;
      var hs = R.range(4.5, 8);
      houses.push([hx, H(hx, hz) - 0.2, hz, hs, R.range(0, 6.283), R.range(0.8, 1.15), R.range(0.85, 1.2)]);
      App._shadows.push([hx, H(hx, hz), hz, hs * 0.45, 0.8, hs]);
    }
    if (houses.length) instanceSolid(scene, htpl, houses, hmat);
  }
  var rows = R.int(6, 10);
  var start = R.range(240, 360);
  var spread = R.range(0.9, 1.25);           /* how wide across the view the city runs */
  var groundAt = function (x, z) { return Math.max(H(x, z), P.waterY != null ? P.waterY + 0.5 : -1e9); };
  for (var band = 0; band < rows; band++) {
    var dist = start + band * R.range(42, 78);
    var n = R.int(9, 18);
    for (var i = 0; i < n; i++) {
      guard++;
      var a = R.range(-spread, spread);
      var rr = dist * R.range(0.9, 1.12);
      var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
      /* the middle bands carry the towers; the edges and the front stay low */
      var mid = 1.0 - Math.abs(band / (rows - 1) - 0.55) * 1.6;
      var tall = R.f() < (0.08 + mid * 0.42);
      var hgt = tall ? R.range(90, 260) * (0.6 + mid * 0.5) : R.range(24, 70);
      var wid = R.range(16, 46), dep = R.range(16, 46);
      items.push([x, groundAt(x, z) - 1.5, z, wid, R.range(0, 6.283), hgt / wid, dep / wid, R.f()]);
      App._shadows.push([x, groundAt(x, z), z, wid * 0.55, 0.9, hgt]);
    }
  }
  cityMesh(scene, P, R, U, items);
}

/* the instanced block mesh, shared by the distant skyline and the view down
   from a tower */
function cityMesh(scene, P, R, U, items) {
  var box = new THREE.BoxGeometry(1, 1, 1);
  box.translate(0, 0.5, 0);
  if (!items.length) return;

  var geo = new THREE.InstancedBufferGeometry();
  geo.index = box.index;
  geo.setAttribute('position', box.attributes.position);
  geo.setAttribute('normal', box.attributes.normal);
  var iPos = new Float32Array(items.length * 3);
  var iAttr = new Float32Array(items.length * 4);
  var iSeed = new Float32Array(items.length);
  for (var k = 0; k < items.length; k++) {
    iPos[k * 3] = items[k][0]; iPos[k * 3 + 1] = items[k][1]; iPos[k * 3 + 2] = items[k][2];
    iAttr[k * 4] = items[k][3]; iAttr[k * 4 + 1] = items[k][4];
    iAttr[k * 4 + 2] = items[k][5]; iAttr[k * 4 + 3] = items[k][6];
    iSeed[k] = items[k][7];
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.setAttribute('iSeed', new THREE.InstancedBufferAttribute(iSeed, 1));
  geo.instanceCount = items.length;

  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
      uNight: App.skyU.uNight,
      uWall: { value: new THREE.Color(R.pick(['#6d6560', '#5c5a58', '#7a6f63', '#585f66', '#6b6156'])) },
      uLit: { value: new THREE.Color(R.pick(['#ffd9a0', '#ffe6bd', '#ffcf8a'])) }
    },
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr; attribute float iSeed;',
      'uniform float uFogDensity;',
      'varying vec3 vN; varying vec3 vL; varying float vFog; varying float vSeed; varying vec3 vSize;',
      GLSL_COMMON,
      'void main(){',
      '  float w = iAttr.x, rot = iAttr.y;',
      '  vec3 sz = vec3(w, w * iAttr.z, w * iAttr.w);',
      '  vec3 lp = position * sz;',
      '  float c = cos(rot), s2 = sin(rot);',
      '  vec3 wp = iPos + vec3(lp.x * c - lp.z * s2, lp.y, lp.x * s2 + lp.z * c);',
      '  vN = normalize(vec3(normal.x * c - normal.z * s2, normal.y, normal.x * s2 + normal.z * c));',
      '  vL = position;',
      '  vSize = sz;',
      '  vSeed = iSeed;',
      '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
      '  vFog = fogAmt(-mv.z, uFogDensity);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform vec3 uSunDir, uSunCol, uAmbCol, uFogCol, uWall, uLit;',
      'uniform float uNight, uTime, uShadow;',
      'varying vec3 vN; varying vec3 vL; varying float vFog; varying float vSeed; varying vec3 vSize;',
      'float h21(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }',
      'void main(){',
      '  vec3 c = uWall * (0.55 + 0.45 * abs(vN.x) + 0.25 * max(vN.y, 0.0));',
      '  float diff = max(dot(vN, normalize(uSunDir)), 0.0);',
      '  c *= (uAmbCol * 1.15 + uSunCol * diff * 0.95);',
      /* pick the two axes that run across whichever face we are on */
      '  vec2 face = abs(vN.y) > 0.5 ? vL.xz : (abs(vN.x) > 0.5 ? vL.zy : vL.xy);',
      '  vec2 span = abs(vN.y) > 0.5 ? vSize.xz : (abs(vN.x) > 0.5 ? vSize.zy : vSize.xy);',
      '  if (abs(vN.y) < 0.5) {',
      '    vec2 cell = floor(vec2(face.x * span.x / 3.4, face.y * span.y / 3.6));',
      '    vec2 f = fract(vec2(face.x * span.x / 3.4, face.y * span.y / 3.6));',
      '    float pane = step(0.16, f.x) * step(f.x, 0.84) * step(0.22, f.y) * step(f.y, 0.80);',
      '    float r = h21(cell + vSeed * 37.0);',
      /* a few windows change over the course of an hour */
      '    float flicker = step(0.5, fract(r * 91.0 + floor(uTime / 47.0 + r * 13.0) * 0.5));',
      '    float lit = step(1.0 - mix(0.06, 0.42, uNight), r) * mix(1.0, flicker, 0.35);',
      '    c = mix(c * (0.82 + 0.5 * h21(cell + 5.0)), uLit * 1.5, pane * lit * (0.25 + 0.75 * uNight));',
      '    c *= mix(1.0, 0.55, pane * (1.0 - lit) * (1.0 - uNight) * 0.8);',
      '  }',
      '  gl_FragColor = vec4(mix(c, uFogCol, vFog), 1.0);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  scene.add(m);
  App.propMeshes.push(m);
}


/* ---------- baked shadows ----------
   Marched across the heightfield toward the sun once per world (and again when
   the sun has moved enough to matter), then each tree's crown is dropped along
   the sun onto the same map. Nothing per frame but a texture read. */
var SHADOW = { x0: -300, x1: 300, z0: -600, z1: 30 };
function bakeShadows(P, H, sunDir) {
  var N = Q().grid >= 180 ? 448 : 320;
  var sx = (SHADOW.x1 - SHADOW.x0) / N, sz = (SHADOW.z1 - SHADOW.z0) / N;
  var hg = new Float32Array(N * N), i, j, k;
  for (j = 0; j < N; j++) for (i = 0; i < N; i++)
    hg[j * N + i] = H(SHADOW.x0 + (i + 0.5) * sx, SHADOW.z0 + (j + 0.5) * sz);
  var lit = new Float32Array(N * N);
  var dx = sunDir.x, dy = sunDir.y, dz = sunDir.z;
  if (dy < 0.04) { for (k = 0; k < N * N; k++) lit[k] = 1; }
  else {
    var step = 3.2, steps = 70;
    for (j = 0; j < N; j++) {
      for (i = 0; i < N; i++) {
        var px = i + 0.5, pz = j + 0.5, ray = hg[j * N + i] + 0.35, open = 1;
        for (k = 0; k < steps; k++) {
          px += dx * step / sx; pz += dz * step / sz; ray += dy * step;
          var ii = px | 0, jj = pz | 0;
          if (ii < 0 || jj < 0 || ii >= N || jj >= N) break;
          if (hg[jj * N + ii] > ray) { open = 0; break; }
        }
        lit[j * N + i] = open;
      }
    }
  }
  /* crowns: an ellipse dropped along the light, a thin trunk line back to the base */
  var casters = App._shadows || [];
  var hx = dx, hz = dz, hl = Math.sqrt(hx * hx + hz * hz) || 1;
  hx /= hl; hz /= hl;
  var tanE = Math.max(dy, 0.12) / hl;

function rockTemplate(R, kind) {

      'attribute vec3 iAttr;',

      'varying float vA; varying vec2 vUv; varying vec3 vTint;',

      '  wp.x += sin(uTime * 0.5 + iAttr.y) * life * uScale * 0.30;',

/* ---------- a lighthouse beacon, turning ---------- */

  var quad = new THREE.PlaneGeometry(1, 1);
  var mat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uCamPos: U.uCamPos, uNight: App.skyU.uNight,

/* A bridge across the gorge, in one of four styles, with cars crossing it.
   The deck is instanced once; the traffic is a stream of small boxes whose
   position along the deck is a function of time, so it costs nothing. */
function bridgeGeo(P, R, H) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  var span = P.gorgeW * 2.6 + 40, deckW = R.range(9, 15), th = R.range(0.8, 1.6);
  var i;
  /* The road carries well past the span, so the traffic leaves the view
     instead of driving into the bank. */
  var roadHalf = span * 0.5 + 130;
  /* The deck level came from the gorge depth alone and was never compared
     with the land, so it often sat below the rim: the ends of the span were
     buried and the cars went into the dirt. Lift it clear of every piece of
     ground the road crosses. */
  var rim = -1e9;
  for (i = -24; i <= 24; i++) rim = Math.max(rim, H(i / 24 * roadHalf, P.bridgeZ));
  P.bridgeDeck = rim + th * 0.5 + 0.6;
  var kind = P.bridgeKind, drop = P.bridgeDeck - P.waterY;
  /* the roadway */
  pushBox(B, 0, 0, 0, span * 0.5, th * 0.5, deckW * 0.5, 0);
  /* the approach either side, on fill that reaches below the ground so that
     it meets the land instead of floating over it */
  var segs = 22;
  for (i = 0; i < segs; i++) {
    var e0 = span * 0.5 + (roadHalf - span * 0.5) * (i / segs);
    var e1 = span * 0.5 + (roadHalf - span * 0.5) * ((i + 1) / segs);
    for (var sd = -1; sd <= 1; sd += 2) {
      var gy = Math.min(H(sd * e0, P.bridgeZ), H(sd * e1, P.bridgeZ)) - 4.0 - P.bridgeDeck;
      pushBox(B, sd * (e0 + e1) * 0.5, (th * 0.5 + gy) * 0.5, 0,
              (e1 - e0) * 0.5 + 0.1, (th * 0.5 - gy) * 0.5, deckW * 0.44, 0);
    }
  }
  /* parapets, the length of the road */
  pushBox(B, 0, th * 0.5 + 0.5, deckW * 0.5 - 0.3, roadHalf, 0.5, 0.22, 0);
  pushBox(B, 0, th * 0.5 + 0.5, -deckW * 0.5 + 0.3, roadHalf, 0.5, 0.22, 0);
  if (kind === 'suspension') {
    var towH = drop * R.range(0.42, 0.72), tx = span * R.range(0.20, 0.30);
    for (i = -1; i <= 1; i += 2) {
      for (var sgn = -1; sgn <= 1; sgn += 2) pushBox(B, i * tx, towH * 0.5, sgn * (deckW * 0.5 - 0.8), 1.1, towH * 0.5, 1.1, 0);
      pushBox(B, i * tx, towH - 1.2, 0, 1.4, 0.7, deckW * 0.5, 0);
    }
    /* main cable as a chain of short segments following a catenary */
    for (var sgn2 = -1; sgn2 <= 1; sgn2 += 2) {
      var zc = sgn2 * (deckW * 0.5 - 0.8);
      for (i = 0; i < 40; i++) {
        var t0 = i / 40 * 2 - 1, t1 = (i + 1) / 40 * 2 - 1;
        var cy0 = towH * (Math.cosh(t0 * 1.9) / Math.cosh(1.9)) * 0.92 + 1.2;
        var cy1 = towH * (Math.cosh(t1 * 1.9) / Math.cosh(1.9)) * 0.92 + 1.2;
        var mx = (t0 + t1) * 0.5 * span * 0.5, my = (cy0 + cy1) * 0.5;
        var len = Math.sqrt(Math.pow((t1 - t0) * span * 0.5, 2) + Math.pow(cy1 - cy0, 2)) * 0.5;
        pushBox(B, mx, my, zc, len, 0.18, 0.18, 0);
        if (i % 3 === 0 && Math.abs(t0) < 0.98) pushBox(B, mx, (my + th) * 0.5, zc, 0.09, (my - th) * 0.5, 0.09, 0);
      }
    }
  } else if (kind === 'arch') {
    for (var sgn3 = -1; sgn3 <= 1; sgn3 += 2) {
      var za = sgn3 * (deckW * 0.5 - 1.0);
      for (i = 0; i < 30; i++) {
        var a0 = i / 30, a1 = (i + 1) / 30;
        var ay0 = -drop * 0.72 * (1 - Math.pow(a0 * 2 - 1, 2) * 1.0) - 0.5;

        if (i % 4 === 0) pushBox(B, ax, ay * 0.5, za, 0.30, Math.abs(ay) * 0.5, 0.30, 0);
      }
    }

    /* Round arches carried on piers. The voussoirs were axis-aligned boxes set
       around a curve that bent downward, so the ring read as a row of flat
       plates hanging in the air under the deck. Put the curve the right way up
       and lay each stone along its own radius. */
    var arches = R.int(3, 6), aw = span / arches;
    var rr = Math.min(aw * 0.40, drop * 0.42), ringT = Math.max(0.5, aw * 0.05);
    var spring = -1.0 - rr, VN = 15, k, q;
    for (i = 0; i < arches; i++) {
      var px = -span * 0.5 + aw * (i + 0.5);
      for (k = 0; k <= VN; k++) {
        var ang = Math.PI * (k / VN);
        pushBox(B, px - Math.cos(ang) * rr, spring + Math.sin(ang) * rr, 0,
                Math.PI * rr / VN * 0.62, ringT * 0.5, deckW * 0.5, 0, Math.PI * 0.5 - ang);
      }
      /* the spandrel: wall over the haunch of the arch, up to the roadway */
      for (q = 0; q < 14; q++) {
        var sx = (q / 14 - 0.5 + 1 / 28) * aw;
        var ay = Math.abs(sx) < rr ? spring + Math.sqrt(rr * rr - sx * sx) : spring;
        if (ay < -0.25) pushBox(B, px + sx, (ay - 0.25) * 0.5, 0, aw / 28 + 0.05, (-0.25 - ay) * 0.5, deckW * 0.5, 0);
      }
      if (i > 0) pushBox(B, px - aw * 0.5, (spring - drop) * 0.5, 0, aw * 0.12, (spring + drop) * 0.5, deckW * 0.48, 0);
    }
    pushBox(B, -span * 0.5, (spring - drop) * 0.5, 0, aw * 0.16, (spring + drop) * 0.5, deckW * 0.48, 0);
    pushBox(B, span * 0.5, (spring - drop) * 0.5, 0, aw * 0.16, (spring + drop) * 0.5, deckW * 0.48, 0);
  } else { /* girder: a plate truss each side of the deck, piers to the floor */
    var gTop = -0.85, gBot = -2.75, gH = (gTop - gBot) * 0.5, gMid = (gTop + gBot) * 0.5;
    var bay = span * 0.96 / 24;
    for (var gs = -1; gs <= 1; gs += 2) {
      var gz = gs * deckW * 0.40;
      pushBox(B, 0, gTop, gz, span * 0.5, 0.24, 0.30, 0);       /* top chord */
      pushBox(B, 0, gBot, gz, span * 0.5, 0.24, 0.30, 0);       /* bottom chord */
      /* the web: an upright at every bay with a diagonal between each pair.
         These were boxes turned about y, which laid flat plates out sideways
         under the deck instead of bracing anything. */
      for (i = 0; i <= 24; i++) {
        var dx = (i / 24 - 0.5) * span * 0.96;
        pushBox(B, dx, gMid, gz, 0.16, gH, 0.22, 0);
        if (i < 24) {
          var lean = Math.atan2(bay, gH * 2) * (i % 2 ? 1 : -1);
          pushBox(B, dx + bay * 0.5, gMid, gz, 0.14, Math.sqrt(bay * bay + gH * gH * 4) * 0.5, 0.18, 0, lean);
        }
      }
    }
    var piers = R.int(2, 4);
    for (i = 0; i < piers; i++) {
      var qx = (i / (piers - 1) - 0.5) * span * 0.72;
      pushBox(B, qx, -drop * 0.5 - 2.75, 0, 1.5, drop * 0.5, deckW * 0.34, 0);
    }
  }
  P.bridgeSpan = span; P.bridgeW = deckW; P.bridgeTh = th; P.bridgeRoad = roadHalf * 2;
  return finishGeo(B);
}
function buildBridge(scene, P, R, U, H) {
  var col = { suspension: '#9aa2a6', arch: '#8e9498', girder: '#6f5a4a', stone: '#a3968a' }[P.bridgeKind];
  var mat = solidMat(U, col, { rib: 0, grain: 0, spines: 0, body2: '#6d6a66' });
  var geo = bridgeGeo(P, R, H);
  instanceSolid(scene, geo, [[0, P.bridgeDeck, P.bridgeZ, 1, 0, 1, 1]], mat);
  App._shadows.push([0, P.bridgeDeck, P.bridgeZ, P.bridgeSpan * 0.22, 0.75, 2]);
  buildTraffic(scene, P, R, U, {
    y: P.bridgeDeck + P.bridgeTh * 0.5, z: P.bridgeZ, len: P.bridgeRoad,
    lanes: [-P.bridgeW * 0.22, P.bridgeW * 0.22], axis: 'x', rate: P.trafficRate
  });
}

/* Vehicles: a stream travelling along a line. Each one's position comes from
   its own offset plus time, so they space out, pass each other, and never stop. */
function buildTraffic(scene, P, R, U, o) {
  var perLane = Math.max(3, Math.round(o.rate * 7));
  var lanes = o.lanes.length, N = perLane * lanes;
  var box = new THREE.BoxGeometry(1, 1, 1);
  var geo = new THREE.InstancedBufferGeometry();

  geo.setAttribute('normal', box.attributes.normal);

  var carCols = ['#c8ccd0', '#2f3438', '#8d2f2a', '#2c4a72', '#c9a23a', '#3e6b46', '#d8d2c4', '#6a6d70'];

  for (var L = 0; L < lanes; L++) {
    for (var i = 0; i < perLane; i++) {
      var truck = R.f() < 0.22;
      iAttr[m * 4] = truck ? R.range(7, 12) : R.range(3.6, 5.2);     /* length */
      iAttr[m * 4 + 1] = truck ? R.range(2.4, 3.1) : R.range(1.3, 1.6); /* height */
      iAttr[m * 4 + 2] = truck ? R.range(2.4, 2.7) : R.range(1.7, 2.0); /* width */
      iAttr[m * 4 + 3] = (i + R.range(-0.35, 0.35)) / perLane;         /* start along the line */
      var c = new THREE.Color(truck ? R.pick(['#d8d2c4', '#8d8f92', '#2f3438']) : R.pick(carCols));
      iCol[m * 3] = c.r; iCol[m * 3 + 1] = c.g; iCol[m * 3 + 2] = c.b;
      iLane[m * 4] = o.lanes[L];
      iLane[m * 4 + 1] = L % 2 === 0 ? 1 : -1;                          /* which way it goes */
      iLane[m * 4 + 2] = R.range(0.82, 1.18);                           /* its own speed */
      iLane[m * 4 + 3] = truck ? 1 : 0;

    uniforms: {
      uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uCamPos: U.uCamPos,
      uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
      uNight: App.skyU.uNight,

    },

      'attribute vec4 iAttr; attribute vec3 iCol; attribute vec4 iLane;',
      'uniform float uTime, uFogDensity, uLen, uSpeed, uShadow, uAlongX, uNight;',
      'uniform vec3 uOrigin, uCamPos, uSunDir, uSunCol, uAmbCol, uFogCol;',
      'varying vec3 vCol; varying float vFog; varying vec3 vHaze; varying float vLamp;',
      GLSL_COMMON,

/* The view down from a tower: blocks on a street grid, some above the window
   and some below, with traffic in the streets far beneath. */
function buildBlocks(scene, P, R, U, H) {
  var bw = P.blockW, sw = P.streetW, pitch = bw + sw, ga = P.gridAngle;
  var ca = Math.cos(ga), sa = Math.sin(ga);
  var items = [], reach = 12;
  for (var gx = -reach; gx <= reach; gx++) {
    for (var gz = -reach; gz <= 2; gz++) {
      var lx = gx * pitch, lz = gz * pitch;
      var x = lx * ca - lz * sa, z = lx * sa + lz * ca;
      var d = Math.sqrt(x * x + z * z);
      if (d < pitch * 0.75 || d > 1500) continue;
      /* the tower you are in occupies the middle of the near block */
      var hgt = Math.pow(R.f(), 2.0) * P.towerMax + R.range(8, 26);
      if (R.f() < 0.05) hgt = P.towerMax * R.range(1.0, 1.5);
      var w2 = bw * R.range(0.30, 0.48), d2 = bw * R.range(0.30, 0.48);
      items.push([x, -P.storey, z, w2 * 2, ga + R.range(-0.04, 0.04), hgt / (w2 * 2), d2 / w2, R.f()]);
      if (R.f() < 0.5) {
        var ox = x + R.range(-bw * 0.4, bw * 0.4), oz = z + R.range(-bw * 0.4, bw * 0.4);
        var h2 = hgt * R.range(0.4, 0.85), w3 = bw * R.range(0.18, 0.30);
        items.push([ox, -P.storey, oz, w3 * 2, ga + R.range(-0.1, 0.1), h2 / (w3 * 2), R.range(0.7, 1.3), R.f()]);
      }
      App._shadows.push([x, -P.storey, z, w2, 0.9, hgt]);
    }
  }
  cityMesh(scene, P, R, U, items);
  buildRoofs(scene, P, R, U, items);
  /* traffic in the two streets nearest the window */
  for (var lane = -1; lane <= 1; lane += 2) {
    var off = lane * pitch * 0.5;
    buildTraffic(scene, P, R, U, {
      x: off * ca, y: -P.storey + 0.4, z: -pitch * 1.5 + off * sa, len: pitch * 16,
      lanes: [-sw * 0.18, sw * 0.18], axis: 'z', rate: P.trafficRate

  }
}

/* Round bales, wrapped or bare, sitting where the baler dropped them. */
function baleGeo(R, upright) {
  /* A round bale is about as wide as it is tall — roughly a cube's worth of
     hay rolled up. It was two and a half times too long, which is why it read
     as a pipe. The winding runs around the drum, so the stripe coordinate is
     the position along the axis, not the way round it. */
  var B = { pos: [], nor: [], idx: [], rib: [] };
  var seg = 20, hl = R.range(0.46, 0.58), r = 0.5;
  var ax = function (t) { return upright ? [0, 0.5 + t * 2 * hl - hl, 0] : [t * 2 * hl - hl, 0.5, 0]; };
  /* both frames turn the same way about their own axis, or one of the two
     orientations builds its drum inside out */
  var rad = function (a) { return upright ? [Math.cos(a) * r, 0, Math.sin(a) * r] : [0, Math.cos(a) * r, -Math.sin(a) * r]; };
  var i, k;
  /* the drum */
  for (i = 0; i <= seg; i++) {
    var a = (i / seg) * 6.2832;
    var rv = rad(a);
    for (k = 0; k < 2; k++) {
      var c = ax(k);
      B.pos.push(c[0] + rv[0], c[1] + rv[1], c[2] + rv[2]);
      B.nor.push(rv[0] / r, upright ? 0 : rv[1] / r, rv[2] / r);
      B.rib.push(k);                       /* along the axis: rings around the drum */
    }
  }
  for (i = 0; i < seg; i++) { var o = i * 2; B.idx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2); }
  /* the two flat faces, where the hay shows as a spiral */
  for (var e = 0; e <= 1; e++) {
    var c0 = B.pos.length / 3, cc = ax(e);
    var n = upright ? [0, e ? 1 : -1, 0] : [e ? 1 : -1, 0, 0];
    B.pos.push(cc[0], cc[1], cc[2]); B.nor.push(n[0], n[1], n[2]); B.rib.push(0);
    for (i = 0; i <= seg; i++) {
      var a2 = (i / seg) * 6.2832, rv2 = rad(a2);
      B.pos.push(cc[0] + rv2[0], cc[1] + rv2[1], cc[2] + rv2[2]);
      B.nor.push(n[0], n[1], n[2]);
      B.rib.push(1);                        /* the face reads as one band */
    }
    for (i = 0; i < seg; i++) {
      if (e) B.idx.push(c0, c0 + 2 + i, c0 + 1 + i);
      else B.idx.push(c0, c0 + 1 + i, c0 + 2 + i);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(B.pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(B.nor, 3));
  geo.setAttribute('rib', new THREE.Float32BufferAttribute(B.rib, 1));
  geo.setIndex(B.idx);
  return geo;
}

function buildBales(scene, P, R, U, H, spec) {
  var wrapped = R.f() < 0.35;
  var upright = R.f() < 0.25;
  var col = wrapped ? R.pick(['#e8e6e0', '#d9e2d6', '#2e2e30']) : R.pick(['#c9ae62', '#d6bd77', '#bda055']);
  /* eight to fourteen turns of net around the drum, and a straw grain */
  var mat = solidMat(U, col, { rib: wrapped ? 0.5 : 1, ribN: R.range(8, 14), grain: wrapped ? 0 : 1, spines: 0,
                               barkN: 34, barkPlate: 2.5, body2: col });
  var tpl = baleGeo(R, upright);
  /* the baler works in lines, so bales fall roughly along them */
  var lineA = R.range(0, 3.14), lineGap = R.range(24, 44);
  var items = [], guard = 0;
  while (items.length < spec.count && guard < spec.count * 60) {
    guard++;
    var a = R.range(-1.15, 1.15), rr = spec.r[0] + Math.pow(R.f(), 1.2) * (spec.r[1] - spec.r[0]);
    var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
    var perp = x * Math.cos(lineA) + z * Math.sin(lineA);
    var snap = Math.round(perp / lineGap) * lineGap + R.gauss() * 2.2;
    x += (snap - perp) * Math.cos(lineA); z += (snap - perp) * Math.sin(lineA);
    if (!plantable(P, H, x, z)) continue;
    var sz = R.range(spec.size[0], spec.size[1]);
    items.push([x, H(x, z), z, sz, lineA + R.range(-0.25, 0.25), 1, 1]);
    App._shadows.push([x, H(x, z), z, sz * 0.55, 0.85, sz]);
  }
  if (items.length) instanceSolid(scene, tpl, items, mat);
}

/* The water, laid on the same profile the rock was cut from, so it runs down
   the mountainside rather than hanging in front of it. One continuous ribbon:
   it free-falls down the pitches and spreads over the benches. */
function buildCascadeFall(scene, P, R, U, H) {
  var segs = P.fallSegs, notch = P.fallNotch, fx = P.fallX;
  var STEPS = 90;
  var pts = [];
  /* walk the profile from the top of the fall down to the pool */
  var total = 0;
  for (var i = segs.length - 1; i >= 0; i--) {
    var g = segs[i];
    for (var k = 0; k < STEPS / segs.length; k++) {
      var t = k / (STEPS / segs.length);
      var e = g.drop ? (1 - t) * (1 - t) * (3 - 2 * (1 - t)) : (1 - t);
      var z = g.z1 + (g.z0 - g.z1) * t;
      var y = g.y0 + (g.y1 - g.y0) * e;
      /* a pitch narrows as it falls and the water gathers speed; a bench spreads */
      var w = notch * (g.drop ? (0.42 + 0.30 * t) : (0.55 + 0.42 * t));
      pts.push({ z: z, y: y, w: w, drop: g.drop });
    }
  }
  pts.push({ z: P.poolZ + 6, y: P.waterY + 0.15, w: notch * 1.05, drop: 0 });
  for (var q = 1; q < pts.length; q++)
    total += Math.hypot(pts[q].z - pts[q - 1].z, pts[q].y - pts[q - 1].y);

  var pos = [], uv = [], idx = [], run = 0;
  for (var m = 0; m < pts.length; m++) {
    var pt = pts[m];
    if (m > 0) run += Math.hypot(pt.z - pts[m - 1].z, pt.y - pts[m - 1].y);
    if (m > 0 && pt.z <= pts[m - 1].z) pt.z = pts[m - 1].z + 0.2;   /* always run toward the window */
    /* sit just clear of the rock: out of the gully floor and toward the viewer */
    var lift = pt.drop ? 0.9 : 0.35;
    var out = pt.drop ? 1.5 : 0.5;
    /* each edge rides the rock beneath it, so the sheet leans with the gully
       and never cuts into its walls */
    var zz2 = pt.z + out;
    var yL = Math.min(Math.max(pt.y, H(fx - pt.w, zz2) + lift * 0.5), H(fx - pt.w, zz2) + lift + 1.6);
    var yR = Math.min(Math.max(pt.y, H(fx + pt.w, zz2) + lift * 0.5), H(fx + pt.w, zz2) + lift + 1.6);
    pos.push(fx - pt.w, yL, zz2);
    pos.push(fx + pt.w, yR, zz2);
    var v = run / Math.max(total, 1);
    uv.push(0, v, 1, v);
    if (m < pts.length - 1) {
      var o = m * 2;
      idx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
      uLen: { value: total }
    },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: [
      'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
      'uniform float uFogDensity; uniform vec3 uSunDir, uSunCol, uAmbCol, uFogCol;',
      GLSL_COMMON,
      'void main(){ vUv = uv;',
      '  vTint = uAmbCol * 1.6 + uSunCol * 1.0;',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      '  vec4 mv = viewMatrix * wp;',
      '  vFog = fogAmt(-mv.z, uFogDensity);',
      '  vHaze = hazeToward(uFogCol, normalize(wp.xyz - cameraPosition), uSunDir, uSunCol);',
      '  gl_Position = projectionMatrix * mv; }'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform float uTime, uLen; varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
      'float h1(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.545); }',
      'void main(){',
      /* strands run the length of the ribbon, accelerating as they descend */
      '  float lane = floor(vUv.x * 30.0);',
      '  float speed = 0.5 + h1(vec2(lane, 1.0)) * 0.4;',
      '  float fall = vUv.y * uLen * 0.09 - uTime * speed;',
      '  float strand = fract(fall + h1(vec2(lane, 7.0)) * 9.0);',
      '  float bright = smoothstep(0.1, 0.85, strand);',
      /* the ribbon is fullest in the middle and feathers at its edges */
      '  float body = 1.0 - smoothstep(0.30, 0.5, abs(vUv.x - 0.5));',
      /* white water builds toward the foot */
      '  float froth = smoothstep(0.55, 0.05, vUv.y);',
      '  float a = body * (0.50 + 0.50 * bright) * (0.72 + 0.28 * froth);',
      '  vec3 c = mix(vec3(0.70, 0.79, 0.84), vec3(1.0), bright * 0.75 + froth * 0.45);',
      '  gl_FragColor = vec4(tone(mix(c * vTint * 0.5, vHaze, vFog * 0.7)), a * 0.88 * (1.0 - vFog * 0.6));',
      '}'
    ].join('\n')
  });
  var mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 4;
  scene.add(mesh);
  App.propMeshes.push(mesh);

  /* spray at the foot of every pitch, not just the bottom */
  for (var si = 0; si < segs.length; si++) {
    if (!segs[si].drop) continue;
    var g2 = segs[si];
    buildSmoke(scene, P, R, U, fx, g2.y0 + 1.0, g2.z0 + 3, notch * (0.9 + si * 0.25) * P.mistPower);
  }
}

/* Bands of colour laid through the canyon walls. */
function strataUniforms(P) {
  return {
    uStrata: { value: P.strata || 0 },
    uStrataTop: { value: 14 },
    uStrataBot: { value: -(P.canyonDepth || 60) }
  };
}

/* ---------- field boundaries ----------
   Hedges, walls, fences and shelter belts running across the land. These are
   what turn an expanse into fields, and they fill the middle distance, which
   is otherwise nearly empty. Each is one instanced mesh along a seeded line. */
var BOUNDARY_KINDS = {
  hedge:    { biomes: ['meadow', 'farmland', 'hayfield', 'orchard', 'blossom', 'flowerfield', 'lavender', 'river', 'lakefront', 'autumn'], w: 5 },
  wall:     { biomes: ['moor', 'alpine', 'terraces', 'tundra', 'meadow', 'hayfield', 'cliffcoast', 'fjord'], w: 4 },
  fence:    { biomes: ['meadow', 'hayfield', 'farmland', 'savanna', 'oasis', 'river', 'moor', 'canyon'], w: 4 },
  shelter:  { biomes: ['farmland', 'hayfield', 'orchard', 'blossom', 'meadow', 'lavender'], w: 3 }
};
function boundaryPost(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  pushBox(B, 0, 0.55, 0, 0.055, 0.55, 0.055, 0);
  return finishGeo(B);
}
function boundaryRail(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  pushBox(B, 0, 0.72, 0, 1.0, 0.045, 0.03, 0);
  pushBox(B, 0, 0.44, 0, 1.0, 0.045, 0.03, 0);
  return finishGeo(B);
}
function boundaryStone(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  /* a course of rough stones, narrowing toward the top */
  for (var c = 0; c < 4; c++) {
    var y = 0.13 + c * 0.24, half = 0.30 - c * 0.045;
    var n = 3;
    for (var i = 0; i < n; i++) {
      var t = (i + 0.5) / n - 0.5;
      pushBox(B, t * 1.7 + R.range(-0.06, 0.06), y, R.range(-0.03, 0.03),
              0.9 / n * R.range(0.8, 1.05), 0.12, half, R.range(-0.12, 0.12));
    }
  }
  pushBox(B, 0, 1.06, 0, 0.9, 0.06, 0.18, 0);            /* the capping course */
  return finishGeo(B);
}
function buildBoundaries(scene, P, R, U, H) {
  if (P.waterY != null && P.biome.terrain === 'cascade') return;
  var opts = [];
  for (var k in BOUNDARY_KINDS) if (BOUNDARY_KINDS[k].biomes.indexOf(P.biomeKey) >= 0) {
    for (var w = 0; w < BOUNDARY_KINDS[k].w; w++) opts.push(k);
  }
  if (!opts.length || R.f() > 0.78) return;
  var kind = R.pick(opts);
  P.boundaryKind = kind;

  /* two or three roughly parallel lines, plus one crossing them, so the land
     reads as divided into fields rather than striped */
  var mainA = R.range(-1.3, 1.3);
  var lines = [];
  var nMain = R.int(2, 4);
  for (var i = 0; i < nMain; i++) lines.push({ a: mainA + R.range(-0.14, 0.14), d: R.range(35, 300) * (R.f() < 0.5 ? -1 : 1) });
  if (R.f() < 0.7) for (var j = 0; j < R.int(1, 2); j++)
    lines.push({ a: mainA + Math.PI / 2 + R.range(-0.22, 0.22), d: R.range(30, 240) * (R.f() < 0.5 ? -1 : 1) });

  var posts = [], rails = [], stones = [], bushes = [], trees = [];
  for (var L = 0; L < lines.length; L++) {
    var ln = lines[L], ca = Math.cos(ln.a), sa = Math.sin(ln.a);
    /* the line's own origin, offset sideways from the window */
    var ox = -sa * ln.d, oz = ca * ln.d;
    var step = kind === 'fence' ? 2.6 : (kind === 'wall' ? 1.7 : (kind === 'shelter' ? 7.5 : 2.1));
    var half = R.range(120, 340);
    var gapAt = R.range(0, 1), gapW = R.range(0.03, 0.09);   /* a gate or a gap */
    for (var t = -half; t <= half; t += step) {
      var x = ox + ca * t, z = oz + sa * t;
      if (z > -6) continue;
      var d = Math.sqrt(x * x + z * z);
      if (d < 12 || d > 420) continue;
      var u = (t + half) / (2 * half);
      if (Math.abs(u - gapAt) < gapW) continue;
      if (P.waterY != null && H(x, z) < P.waterY + 0.3) continue;
      if (P.pathKind && onPathAt(P, x, z) > 0.4) continue;
      var y = H(x, z);
      var jx = x + R.gauss() * 0.12, jz = z + R.gauss() * 0.12;
      if (kind === 'fence') {
        posts.push([jx, y, jz, R.range(0.85, 1.1), ln.a, 1, 1]);
        rails.push([x + ca * step * 0.5, H(x + ca * step * 0.5, z + sa * step * 0.5), z + sa * step * 0.5,
                    step * 0.52, ln.a, 1, 1]);
      } else if (kind === 'wall') {
        stones.push([jx, y - 0.05, jz, R.range(0.92, 1.12), ln.a + R.range(-0.05, 0.05), R.range(0.9, 1.1), 1]);
      } else if (kind === 'shelter') {
        trees.push([jx, jz, R.range(6, 13)]);
      } else {
        bushes.push([jx, jz, R.range(1.5, 2.9)]);
      }
      if (d < 240 && (kind === 'wall' || kind === 'hedge' || kind === 'shelter'))
        App._shadows.push([x, y, z, kind === 'shelter' ? 2.6 : 1.0, 0.7, kind === 'shelter' ? 8 : 1.6]);
    }
  }
  var woodCols = ['#6b5842', '#7a6549', '#5e4d3a'];
  if (posts.length) {
    var wm = solidMat(U, R.pick(woodCols), { rib: 0, grain: 1, spines: 0, barkN: 24, barkPlate: 8 });
    instanceSolid(scene, boundaryPost(R), posts, wm);
    if (rails.length) instanceSolid(scene, boundaryRail(R), rails, wm);
  }
  if (stones.length) instanceSolid(scene, boundaryStone(R), stones,
    solidMat(U, R.pick(['#8b8578', '#7d7a70', '#948d7e', '#6f6a60']), { rib: 0, grain: 2, spines: 0, body2: '#9a9488', lichen: '#9aa15a' }));
  if (bushes.length) boundaryBillboards(scene, P, R, U, H, bushes, 'hedge');
  if (trees.length) boundaryBillboards(scene, P, R, U, H, trees, P.seasonKey === 'winter' ? 'broadleaf' : (R.f() < 0.5 ? 'pine' : 'broadleaf'));
}
function boundaryBillboards(scene, P, R, U, H, items, kind) {
  var quad = new THREE.PlaneGeometry(1, 1);
  quad.translate(0, 0.5, 0);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var iPos = new Float32Array(items.length * 3), iAttr = new Float32Array(items.length * 2);
  for (var i = 0; i < items.length; i++) {
    iPos[i * 3] = items[i][0];
    iPos[i * 3 + 1] = H(items[i][0], items[i][1]) - items[i][2] * 0.06;
    iPos[i * 3 + 2] = items[i][1];
    iAttr[i * 2] = items[i][2];
    iAttr[i * 2 + 1] = R.range(0, 6.283);
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 2));
  geo.instanceCount = items.length;
  var mat = propBillboardMat(U, makePropTexture(kind, P, R, { far: true }), kind === 'hedge' ? 0.02 : 0.03);
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  scene.add(m);
  App.propMeshes.push(m);
}

/* a plain lit billboard, for things that only need to stand there and sway */
function propBillboardMat(U, map, sway) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uWind: U.uWind, uGust: U.uGust, uWindDir: U.uWindDir,
      uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol, uFogCol: U.uFogCol,
      uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow,
      uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
      uSnow: U.uSnow, uCamPos: U.uCamPos,
      uMap: { value: map }, uSway: { value: sway }
    },
    alphaTest: 0.25, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec2 iAttr;',
      'uniform float uTime, uWind, uGust, uFogDensity, uShadow, uSnow, uSway;',
      'uniform vec2 uWindDir; uniform vec3 uCamPos, uSunDir, uSunCol, uAmbCol, uFogCol;',
      'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
      GLSL_COMMON,
      'void main(){',
      '  float size = iAttr.x;',
      '  vec3 toCam = normalize(vec3(uCamPos.x - iPos.x, 0.0, uCamPos.z - iPos.z));',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 lp = right * position.x * size * 0.85 + vec3(0.0, position.y * size, 0.0);',
      '  float sway = sin(uTime * 0.8 + iAttr.y) * 0.5 + sin(uTime * 0.33 + iAttr.y * 1.6) * 0.5;',
      '  lp.xz += uWindDir * sway * uWind * (0.3 + 0.7 * uGust) * size * uSway * position.y * position.y;',
      '  vec3 wp = iPos + lp;',
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.30, 1.0, baked(wp.xz));',
      '  float back = pow(max(dot(-toCam, normalize(uSunDir)), 0.0), 3.0) * 0.35;',
      '  vTint = (uAmbCol * 0.9 + uSunCol * (0.6 + back) * sh) * (1.0 - uSnow * 0.25);',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
      '  vFog = fogAmtH(-mv.z, uFogDensity, wp.y);',
      '  vHaze = hazeToward(uFogCol, normalize(wp - cameraPosition), uSunDir, uSunCol);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap;',
      'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
      'void main(){',
      '  vec4 t = texture2D(uMap, vUv);',
      '  if (t.a < 0.25) discard;',
      '  gl_FragColor = vec4(mix(t.rgb * vTint, vHaze, vFog), smoothstep(0.3, 0.7, t.a));',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
}

/* ---------- grazing herds ----------
   Animals in the middle distance, drifting slowly and pausing to graze. The
   whole path is a function of time in the vertex shader, so a hundred sheep
   cost one draw call and nothing per frame. */
var HERDS = {
  sheep:  { biomes: ['moor', 'meadow', 'hayfield', 'alpine', 'terraces', 'tundra'], n: [8, 34], size: [0.75, 1.0], col: '#ddd8cc', dark: '#3a352e', graze: 0.75, speed: 0.05 },
  cattle: { biomes: ['meadow', 'farmland', 'hayfield', 'river', 'lakefront'], n: [5, 16], size: [1.5, 1.9], col: '#8a6b4a', dark: '#2e2822', graze: 0.7, speed: 0.04 },
  goat:   { biomes: ['canyon', 'alpine', 'terraces', 'moor', 'oasis'], n: [4, 12], size: [0.7, 0.95], col: '#a8967c', dark: '#4a4036', graze: 0.6, speed: 0.07 },
  deer:   { biomes: ['autumn', 'orchard', 'blossom', 'cascade', 'river', 'meadow'], n: [3, 8], size: [1.2, 1.5], col: '#9c7852', dark: '#4a3826', graze: 0.55, speed: 0.08 },
  camel:  { biomes: ['oasis', 'desert', 'saltflat'], n: [3, 9], size: [1.9, 2.3], col: '#bda078', dark: '#6b5940', graze: 0.5, speed: 0.045 }
};
function makeHerdTexture(kind, H) {
  var S = 96, c = cnv(S, S), g = c.getContext('2d');
  var body = H.col, dark = H.dark;
  g.fillStyle = body;
  if (kind === 'sheep') {
    g.beginPath(); g.ellipse(S * 0.50, S * 0.50, S * 0.27, S * 0.20, 0, 0, 6.283); g.fill();
    g.fillStyle = dark;
    g.beginPath(); g.ellipse(S * 0.76, S * 0.44, S * 0.085, S * 0.075, 0, 0, 6.283); g.fill();
    g.fillRect(S * 0.34, S * 0.66, S * 0.055, S * 0.20);
    g.fillRect(S * 0.60, S * 0.66, S * 0.055, S * 0.20);
  } else if (kind === 'cattle') {

    g.beginPath(); g.ellipse(S * 0.48, S * 0.50, S * 0.24, S * 0.15, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(S * 0.75, S * 0.42, S * 0.085, S * 0.07, 0, 0, 6.283); g.fill();
    g.strokeStyle = dark; g.lineWidth = S * 0.03; g.lineCap = 'round';
    g.beginPath(); g.moveTo(S * 0.79, S * 0.36); g.lineTo(S * 0.86, S * 0.24); g.stroke();

    g.beginPath(); g.ellipse(S * 0.46, S * 0.48, S * 0.26, S * 0.14, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(S * 0.40, S * 0.36, S * 0.11, S * 0.10, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(S * 0.58, S * 0.37, S * 0.09, S * 0.085, 0, 0, 6.283); g.fill();

    g.beginPath(); g.ellipse(S * 0.85, S * 0.19, S * 0.065, S * 0.05, 0.4, 0, 6.283); g.fill();
