    w: w, h: h, qw: qw, qh: qh,
    sw: sw, sh: sh,
    scene: (function () { var t = new THREE.WebGLMultisampleRenderTarget(sw, sh, full); t.samples = 4; return t; })(),
    bright: new THREE.WebGLRenderTarget(qw, qh, quarter),
    blurA: new THREE.WebGLRenderTarget(qw, qh, quarter),
    blurB: new THREE.WebGLRenderTarget(qw, qh, quarter),
    cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1),
    sceneQ: new THREE.Scene()
  };
  var VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  P.matBright = new THREE.ShaderMaterial({
    uniforms: { tex: { value: null }, uStep: { value: new THREE.Vector2(1 / (3 * qw), 1 / (3 * qh)) } }, depthTest: false, depthWrite: false,
    vertexShader: VS,
    fragmentShader: [
      'uniform sampler2D tex; uniform vec2 uStep; varying vec2 vUv;',
      /* nine taps across the whole footprint of this small pixel, so a bright
         speck in the big image cannot drop in and out of the glow */
      'void main(){',
      '  vec3 c = vec3(0.0);',
      '  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++)',
      '    c += texture2D(tex, vUv + vec2(float(x), float(y)) * uStep).rgb;',
      '  c /= 9.0;',
      '  float l = dot(c, vec3(0.3, 0.59, 0.11));',
      '  gl_FragColor = vec4(c * smoothstep(0.86, 1.0, l), 1.0); }'
    ].join('\n')
  });
  P.matBlur = new THREE.ShaderMaterial({
    uniforms: { tex: { value: null }, dir: { value: new THREE.Vector2(1, 0) } }, depthTest: false, depthWrite: false,
    vertexShader: VS,
    fragmentShader: [
      'uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;',
      'void main(){',
      '  vec3 c = texture2D(tex, vUv).rgb * 0.227;',
      '  c += (texture2D(tex, vUv + dir * 1.385).rgb + texture2D(tex, vUv - dir * 1.385).rgb) * 0.316;',
      '  c += (texture2D(tex, vUv + dir * 3.231).rgb + texture2D(tex, vUv - dir * 3.231).rgb) * 0.070;',
      '  gl_FragColor = vec4(c, 1.0); }'
    ].join('\n')
  });
  P.matComp = new THREE.ShaderMaterial({
    uniforms: { tex: { value: null }, bloom: { value: null }, uTime: { value: 0 },
                uRes: { value: new THREE.Vector2(w, h) }, uBloom: { value: 0.22 },
                uTexel: { value: new THREE.Vector2(1 / sw, 1 / sh) } },
    depthTest: false, depthWrite: false,
    vertexShader: VS,
    fragmentShader: [
      'uniform sampler2D tex, bloom; uniform float uTime, uBloom; uniform vec2 uRes, uTexel; varying vec2 vUv;',
      'void main(){',
      '  vec2 o = uTexel * 0.36;',
      '  vec3 c = (texture2D(tex, vUv + vec2(-o.x, -o.y)).rgb + texture2D(tex, vUv + vec2(o.x, -o.y)).rgb',
      '          + texture2D(tex, vUv + vec2(-o.x, o.y)).rgb + texture2D(tex, vUv + vec2(o.x, o.y)).rgb) * 0.25;',

      '  c += texture2D(bloom, vUv).rgb * uBloom;',
      '  float l = dot(c, vec3(0.3, 0.59, 0.11));',
      '  float g = fract(sin(dot(floor(vUv * uRes) + fract(uTime) * 61.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;',
      '  c += g * 0.026 * (1.0 - l * 0.7);',
      /* a little contrast, cool shadows, warm highlights */
      '  c = mix(c, c * c * (3.0 - 2.0 * c), 0.16);',
      '  c += vec3(-0.012, 0.0, 0.022) * (1.0 - l) + vec3(0.02, 0.008, -0.012) * l;',
      /* temporal accumulation: the last frame is folded in, more when the view
         is moving. Detail that flickered frame to frame settles; a pan gets a
         touch of motion blur, which is what an eye sees too. */
      '  gl_FragColor = vec4(c, 1.0); }'
    ].join('\n')
  });

    uniforms: { tex: { value: null } }, depthTest: false, depthWrite: false,
    vertexShader: VS,
    fragmentShader: 'uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(tex, vUv).rgb, 1.0); }'
  });

  P.quad.frustumCulled = false;
  P.sceneQ.add(P.quad);
  App.post = P;
}
function disposePost() {
  var P = App.post;
  if (!P) return;
  P.scene.dispose(); P.bright.dispose(); P.blurA.dispose(); P.blurB.dispose();
  P.matBright.dispose(); P.matBlur.dispose(); P.matComp.dispose(); P.matBlit.dispose(); P.quad.geometry.dispose();
  App.post = null;
}
function renderFrame() {
  var r = App.renderer, P = App.post;
  if (!P) { r.setRenderTarget(null); r.render(App.scene, App.camera); return; }

  r.setRenderTarget(P.scene); r.render(App.scene, App.camera);
  P.quad.material = P.matBright; P.matBright.uniforms.tex.value = P.scene.texture;
  r.setRenderTarget(P.bright); r.render(P.sceneQ, P.cam);
  P.quad.material = P.matBlur;
  P.matBlur.uniforms.tex.value = P.bright.texture; P.matBlur.uniforms.dir.value.set(1 / P.qw, 0);
  r.setRenderTarget(P.blurA); r.render(P.sceneQ, P.cam);
  P.matBlur.uniforms.tex.value = P.blurA.texture; P.matBlur.uniforms.dir.value.set(0, 1 / P.qh);
  r.setRenderTarget(P.blurB); r.render(P.sceneQ, P.cam);
  P.quad.material = P.matComp;
  P.matComp.uniforms.tex.value = P.scene.texture; P.matComp.uniforms.bloom.value = P.blurB.texture;
  P.matComp.uniforms.uTime.value = App.t || 0;
  r.setRenderTarget(null); r.render(P.sceneQ, P.cam);

/* ============================================================
   8. layout / framing
   ============================================================ */
var resizeTimer = null;
function layout() {
  if (!App.P || !App.camera || !App.renderer) return;
  var w = window.innerWidth, h = window.innerHeight;
  var P = App.P, cam = App.camera, r = App.renderer;
  cam.aspect = w / h;
  var changed = sizeWindow(P, cam.aspect);
  App.camDist = P.win.dist;

  cam.position.set(0, P.win.cy, App.camDist);
  cam.lookAt(0, P.win.cy - PITCH * (20 + App.camDist), -20);
  cam.updateProjectionMatrix();
  r.setPixelRatio(qualityRatio());
  r.setSize(w, h, false);
  setupPost();
  FX.resize();

  /* the opening changes shape with the screen, so the joinery is rebuilt --
     debounced, since this regenerates geometry and textures */
  if (changed && App.room) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuildRoom, 220);
  }
}
function rebuildRoom() {
  if (!App.room || !App.P || switching) return;
  App.scene.remove(App.room);
  disposeDeep(App.room);
  App.room = null;
  buildRoom(App.scene, App.P, App.U);
  updateWeather(App.t);
}
function qualityRatio() {
  var dpr = window.devicePixelRatio || 1;
  var step = [1, 0.86, 0.72, 0.60][Math.min(App.quality, 3)];
  return Math.max(0.55, Math.min(dpr, Q().pixel) * step);
}

/* ============================================================
   9. weather over time
   ============================================================ */
var _c1 = new THREE.Color(), _c2 = new THREE.Color(), _cw = new THREE.Color();
function mixHex(out, a, b, t) {
  _c1.set(a); _c2.set(b);
  out.copy(_c1).lerp(_c2, t);
  return out;
}
function desat(c, amount) {
  var l = c.r * 0.30 + c.g * 0.59 + c.b * 0.11;
  c.r = lerp(c.r, l, amount); c.g = lerp(c.g, l, amount); c.b = lerp(c.b, l, amount);
  return c;
}

function updateWeather(t) {
  var P = App.P, U = App.U, W = P.weather;
  var A = TIMES[P.timeA], B = TIMES[P.timeB];
  var k;

  /* the light breathes slowly between two hours of the day */
  k = 0.5 - 0.5 * Math.cos((t / P.driftPeriod) * 6.283 + P.driftPhase);
  k *= P.driftAmount;
  var elev = lerp(A.elev, B.elev, k) * Math.PI / 180;

  /* weather intensity also wanders, so nothing loops */
  var mood = 0.5 + 0.5 * Math.sin(t * 0.0121 + 1.3) * 0.6 + 0.5 * Math.sin(t * 0.0043 - 0.7) * 0.4;
  mood = clamp(mood, 0, 1);

  var az = P.sunAz;

  /* a live clock overrides the seeded hour with the viewer's own */
  if (App.liveClock) {
    var now = new Date();
    var hr = now.getHours() + now.getMinutes() / 60;
    elev = (62 * Math.sin((hr - 6) / 12 * Math.PI)) * Math.PI / 180;
    var deg = elev * 180 / Math.PI;
    var rising = hr < 12;
    var key = deg < -8 ? 'night' : (deg < 4 ? (rising ? 'dawn' : 'dusk')
      : (deg < 16 ? (rising ? 'dawn' : 'golden')
      : (deg < 38 ? (rising ? 'morning' : 'afternoon') : 'midday')));
    A = B = TIMES[key];
    k = 0;
    App.liveLabel = key;
  } else App.liveLabel = null;

  var night = clamp((-elev * 180 / Math.PI - 1) / 9, 0, 1);
  var sd = U.uSunDir.value;
  if (night > 0.02) {
    /* after sunset the moon takes over as the light, from the other side */
    var mel = (12 + 34 * night) * Math.PI / 180;
    var maz = az + Math.PI;
    sd.set(Math.sin(maz) * Math.cos(mel), Math.sin(mel), -Math.cos(maz) * Math.cos(mel)).normalize();
    App.skyU.uMoonDir.value.copy(sd);
  } else {
    sd.set(Math.sin(az) * Math.cos(elev), Math.sin(elev), -Math.cos(az) * Math.cos(elev)).normalize();
    App.skyU.uMoonDir.value.set(Math.sin(az + Math.PI), 0.5, -Math.cos(az + Math.PI)).normalize();
  }
  App.skyU.uNight.value = night;

  var lightMul = W.lightMul * (1 - 0.14 * mood);
  var sunI = lerp(A.sunI, B.sunI, k) * lightMul;
  var ambI = lerp(A.ambI, B.ambI, k) * W.ambMul;

  mixHex(U.uSunCol.value, A.sun, B.sun, k).multiplyScalar(sunI * 0.95);
  desat(U.uSunCol.value, W.desat * 0.7);
  mixHex(U.uAmbCol.value, A.amb, B.amb, k).multiplyScalar(ambI);
  desat(U.uAmbCol.value, W.desat * 0.5);

  /* haze thickens and thins */
  U.uFogDensity.value = W.fogD * P.hazeMul * (0.72 + 0.55 * mood);
  /* the glow in the haze toward the sun needs a sun to glow from */
  U.uHazeK.value = clamp(lightMul * 1.15, 0, 1) * (0.3 + 0.7 * (1 - W.cover));
  /* a rainbow needs rain in the air, a low sun, and the sun behind the window */
  /* the bow is a circle of 42 degrees around the point opposite the sun, so it
     shows only when the sun is behind the window and low enough to lift that
     point's arc above the horizon */
  var elevSin = Math.sin(elev);
  var wet = Math.max(W.rain, App.wetness || 0);
  var behind = U.uSunDir.value.z;
  var bow = wet * smoothstep(0.03, 0.18, elevSin) * (1 - smoothstep(0.50, 0.78, elevSin))
          * clamp(lightMul * 1.5, 0, 1) * smoothstep(0.05, 0.45, behind) * (1 - night);
  App.wetness = W.rain > 0.1 ? 1 : Math.max(0, (App.wetness || 0) - 0.0006);
  App.bowTarget = clamp(bow * 1.5, 0, 1);
  App.skyU.uBow.value += (App.bowTarget - App.skyU.uBow.value) * 0.02;
  /* snow under fog is a whiteout with nothing to look at; keep the world in reach */
  if (U.uSnow.value > 0.35) U.uFogDensity.value = Math.min(U.uFogDensity.value, 0.0048);
  /* the skyline must always be there to look at */
  if (P.biomeKey === 'urban') U.uFogDensity.value = Math.min(U.uFogDensity.value, 0.0026);
  U.uShadow.value = W.shadow * (0.7 + 0.6 * (1 - mood)) * (1 - night * 0.85);

  var S = App.skyU;
  mixHex(S.uZenith.value, A.zen, B.zen, k);
  desat(S.uZenith.value, W.desat);
  S.uZenith.value.multiplyScalar(lerp(0.72, 1.0, lightMul));
  mixHex(S.uHorizon.value, A.hor, B.hor, k);
  desat(S.uHorizon.value, W.desat * 0.85);
  S.uHorizon.value.multiplyScalar(lerp(0.80, 1.0, lightMul));
  /* the landscape's own air tints the horizon a little: dust warm, sea cool */
  var hz = P.biome.haze;
  S.uHorizon.value.r *= lerp(1, hz[0], 0.6); S.uHorizon.value.g *= lerp(1, hz[1], 0.6); S.uHorizon.value.b *= lerp(1, hz[2], 0.6);
  /* the far ground fades to the sky it meets: one colour, so there is no seam */
  U.uFogCol.value.copy(S.uHorizon.value);
  mixHex(S.uCloudL.value, A.cl, B.cl, k).multiplyScalar(lerp(0.62, 1.0, lightMul));
  mixHex(S.uCloudD.value, A.cd, B.cd, k).multiplyScalar(lerp(0.55, 1.0, lightMul));
  S.uSunCol.value.copy(U.uSunCol.value).multiplyScalar(1.5);
  S.uSunVis.value = clamp(lightMul * 1.15, 0, 1) * smoothstep(-0.02, 0.06, Math.sin(elev));
  S.uCover.value = clamp(W.cover + (mood - 0.5) * 0.14, 0.0, 0.95);

  /* snow gathers on the ground, and eases off if it stops */
  if (W.snow > 0) {
    var target = clamp(0.35 + W.snow * 0.55, 0, 0.92);
    U.uSnow.value += (target - U.uSnow.value) * 0.0009;
  } else if (P.baseSnow) {
    U.uSnow.value += (P.baseSnow - U.uSnow.value) * 0.002;
  }

  /* a strike whitens the sky and throws hard light across everything */
  var fl = App.flash || 0;
  if (fl > 0.002) {
    U.uAmbCol.value.multiplyScalar(1 + fl * 3.4);
    U.uSunCol.value.multiplyScalar(1 + fl * 0.6);
    U.uFogCol.value.lerp(new THREE.Color(0.86, 0.90, 1.0), fl * 0.55);
    S.uZenith.value.lerp(new THREE.Color(0.80, 0.86, 1.0), fl * 0.8);
    S.uHorizon.value.lerp(new THREE.Color(0.92, 0.94, 1.0), fl * 0.8);
    S.uCloudL.value.lerp(new THREE.Color(1.0, 1.0, 1.0), fl * 0.7);
    S.uCloudD.value.lerp(new THREE.Color(0.75, 0.78, 0.86), fl * 0.7);
  }

  /* room lights follow the sun */
  App.sun.position.copy(sd).multiplyScalar(60);
  App.sun.target.position.set(0, P.win.cy, 0);
  App.sun.color.copy(U.uSunCol.value);
  App.sun.intensity = 0.9;
  App.fill.color.copy(U.uAmbCol.value);
  App.fill.intensity = 1.25;
  App.amb.color.copy(U.uFogCol.value);
  App.amb.intensity = 0.40;

    var send = ctx.createGain(); send.gain.value = o.wet == null ? 0.5 : o.wet;
    tail.connect(send); send.connect(this.wet);
    try { src.start(t, Math.random() * 10); } catch (e) { src.start(t); }
    src.stop(t + o.dur + 0.1);
    setTimeout(function () { try { g.disconnect(); send.disconnect(); tail.disconnect(); } catch (e) {} }, (o.dur + (o.delay || 0) + 0.5) * 1000);
  },
  /* ---- what a place does when nothing else is happening ---- */
  scheduleEvents: function () {
    var self = this;
    clearTimeout(this.eventTimer);
    var P = this.P, B = P.biomeKey, W = P.weather;
    var gap = 1800 + Math.random() * 6000;
    this.eventTimer = setTimeout(function () {
      if (self.on && self.ctx && !document.hidden) {
        var r = Math.random();
        var side = Math.random() < 0.5 ? -1 : 1;
        if (W.rain > 0.2 && r < 0.9) {
          /* drips off the frame, in a little run */
          var n = 2 + Math.floor(Math.random() * 4);
          for (var i = 0; i < n; i++) self.burst({ src: 'white', freq: 3200 + Math.random() * 2600, Q: 6, gain: 0.05 + W.rain * 0.05, dur: 0.045, delay: i * (0.12 + Math.random() * 0.25), at: [side * 0.6, 0.4, -0.3], ref: 1, wet: 0.1 });
        } else if ((B === 'coast' || B === 'cliffcoast') && r < 0.7) {
          /* a wave landing on rock */
          self.burst({ src: 'brown', type: 'lowpass', freq: 900, sweep: 140, Q: 0.7, gain: 0.30, dur: 1.6, attack: 0.05, at: [side * 26, 0, -34], ref: 12, wet: 0.6 });
          self.burst({ src: 'white', freq: 2800, sweep: 900, Q: 0.6, gain: 0.08, dur: 1.2, delay: 0.15, at: [side * 26, 0, -34], ref: 12, wet: 0.5 });
        } else if ((B === 'marsh' || B === 'lakefront' || B === 'river' || B === 'oasis' || B === 'bridge') && r < 0.75) {
          /* a lap, or something small going into the water */
          self.burst({ src: 'pink', type: 'lowpass', freq: 700, sweep: 300, Q: 2, gain: 0.10, dur: 0.22, at: [side * 9, -0.5, -12], ref: 5, wet: 0.5 });
        } else if ((B === 'urban' || B === 'penthouse') && r < 0.8) {
          /* a car passing left to right, or a door somewhere */
          if (Math.random() < 0.7) {
            var carX = -60 * side;
            var g0 = self.burst({ src: 'pink', freq: 380, sweep: 900, Q: 0.6, gain: 0.07, dur: 2.4, attack: 0.9, at: [carX, 0, -160], ref: 60, wet: 0.5 });
            self.burst({ src: 'pink', freq: 900, sweep: 360, Q: 0.6, gain: 0.07, dur: 2.4, attack: 0.9, delay: 2.2, at: [-carX, 0, -160], ref: 60, wet: 0.5 });
          } else self.burst({ src: 'brown', type: 'lowpass', freq: 260, Q: 1.5, gain: 0.14, dur: 0.25, at: [side * 40, 4, -90], ref: 30, wet: 0.7 });
        } else if ((B === 'tundra' || W.snow > 0) && r < 0.5) {
          self.burst({ src: 'white', freq: 5200, Q: 8, gain: 0.03, dur: 0.02, at: [side * 6, 0, -8], ref: 3, wet: 0.2 });
        } else if (/autumn|orchard|blossom|meadow|farmland|lakefront|alpine/.test(B) && r < 0.55) {
          /* a twig, or a stir of leaves */
          if (Math.random() < 0.4) self.burst({ src: 'brown', freq: 1400, Q: 3, gain: 0.08, dur: 0.05, at: [side * 12, 0, -16], ref: 5, wet: 0.35 });
          else self.burst({ src: 'white', freq: 2600, sweep: 1900, Q: 0.8, gain: 0.05, dur: 0.6, attack: 0.15, at: [side * 14, 3, -20], ref: 7, wet: 0.45 });
        } else if ((B === 'desert' || B === 'saltflat') && r < 0.4) {
          self.burst({ src: 'white', freq: 1800, sweep: 900, Q: 0.8, gain: 0.04, dur: 1.4, attack: 0.5, at: [side * 20, 0.5, -14], ref: 8, wet: 0.3 });
        }
      }
      self.scheduleEvents();
    }, gap);
  },
  /* ---- the visitors are heard while they are in view ---- */
  visitorSound: function (t) {
    var vi = App.visitorInfo;
    if (!vi || !this.on || !this.ctx) return;
    var cyc = (t / vi.period + vi.phase) % 1;
    var visible = cyc < vi.cross;
    if (visible && !this.visitorOn) {
      this.visitorOn = true;
      var self = this, side = vi.side;
      if (vi.kind === 'boat') {
        var putt = function () {
          if (!self.visitorOn) return;
          self.burst({ src: 'brown', type: 'lowpass', freq: 180, Q: 1.2, gain: 0.09, dur: 0.09, at: [side * 40, 0, -90], ref: 35, wet: 0.6 });
          self.visitorTimer = setTimeout(putt, 240 + Math.random() * 40);
        };
        putt();
      } else if (vi.kind === 'balloon') {
        var burner = function () {
          if (!self.visitorOn) return;
          self.burst({ src: 'brown', freq: 320, sweep: 900, Q: 0.5, gain: 0.10, dur: 1.4, attack: 0.08, at: [side * 30, 60, -200], ref: 80, wet: 0.7 });
          self.burst({ src: 'white', freq: 2400, Q: 0.5, gain: 0.03, dur: 1.2, at: [side * 30, 60, -200], ref: 80, wet: 0.6 });
          self.visitorTimer = setTimeout(burner, 6000 + Math.random() * 9000);
        };
        burner();
      } else if (vi.kind === 'geese') {
        var honk = function () {
          if (!self.visitorOn) return;
          var n = 2 + Math.floor(Math.random() * 3);
          for (var i = 0; i < n; i++) self.burst({ src: 'pink', freq: 520 + Math.random() * 180, sweep: 360, Q: 4, gain: 0.07, dur: 0.16, delay: i * 0.22, attack: 0.02, at: [side * 40, 60, -180], ref: 70, wet: 0.7 });
          self.visitorTimer = setTimeout(honk, 2500 + Math.random() * 5000);
        };
        honk();
      }
    } else if (!visible && this.visitorOn) {
      this.visitorOn = false;
      clearTimeout(this.visitorTimer);
    }
  },

  /* ---- crickets: a narrow tone pulsed at ~26 Hz, in short chirps ---- */
  startCrickets: function () {
    var ctx = this.ctx;
    var src = ctx.createBufferSource();
    src.buffer = this.buf; src.loop = true;
    src.playbackRate.value = 1.0 + Math.random() * 0.05;
    var flt = ctx.createBiquadFilter();
    flt.type = 'bandpass'; flt.frequency.value = 4300 + Math.random() * 500; flt.Q.value = 14;
    var pulse = ctx.createGain(); pulse.gain.value = 0.0;
    var lfo = ctx.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 24 + Math.random() * 6;
    var lg = ctx.createGain(); lg.gain.value = 0.5;
    var chirp = ctx.createGain(); chirp.gain.value = 0.0;
    var gn = ctx.createGain(); gn.gain.value = 0.045;
    var pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    lfo.connect(lg); lg.connect(pulse.gain);
    src.connect(flt); flt.connect(pulse); pulse.connect(chirp); chirp.connect(gn);
    var tail = gn;
    if (pan) { pan.pan.value = Math.random() * 1.2 - 0.6; gn.connect(pan); tail = pan; }
    tail.connect(this.dry);
    var send = ctx.createGain(); send.gain.value = 0.5;
    tail.connect(send); send.connect(this.wet);
    try { src.start(0, Math.random() * 15); } catch (e) { src.start(); }
    lfo.start();
    this.layers.push({ src: src, gain: gn, filter: flt, lfo: lfo, send: send });
    var self = this;
    var gate = function () {
      if (!self.ctx || self.layers.indexOf(entry) < 0) return;
      var t = self.ctx.currentTime;
      chirp.gain.setTargetAtTime(1.0, t, 0.02);
      chirp.gain.setTargetAtTime(0.0, t + 0.22 + Math.random() * 0.25, 0.04);
      self.cricketTimer = setTimeout(gate, 420 + Math.random() * 700);
    };
    var entry = this.layers[this.layers.length - 1];
    clearTimeout(this.cricketTimer);
    gate();
  },

  /* ---- frogs: a low croak, a few in a row, from somewhere off to one side ---- */
  scheduleFrogs: function () {
    var self = this;
    clearTimeout(this.frogTimer);
    this.frogTimer = setTimeout(function () {
      if (self.on && self.ctx && !document.hidden) {
        var ctx = self.ctx, t0 = ctx.currentTime + 0.05;
        var n = 2 + Math.floor(Math.random() * 4), f0 = 150 + Math.random() * 110;
        var pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
        var out = ctx.createGain(); out.gain.value = 0.10 + Math.random() * 0.06;
        var node = out;
        if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; out.connect(pan); node = pan; }
        node.connect(self.dry);
        var send = ctx.createGain(); send.gain.value = 0.7; node.connect(send); send.connect(self.wet);
        for (var i = 0; i < n; i++) {
          var st = t0 + i * (0.19 + Math.random() * 0.08);
          var o = ctx.createOscillator(); o.type = 'sawtooth';
          o.frequency.setValueAtTime(f0, st);
          o.frequency.exponentialRampToValueAtTime(f0 * 0.78, st + 0.14);
          var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 2;
          var am = ctx.createOscillator(); am.frequency.value = 24;
          var amg = ctx.createGain(); amg.gain.value = 0.5;
          var g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, st);
          g.gain.exponentialRampToValueAtTime(0.5, st + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, st + 0.16);
          am.connect(amg); amg.connect(g.gain); am.start(st); am.stop(st + 0.2);
          o.connect(lp); lp.connect(g); g.connect(out);
          o.start(st); o.stop(st + 0.2);
        }
        setTimeout(function () { try { out.disconnect(); send.disconnect(); } catch (e) {} }, 2500);
      }
      self.scheduleFrogs();
    }, 2500 + Math.random() * 6000);
  },

  /* ---- thunder: a rolling low rumble; near strikes crack first ---- */
  rumble: function (delay, near) {
    if (!this.on || !this.ctx) return;
    var ctx = this.ctx, t = ctx.currentTime + (delay || 0);
    near = near || 0;
    var src = ctx.createBufferSource(); src.buffer = this.buf;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 110 + near * 700; lp.Q.value = 0.8;
    var g = ctx.createGain();
    var dur = 3 + Math.random() * 4 + near * 2;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32 + near * 0.55, t + (near > 0.4 ? 0.06 : 0.6 + Math.random() * 0.8));
    g.gain.exponentialRampToValueAtTime(0.12 + near * 0.15, t + 1.2 + near);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(lp); lp.connect(g); g.connect(this.dry);
    var send = ctx.createGain(); send.gain.value = 0.9; g.connect(send); send.connect(this.wet);
    try { src.start(t, Math.random() * 15); } catch (e) { src.start(t); }
    src.stop(t + dur + 0.5);
    setTimeout(function () { try { g.disconnect(); send.disconnect(); } catch (e) {} }, (delay + dur + 1) * 1000);
  },
  thunderIn: function (delay, near) {
    if (this.ctx && this.ctx.state === 'suspended') return;
    this.rumble(delay, Math.max(0, Math.min(1, near)));
  },
  scheduleThunder: function () {
    var self = this;
    clearTimeout(this.thunderTimer);
    this.thunderTimer = setTimeout(function () {
      if (!document.hidden) self.rumble(0, 0);
      self.scheduleThunder();
    }, 45000 + Math.random() * 90000);
  },

  /* ---- surf: a real swell rises quickly and falls away slowly ---- */
  scheduleSwell: function () {
    var self = this;
    clearTimeout(this.swellTimer);
    var gap = 6500 + Math.random() * 6000;
    this.swellTimer = setTimeout(function () {
      if (self.ctx && self.on && self.surfLow) {
        var t = self.ctx.currentTime, peak = 0.16 + Math.random() * 0.14;
        self.surfLow.gain.gain.cancelScheduledValues(t);
        self.surfLow.gain.gain.setTargetAtTime(peak, t, 0.9);
        self.surfLow.gain.gain.setTargetAtTime(0.03, t + 2.6, 2.2);
        /* the foam hisses a moment after the wave lands */
        self.surfHi.gain.gain.cancelScheduledValues(t);
        self.surfHi.gain.gain.setTargetAtTime(peak * 0.55, t + 0.55, 0.7);
        self.surfHi.gain.gain.setTargetAtTime(0.015, t + 3.1, 2.6);
      }
      self.scheduleSwell();
    }, gap);
  },

  /* ---- birds: partials, vibrato and a syllable rhythm, heard across a field ---- */
  call: function () {
    if (!this.on || !this.ctx || !this.voice || this.voices > 3) return;
    var ctx = this.ctx, self = this;
    var kind = this.voice, t0 = ctx.currentTime + 0.02;
    var out = ctx.createGain();
    var far = ctx.createBiquadFilter();
    far.type = 'lowpass';
    far.frequency.value = 2600 + Math.random() * 3200;   /* distance eats the top end */
    var pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    out.connect(far);
    var node = far;
    if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; far.connect(pan); node = pan; }
    var lvl = ctx.createGain(); lvl.gain.value = 0.09 + Math.random() * 0.05;
    node.connect(lvl);
    lvl.connect(this.dry);
    var send = ctx.createGain(); send.gain.value = 0.8;   /* birds live in the reverb */
    lvl.connect(send); send.connect(this.wet);

    var notes = [], i;
    if (kind === 'trill') {
      var n = 5 + Math.floor(Math.random() * 6), f0 = 2700 + Math.random() * 1400;
      for (i = 0; i < n; i++) notes.push({ t: i * 0.055, d: 0.045, f: f0 * (1 + (i % 2) * 0.12), g: 1 });
    } else if (kind === 'fluty') {
      var m = 3 + Math.floor(Math.random() * 3), fb = 1500 + Math.random() * 900;
      for (i = 0; i < m; i++) notes.push({
        t: i * (0.20 + Math.random() * 0.12), d: 0.14 + Math.random() * 0.1,
        f: fb * (0.8 + Math.random() * 0.6), slide: 0.85 + Math.random() * 0.35, g: 1
      });
    } else if (kind === 'hawk') {
      /* one long falling cry from somewhere high */
      notes.push({ t: 0, d: 0.75 + Math.random() * 0.35, f: 2300 + Math.random() * 500, slide: 0.58, g: 0.8, harsh: 1 });
    } else if (kind === 'gull') {
      var k = 2 + Math.floor(Math.random() * 2);
      for (i = 0; i < k; i++) notes.push({
        t: i * 0.42, d: 0.34, f: 1250 + Math.random() * 350, slide: 0.55, g: 0.9, harsh: 1
      });
    } else {
      var syl = [0, 0.26, 0.62, 0.92], fc = 380 + Math.random() * 120;
      for (i = 0; i < syl.length; i++) notes.push({ t: syl[i], d: 0.24, f: fc * (i === 1 ? 1.18 : 1), g: i === 1 ? 1 : 0.7 });
    }

    /* somewhere in the trees ahead: the call comes from a point, not a pan */
    if (pan) { try { pan.disconnect(); } catch (e) {} far.connect(lvl); }
    var px = (Math.random() * 2 - 1) * 34, py = 2 + Math.random() * 12, pz = -10 - Math.random() * 40;
    if (kind === 'hawk') { px *= 2.5; py = 40 + Math.random() * 50; pz = -60 - Math.random() * 120; }
    var placed = this.place(lvl, px, py, pz, 8);
    try { lvl.disconnect(this.dry); } catch (e) {}
    placed.connect(this.dry);
    var last = 0;
    for (i = 0; i < notes.length; i++) {
      var nt = notes[i], st = t0 + nt.t;
      last = Math.max(last, nt.t + nt.d);
      /* the source is harmonically rich; the resonators shape it into a voice */
      var o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(nt.f, st);
      if (nt.slide) o.frequency.exponentialRampToValueAtTime(nt.f * nt.slide, st + nt.d);
      var vib = ctx.createOscillator(); vib.frequency.value = 14 + Math.random() * 14;
      var vg = ctx.createGain(); vg.gain.value = nt.f * 0.018;
      vib.connect(vg); vg.connect(o.frequency); vib.start(st); vib.stop(st + nt.d + 0.02);
      var r1 = ctx.createBiquadFilter(); r1.type = 'bandpass'; r1.Q.value = nt.harsh ? 5 : 11;
      var r2 = ctx.createBiquadFilter(); r2.type = 'bandpass'; r2.Q.value = nt.harsh ? 4 : 9;
      r1.frequency.setValueAtTime(nt.f * (nt.harsh ? 1.6 : 2.1), st);
      r1.frequency.exponentialRampToValueAtTime(nt.f * (nt.harsh ? 1.2 : 1.7), st + nt.d);
      r2.frequency.setValueAtTime(nt.f * 3.2, st);
      r2.frequency.exponentialRampToValueAtTime(nt.f * 2.6, st + nt.d);
      /* breath: a little air in the tone */
      var ns = ctx.createBufferSource(); ns.buffer = this.bufs.white;
      var nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = nt.f * 2.4; nf.Q.value = 3;
      var ng = ctx.createGain(); ng.gain.value = nt.harsh ? 0.35 : 0.12;
      ns.connect(nf); nf.connect(ng);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(Math.max(nt.g * 0.9, 0.001), st + Math.min(0.018, nt.d * 0.25));
      g.gain.exponentialRampToValueAtTime(0.0001, st + nt.d);
      o.connect(r1); r1.connect(g); o.connect(r2); r2.connect(g); ng.connect(g); g.connect(out);
      o.start(st); o.stop(st + nt.d + 0.02);
      try { ns.start(st, Math.random() * 10); } catch (e) { ns.start(st); }
      ns.stop(st + nt.d + 0.02);
    }
    this.voices++;
    setTimeout(function () {
      self.voices--;
      try { out.disconnect(); far.disconnect(); lvl.disconnect(); send.disconnect(); if (pan) pan.disconnect(); } catch (e) {}
    }, (last + 1.2) * 1000);
  },

  scheduleChirp: function () {
    var self = this;
    clearTimeout(this.chirpTimer);
    var gap = self.voice === 'hawk' ? 20000 + Math.random() * 50000 : 4000 + Math.random() * 15000;
    this.chirpTimer = setTimeout(function () {
      if (!document.hidden) self.call();
      self.scheduleChirp();
    }, gap);
  },

  reset: function (P) {
    clearTimeout(this.chirpTimer);
    clearTimeout(this.swellTimer);
    clearTimeout(this.cricketTimer);
    clearTimeout(this.frogTimer);
    clearTimeout(this.thunderTimer);
    clearTimeout(this.eventTimer);
    clearTimeout(this.visitorTimer);
    this.visitorOn = false;
    this.P = P;
    if (!this.ctx) return;
    for (var i = 0; i < this.layers.length; i++) {
      try { this.layers[i].src.stop(); } catch (e) {}
      if (this.layers[i].lfo) { try { this.layers[i].lfo.stop(); } catch (e) {} }
      try {
        this.layers[i].src.disconnect(); this.layers[i].gain.disconnect();
        this.layers[i].send.disconnect();
      } catch (e) {}
    }
    this.layers = [];
    this.surfLow = this.surfHi = this.rustle = null;
    this.buildLayers();
    if (this.on && this.birdsong) this.scheduleChirp();
  },

  toggle: function () {
    if (!this.ready) this.build();
    if (!this.ctx) return false;
    this.on = !this.on;
    if (this.on && this.ctx.state === 'suspended') this.ctx.resume();
    if (this.on && this.birdsong) this.scheduleChirp(); else clearTimeout(this.chirpTimer);
    /* a slow fade in and out: nothing here should ever start abruptly */
    this.master.gain.setTargetAtTime(this.on ? 0.85 : 0, this.ctx.currentTime, this.on ? 1.6 : 0.9);
    return this.on;
  },

  update: function (gust, open) {
    if (!this.on || !this.windFilter) return;
    open = open || 0;
    var ctx = this.ctx, t = ctx.currentTime, w = this.P.windBase;
    /* the sound of a gust reaches you after you have watched it cross the grass */
    this.lag = this.lag == null ? gust : this.lag + (gust - this.lag) * 0.012;
    var g = this.lag;
    var bd = this.bed || { gain: 0.2, gust: 0.34, freq: 420 };
    var f = (bd.freq * (0.6 + g * 1.3 * (0.4 + w))) * (1 + open * 1.4);
    this.windFilter.frequency.setTargetAtTime(f, t, 0.7);
    this.windGain.gain.setTargetAtTime((bd.gain + g * bd.gust * w) * (1 + open * 0.8), t, 0.8);
    var rs = bd.gust / 0.32;
    if (this.res1) this.res1.gain.gain.setTargetAtTime((0.05 + g * 0.10 * w) * rs, t, 1.1);
    if (this.res2) this.res2.gain.gain.setTargetAtTime((0.02 + g * 0.07 * w) * rs, t, 1.3);
    if (this.rustle) this.rustle.gain.gain.setTargetAtTime(Math.max(0, (g - 0.35)) * 0.16 * w * (1 + open), t, 0.5);
    /* opening the sash moves you out of the room and into the weather */
    if (this.dry) this.dry.gain.setTargetAtTime(0.82 + open * 0.25, t, 0.6);
    if (this.room) this.room.frequency.setTargetAtTime(3400 + open * 14000, t, 0.5);
    this.visitorSound(App.t || 0);
    if (this.wet) this.wet.gain.setTargetAtTime(0.30 - open * 0.14, t, 0.6);
    if (this.master) this.master.gain.setTargetAtTime(0.85 + open * 0.4, t, 0.6);
  }
};

/* ============================================================
   12. loop
   ============================================================ */
function loop() {
  requestAnimationFrame(loop);
  if (document.hidden) return;
  var dt = Math.min(App.clock.getDelta(), 0.05);
  var t = App.t + dt;
  App.t = t;
  var U = App.U, P = App.P;

  /* wind: three incommensurate waves so gusts never repeat */
  var g = 0.42
    + 0.30 * Math.sin(t / P.gustPeriod)
    + 0.18 * Math.sin(t / (P.gustPeriod * 2.71) + 1.1)
    + 0.14 * Math.sin(t / (P.gustPeriod * 0.41) + 2.3);
  var lull = Math.pow(0.5 + 0.5 * Math.sin(t * 0.0093 - 0.4), 2);
  U.uGust.value = clamp(g * (0.55 + 0.75 * lull), 0.05, 1.35);
  U.uWind.value = P.windBase * (0.8 + 0.35 * lull);

  /* the wind slowly changes its mind about direction */
  var ang = P.windAngle + Math.sin(t * 0.0071) * 0.55 + t * P.windTurn * 0.02;
  U.uWindDir.value.set(Math.cos(ang), Math.sin(ang));

  U.uTime.value = t;
  U.uCamPos.value.copy(App.camera.position);

  /* lightning: rare, brief, and followed by its thunder after a distance */
  if (P.weather.lightning) {
    App.nextFlash = App.nextFlash == null ? t + 6 + Math.random() * 14 : App.nextFlash;
    if (t >= App.nextFlash) {
      App.flash = 0.7 + Math.random() * 0.5;
      App.flashAgain = t + 0.08 + Math.random() * 0.12;      /* the second strike */
      App.nextFlash = t + 18 + Math.random() * 45;
      var far = 1.0 + Math.random() * 4.5;                    /* seconds -> roughly km */
      Sound.thunderIn(far, 1.0 - far / 6.5);
    }
    if (App.flashAgain && t >= App.flashAgain) { App.flash = Math.max(App.flash || 0, 0.9); App.flashAgain = null; }
    App.flash = (App.flash || 0) * Math.exp(-dt * 11);
  } else App.flash = 0;

  /* clouds drift by integrating velocity, wrapped into the texture's tile */
  var S = App.skyU;
  var cs = 0.0018 + P.windBase * 0.0030;
  var o1 = S.uOff1.value, o2 = S.uOff2.value;
  o1.x = (o1.x + Math.cos(ang) * cs * dt) % 1;
  o1.y = (o1.y + Math.sin(ang) * cs * dt) % 1;
  o2.x = (o2.x + Math.cos(ang + 0.32) * cs * 2.1 * dt) % 1;
  o2.y = (o2.y + Math.sin(ang + 0.32) * cs * 2.1 * dt) % 1;

  updateWeather(t);
  if (!switching && App.bakedSun && App.H && App.bakedSun.angleTo(U.uSunDir.value) > 0.13) {
    applyShadowMap(bakeShadows(P, App.H, U.uSunDir.value));
  }

  /* a breath of camera movement, plus a whisper of parallax */
  var p = App.pointer;
  p.x += (p.tx - p.x) * Math.min(1, dt * 1.6);
  p.y += (p.ty - p.y) * Math.min(1, dt * 1.6);
  var cam = App.camera;
  var breathe = App.reduceMotion ? 0 : 0.85;
  cam.position.x = p.x * 0.11 + Math.sin(t * 0.079) * 0.007 * breathe;
  cam.position.y = P.win.cy + p.y * -0.05 + Math.sin(t * 0.061 + 1.2) * 0.005 * breathe;
  cam.position.z = App.camDist + Math.sin(t * 0.043) * 0.006 * breathe;
  cam.lookAt(p.x * 0.5, P.win.cy - PITCH * (20 + App.camDist) + p.y * -0.35, -20);
  App.sky.position.copy(cam.position);

  /* the sash swings, and the world gets louder through the gap */
  var wantOpen = App.sashOpen ? 1 : 0;
  App.sashAngle = App.sashAngle == null ? 0 : App.sashAngle;
  App.sashAngle += (wantOpen - App.sashAngle) * Math.min(1, dt * 1.7);
  if (App.sash) App.sash.rotation.y = -App.sashAngle * Math.min(0.62, Math.asin(Math.min(0.9, (App.camDist - 0.55) / Math.max(P.win.w, 0.5))));
  if (App.frostMat) App.frostMat.opacity += (App.frostTarget - App.frostMat.opacity) * Math.min(1, dt * 0.05);
  if (App.glassMat) App.glassMat.opacity *= (1 - App.sashAngle * 0.75);

  Sound.update(U.uGust.value, App.sashAngle);
  FX.update(dt, t);
  renderFrame();

  /* the Ingredients-Seed on the bar follows the scene's clock */
  if (App.refreshCode && (App.codeTick == null || t - App.codeTick >= 1)) { App.codeTick = t; App.refreshCode(); }
  if (App.urlOk && !switching && (App.urlTick == null || t - App.urlTick >= 15)) {
    App.urlTick = t;
    try { history.replaceState({}, '', '?code=' + encodeScene()); } catch (e) {}
  }

  /* change the view on a timer, if asked */
  App.elapsed += dt;
  if (App.autoMin > 0) {
    if (!switching && App.elapsed > App.autoMin * 60) go(randomSeed());
    var left = Math.max(0, Math.ceil(App.autoMin * 60 - App.elapsed));
    var txt = 'auto: ' + Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + (left % 60);
    if (txt !== App.autoTxt) {
      App.autoTxt = txt;
      setLabel('bAuto', txt);
    }
  }

  /* keep it smooth: shed pixels, then blades, if the machine is struggling */
  App.frameAvg = App.frameAvg * 0.94 + (dt * 1000) * 0.06;
  if (t - App.lastChange > 2.4) {
    if (App.frameAvg > 26 && App.quality < 3) { App.quality++; applyQuality(); App.lastChange = t; }
    else if (App.frameAvg < 13.5 && App.quality > 0) { App.quality--; applyQuality(); App.lastChange = t; }
  }
  /* in auto, settle on a detail tier once we have seen real frames */
  if (App.qAuto && !switching && App.qChanges < 8) {
    App.qSettle += dt;
    if (App.qSettle > 5) {
      App.qSettle = 0;
      var want = App.qTier;
      if (App.frameAvg > 30 && App.qTier > 0) want = App.qTier - 1;
      else if (App.frameAvg < 11 && App.quality === 0 && App.qTier < QUALITY.length - 1) want = App.qTier + 1;
      if (want !== App.qTier) {
        App.qTier = want;
        App.qChanges++;
        setTier(App.qTier, true);
      }
    }
  }
}

function setTier(tier, keepAuto) {
  if (switching) return;
  var seed = App.P.seed;
  App.qTier = tier;
  if (!keepAuto) { App.qAuto = false; App.qChanges = 99; }
  App.quality = 0;
  App.frameAvg = 16;
  updateHUD(App.P);
  transition(function () { buildWorld(seed); }, 320);
}

function applyQuality() {
  App.renderer.setPixelRatio(qualityRatio());
  App.renderer.setSize(window.innerWidth, window.innerHeight, false);
  setupPost();
  var mul = [1, 1, 0.72, 0.5][App.quality];
  var soft = lerp(1, 0.6, App.quality / 3);
  var trim = function (mesh, factor) {
    if (!mesh || !mesh.geometry.attributes.iPos) return;
    if (mesh.userData.full == null) mesh.userData.full = mesh.geometry.instanceCount;
    mesh.geometry.instanceCount = Math.max(1, Math.floor(mesh.userData.full * factor));
  };
  if (App.grass) App.grass.geometry.instanceCount = Math.floor(App.grassMax * mul);
  trim(App.rain, soft); trim(App.snow, soft); trim(App.leaves, soft);
  trim(App.dust, soft); trim(App.falls, soft); trim(App.birdMesh, soft);
  var lists = (App.propMeshes || []).concat(App.flowerMeshes || []);
  for (var li = 0; li < lists.length; li++) trim(lists[li], mul);
}

/* ============================================================
   13. controls
   ============================================================ */
var wakeTimer = null, hudHeld = false, setPickOpen = function () {};
function wake(hold) {
  var hud = document.getElementById('hud');
  hud.classList.add('awake');
  clearTimeout(wakeTimer);
  if (hold || hudHeld || App.pinned) return;
  wakeTimer = setTimeout(function () {
    var focused = hud.contains && document.activeElement && hud.contains(document.activeElement);
    if (hudHeld || focused) return;
    hud.classList.remove('awake');
    /* the panel is part of the bar: it goes when the bar goes */
    var panel = document.getElementById('pick');
    if (panel && !panel.hidden) setPickOpen(false, true);
  }, 2800);
}
var switching = false;
/* every world swap goes through here, so two can never overlap and strand the
   curtain or the flag */
function transition(build, delay) {
  if (switching) return false;
  switching = true;
  var curtain = document.getElementById('curtain');
  curtain.classList.remove('gone');
  setTimeout(function () {
    try { build(); renderFrame(); }
    catch (e) { switching = false; curtain.classList.add('gone'); throw e; }
    requestAnimationFrame(function () { curtain.classList.add('gone'); switching = false; });
  }, delay || 440);
  return true;
}
function go(seed) {
  if (!parseSeed(seed).valid) return false;
  return transition(function () { buildWorld(seed); });
}

function applyView() {
  var v = App.locks.view;
  App.sashOpen = v === 'open';
  App.bare = v === 'bare';
  if (App.room) App.room.visible = !App.bare;
}

function setLabel(id, text) {
  var el = document.getElementById(id);
  if (!el) return;
  var sp = el.querySelector ? el.querySelector('span') : null;
  if (sp) sp.textContent = text; else el.textContent = text;
}

function syncPicks() {
  var map = { selBiome: 'biome', selWeather: 'weather', selTime: 'time', selWindow: 'window',
              selFinish: 'finish', selSeason: 'season' };
  for (var id in map) {
    var el = document.getElementById(id);
    if (el) el.value = App.locks[map[id]] || '';
  }
  var nEl = document.getElementById('selNight');
  if (nEl) nEl.value = App.locks.night || '';
  var vEl = document.getElementById('selView');
  if (vEl) vEl.value = App.locks.view || '';
}

function updateHUD(P) {
  var windWord = P.windBase > 0.9 ? 'a hard' : (P.windBase > 0.55 ? 'a steady' : 'a light');
  var hour = App.liveClock ? (App.liveLabel ? TIMES[App.liveLabel].label + ' (your time)' : 'your local time')
    : TIMES[P.timeA].label;
  var EXTRA = '';
  if (P.biomeKey === 'bridge') EXTRA = ' &middot; a ' + { suspension: 'suspension bridge', arch: 'steel arch', girder: 'girder bridge', stone: 'stone viaduct' }[P.bridgeKind];
  if (P.biomeKey === 'penthouse') EXTRA = ' &middot; ' + Math.round(P.storey / 3.2) + ' floors up';
  if (P.biomeKey === 'cascade') EXTRA = ' &middot; ' + (P.fallDrops > 1 ? P.fallDrops + '-step cascade' : Math.round(P.fallH) + 'm drop');
  if (P.biomeKey === 'canyon') EXTRA = ' &middot; ' + Math.round(P.canyonDepth) + 'm deep' + (P.hasCanyonRiver ? ', river below' : '');
  if (P.biomeKey === 'oasis' && P.hasCamp) EXTRA = ' &middot; a camp by the water';
  var LMNAME = { lighthouse: 'a lighthouse', windmill: 'a windmill', tower: 'an old tower', barn: 'a barn',
    silo: 'a grain silo', cabin: 'a cabin', pagoda: 'a pagoda', watertank: 'a water tank', jetty: 'a jetty' };
  document.getElementById('note').innerHTML = P.biome.label + ' in ' + P.season.label + ' &middot; ' + P.weather.label +
    ' &middot; ' + hour + ' &middot; ' + windWord + ' ' + P.windName +
    EXTRA + (P.landmarkName && LMNAME[P.landmarkName] ? ' &middot; ' + LMNAME[P.landmarkName] + ' in the distance' : '');
  if (App.refreshCode) App.refreshCode();
  setLabel('bSound', Sound.on ? 'sound: on' : 'sound: off');
  setLabel('bPanes', App.clearPanes ? 'panes: off' : 'panes: on');
  setLabel('bMotion', App.mouseMotion ? 'motion: on' : 'motion: off');
  setLabel('bQual', 'detail: ' + (App.qAuto ? 'auto\u00b7' + Q().name : Q().name));
  var pinBtn = document.getElementById('bPin');
  pinBtn.classList.toggle('pinned', !!App.pinned);
  pinBtn.setAttribute('aria-pressed', App.pinned ? 'true' : 'false');
  syncPicks();

  App.autoTxt = null;
  setLabel('bAuto', App.autoMin ? 'auto: ' + App.autoMin + ':00' : 'auto: off');
  wake();
}

function bindUI() {
  var codeval = document.getElementById('codeval');
  var refreshCode = function () { if (App.P) codeval.textContent = encodeScene(); };
  App.refreshCode = refreshCode;

  var copyText = function (text, btn, iconHtml) {
    var done = function () {
      btn.innerHTML = TICK_ICON; btn.classList.add('done');
      setTimeout(function () { btn.innerHTML = iconHtml; btn.classList.remove('done'); }, 1500);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  };
  var COPY_ICON = document.getElementById('bCopy').innerHTML;
  document.getElementById('bCopy').addEventListener('click', function () { copyText(encodeScene(), this, COPY_ICON); });

  /* the paste dialog takes a full Ingredients-Seed or a bare seed */
  var paste = document.getElementById('paste'), pasteIn = document.getElementById('pasteIn'), pasteMsg = document.getElementById('pasteMsg');
  var openPaste = function () {
    paste.hidden = false; pasteMsg.textContent = '';
    pasteIn.value = '';
    if (pasteIn.focus) pasteIn.focus();
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        if (t && (isSceneCode(t) || parseSeed(t).valid)) pasteIn.value = t.trim();
      }, function () {});
    }
  };
  var closePaste = function () { paste.hidden = true; wake(); };
  var submitPaste = function () {
    var v = pasteIn.value.trim();
    var valid = isSceneCode(v) || parseSeed(v).valid;
    if (!valid) { pasteMsg.textContent = 'That is not an Ingredients-Seed or a seed. A seed is up to eight hex characters.'; return; }
    closePaste();
    /* a build may already be under way; if so, try again once it has landed */
    var attempt = function (n) {
      var ok = isSceneCode(v) ? applyScene(v) : go(v);
      if (!ok && n > 0) setTimeout(function () { attempt(n - 1); }, 600);
    };
    attempt(4);
  };
  document.getElementById('bPaste').addEventListener('click', openPaste);
  document.getElementById('pasteGo').addEventListener('click', submitPaste);
  document.getElementById('pasteNo').addEventListener('click', closePaste);
  pasteIn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitPaste();
    if (e.key === 'Escape') closePaste();
  });
  paste.addEventListener('click', function (e) { if (e.target === paste) closePaste(); });

  var newView = function (e) {
    /* plain click keeps your choices; shift-click throws them away too */
    go(seedString(randomSeed(), 0, e && e.shiftKey ? {} : App.locks));
  };
  document.getElementById('bNew').addEventListener('click', newView);
  document.getElementById('bRefresh').addEventListener('click', newView);
  var TICK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  document.getElementById('bSound').addEventListener('click', function () {
    var on = Sound.toggle();
    Prefs.set('sound', on);
    setLabel('bSound', on ? 'sound: on' : 'sound: off');
  });
  /* the choose panel: pin any ingredient, leave the rest to the seed */
  var fill = function (id, items, key) {
    var sel = document.getElementById(id);
    var html = '<option value="">any</option>';
    for (var i = 0; i < items.length; i++) {
      html += '<option value="' + items[i][0] + '">' + items[i][1] + '</option>';
    }
    sel.innerHTML = html;
    sel.addEventListener('change', function () {
      App.locks[key] = sel.value || null;
      var cur = parseSeed(App.P.seed);
      go(seedString(cur.base, cur.nonce, App.locks));
    });
    return sel;
  };
  var bl = [], wl = [], tl = [], winl = [], fl = [], sl = [], k;
  for (var si3 = 0; si3 < SEASON_ORDER.length; si3++) sl.push([SEASON_ORDER[si3], SEASONS[SEASON_ORDER[si3]].label]);
  for (k in BIOMES) bl.push([k, BIOMES[k].label]);
  bl.sort(function (a, b) { return a[1] < b[1] ? -1 : 1; });
  for (k in WEATHERS) wl.push([k, WEATHERS[k].label]);
  for (var ti = 0; ti < TIME_ORDER.length; ti++) tl.push([TIME_ORDER[ti], TIMES[TIME_ORDER[ti]].label]);
  for (var wi = 0; wi < WINDOW_TYPES.length; wi++) winl.push([WINDOW_TYPES[wi].name, WINDOW_TYPES[wi].name]);
  for (var fi = 0; fi < FINISHES.length; fi++) fl.push([FINISHES[fi].name, FINISHES[fi].name]);
  fill('selBiome', bl, 'biome');
  fill('selWeather', wl, 'weather');
  fill('selTime', tl, 'time');
  fill('selWindow', winl, 'window');
  fill('selFinish', fl, 'finish');
  fill('selSeason', sl, 'season');

  var pickBtn = document.getElementById('bPick');
  setPickOpen = function (open, quiet) {
    var panel = document.getElementById('pick');
    panel.hidden = !open;
    pickBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    pickBtn.title = open ? 'Close the choices' : 'Choose the ingredients yourself';
    if (open) { var f = document.getElementById('selBiome'); if (f && f.focus) f.focus(); }
    else if (!quiet && pickBtn.focus) pickBtn.focus();
    if (!quiet) wake();
  };
  pickBtn.addEventListener('click', function () {
    setPickOpen(document.getElementById('pick').hidden);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !document.getElementById('pick').hidden) setPickOpen(false);
  });
  document.getElementById('selNight').addEventListener('change', function () {
    App.locks.night = this.value === 'off' ? 'off' : null;
    var c1 = parseSeed(App.P.seed);
    go(seedString(c1.base, c1.nonce, App.locks));
  });
  document.getElementById('selClock').addEventListener('change', function () {
    App.liveClock = this.value === 'live';
    updateHUD(App.P);
  });
  document.getElementById('selView').addEventListener('change', function () {
    App.locks.view = this.value || null;
    applyView();
    var c2 = parseSeed(App.P.seed);
    writeSeedToUrl(seedString(c2.base, c2.nonce, App.locks));
    App.P.seed = seedString(c2.base, c2.nonce, App.locks);
    updateHUD(App.P);
  });

  document.getElementById('bClear').addEventListener('click', function () {
    for (var key in App.locks) App.locks[key] = null;
    syncPicks();
    var cur0 = parseSeed(App.P.seed);
    go(seedString(cur0.base, cur0.nonce, App.locks));
  });

  document.getElementById('bShuffle').addEventListener('click', function () {
    var sp = parseSeed(App.P.seed);
    go(seedString(sp.base, sp.nonce + 1, sp.locks));
  });

  var Q_STEPS = ['auto', 'low', 'medium', 'high', 'ultra'];
  document.getElementById('bQual').addEventListener('click', function () {
    var cur = App.qAuto ? 0 : App.qTier + 1;
    var next = (cur + 1) % Q_STEPS.length;
    if (next === 0) {
      App.qAuto = true; App.qChanges = 0; App.qSettle = 0;
      Prefs.set('qAuto', true);
      updateHUD(App.P);
    } else {
      Prefs.set('qAuto', false);
      Prefs.set('qTier', next - 1);
      setTier(next - 1, false);
    }
  });

  document.getElementById('bMotion').addEventListener('click', function () {
    App.mouseMotion = !App.mouseMotion;
    Prefs.set('motion', App.mouseMotion);
    setLabel('bMotion', App.mouseMotion ? 'motion: on' : 'motion: off');
    if (!App.mouseMotion) { App.pointer.tx = 0; App.pointer.ty = 0; }
  });

  document.getElementById('bPin').addEventListener('click', function () {
    App.pinned = !App.pinned;
    Prefs.set('pinned', App.pinned);
    this.classList.toggle('pinned', App.pinned);
    this.setAttribute('aria-pressed', App.pinned ? 'true' : 'false');
    this.title = App.pinned ? 'Let the bar fade again' : 'Keep this bar on screen';
    wake();
  });

  document.getElementById('bTools').addEventListener('click', function () {
    App.showTools = !App.showTools;
    Prefs.set('tools', App.showTools);
    document.getElementById('hud').classList.toggle('notools', !App.showTools);
    this.setAttribute('aria-expanded', App.showTools ? 'true' : 'false');
    wake();
  });

  document.getElementById('bPanes').addEventListener('click', function () {
    App.clearPanes = !App.clearPanes;
    Prefs.set('panes', App.clearPanes);
    setLabel('bPanes', App.clearPanes ? 'panes: off' : 'panes: on');
    sizeWindow(App.P, App.camera.aspect);
    rebuildRoom();
  });

  var AUTO_STEPS = [0, 5, 15, 30];
  document.getElementById('bAuto').addEventListener('click', function () {
    var i = (AUTO_STEPS.indexOf(App.autoMin) + 1) % AUTO_STEPS.length;
    App.autoMin = AUTO_STEPS[i];
    Prefs.set('autoMin', App.autoMin);
    App.elapsed = 0;
    App.autoTxt = null;
    setLabel('bAuto', App.autoMin ? 'auto: ' + App.autoMin + ':00' : 'auto: off');
    this.title = App.autoMin
      ? 'A new view every ' + App.autoMin + ' minutes'
      : 'Change the view on a timer';
  });

  var hud = document.getElementById('hud');
  hud.addEventListener('pointerenter', function () { hudHeld = true; wake(true); });
  hud.addEventListener('pointerleave', function () { hudHeld = false; wake(); });

  window.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || !document.getElementById('paste').hidden) return;
    if (e.key === 'r' || e.key === 'R') go(randomSeed());
    if (e.key === 'c' || e.key === 'C') document.getElementById('bCopy').click();
    wake();
  });
  window.addEventListener('touchstart', function () { wake(); }, { passive: true });
  window.addEventListener('pointerdown', function () { wake(); }, { passive: true });
  window.addEventListener('focusin', function (e) {
    if (document.getElementById('hud').contains(e.target)) wake(true);
  });
  wake();
}

if (window.THREE) start();
else {
  document.getElementById('fallback').style.display = 'grid';
  document.getElementById('curtain').style.display = 'none';
}
})();
</script>
