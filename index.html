  }
  return items;
}

function plantable(P, H, x, z, maxSlope) {
  if (P.waterY != null && H(x, z) < P.waterY + 0.25) return false;
  /* in an erg, only the hollows between the dunes hold anything */
  if (P.erg && duneAt(P.dune, x, z) > P.dune.hd * 0.22) return false;
  if (maxSlope && slopeAt(H, x, z) > maxSlope) return false;
  if (P.clearKind && clearAt(P, x, z + 0.6) > 0) return false;
  if (P.pathKind && onPathAt(P, x, z) > 0.55) return false;
  /* nothing grows up between the wheel ruts big enough to stop a tractor */
  if (P.pathKind && P.pathGauge > 0.01 && pathOff(P, x, z) < P.pathGauge * 0.5 + P.pathW) return false;
  return true;
}

/* the billboard material every planted prop shares */
function propMat(U, P, R, kind, swayMul, far) {
  return new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uWind: U.uWind, uGust: U.uGust, uWindDir: U.uWindDir,
        uSunCol: U.uSunCol, uAmbCol: U.uAmbCol, uFogCol: U.uFogCol, uSunDir: U.uSunDir,
        uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale, uSnow: U.uSnow,
        uCamPos: U.uCamPos, uSway: { value: swayMul }, uAspect: { value: spriteAspect(kind) },
        uCrown: { value: spriteCrown(kind) },
        uMap: { value: makePropTexture(kind, P, R, { far: !!far }) }
      },
      alphaToCoverage: true, alphaTest: 0.4,
      side: THREE.DoubleSide,
      vertexShader: [
        'attribute vec3 iPos; attribute vec3 iAttr;',
        'uniform float uTime, uWind, uGust, uFogDensity, uShadow, uSnow, uSway, uAspect;',
        'uniform vec2 uWindDir; uniform vec3 uCamPos, uSunCol, uAmbCol, uFogCol, uSunDir;',
        'varying vec2 vUv; varying float vFog; varying vec3 vHaze;',
        'varying vec2 vQ; varying float vFlip, vSh, vFade; varying vec3 vJit, vRight, vToCam, vAmb;',
        GLSL_COMMON,
        GLSL_SPRITE_V,
        'void main(){',
        '  float size = iAttr.x;',
        '  vec3 toCam = normalize(vec3(uCamPos.x - iPos.x, 0.0, uCamPos.z - iPos.z));',
        '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
        '  vec3 lp = right * position.x * size * uAspect + vec3(0.0, position.y * size, 0.0);',
        '  float sway = sin(uTime * 0.62 + iAttr.y) * 0.5 + sin(uTime * 0.27 + iAttr.y * 2.1) * 0.5;',
        '  lp.xz += uWindDir * sway * uWind * (0.35 + 0.75 * uGust) * position.y * position.y * size * uSway;',
        '  vec3 wp = iPos + lp;',
        '  vQ = uv; vFade = iAttr.z;',
        '  vUv = spriteUv(uv, iAttr.y, vFlip, vJit);',
        '  vJit *= 1.0 - uSnow * 0.25;',
        '  vRight = right; vToCam = toCam;',
        '  vec2 bk = bakedRG(wp.xz);',
        '  vSh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.03, 1.0, bk.x);',
        '  vAmb = uAmbCol * 0.95 * mix(1.0, bk.y, 0.5);',
        '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
        '  vFog = fogAmtH(-mv.z, uFogDensity, wp.y);',
        '  vHaze = hazeAt(uFogCol, normalize(wp - cameraPosition), uSunDir, uSunCol, vFog);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
      GLSL_TONE,
        'uniform sampler2D uMap; uniform vec3 uFogCol, uSunDir, uSunCol; uniform vec4 uCrown;',
        'varying vec2 vUv; varying float vFog; varying vec3 vHaze;',
        'varying vec2 vQ; varying float vFlip, vSh, vFade; varying vec3 vJit, vRight, vToCam, vAmb;',
        GLSL_COMMON,
        GLSL_SPRITE_F,
        'void main(){',
        '  vec4 t = texture2D(uMap, vUv);',
        '  if (t.a < 0.25) discard;',
        '  vec3 light = spriteLight(vQ, uCrown, vFlip, vRight, vToCam, t.a, vAmb, vSh);',
        '  gl_FragColor = vec4(mix(t.rgb * vJit * light, vHaze, vFog), smoothstep(0.3, 0.7, t.a) * vFade);',
        '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
      ].join('\n')

function buildProps(scene, P, R, U, H) {
  App.propMeshes = [];
  var lim = scatterLim(P);
  var specs = P.props.slice();
  if (P.treeline) {
    specs.push({ kind: P.treelineKind, count: R.int(26, 60), size: [9, 18],
                 r: [150, 430], line: true });
  }
  /* An oasis's palms and bushes stand round its water, P.palmCount of the
     palms, from the shore out to where the ground water gives out; none out
     on the dunes. Its own stream. */
  if (P.oasisW) {
    var OR = RNG(P.base + '/build/oasis' + (P.nonce ? '/' + P.nonce : ''));
    for (var os = 0; os < specs.length; os++) {
      var osp = specs[os];
      if (osp.kind !== 'palm' && osp.kind !== 'shrub') continue;
      var want = osp.kind === 'palm' ? P.palmCount : osp.count, ring = [];
      for (var og = 0; og < want * 40 && ring.length < want; og++) {
        var oa = OR.range(0, 6.283), orr = P.oasisW * (osp.kind === 'palm' ? OR.range(0.7, 1.45) : OR.range(0.6, 1.9));
        var ox = P.oasisX + Math.cos(oa) * orr, oz = P.oasisZ + Math.sin(oa) * orr;
        if (Math.abs(Math.atan2(ox, -oz)) > lim || !plantable(P, H, ox, oz, 0.45) || H(ox, oz) > P.waterY + 5.5) continue;
        ring.push([ox, oz, OR.range(osp.size[0], osp.size[1])]);
      }
      specs[os] = { kind: osp.kind, count: ring.length, size: osp.size, r: osp.r, seed: osp.seed, preset: ring };
    }
  }
  /* A river through dry country is lined with green: willow and tamarisk
     thickets along both banks of the channel, nothing beyond. Its own
     stream, laid along the channel itself. */
  if (P._chanXZ && P.hasCanyonRiver) {
    var RP = RNG(P.base + '/build/riparian' + (P.nonce ? '/' + P.nonce : '')), rip = [];
    for (var ra = -1400; ra < 1400; ra += RP.range(4, 16)) {
      for (var rs = -1; rs <= 1; rs += 2) {
        if (RP.f() < 0.25) continue;
        var rq = P._chanXZ(ra, rs * ((P.chanW || 12) * 0.9 + RP.range(0, 9)));
        var rd = Math.hypot(rq[0], rq[1]);
        if (rd > 1100 || Math.abs(Math.atan2(rq[0], -rq[1])) > lim) continue;
        if (H(rq[0], rq[1]) < P.waterY + 0.3 || slopeAt(H, rq[0], rq[1]) > 0.35) continue;
        rip.push([rq[0], rq[1], RP.range(2.5, 7)]);
      }
    }
    if (rip.length) specs.push({ kind: 'shrub', count: rip.length, size: [2.5, 7], r: [0, 1200], preset: rip });
  }
  for (var si = 0; si < specs.length; si++) {
    var spec = specs[si];
    if (!spec.count) continue;
    if (spec.kind === 'cactus') { buildCacti(scene, P, R, U, H, spec); continue; }
    if (spec.kind === 'wall') { buildWalls(scene, P, R, U, H, spec); continue; }
    if (spec.kind === 'city') { buildCity(scene, P, R, U, H); continue; }
    if (spec.kind === 'blocks') { buildBlocks(scene, P, R, U, H); continue; }
    if (spec.kind === 'bridge') { buildBridge(scene, P, R, U, H); continue; }
    if (spec.kind === 'rock') { buildRocks(scene, P, R, U, H, spec); continue; }
    if (spec.kind === 'hedge') {
      /* Hedgerows round the fields, square to the crop rows: these were bushes
         snapped onto the rows and stood in the crop like shrubs. The count
         was bushes; a few metres of hedge apiece. */
      var HR = RNG(P.base + '/build/hedgerows/' + si + (P.nonce ? '/' + P.nonce : ''));
      var hl = [], hA = P.rowAngle || HR.range(-0.4, 0.4), nH = clamp(Math.round(spec.count / 45), 2, 6);

   moves in a desert, and they move slowly. */

    iAttr[i * 4 + 3] = R.range(0.5, 1.2);     /* speed */

  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));

    uniforms: {
      uTime: U.uTime, uWind: U.uWind, uGust: U.uGust, uWindDir: U.uWindDir,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uCamPos: U.uCamPos,
      uAmbCol: U.uAmbCol, uSunCol: U.uSunCol,

      'uniform float uTime, uWind, uGust, uFogDensity;',

      '  float dn = aAlong;',
      '  float spread = 1.0 + dn * 0.5 + smoothstep(0.82, 1.0, dn) * 1.6;',
      '  vec3 wp = position + right * aSide * 0.5 * aWidth * spread;',
      '  vUv = vec2(aSide * 0.5 + 0.5, 1.0 - aAlong); vLen = aLen; vSeed = aSeed; vW = aWidth * spread;',
      '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
      '  vFog = fogAmt(-mv.z, uFogDensity);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uFogCol, uAmbCol, uSunCol;',
      'uniform float uTime;',
      'varying vec2 vUv; varying float vFog; varying float vLen, vSeed, vW;',
      'float hf(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }',
      'float vnf(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);',
      '  return mix(mix(hf(i), hf(i + vec2(1.0, 0.0)), f.x), mix(hf(i + vec2(0.0, 1.0)), hf(i + vec2(1.0)), f.x), f.y); }',
      'void main(){',
      /* Streaks running down the drop, stretched along it and quickening as
         they go; a puffy cloud texture read up it had made a dotted line.
         The fine streaks fade to their mean once narrower than a pixel. */
      '  float d = 1.0 - vUv.y;',
      '  float along = pow(d, 0.7) * vLen * 0.09;',
      '  float x = vUv.x * vW * 0.9 + vSeed * 7.0;',
      '  float s1 = vnf(vec2(x, along - uTime * 2.2));',
      '  float s2 = vnf(vec2(x * 2.3 + 3.1, along * 1.9 - uTime * 4.1));',
      '  float k2 = 1.0 - smoothstep(0.30, 0.85, fwidth(x) * 2.3);',
      '  float n = s1 * 0.62 + mix(0.5, s2, k2) * 0.38;',
      /* the edges wander as the water does */
      '  float ew = vnf(vec2(along * 0.25, vSeed)) * 0.18;',
      '  float edge = smoothstep(0.0, 0.16 + ew, vUv.x) * smoothstep(1.0, 0.84 - ew, vUv.x);',
      '  float a = edge * mix(0.75, 0.45, d) * smoothstep(0.25, 0.70, n);',
      '  a += edge * (1.0 - smoothstep(0.0, 0.08, d)) * 0.35;',
      /* spray at the foot: a soft cloud, not a hard end */
      '  float foot = smoothstep(0.80, 1.0, d) * (1.0 - smoothstep(0.30, 0.50, abs(vUv.x - 0.5)) * 0.8);',
      '  a = max(a, foot * 0.45 * (0.6 + 0.4 * s1));',
      '  vec3 col = mix(vec3(0.86, 0.92, 0.95), uSunCol * 0.6 + uAmbCol * 0.8, 0.35);',
      '  gl_FragColor = vec4(mix(col, uFogCol, vFog), a * (1.0 - vFog * 0.85));',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  mat.uniforms.uFogCol = U.uFogCol;
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 1;
  scene.add(m);
  App.falls = m;
}


/* ---------- visitors ----------
   One thing at a time, crossing slowly, minutes apart. The reward is catching
   it, so nothing here is frequent enough to become scenery. */
function makeVisitorTexture(kind, R) {
  var S = 256, c = cnv(S, S), g = c.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'balloon') {
    var band = [R.pick(['#c8443a', '#d98b2b', '#e0d15a', '#3f7fae', '#7a4b8e']), '#f2ece0'];
    var cx = S / 2, cy = S * 0.40, rx = S * 0.27, ry = S * 0.31;
    for (var i = 0; i < 7; i++) {
      g.fillStyle = band[i % 2];
      g.beginPath();
      g.moveTo(cx, cy + ry);
      g.bezierCurveTo(cx - rx + i * rx * 2 / 7, cy + ry * 0.4, cx - rx + i * rx * 2 / 7, cy - ry, cx, cy - ry);
      g.bezierCurveTo(cx - rx + (i + 1) * rx * 2 / 7, cy - ry, cx - rx + (i + 1) * rx * 2 / 7, cy + ry * 0.4, cx, cy + ry);
      g.fill();
    }
    g.strokeStyle = '#5a4a38'; g.lineWidth = 2.2;
    g.beginPath(); g.moveTo(cx - S * 0.06, cy + ry * 0.96); g.lineTo(cx - S * 0.045, S * 0.80);
    g.moveTo(cx + S * 0.06, cy + ry * 0.96); g.lineTo(cx + S * 0.045, S * 0.80); g.stroke();
    g.fillStyle = '#7a5a34';
    g.fillRect(cx - S * 0.055, S * 0.80, S * 0.11, S * 0.075);
  } else if (kind === 'boat') {
    g.fillStyle = '#f4f1e8';
    g.beginPath(); g.moveTo(S * 0.50, S * 0.18); g.lineTo(S * 0.50, S * 0.62);
    g.lineTo(S * 0.26, S * 0.62); g.closePath(); g.fill();
    g.fillStyle = '#e6e0d2';
    g.beginPath(); g.moveTo(S * 0.52, S * 0.24); g.lineTo(S * 0.52, S * 0.62);
    g.lineTo(S * 0.70, S * 0.62); g.closePath(); g.fill();
    g.strokeStyle = '#4a4038'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(S * 0.51, S * 0.16); g.lineTo(S * 0.51, S * 0.64); g.stroke();
    g.fillStyle = R.pick(['#39424c', '#5c4632', '#2f4a44']);
    g.beginPath();
    g.moveTo(S * 0.22, S * 0.64); g.lineTo(S * 0.78, S * 0.64);
    g.lineTo(S * 0.70, S * 0.72); g.lineTo(S * 0.30, S * 0.72); g.closePath(); g.fill();
  } else if (kind === 'deer') {
    g.fillStyle = 'rgba(74,56,38,0.94)';
    g.beginPath(); g.ellipse(S * 0.50, S * 0.56, S * 0.19, S * 0.10, 0, 0, 6.283); g.fill();
    g.fillRect(S * 0.36, S * 0.62, S * 0.035, S * 0.20);
    g.fillRect(S * 0.44, S * 0.62, S * 0.035, S * 0.20);
    g.fillRect(S * 0.57, S * 0.62, S * 0.035, S * 0.20);
    g.fillRect(S * 0.64, S * 0.62, S * 0.035, S * 0.20);
    g.beginPath(); g.moveTo(S * 0.64, S * 0.52); g.lineTo(S * 0.74, S * 0.36);
    g.lineTo(S * 0.79, S * 0.38); g.lineTo(S * 0.70, S * 0.53); g.closePath(); g.fill();
    g.beginPath(); g.ellipse(S * 0.78, S * 0.35, S * 0.055, S * 0.035, -0.4, 0, 6.283); g.fill();
    g.strokeStyle = 'rgba(74,56,38,0.94)'; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(S * 0.79, S * 0.32); g.lineTo(S * 0.83, S * 0.22); g.moveTo(S * 0.80, S * 0.27); g.lineTo(S * 0.87, S * 0.25);
    g.moveTo(S * 0.75, S * 0.32); g.lineTo(S * 0.73, S * 0.21); g.stroke();
  } else { /* geese: a skein */
    g.strokeStyle = 'rgba(38,40,46,0.9)'; g.lineWidth = 4; 
    for (var b = 0; b < 7; b++) {
      var t = b / 6;
      var bx = S * (0.14 + t * 0.72), by = S * (0.32 + Math.abs(t - 0.5) * 0.36);
      g.beginPath();
      g.moveTo(bx - S * 0.045, by + S * 0.02);
      g.quadraticCurveTo(bx, by - S * 0.03, bx + S * 0.045, by + S * 0.02);
      g.stroke();
    }
  }
  return tex(c, false);
}

function buildVisitors(scene, P, R, U, H) {
  var kinds = [];
  var wet = P.waterY != null;
  var calm = P.weather.rain < 0.5 && P.weather.snow < 0.5;
  if (wet && calm && P.biomeKey !== 'saltflat' && P.biomeKey !== 'marsh') kinds.push('boat');
  if (calm && P.weather.cover > 0.3 && !wet) kinds.push('balloon');
  if (['meadow','autumn','moor','alpine','farmland','orchard','blossom','lakefront','river','tundra'].indexOf(P.biomeKey) >= 0) kinds.push('deer');
  if (calm) kinds.push('geese');
  if (!kinds.length || !R.chance(0.72)) return;
  var kind = R.pick(kinds);
  P.visitor = kind;

  var quad = new THREE.PlaneGeometry(1, 1);
  /* Where the card hangs from its own origin. A deer stands on the ground and
     a balloon or a goose hangs by its middle, but a boat was hanging by its
     middle too, and the hull is drawn near the foot of its card: that put the
     bottom of the hull about a fifth of the card below the origin, which for
     a boat eight metres long is nearly two metres under the water. Hang it by
     its waterline instead. */
  quad.translate(0, kind === 'deer' ? 0.5 : (kind === 'boat' ? 0.19 : 0), 0);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var n = kind === 'deer' ? R.int(2, 4) : 1;
  var iAttr = new Float32Array(n * 4);
  for (var i = 0; i < n; i++) {
    iAttr[i * 4] = R.range(0, 1);                       /* start of its own crossing */
    iAttr[i * 4 + 1] = R.range(0.9, 1.15) + i * 0.04;   /* stagger within a group */
    iAttr[i * 4 + 2] = i * R.range(3, 9);
    iAttr[i * 4 + 3] = R.range(-0.35, 0.35);
  }
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = n;

  var cfg = {
    balloon: { size: R.range(11, 20), dist: R.range(180, 420), height: R.range(45, 110), period: R.range(300, 620), cross: 0.42 },
    boat:    { size: R.range(5, 12),  dist: R.range(70, 260),  height: 0,                period: R.range(280, 560), cross: 0.45 },
    deer:    { size: R.range(1.1, 1.7), dist: R.range(38, 120), height: 0,               period: R.range(240, 520), cross: 0.30 },
    geese:   { size: R.range(9, 17),  dist: R.range(130, 320), height: R.range(55, 130), period: R.range(260, 540), cross: 0.24 }
  }[kind];
  var groundY = kind === 'boat' ? (P.waterY || 0) - 0.1 : 0;
  App.visitorInfo = { kind: kind, period: cfg.period, phase: iAttr[0], cross: cfg.cross, side: iAttr[3] > 0 ? 1 : -1 };

  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uCamPos: U.uCamPos, uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
      uAmbCol: U.uAmbCol, uSunCol: U.uSunCol, uWindDir: U.uWindDir,
      uMap: { value: makeVisitorTexture(kind, R) },
      uSize: { value: cfg.size }, uDist: { value: cfg.dist }, uHeight: { value: cfg.height },
      uPeriod: { value: cfg.period }, uCross: { value: cfg.cross },
      uGround: { value: groundY }, uWalks: { value: kind === 'deer' ? 1 : 0 }
    },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec4 iAttr;',
      'uniform float uTime, uFogDensity, uSize, uDist, uHeight, uPeriod, uCross, uGround, uWalks;',
      'uniform vec3 uCamPos;',
      'varying vec2 vUv; varying float vFade;',
      GLSL_COMMON,
      'void main(){',
      '  float cyc = fract(uTime / uPeriod + iAttr.x + iAttr.z * 0.004);',
      '  float span = uCross;',
      '  float u = cyc / span;',
      '  vFade = step(cyc, span) * smoothstep(0.0, 0.10, u) * smoothstep(1.0, 0.88, u);',
      '  float side = iAttr.w > 0.0 ? 1.0 : -1.0;',
      '  float travel = mix(-1.15, 1.15, u) * side;',
      '  float d = uDist * iAttr.y + iAttr.z * 2.0;',
      '  vec3 wp = vec3(travel * d * 0.75 + iAttr.z, uGround + uHeight + sin(uTime * 0.07 + iAttr.x * 6.0) * uHeight * 0.05, -d);',
      '  float bob = uWalks * abs(sin(uTime * 1.6 + iAttr.x * 9.0)) * uSize * 0.045;',
      '  wp.y += bob;',
      '  vec3 toCam = normalize(vec3(uCamPos.x - wp.x, 0.0, uCamPos.z - wp.z));',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 up = uWalks > 0.5 ? vec3(0.0,1.0,0.0) : normalize(cross(toCam, right));',
      '  vec3 p = wp + right * position.x * uSize * side + up * position.y * uSize;',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vFade *= 1.0 - fogAmt(-mv.z, uFogDensity) * 0.9;',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uFogCol, uAmbCol, uSunCol;',
      'varying vec2 vUv; varying float vFade;',
      'void main(){',
      '  vec4 t = texture2D(uMap, vUv);',
      '  if (t.a < 0.05 || vFade <= 0.001) discard;',
      '  vec3 c = t.rgb * (uAmbCol * 0.9 + uSunCol * 0.55);',
      '  gl_FragColor = vec4(mix(c, uFogCol, 0.25), t.a * vFade);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  mat.uniforms.uFogCol = U.uFogCol;
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 2;
  scene.add(m);
  App.visitor = m;
}

/* ---------- birds ---------- */
function buildBirds(scene, P, R, U) {
  if (!P.birds) return;
  var COUNT = P.birds;
  var quad = new THREE.PlaneGeometry(1, 1);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var iAttr = new Float32Array(COUNT * 4);
  for (var i = 0; i < COUNT; i++) {
    iAttr[i * 4] = R.range(0, 6.283);          /* phase */
    iAttr[i * 4 + 1] = R.range(28, 95);        /* height */
    iAttr[i * 4 + 2] = R.range(1.4, 3.4);      /* size */
    /* a negative speed marks a bird that circles rather than crosses */
    iAttr[i * 4 + 3] = (P.biome.raptors && R.chance(0.75)) ? -R.range(0.5, 0.9) : R.range(0.6, 1.5);
  }
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = COUNT;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
      uMap: { value: makeBirdTexture() }, uCamPos: U.uCamPos,
      uDrift: { value: R.range(-1, 1) }
    },
    transparent: true, depthWrite: false,
    vertexShader: [
      'attribute vec4 iAttr;',
      'uniform float uTime, uFogDensity, uDrift; uniform vec3 uCamPos;',
      'varying vec2 vUv; varying float vFog;',
      GLSL_COMMON,
      'void main(){',
      '  vec3 wp; float flap;',
      '  if (iAttr.w < 0.0) {',
      '    float ang = uTime * 0.045 * abs(iAttr.w) + iAttr.x;',
      '    float orbit = 34.0 + 46.0 * fract(iAttr.x * 0.37);',
      '    wp = vec3(sin(ang) * orbit, iAttr.y + sin(ang * 0.7) * 5.0,',
      '              -95.0 - 60.0 * fract(iAttr.x * 0.61) + cos(ang) * orbit);',
      '    flap = 0.86 + 0.14 * sin(uTime * 1.6 + iAttr.x);',
      '  } else {',
      '    float t = uTime * 0.05 * iAttr.w + iAttr.x;',
      '    float loop = 300.0;',
      '    float px = mod(t * 250.0, loop) - loop * 0.5;',
      '    float pz = -120.0 - 70.0 * sin(iAttr.x) - 30.0 * sin(t * 0.7);',
      '    wp = vec3(px * (uDrift > 0.0 ? 1.0 : -1.0), iAttr.y + sin(t * 1.7) * 4.0, pz);',
      '    flap = 0.55 + 0.45 * sin(uTime * 7.0 + iAttr.x * 5.0);',
      '  }',
      '  vec3 toCam = normalize(uCamPos - wp);',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 up = normalize(cross(toCam, right));',
      '  vec3 p = wp + right * position.x * iAttr.z + up * position.y * iAttr.z * flap;',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vFog = fogAmt(-mv.z, uFogDensity);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uFogCol;',
      'varying vec2 vUv; varying float vFog;',
      'void main(){',
      '  vec4 t = texture2D(uMap, vUv);',
      '  gl_FragColor = vec4(mix(t.rgb, uFogCol, vFog), t.a * (1.0 - vFog) * 0.85);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  mat.uniforms.uFogCol = U.uFogCol;
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 2;
  scene.add(m);
  App.birdMesh = m;
}

/* ---------- rain & snow ---------- */
function buildPrecip(scene, P, R, U) {
  var W = P.weather;
  if (W.rain > 0) {
    var COUNT = Math.round((2600 * W.rain + 700) * Q().precipMul);
    var quad = new THREE.PlaneGeometry(1, 1);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);
    var iPos = new Float32Array(COUNT * 3);
    var iAttr = new Float32Array(COUNT * 3);
    for (var i = 0; i < COUNT; i++) {
      iPos[i * 3] = R.range(-45, 45);
      iPos[i * 3 + 1] = R.range(0, 34);
      iPos[i * 3 + 2] = R.range(-58, -1.5);
      iAttr[i * 3] = R.range(0.35, 1.05) * (0.6 + W.rain * 0.8);
      iAttr[i * 3 + 1] = R.range(0.008, 0.019);
      iAttr[i * 3 + 2] = R.range(0.6, 1.5);
    }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 3));
    geo.instanceCount = COUNT;
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uWindDir: U.uWindDir, uWind: U.uWind, uGust: U.uGust,
        uCamPos: U.uCamPos, uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
        uAmbCol: U.uAmbCol, uSunCol: U.uSunCol,
        uIntensity: { value: W.rain }
      },
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      vertexShader: [
        'attribute vec3 iPos; attribute vec3 iAttr;',
        'uniform float uTime, uWind, uGust, uFogDensity, uIntensity;',
        'uniform vec2 uWindDir; uniform vec3 uCamPos;',
        'varying float vA;',
        GLSL_COMMON,
        'void main(){',
        '  float speed = 15.0 + iAttr.z * 12.0 + uGust * 6.0;',
        '  float range = 34.0;',
        '  float y = mod(iPos.y - uTime * speed, range);',
        '  float slant = uWind * (0.35 + 0.5 * uGust) * 0.5;',
        '  vec3 wp = vec3(iPos.x + uWindDir.x * (range - y) * slant * 0.35, y, iPos.z + uWindDir.y * (range - y) * slant * 0.35);',
        /* an on-shore wind must not blow a drop through the glass: wrap the
           drift back into the outdoor band, as the flakes do */
        '  wp.z = mod(wp.z + 58.0, 56.5) - 58.0;',
        '  vec3 dir = normalize(vec3(uWindDir.x * slant, -1.0, uWindDir.y * slant));',
        '  vec3 toCam = normalize(uCamPos - wp);',
        '  vec3 right = normalize(cross(dir, toCam));',
        '  float dr = length(wp - cameraPosition);',
        '  float grow = 1.0 + smoothstep(6.0, 40.0, dr) * 3.2;',
        '  vec3 p = wp + right * position.x * iAttr.y * grow + dir * position.y * iAttr.x * 2.2;',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  float d = -mv.z;',
        '  vA = (1.0 - fogAmt(d, uFogDensity)) * uIntensity * (0.30 + 0.5 * smoothstep(2.0, 16.0, d)) * 0.75',
        '     / grow * (1.0 - smoothstep(30.0, 46.0, dr));',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
      GLSL_TONE,
        'varying float vA;',
        'uniform vec3 uAmbCol, uSunCol;',
        'void main(){',
        '  vec3 lit = vec3(0.80, 0.85, 0.92) * clamp(uAmbCol * 1.6 + uSunCol * 0.5, 0.10, 1.0);',
        '  gl_FragColor = vec4(lit, vA);',
        '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
      ].join('\n')
    });
    var rain = new THREE.Mesh(geo, mat);
    rain.frustumCulled = false;
    rain.renderOrder = 3;
    scene.add(rain);
    App.rain = rain;
  }

  if (P.leafFall) buildFlakes(scene, P, R, U, {
    count: Math.round(P.leafFall * Q().precipMul), colour: P.fallCol,
    size: [0.05, 0.13], fall: [0.28, 0.6], sway: 1.8, intensity: 0.85
  });
  if (W.snow > 0) buildFlakes(scene, P, R, U, {
    count: Math.round((2000 * W.snow + 600) * Q().precipMul),
    colour: '#f5f8ff', size: [0.025, 0.075], fall: [0.55, 1.4],
    sway: 1.0, intensity: W.snow, snow: true
  });
}

/* anything that drifts down: snow, autumn leaves, blossom */
function buildFlakes(scene, P, R, U, o) {
  var CN = o.count;
  if (!CN) return;
  var q2 = new THREE.PlaneGeometry(1, 1);
  var g2 = new THREE.InstancedBufferGeometry();
  g2.index = q2.index;
  g2.setAttribute('position', q2.attributes.position);
  g2.setAttribute('uv', q2.attributes.uv);
  var sPos = new Float32Array(CN * 3);
  var sAttr = new Float32Array(CN * 3);
  for (var j = 0; j < CN; j++) {
    sPos[j * 3] = R.range(-40, 40);
    sPos[j * 3 + 1] = R.range(0, 30);
    sPos[j * 3 + 2] = R.range(-52, -1.5);
    sAttr[j * 3] = R.range(o.size[0], o.size[1]);
    sAttr[j * 3 + 1] = R.range(0, 6.283);
    sAttr[j * 3 + 2] = R.range(o.fall[0], o.fall[1]);
  }
  g2.setAttribute('iPos', new THREE.InstancedBufferAttribute(sPos, 3));
  g2.setAttribute('iAttr', new THREE.InstancedBufferAttribute(sAttr, 3));
  g2.instanceCount = CN;
  var m2 = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uWindDir: U.uWindDir, uWind: U.uWind, uGust: U.uGust,
      uCamPos: U.uCamPos, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uFogCol: U.uFogCol,
      uAmbCol: U.uAmbCol, uSunCol: U.uSunCol,
      uMap: { value: makeSoftDot() },
      uColour: { value: new THREE.Color(o.colour) },
      uSway: { value: o.sway },
      uSpin: { value: o.snow ? 0.0 : 1.0 },
      uIntensity: { value: o.intensity }
    },
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec3 iAttr;',
      'uniform float uTime, uWind, uGust, uFogDensity, uIntensity, uSway, uSpin;',
      'uniform vec2 uWindDir; uniform vec3 uCamPos;',
      'varying vec2 vUv; varying float vA;',
      GLSL_COMMON,
      'void main(){',
      '  float range = 30.0;',
      '  float fall = iAttr.z;',
      '  float y = mod(iPos.y - uTime * fall, range);',
      '  float age = range - y;',
      '  float drift = uWind * (0.4 + 0.6 * uGust);',
      '  vec3 wp = vec3(iPos.x, y, iPos.z);',
      '  wp.x += sin(uTime * 0.45 * uSway + iAttr.y) * 0.9 * uSway + uWindDir.x * age * drift * 0.42;',
      '  wp.z += cos(uTime * 0.37 * uSway + iAttr.y * 1.7) * 0.9 * uSway + uWindDir.y * age * drift * 0.42;',
      '  wp.x = mod(wp.x + 45.0, 90.0) - 45.0;',
      '  wp.z = mod(wp.z + 57.0, 56.0) - 57.0;',
      '  vec3 toCam = normalize(uCamPos - wp);',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 up = normalize(cross(toCam, right));',
      '  float sp = uSpin * (uTime * 2.1 + iAttr.y * 4.0);',
      '  vec2 q = vec2(position.x * cos(sp) - position.y * sin(sp),',
      '               position.x * sin(sp) + position.y * cos(sp));',
      '  float squash = mix(1.0, 0.35 + 0.65 * abs(sin(uTime * 1.7 + iAttr.y)), uSpin);',
      '  float df = length(wp - cameraPosition);',
      '  float grow = 1.0 + smoothstep(6.0, 36.0, df) * 2.2;',
      '  vec3 p = wp + right * q.x * iAttr.x * grow + up * q.y * iAttr.x * squash * grow;',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  float d = -mv.z;',
      '  vA = (1.0 - fogAmt(d, uFogDensity)) * uIntensity * smoothstep(1.2, 5.0, d)',
      '     / (0.6 + 0.4 * grow) * (1.0 - smoothstep(28.0, 44.0, df));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap; uniform vec3 uColour, uAmbCol, uSunCol;',
      'uniform float uSpin;',
      'varying vec2 vUv; varying float vA;',
      'void main(){',
      '  float a = texture2D(uMap, vUv).a;',
      '  if (uSpin > 0.5) a = smoothstep(0.25, 0.6, a);',
      '  vec3 c = uColour * clamp(uAmbCol * 1.5 + uSunCol * 0.6, 0.12, 1.0);',
      '  gl_FragColor = vec4(c, a * vA * 0.9);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  var mesh = new THREE.Mesh(g2, m2);
  mesh.frustumCulled = false;
  mesh.renderOrder = 3;
  scene.add(mesh);
  if (o.snow) App.snow = mesh; else App.leaves = mesh;
}

/* ---------- the room, the window ---------- */
function openingPoints(P, e, cw) {
  var w = P.win.w, h = P.win.h, cy = P.win.cy;
  var arch = P.win.arch;
  var x0 = -w / 2 - e, x1 = w / 2 + e;
  var y0 = cy - h / 2 - e, y1 = cy + h / 2 + e;
  var r = w / 2 + e;
  var springY = cy + h / 2 - w / 2;
  var pts = [];
  pts.push(new THREE.Vector2(x0, y0));
  if (arch) {
    pts.push(new THREE.Vector2(x0, springY));
    var seg = 26;
    for (var i = 0; i <= seg; i++) {
      var a = Math.PI - Math.PI * (i / seg);
      pts.push(new THREE.Vector2(Math.cos(a) * r, springY + Math.sin(a) * r));
    }
  } else {
    pts.push(new THREE.Vector2(x0, y1));
    pts.push(new THREE.Vector2(x1, y1));
  }
  pts.push(new THREE.Vector2(x1, y0));
  if (!cw) pts.reverse();
  return pts;
}

function buildRoom(scene, P, U) {
  var R = RNG(P.base + '/room');
  var g = new THREE.Group();
  var w = P.win.w, h = P.win.h, cy = P.win.cy;
  var arch = P.win.arch;
  var springY = cy + h / 2 - w / 2;
  var wallW = 40, wallH = 26;

  /* --- wall with the opening cut out, extruded to give the reveal --- */
  var shape = new THREE.Shape([
    new THREE.Vector2(-wallW / 2, cy - wallH / 2),
    new THREE.Vector2(wallW / 2, cy - wallH / 2),
    new THREE.Vector2(wallW / 2, cy + wallH / 2),
    new THREE.Vector2(-wallW / 2, cy + wallH / 2)
  ]);
  shape.holes.push(new THREE.Path(openingPoints(P, 0, true)));
  var wallGeo = new THREE.ExtrudeGeometry(shape, { depth: P.win.wallDepth, bevelEnabled: false, steps: 1, curveSegments: 24 });
  wallGeo.translate(0, 0, -P.win.wallDepth);
  var wallTex = makeWallTexture(P, R, wallW, wallH);
  wallTex.repeat.set(1 / wallW, 1 / wallH);
  wallTex.offset.set(0.5, 0.5 - cy / wallH);
  var wallMat = new THREE.MeshLambertMaterial({
    color: new THREE.Color(P.win.wallTint),
    map: wallTex,
    side: THREE.DoubleSide
  });
  var wall = new THREE.Mesh(wallGeo, wallMat);
  g.add(wall);

  /* --- interior casing --- */
  var casingShape = new THREE.Shape(openingPoints(P, P.win.casing, false));
  casingShape.holes.push(new THREE.Path(openingPoints(P, 0.004, true)));
  var casingGeo = new THREE.ExtrudeGeometry(casingShape, { depth: P.win.casingDepth, bevelEnabled: false, steps: 1, curveSegments: 24 });
  var finTex = makeFinishTexture(P.win.finish, R);
  var frameMat = new THREE.MeshLambertMaterial({ map: finTex, side: THREE.DoubleSide });
  var casing = new THREE.Mesh(casingGeo, frameMat);
  g.add(casing);

  /* --- sash frame, set back into the reveal --- */
  var zSash = -P.win.wallDepth * P.win.setback;
  var sashShape = new THREE.Shape(openingPoints(P, -0.012, false));
  sashShape.holes.push(new THREE.Path(openingPoints(P, -0.012 - P.win.frame, true)));
  var sash = new THREE.Group();
  /* hinged on one jamb, so opening it reads at a glance */
  sash.position.set(-w / 2, 0, zSash);
  var sashGeo = new THREE.ExtrudeGeometry(sashShape, { depth: 0.055, bevelEnabled: false, steps: 1, curveSegments: 24 });
  sashGeo.translate(w / 2, 0, 0);
  sash.add(new THREE.Mesh(sashGeo, frameMat));
  g.add(sash);
  App.sash = sash;

  /* --- glazing bars --- */
  var cols = P.win.cols, rows = P.win.rows, bar = P.win.bar, bd = 0.042;
  var innerX0 = -w / 2 + P.win.frame, innerX1 = w / 2 - P.win.frame;
  var innerY0 = cy - h / 2 + P.win.frame;
  var innerY1 = arch ? springY : cy + h / 2 - P.win.frame;
  var barMat = frameMat;
  var i, cnvY;
  for (i = 1; i < cols; i++) {
    var bx = innerX0 + (innerX1 - innerX0) * (i / cols);
    var bh = innerY1 - innerY0;
    var vb = new THREE.Mesh(new THREE.BoxGeometry(bar, bh, bd), barMat);
    vb.position.set(bx + w / 2, (innerY0 + innerY1) / 2, 0.027);
    sash.add(vb);
  }
  for (i = 1; i < rows; i++) {
    cnvY = innerY0 + (innerY1 - innerY0) * (i / rows);
    var thick = (P.win.meetingRow && i === P.win.meetingRow) ? bar * 3.1 : bar;
    var hb = new THREE.Mesh(new THREE.BoxGeometry(innerX1 - innerX0, thick, bd * (thick > bar ? 1.25 : 1)), barMat);
    hb.position.set(w / 2, cnvY, 0.027);
    sash.add(hb);
  }
  if (arch && !P.win.clear) {
    /* transom at the spring line + radial bars in the fan light */
    var tr = new THREE.Mesh(new THREE.BoxGeometry(innerX1 - innerX0, bar * 1.6, bd), barMat);
    tr.position.set(w / 2, springY, 0.027);
    sash.add(tr);
    var rr = w / 2 - P.win.frame;
    var fan = cols > 1 ? 3 : 2;
    for (i = 1; i <= fan; i++) {
      var ang = Math.PI * (i / (fan + 1));
      var rb = new THREE.Mesh(new THREE.BoxGeometry(bar, rr, bd), barMat);
      rb.position.set(w / 2 + Math.cos(ang) * rr / 2, springY + Math.sin(ang) * rr / 2, 0.027);
      rb.rotation.z = ang - Math.PI / 2;
      sash.add(rb);
    }
  }

  /* --- sill + apron --- */
  var sillW = w + P.win.casing * 2 + 0.14;
  var sillGeo = new THREE.BoxGeometry(sillW, 0.055, P.win.wallDepth + P.win.sillDepth);
  var sill = new THREE.Mesh(sillGeo, frameMat);
  sill.position.set(0, cy - h / 2 - 0.027, -P.win.wallDepth / 2 + P.win.sillDepth / 2);
  g.add(sill);
  var apron = new THREE.Mesh(new THREE.BoxGeometry(sillW * 0.86, 0.10, 0.028), frameMat);
  apron.position.set(0, cy - h / 2 - 0.115, 0.014);
  g.add(apron);

  /* --- glass --- */
  var glassGeo = new THREE.PlaneGeometry(w * 1.02, h * 1.02);
  var glassMat = new THREE.MeshBasicMaterial({
    map: makeGlassTexture(R),
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  var glass = new THREE.Mesh(glassGeo, glassMat);
  glass.position.set(w / 2, cy, 0.01);
  glass.renderOrder = 6;
  sash.add(glass);
  /* frost forms on the glass itself, so the glazing bars sit in front of it
     and it reads as outside the pane rather than a film over the window */
  if (P.weather.snow > 0 || P.baseSnow > 0.3) {
    var frostMat = new THREE.MeshBasicMaterial({
      map: tex(makeFrostCanvas(P), false), transparent: true, opacity: 0, depthWrite: false
    });
    var frost = new THREE.Mesh(new THREE.PlaneGeometry(w * 1.02, h * 1.02), frostMat);
    frost.position.set(w / 2, cy, 0.014);
    frost.renderOrder = 5;
    sash.add(frost);
    App.frostMat = frostMat;
    App.frostTarget = clamp(0.18 + (P.weather.snow || 0) * 0.28 + (P.baseSnow || 0) * 0.12, 0, 0.55);
  } else { App.frostMat = null; App.frostTarget = 0; }
  App.glass = glass;
  App.glassMat = glassMat;

  g.visible = !App.bare;
  scene.add(g);
  App.room = g;
  App.sashAngle = App.sashAngle || 0;
}


/* ---------- post ----------
   The scene is drawn to a target, its highlights blurred at quarter size and
   added back, then graded and given grain. One extra full-screen pass. */
function setupPost() {
  var r = App.renderer;
  if (!r) return;
  disposePost();
  if (!Q().post) return;
  var size = new THREE.Vector2();
  r.getDrawingBufferSize(size);
  var w = Math.max(2, size.x | 0), h = Math.max(2, size.y | 0);
  /* The scene is drawn larger than the screen and filtered down, on top of
     4x multisampling: fine moving detail gets ten-odd samples a pixel and
     stops crawling when the view shifts. */
  var ss = Q().ss || 1;
  var sw = Math.min(4096, Math.round(w * ss)), sh = Math.min(4096, Math.round(h * ss));
  /* An offscreen target has no anti-aliasing unless it is multisampled, and
     that needs WebGL2. Without it, bloom is not worth every edge in the scene
     shimmering, so the pass is skipped and the scene draws straight to screen. */
  if (!r.capabilities.isWebGL2 || !THREE.WebGLMultisampleRenderTarget) return;
  /* stencilBuffer:true is what makes three give the target a 24-bit depth
     buffer; without it the depth is 16-bit and the near field z-fights */
  var full = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, depthBuffer: true, stencilBuffer: true };
  var quarter = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, depthBuffer: false, stencilBuffer: false };
  var qw = Math.max(2, w >> 2), qh = Math.max(2, h >> 2);
  var P = {
    w: w, h: h, qw: qw, qh: qh,
    sw: sw, sh: sh,
    scene: (function () { var t = new THREE.WebGLMultisampleRenderTarget(sw, sh, full); t.samples = 4; return t; })(),
    bright: new THREE.WebGLRenderTarget(qw, qh, quarter),
    blurA: new THREE.WebGLRenderTarget(qw, qh, quarter),
    blurB: new THREE.WebGLRenderTarget(qw, qh, quarter),
    cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1),
    sceneQ: new THREE.Scene()
  };
  var VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  P.matBright = new THREE.ShaderMaterial({
    uniforms: { tex: { value: null }, uStep: { value: new THREE.Vector2(1 / (3 * qw), 1 / (3 * qh)) } }, depthTest: false, depthWrite: false,
    vertexShader: VS,
    fragmentShader: [
      'uniform sampler2D tex; uniform vec2 uStep; varying vec2 vUv;',
      /* nine taps across the whole footprint of this small pixel, so a bright
         speck in the big image cannot drop in and out of the glow */
      'void main(){',
      '  vec3 c = vec3(0.0);',
      '  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++)',
      '    c += texture2D(tex, vUv + vec2(float(x), float(y)) * uStep).rgb;',
      '  c /= 9.0;',
      '  float l = dot(c, vec3(0.3, 0.59, 0.11));',
      '  gl_FragColor = vec4(c * smoothstep(0.86, 1.0, l), 1.0); }'
    ].join('\n')
  });
  P.matBlur = new THREE.ShaderMaterial({
    uniforms: { tex: { value: null }, dir: { value: new THREE.Vector2(1, 0) } }, depthTest: false, depthWrite: false,
    vertexShader: VS,
    fragmentShader: [
      'uniform sampler2D tex; uniform vec2 dir; varying vec2 vUv;',
      'void main(){',
      '  vec3 c = texture2D(tex, vUv).rgb * 0.227;',
      '  c += (texture2D(tex, vUv + dir * 1.385).rgb + texture2D(tex, vUv - dir * 1.385).rgb) * 0.316;',
      '  c += (texture2D(tex, vUv + dir * 3.231).rgb + texture2D(tex, vUv - dir * 3.231).rgb) * 0.070;',
      '  gl_FragColor = vec4(c, 1.0); }'
    ].join('\n')
  });
  P.matComp = new THREE.ShaderMaterial({
    uniforms: { tex: { value: null }, bloom: { value: null }, uTime: { value: 0 },
                uRes: { value: new THREE.Vector2(w, h) }, uBloom: { value: 0.22 },
                uTexel: { value: new THREE.Vector2(1 / sw, 1 / sh) } },
    depthTest: false, depthWrite: false,
    vertexShader: VS,
    fragmentShader: [
      'uniform sampler2D tex, bloom; uniform float uTime, uBloom; uniform vec2 uRes, uTexel; varying vec2 vUv;',
      'void main(){',
      '  vec2 o = uTexel * 0.36;',
      '  vec3 c = (texture2D(tex, vUv + vec2(-o.x, -o.y)).rgb + texture2D(tex, vUv + vec2(o.x, -o.y)).rgb',
      '          + texture2D(tex, vUv + vec2(-o.x, o.y)).rgb + texture2D(tex, vUv + vec2(o.x, o.y)).rgb) * 0.25;',

      '  c += texture2D(bloom, vUv).rgb * uBloom;',
      '  float l = dot(c, vec3(0.3, 0.59, 0.11));',
      '  float g = fract(sin(dot(floor(vUv * uRes) + fract(uTime) * 61.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;',
      '  c += g * 0.026 * (1.0 - l * 0.7);',
      /* contrast and split-tone are in tone(), so every tier gets them */
      /* temporal accumulation: the last frame is folded in, more when the view
         is moving. Detail that flickered frame to frame settles; a pan gets a
         touch of motion blur, which is what an eye sees too. */
      '  gl_FragColor = vec4(c, 1.0); }'
    ].join('\n')
  });
  P.matBlit = new THREE.ShaderMaterial({
    uniforms: { tex: { value: null } }, depthTest: false, depthWrite: false,
    vertexShader: VS,
    fragmentShader: 'uniform sampler2D tex; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(tex, vUv).rgb, 1.0); }'
  });
  P.quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), P.matComp);
  P.quad.frustumCulled = false;
  P.sceneQ.add(P.quad);
  App.post = P;
}
function disposePost() {
  var P = App.post;
  if (!P) return;
  P.scene.dispose(); P.bright.dispose(); P.blurA.dispose(); P.blurB.dispose();
  P.matBright.dispose(); P.matBlur.dispose(); P.matComp.dispose(); P.matBlit.dispose(); P.quad.geometry.dispose();
  App.post = null;
}
function renderFrame() {
  var r = App.renderer, P = App.post;
  if (!P) { r.setRenderTarget(null); r.render(App.scene, App.camera); return; }

  r.setRenderTarget(P.scene); r.render(App.scene, App.camera);
  P.quad.material = P.matBright; P.matBright.uniforms.tex.value = P.scene.texture;
  r.setRenderTarget(P.bright); r.render(P.sceneQ, P.cam);
  P.quad.material = P.matBlur;
  P.matBlur.uniforms.tex.value = P.bright.texture; P.matBlur.uniforms.dir.value.set(1 / P.qw, 0);
  r.setRenderTarget(P.blurA); r.render(P.sceneQ, P.cam);
  P.matBlur.uniforms.tex.value = P.blurA.texture; P.matBlur.uniforms.dir.value.set(0, 1 / P.qh);
  r.setRenderTarget(P.blurB); r.render(P.sceneQ, P.cam);
  P.quad.material = P.matComp;
  P.matComp.uniforms.tex.value = P.scene.texture; P.matComp.uniforms.bloom.value = P.blurB.texture;
  P.matComp.uniforms.uTime.value = App.t || 0;
  r.setRenderTarget(null); r.render(P.sceneQ, P.cam);
}

/* ============================================================
   8. layout / framing
   ============================================================ */
var resizeTimer = null;
function layout() {
  if (!App.P || !App.camera || !App.renderer) return;
  var w = window.innerWidth, h = window.innerHeight;
  var P = App.P, cam = App.camera, r = App.renderer;
  /* A view that has not been laid out yet reports no size at all, and 0/0 is
     NaN. That ran on through the window sizing into the wall texture, where a
     non-finite gradient throws, and the throw left the view black for good.
     Carry on with a plain square until a real size arrives. */
  cam.aspect = (w > 0 && h > 0) ? w / h : 1;
  var changed = sizeWindow(P, cam.aspect);
  App.camDist = P.win.dist;

  cam.position.set(0, P.win.cy, App.camDist);
  cam.lookAt(0, P.win.cy - PITCH * (20 + App.camDist), -20);
  cam.updateProjectionMatrix();
  r.setPixelRatio(qualityRatio());
  r.setSize(Math.max(1, w), Math.max(1, h), false);
  setupPost();
  FX.resize();

  /* the opening changes shape with the screen, so the joinery is rebuilt --
     debounced, since this regenerates geometry and textures */
  if (changed && App.room) {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuildRoom, 220);
  }
}
function rebuildRoom() {
  if (!App.room || !App.P || switching) return;
  App.scene.remove(App.room);
  disposeDeep(App.room);
  App.room = null;
  buildRoom(App.scene, App.P, App.U);
  updateWeather(App.t);
}
function qualityRatio() {
  var dpr = window.devicePixelRatio || 1;
  var step = [1, 0.86, 0.72, 0.60][Math.min(App.quality, 3)];
  return Math.max(0.55, Math.min(dpr, Q().pixel) * step);
}

/* ============================================================
   9. weather over time
   ============================================================ */
var _c1 = new THREE.Color(), _c2 = new THREE.Color(), _cw = new THREE.Color();
function mixHex(out, a, b, t) {
  _c1.set(a); _c2.set(b);
  out.copy(_c1).lerp(_c2, t);
  return out;
}
function desat(c, amount) {
  var l = c.r * 0.30 + c.g * 0.59 + c.b * 0.11;
  c.r = lerp(c.r, l, amount); c.g = lerp(c.g, l, amount); c.b = lerp(c.b, l, amount);
  return c;
}

/* how deep a snowfall settles if it keeps going */
function snowTarget(W) { return clamp(0.35 + W.snow * 0.55, 0, 0.92); }

function updateWeather(t) {
  var P = App.P, U = App.U, W = P.weather;
  var A = TIMES[P.timeA], B = TIMES[P.timeB];
  var k;

  /* the light breathes slowly between two hours of the day */
  k = 0.5 - 0.5 * Math.cos((t / P.driftPeriod) * 6.283 + P.driftPhase);
  k *= P.driftAmount;
  var elev = lerp(A.elev, B.elev, k) * Math.PI / 180;

  /* weather intensity also wanders, so nothing loops */
  var mood = 0.5 + 0.5 * Math.sin(t * 0.0121 + 1.3) * 0.6 + 0.5 * Math.sin(t * 0.0043 - 0.7) * 0.4;
  mood = clamp(mood, 0, 1);

  var az = P.sunAz;

  /* a live clock overrides the seeded hour with the viewer's own */
  if (App.liveClock) {
    var now = new Date();
    var hr = now.getHours() + now.getMinutes() / 60;
    elev = (62 * Math.sin((hr - 6) / 12 * Math.PI)) * Math.PI / 180;

        self.surfLow.gain.gain.setTargetAtTime(peak, t, 0.9);
        self.surfLow.gain.gain.setTargetAtTime(0.03, t + 2.6, 2.2);
        /* the foam hisses a moment after the wave lands */
        self.surfHi.gain.gain.cancelScheduledValues(t);
        self.surfHi.gain.gain.setTargetAtTime(peak * 0.55, t + 0.55, 0.7);
        self.surfHi.gain.gain.setTargetAtTime(0.015, t + 3.1, 2.6);
      }
      self.scheduleSwell();
    }, gap);
  },

  /* ---- birds: partials, vibrato and a syllable rhythm, heard across a field ---- */
  call: function () {
    if (!this.on || !this.ctx || !this.voice || this.voices > 3) return;
    var ctx = this.ctx, self = this;
    var kind = this.voice, t0 = ctx.currentTime + 0.02;
    var out = ctx.createGain();
    var far = ctx.createBiquadFilter();
    far.type = 'lowpass';
    far.frequency.value = 2600 + Math.random() * 3200;   /* distance eats the top end */
    var pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    out.connect(far);
    var node = far;
    if (pan) { pan.pan.value = Math.random() * 1.6 - 0.8; far.connect(pan); node = pan; }
    var lvl = ctx.createGain(); lvl.gain.value = 0.09 + Math.random() * 0.05;
    node.connect(lvl);
    lvl.connect(this.dry);
    var send = ctx.createGain(); send.gain.value = 0.8;   /* birds live in the reverb */
    lvl.connect(send); send.connect(this.wet);

    var notes = [], i;
    if (kind === 'trill') {
      var n = 5 + Math.floor(Math.random() * 6), f0 = 2700 + Math.random() * 1400;
      for (i = 0; i < n; i++) notes.push({ t: i * 0.055, d: 0.045, f: f0 * (1 + (i % 2) * 0.12), g: 1 });
    } else if (kind === 'fluty') {
      var m = 3 + Math.floor(Math.random() * 3), fb = 1500 + Math.random() * 900;
      for (i = 0; i < m; i++) notes.push({
        t: i * (0.20 + Math.random() * 0.12), d: 0.14 + Math.random() * 0.1,
        f: fb * (0.8 + Math.random() * 0.6), slide: 0.85 + Math.random() * 0.35, g: 1
      });
    } else if (kind === 'hawk') {
      /* one long falling cry from somewhere high */
      notes.push({ t: 0, d: 0.75 + Math.random() * 0.35, f: 2300 + Math.random() * 500, slide: 0.58, g: 0.8, harsh: 1 });
    } else if (kind === 'gull') {
      var k = 2 + Math.floor(Math.random() * 2);
      for (i = 0; i < k; i++) notes.push({
        t: i * 0.42, d: 0.34, f: 1250 + Math.random() * 350, slide: 0.55, g: 0.9, harsh: 1
      });
    } else {
      var syl = [0, 0.26, 0.62, 0.92], fc = 380 + Math.random() * 120;
      for (i = 0; i < syl.length; i++) notes.push({ t: syl[i], d: 0.24, f: fc * (i === 1 ? 1.18 : 1), g: i === 1 ? 1 : 0.7 });
    }

    /* somewhere in the trees ahead: the call comes from a point, not a pan */
    if (pan) { try { pan.disconnect(); } catch (e) {} far.connect(lvl); }
    var px = (Math.random() * 2 - 1) * 34, py = 2 + Math.random() * 12, pz = -10 - Math.random() * 40;
    if (kind === 'hawk') { px *= 2.5; py = 40 + Math.random() * 50; pz = -60 - Math.random() * 120; }
    var placed = this.place(lvl, px, py, pz, 8);
    try { lvl.disconnect(this.dry); } catch (e) {}
    placed.connect(this.dry);
    var last = 0;
    for (i = 0; i < notes.length; i++) {
      var nt = notes[i], st = t0 + nt.t;
      last = Math.max(last, nt.t + nt.d);
      /* the source is harmonically rich; the resonators shape it into a voice */
      var o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(nt.f, st);
      if (nt.slide) o.frequency.exponentialRampToValueAtTime(nt.f * nt.slide, st + nt.d);
      var vib = ctx.createOscillator(); vib.frequency.value = 14 + Math.random() * 14;
      var vg = ctx.createGain(); vg.gain.value = nt.f * 0.018;
      vib.connect(vg); vg.connect(o.frequency); vib.start(st); vib.stop(st + nt.d + 0.02);
      var r1 = ctx.createBiquadFilter(); r1.type = 'bandpass'; r1.Q.value = nt.harsh ? 5 : 11;
      var r2 = ctx.createBiquadFilter(); r2.type = 'bandpass'; r2.Q.value = nt.harsh ? 4 : 9;
      r1.frequency.setValueAtTime(nt.f * (nt.harsh ? 1.6 : 2.1), st);
      r1.frequency.exponentialRampToValueAtTime(nt.f * (nt.harsh ? 1.2 : 1.7), st + nt.d);
      r2.frequency.setValueAtTime(nt.f * 3.2, st);
      r2.frequency.exponentialRampToValueAtTime(nt.f * 2.6, st + nt.d);
      /* breath: a little air in the tone */
      var ns = ctx.createBufferSource(); ns.buffer = this.bufs.white;
      var nf = ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = nt.f * 2.4; nf.Q.value = 3;
      var ng = ctx.createGain(); ng.gain.value = nt.harsh ? 0.35 : 0.12;
      ns.connect(nf); nf.connect(ng);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(Math.max(nt.g * 0.9, 0.001), st + Math.min(0.018, nt.d * 0.25));
      g.gain.exponentialRampToValueAtTime(0.0001, st + nt.d);
      o.connect(r1); r1.connect(g); o.connect(r2); r2.connect(g); ng.connect(g); g.connect(out);
      o.start(st); o.stop(st + nt.d + 0.02);
      try { ns.start(st, Math.random() * 10); } catch (e) { ns.start(st); }
      ns.stop(st + nt.d + 0.02);
    }
    this.voices++;
    setTimeout(function () {
      self.voices--;
      try { out.disconnect(); far.disconnect(); lvl.disconnect(); send.disconnect(); if (pan) pan.disconnect(); } catch (e) {}
    }, (last + 1.2) * 1000);
  },

  scheduleChirp: function () {
    var self = this;
    clearTimeout(this.chirpTimer);
    var gap = self.voice === 'hawk' ? 20000 + Math.random() * 50000 : 4000 + Math.random() * 15000;
    this.chirpTimer = setTimeout(function () {
      if (!document.hidden) self.call();
      self.scheduleChirp();
    }, gap);
  },

  reset: function (P) {
    clearTimeout(this.chirpTimer);
    clearTimeout(this.swellTimer);
    clearTimeout(this.cricketTimer);
    clearTimeout(this.frogTimer);
    clearTimeout(this.thunderTimer);
    clearTimeout(this.eventTimer);
    clearTimeout(this.visitorTimer);
    this.visitorOn = false;
    this.P = P;
    if (!this.ctx) return;
    for (var i = 0; i < this.layers.length; i++) {
      try { this.layers[i].src.stop(); } catch (e) {}
      if (this.layers[i].lfo) { try { this.layers[i].lfo.stop(); } catch (e) {} }
      try {
        this.layers[i].src.disconnect(); this.layers[i].gain.disconnect();
        this.layers[i].send.disconnect();
      } catch (e) {}
    }
    this.layers = [];
    this.surfLow = this.surfHi = this.rustle = null;
    this.buildLayers();
    if (this.on && this.birdsong) this.scheduleChirp();
  },

  toggle: function () {
    if (!this.ready) this.build();
    if (!this.ctx) return false;
    this.on = !this.on;
    if (this.on && this.ctx.state === 'suspended') this.ctx.resume();
    if (this.on && this.birdsong) this.scheduleChirp(); else clearTimeout(this.chirpTimer);
    /* a slow fade in and out: nothing here should ever start abruptly */
    this.master.gain.setTargetAtTime(this.on ? 0.85 : 0, this.ctx.currentTime, this.on ? 1.6 : 0.9);
    return this.on;
  },

  update: function (gust, open) {
    if (!this.on || !this.windFilter) return;
    open = open || 0;
    var ctx = this.ctx, t = ctx.currentTime, w = this.P.windBase;
    /* the sound of a gust reaches you after you have watched it cross the grass */
    this.lag = this.lag == null ? gust : this.lag + (gust - this.lag) * 0.012;
    var g = this.lag;
    var bd = this.bed || { gain: 0.2, gust: 0.34, freq: 420 };
    var f = (bd.freq * (0.6 + g * 1.3 * (0.4 + w))) * (1 + open * 1.4);
    this.windFilter.frequency.setTargetAtTime(f, t, 0.7);
    this.windGain.gain.setTargetAtTime((bd.gain + g * bd.gust * w) * (1 + open * 0.8), t, 0.8);
    var rs = bd.gust / 0.32;
    if (this.res1) this.res1.gain.gain.setTargetAtTime((0.05 + g * 0.10 * w) * rs, t, 1.1);
    if (this.res2) this.res2.gain.gain.setTargetAtTime((0.02 + g * 0.07 * w) * rs, t, 1.3);
    if (this.rustle) this.rustle.gain.gain.setTargetAtTime(Math.max(0, (g - 0.35)) * 0.16 * w * (1 + open), t, 0.5);
    /* opening the sash moves you out of the room and into the weather */
    if (this.dry) this.dry.gain.setTargetAtTime(0.82 + open * 0.25, t, 0.6);
    if (this.room) this.room.frequency.setTargetAtTime(3400 + open * 14000, t, 0.5);
    this.visitorSound(App.t || 0);
    if (this.wet) this.wet.gain.setTargetAtTime(0.30 - open * 0.14, t, 0.6);
    if (this.master) this.master.gain.setTargetAtTime(0.85 + open * 0.4, t, 0.6);
  }
};

/* ============================================================
   12. loop
   ============================================================ */
function loop() {
  requestAnimationFrame(loop);
  if (document.hidden) return;
  var dt = Math.min(App.clock.getDelta(), 0.05);
  var t = App.t + dt;
  App.t = t;
  var U = App.U, P = App.P;

  /* wind: three incommensurate waves so gusts never repeat */
  var g = 0.42
    + 0.30 * Math.sin(t / P.gustPeriod)
    + 0.18 * Math.sin(t / (P.gustPeriod * 2.71) + 1.1)
    + 0.14 * Math.sin(t / (P.gustPeriod * 0.41) + 2.3);
  var lull = Math.pow(0.5 + 0.5 * Math.sin(t * 0.0093 - 0.4), 2);
  U.uGust.value = clamp(g * (0.55 + 0.75 * lull), 0.05, 1.35);
  U.uWind.value = P.windBase * (0.8 + 0.35 * lull);

  /* the wind slowly changes its mind about direction */
  var ang = P.windAngle + Math.sin(t * 0.0071) * 0.55 + t * P.windTurn * 0.02;
  U.uWindDir.value.set(Math.cos(ang), Math.sin(ang));

  U.uTime.value = t;
  U.uCamPos.value.copy(App.camera.position);

  /* lightning: rare, brief, and followed by its thunder after a distance */
  if (P.weather.lightning) {
    App.nextFlash = App.nextFlash == null ? t + 6 + Math.random() * 14 : App.nextFlash;
    if (t >= App.nextFlash) {
      App.flash = 0.7 + Math.random() * 0.5;
      App.flashAgain = t + 0.08 + Math.random() * 0.12;      /* the second strike */
      App.nextFlash = t + 18 + Math.random() * 45;
      var far = 1.0 + Math.random() * 4.5;                    /* seconds -> roughly km */
      Sound.thunderIn(far, 1.0 - far / 6.5);
    }
    if (App.flashAgain && t >= App.flashAgain) { App.flash = Math.max(App.flash || 0, 0.9); App.flashAgain = null; }
    App.flash = (App.flash || 0) * Math.exp(-dt * 11);
  } else App.flash = 0;

  /* clouds drift by integrating velocity, wrapped into the texture's tile */
  var S = App.skyU;
  var cs = 0.0018 + P.windBase * 0.0030;
  var o1 = S.uOff1.value, o2 = S.uOff2.value;
  o1.x = (o1.x + Math.cos(ang) * cs * dt) % 1;
  o1.y = (o1.y + Math.sin(ang) * cs * dt) % 1;
  o2.x = (o2.x + Math.cos(ang + 0.32) * cs * 2.1 * dt) % 1;
  o2.y = (o2.y + Math.sin(ang + 0.32) * cs * 2.1 * dt) % 1;

  updateWeather(t);
  if (!switching && App.bakedSun && App.H && App.bakedSun.angleTo(U.uSunDir.value) > 0.13) {
    applyShadowMap(bakeShadows(P, App.H, U.uSunDir.value));
  }

  /* a breath of camera movement, plus a whisper of parallax */
  var p = App.pointer;
  p.x += (p.tx - p.x) * Math.min(1, dt * 1.6);
  p.y += (p.ty - p.y) * Math.min(1, dt * 1.6);
  var cam = App.camera;
  var breathe = App.reduceMotion ? 0 : 0.85;
  cam.position.x = p.x * 0.11 + Math.sin(t * 0.079) * 0.007 * breathe;
  cam.position.y = P.win.cy + p.y * -0.05 + Math.sin(t * 0.061 + 1.2) * 0.005 * breathe;
  cam.position.z = App.camDist + Math.sin(t * 0.043) * 0.006 * breathe;
  cam.lookAt(p.x * 0.5, P.win.cy - PITCH * (20 + App.camDist) + p.y * -0.35, -20);
  App.sky.position.copy(cam.position);

  /* the sash swings, and the world gets louder through the gap */
  var wantOpen = App.sashOpen ? 1 : 0;
  App.sashAngle = App.sashAngle == null ? 0 : App.sashAngle;
  App.sashAngle += (wantOpen - App.sashAngle) * Math.min(1, dt * 1.7);
  if (App.sash) App.sash.rotation.y = -App.sashAngle * Math.min(0.62, Math.asin(Math.min(0.9, (App.camDist - 0.55) / Math.max(P.win.w, 0.5))));
  if (App.frostMat) App.frostMat.opacity += (App.frostTarget - App.frostMat.opacity) * Math.min(1, dt * 0.05);
  if (App.glassMat) App.glassMat.opacity *= (1 - App.sashAngle * 0.75);

  Sound.update(U.uGust.value, App.sashAngle);
  FX.update(dt, t);
  renderFrame();

  /* the Ingredients-Seed on the bar follows the scene's clock */
  if (App.refreshCode && (App.codeTick == null || t - App.codeTick >= 1)) { App.codeTick = t; App.refreshCode(); }
  if (App.urlOk && !switching && (App.urlTick == null || t - App.urlTick >= 15)) {
    App.urlTick = t;
    try { history.replaceState({}, '', '?code=' + encodeScene()); } catch (e) {}
  }

  /* change the view on a timer, if asked */
  App.elapsed += dt;
  if (App.autoMin > 0) {
    if (!switching && App.elapsed > App.autoMin * 60) go(randomSeed());
    var left = Math.max(0, Math.ceil(App.autoMin * 60 - App.elapsed));
    var txt = 'auto: ' + Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + (left % 60);
    if (txt !== App.autoTxt) {
      App.autoTxt = txt;
      setLabel('bAuto', txt);
    }
  }

  /* keep it smooth: shed pixels, then blades, if the machine is struggling */
  App.frameAvg = App.frameAvg * 0.94 + (dt * 1000) * 0.06;
  if (t - App.lastChange > 2.4) {
    if (App.frameAvg > 26 && App.quality < 3) { App.quality++; applyQuality(); App.lastChange = t; }
    else if (App.frameAvg < 13.5 && App.quality > 0) { App.quality--; applyQuality(); App.lastChange = t; }
  }
  /* in auto, settle on a detail tier once we have seen real frames */
  if (App.qAuto && !switching && App.qChanges < 8) {
    App.qSettle += dt;
    if (App.qSettle > 5) {
      App.qSettle = 0;
      var want = App.qTier;
      if (App.frameAvg > 30 && App.qTier > 0) want = App.qTier - 1;
      else if (App.frameAvg < 11 && App.quality === 0 && App.qTier < QUALITY.length - 1) want = App.qTier + 1;
      if (want !== App.qTier) {
        App.qTier = want;
        App.qChanges++;
        setTier(App.qTier, true);
      }
    }
  }
}

function setTier(tier, keepAuto) {
  if (switching) return;
  var seed = App.P.seed;
  App.qTier = tier;
  if (!keepAuto) { App.qAuto = false; App.qChanges = 99; }
  App.quality = 0;
  App.frameAvg = 16;
  updateHUD(App.P);
  transition(function () { buildWorld(seed); }, 320);
}

function applyQuality() {
  App.renderer.setPixelRatio(qualityRatio());
  App.renderer.setSize(window.innerWidth, window.innerHeight, false);
  setupPost();
  var mul = [1, 1, 0.72, 0.5][App.quality];
  var soft = lerp(1, 0.6, App.quality / 3);
  var trim = function (mesh, factor) {
    if (!mesh || mesh.userData.noTrim || !mesh.geometry.attributes.iPos) return;
    if (mesh.userData.full == null) mesh.userData.full = mesh.geometry.instanceCount;
    mesh.geometry.instanceCount = Math.max(1, Math.floor(mesh.userData.full * factor));
  };
  if (App.grass) App.grass.geometry.instanceCount = Math.floor(App.grassMax * mul);
  trim(App.rain, soft); trim(App.snow, soft); trim(App.leaves, soft);
  trim(App.dust, soft); trim(App.falls, soft); trim(App.birdMesh, soft);
  var lists = (App.propMeshes || []).concat(App.flowerMeshes || []);
  for (var li = 0; li < lists.length; li++) trim(lists[li], mul);
}

/* ============================================================
   13. controls
   ============================================================ */
var wakeTimer = null, hudHeld = false, setPickOpen = function () {};
function wake(hold) {
  var hud = document.getElementById('hud');
  hud.classList.add('awake');
  clearTimeout(wakeTimer);
  if (hold || hudHeld || App.pinned) return;
  wakeTimer = setTimeout(function () {
    var focused = hud.contains && document.activeElement && hud.contains(document.activeElement);
    if (hudHeld || focused) return;
    hud.classList.remove('awake');
    /* the panel is part of the bar: it goes when the bar goes */
    var panel = document.getElementById('pick');
    if (panel && !panel.hidden) setPickOpen(false, true);
  }, 2800);
}
/* Put the bar away now rather than waiting out its timer. Three things hold
   it open - the pointer resting on it, focus inside it, and the pin - so all
   three have to be let go of, or it would come straight back. */
function hideHud() {
  var hud = document.getElementById('hud');
  clearTimeout(wakeTimer);
  hudHeld = false;
  if (App.pinned) {
    App.pinned = false;
    Prefs.set('pinned', false);
    var pin = document.getElementById('bPin');
    pin.classList.remove('pinned');
    pin.setAttribute('aria-pressed', 'false');
    pin.title = 'Keep this bar on screen';
  }
  if (document.activeElement && hud.contains(document.activeElement)) document.activeElement.blur();
  var panel = document.getElementById('pick');
  if (panel && !panel.hidden) setPickOpen(false, true);
  hud.classList.remove('awake');
}

var switching = false;
/* every world swap goes through here, so two can never overlap and strand the
   curtain or the flag */
function transition(build, delay) {
  if (switching) return false;
  switching = true;
  var curtain = document.getElementById('curtain');
  curtain.classList.remove('gone');
  setTimeout(function () {
    try { build(); renderFrame(); }
    catch (e) { switching = false; curtain.classList.add('gone'); throw e; }
    requestAnimationFrame(function () { curtain.classList.add('gone'); switching = false; });
  }, delay || 440);
  return true;
}
function go(seed) {
  if (!parseSeed(seed).valid) return false;
  return transition(function () { buildWorld(seed); });
}

function applyView() {
  var v = App.locks.view;
  App.sashOpen = v === 'open';
  App.bare = v === 'bare';
  if (App.room) App.room.visible = !App.bare;
}

function setLabel(id, text) {
  var el = document.getElementById(id);
  if (!el) return;
  var sp = el.querySelector ? el.querySelector('span') : null;
  if (sp) sp.textContent = text; else el.textContent = text;
}

function syncPicks() {
  var map = { selBiome: 'biome', selWeather: 'weather', selTime: 'time', selWindow: 'window',
              selFinish: 'finish', selSeason: 'season' };
  for (var id in map) {
    var el = document.getElementById(id);
    if (el) el.value = App.locks[map[id]] || '';
  }
  var nEl = document.getElementById('selNight');
  if (nEl) nEl.value = App.locks.night || '';
  var vEl = document.getElementById('selView');
  if (vEl) vEl.value = App.locks.view || '';
}

function updateHUD(P) {
  var windWord = P.windBase > 0.9 ? 'a hard' : (P.windBase > 0.55 ? 'a steady' : 'a light');
  var hour = App.liveClock ? (App.liveLabel ? TIMES[App.liveLabel].label + ' (your time)' : 'your local time')
    : TIMES[P.timeA].label;
  var EXTRA = '';
  if (P.biomeKey === 'bridge') EXTRA = ' &middot; a ' + { suspension: 'suspension bridge', arch: 'steel arch', girder: 'girder bridge', stone: 'stone viaduct' }[P.bridgeKind];
  if (P.biomeKey === 'penthouse') EXTRA = ' &middot; ' + Math.round(P.storey / 3.2) + ' floors up';
  if (P.biomeKey === 'cascade') EXTRA = ' &middot; ' + (P.fallDrops > 1 ? P.fallDrops + '-step cascade' : Math.round(P.fallH) + 'm drop');
  if (P.biomeKey === 'canyon') EXTRA = ' &middot; ' + Math.round(P.canyonDepth) + 'm deep' + (P.hasCanyonRiver ? ', river below' : '');
  if (P.biomeKey === 'oasis' && P.hasCamp) EXTRA = ' &middot; a camp by the water';
  var LMNAME = { lighthouse: 'a lighthouse', windmill: 'a windmill', tower: 'an old tower', barn: 'a barn',
    house: 'an empty house', smokestack: 'a chimney stack',
    silo: 'a grain silo', cabin: 'a cabin', pagoda: 'a pagoda', watertank: 'a water tank', jetty: 'a jetty' };
  document.getElementById('note').innerHTML = P.biome.label + ' in ' + P.season.label + ' &middot; ' + P.weather.label +
    ' &middot; ' + hour + ' &middot; ' + windWord + ' ' + P.windName +
    EXTRA + (P.landmarkName && LMNAME[P.landmarkName] ? ' &middot; ' + LMNAME[P.landmarkName] + ' in the distance' : '');
  if (App.refreshCode) App.refreshCode();
  setLabel('bSound', Sound.on ? 'sound: on' : 'sound: off');
  setLabel('bPanes', App.clearPanes ? 'panes: off' : 'panes: on');
  setLabel('bMotion', App.mouseMotion ? 'motion: on' : 'motion: off');
  setLabel('bQual', 'detail: ' + (App.qAuto ? 'auto\u00b7' + Q().name : Q().name));
  var pinBtn = document.getElementById('bPin');
  pinBtn.classList.toggle('pinned', !!App.pinned);
  pinBtn.setAttribute('aria-pressed', App.pinned ? 'true' : 'false');
  syncPicks();

  App.autoTxt = null;
  setLabel('bAuto', App.autoMin ? 'auto: ' + App.autoMin + ':00' : 'auto: off');
  wake();
}

function bindUI() {
  var codeval = document.getElementById('codeval');
  var refreshCode = function () { if (App.P) codeval.textContent = encodeScene(); };
  App.refreshCode = refreshCode;

  var copyText = function (text, btn, iconHtml) {
    var done = function () {
      btn.innerHTML = TICK_ICON; btn.classList.add('done');
      setTimeout(function () { btn.innerHTML = iconHtml; btn.classList.remove('done'); }, 1500);
    };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  };
  var COPY_ICON = document.getElementById('bCopy').innerHTML;
  document.getElementById('bCopy').addEventListener('click', function () { copyText(encodeScene(), this, COPY_ICON); });

  /* the paste dialog takes a full Ingredients-Seed or a bare seed */
  var paste = document.getElementById('paste'), pasteIn = document.getElementById('pasteIn'), pasteMsg = document.getElementById('pasteMsg');
  var openPaste = function () {
    paste.hidden = false; pasteMsg.textContent = '';
    pasteIn.value = '';
    if (pasteIn.focus) pasteIn.focus();
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (t) {
        if (t && (isSceneCode(t) || parseSeed(t).valid)) pasteIn.value = t.trim();
      }, function () {});
    }
  };
  var closePaste = function () { paste.hidden = true; wake(); };
  var submitPaste = function () {
    var v = pasteIn.value.trim();
    var valid = isSceneCode(v) || parseSeed(v).valid;
    if (!valid) { pasteMsg.textContent = 'That is not an Ingredients-Seed or a seed. A seed is up to eight hex characters.'; return; }
    closePaste();
    /* a build may already be under way; if so, try again once it has landed */
    var attempt = function (n) {
      var ok = isSceneCode(v) ? applyScene(v) : go(v);
      if (!ok && n > 0) setTimeout(function () { attempt(n - 1); }, 600);
    };
    attempt(4);
  };
  document.getElementById('bPaste').addEventListener('click', openPaste);
  document.getElementById('pasteGo').addEventListener('click', submitPaste);
  document.getElementById('pasteNo').addEventListener('click', closePaste);
  pasteIn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') submitPaste();
    if (e.key === 'Escape') closePaste();
  });
  paste.addEventListener('click', function (e) { if (e.target === paste) closePaste(); });

  var newView = function (e) {
    /* plain click keeps your choices; shift-click throws them away too */
    go(seedString(randomSeed(), 0, e && e.shiftKey ? {} : App.locks));
  };
  document.getElementById('bNew').addEventListener('click', newView);
  document.getElementById('bRefresh').addEventListener('click', newView);
  var TICK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  document.getElementById('bSound').addEventListener('click', function () {
    var on = Sound.toggle();
    Prefs.set('sound', on);
    setLabel('bSound', on ? 'sound: on' : 'sound: off');
  });
  /* the choose panel: pin any ingredient, leave the rest to the seed */
  var fill = function (id, items, key) {
    var sel = document.getElementById(id);
    var html = '<option value="">any</option>';
    for (var i = 0; i < items.length; i++) {
      html += '<option value="' + items[i][0] + '">' + items[i][1] + '</option>';
    }
    sel.innerHTML = html;
    sel.addEventListener('change', function () {
      App.locks[key] = sel.value || null;
      var cur = parseSeed(App.P.seed);
      go(seedString(cur.base, cur.nonce, App.locks));
    });
    return sel;
  };
  var bl = [], wl = [], tl = [], winl = [], fl = [], sl = [], k;
  for (var si3 = 0; si3 < SEASON_ORDER.length; si3++) sl.push([SEASON_ORDER[si3], SEASONS[SEASON_ORDER[si3]].label]);
  for (k in BIOMES) bl.push([k, BIOMES[k].label]);
  bl.sort(function (a, b) { return a[1] < b[1] ? -1 : 1; });
  for (k in WEATHERS) wl.push([k, WEATHERS[k].label]);
  for (var ti = 0; ti < TIME_ORDER.length; ti++) tl.push([TIME_ORDER[ti], TIMES[TIME_ORDER[ti]].label]);
  for (var wi = 0; wi < WINDOW_TYPES.length; wi++) winl.push([WINDOW_TYPES[wi].name, WINDOW_TYPES[wi].name]);
  for (var fi = 0; fi < FINISHES.length; fi++) fl.push([FINISHES[fi].name, FINISHES[fi].name]);
  fill('selBiome', bl, 'biome');
  fill('selWeather', wl, 'weather');
  fill('selTime', tl, 'time');
  fill('selWindow', winl, 'window');
  fill('selFinish', fl, 'finish');
  fill('selSeason', sl, 'season');

  var pickBtn = document.getElementById('bPick');
  setPickOpen = function (open, quiet) {
    var panel = document.getElementById('pick');
    panel.hidden = !open;
    pickBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    pickBtn.title = open ? 'Close the choices' : 'Choose the ingredients yourself';
    if (open) { var f = document.getElementById('selBiome'); if (f && f.focus) f.focus(); }
    else if (!quiet && pickBtn.focus) pickBtn.focus();
    if (!quiet) wake();
  };
  pickBtn.addEventListener('click', function () {
    setPickOpen(document.getElementById('pick').hidden);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !document.getElementById('pick').hidden) setPickOpen(false);
  });
  document.getElementById('selNight').addEventListener('change', function () {
    App.locks.night = this.value === 'off' ? 'off' : null;
    var c1 = parseSeed(App.P.seed);
    go(seedString(c1.base, c1.nonce, App.locks));
  });
  document.getElementById('selClock').addEventListener('change', function () {
    App.liveClock = this.value === 'live';
    updateHUD(App.P);
  });
  document.getElementById('selView').addEventListener('change', function () {
    App.locks.view = this.value || null;
    applyView();
    var c2 = parseSeed(App.P.seed);
    writeSeedToUrl(seedString(c2.base, c2.nonce, App.locks));
    App.P.seed = seedString(c2.base, c2.nonce, App.locks);
    updateHUD(App.P);
  });

  document.getElementById('bClear').addEventListener('click', function () {
    for (var key in App.locks) App.locks[key] = null;
    syncPicks();
    var cur0 = parseSeed(App.P.seed);
    go(seedString(cur0.base, cur0.nonce, App.locks));
  });

  document.getElementById('bShuffle').addEventListener('click', function () {
    var sp = parseSeed(App.P.seed);
    go(seedString(sp.base, sp.nonce + 1, sp.locks));
  });

  var Q_STEPS = ['auto', 'low', 'medium', 'high', 'ultra'];
  document.getElementById('bQual').addEventListener('click', function () {
    var cur = App.qAuto ? 0 : App.qTier + 1;
    var next = (cur + 1) % Q_STEPS.length;
    if (next === 0) {
      App.qAuto = true; App.qChanges = 0; App.qSettle = 0;
      Prefs.set('qAuto', true);
      updateHUD(App.P);
    } else {
      Prefs.set('qAuto', false);
      Prefs.set('qTier', next - 1);
      setTier(next - 1, false);
    }
  });

  document.getElementById('bMotion').addEventListener('click', function () {
    App.mouseMotion = !App.mouseMotion;
    Prefs.set('motion', App.mouseMotion);
    setLabel('bMotion', App.mouseMotion ? 'motion: on' : 'motion: off');
    if (!App.mouseMotion) { App.pointer.tx = 0; App.pointer.ty = 0; }
  });

  document.getElementById('bPin').addEventListener('click', function () {
    App.pinned = !App.pinned;
    Prefs.set('pinned', App.pinned);
    this.classList.toggle('pinned', App.pinned);
    this.setAttribute('aria-pressed', App.pinned ? 'true' : 'false');
    this.title = App.pinned ? 'Let the bar fade again' : 'Keep this bar on screen';
    wake();
  });

  document.getElementById('bClose').addEventListener('click', hideHud);

  document.getElementById('bTools').addEventListener('click', function () {
    App.showTools = !App.showTools;
    Prefs.set('tools', App.showTools);
    document.getElementById('hud').classList.toggle('notools', !App.showTools);
    this.setAttribute('aria-expanded', App.showTools ? 'true' : 'false');
    wake();
  });

  document.getElementById('bPanes').addEventListener('click', function () {
    App.clearPanes = !App.clearPanes;
    Prefs.set('panes', App.clearPanes);
    setLabel('bPanes', App.clearPanes ? 'panes: off' : 'panes: on');
    sizeWindow(App.P, App.camera.aspect);
    rebuildRoom();
  });

  var AUTO_STEPS = [0, 5, 15, 30];
  document.getElementById('bAuto').addEventListener('click', function () {
    var i = (AUTO_STEPS.indexOf(App.autoMin) + 1) % AUTO_STEPS.length;
    App.autoMin = AUTO_STEPS[i];
    Prefs.set('autoMin', App.autoMin);
    App.elapsed = 0;
    App.autoTxt = null;
    setLabel('bAuto', App.autoMin ? 'auto: ' + App.autoMin + ':00' : 'auto: off');
    this.title = App.autoMin
      ? 'A new view every ' + App.autoMin + ' minutes'
      : 'Change the view on a timer';
  });

  var hud = document.getElementById('hud');
  hud.addEventListener('pointerenter', function () { hudHeld = true; wake(true); });
  hud.addEventListener('pointerleave', function () { hudHeld = false; wake(); });

  window.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || !document.getElementById('paste').hidden) return;
    if (e.key === 'r' || e.key === 'R') go(randomSeed());
    if (e.key === 'c' || e.key === 'C') document.getElementById('bCopy').click();
    wake();
  });
  window.addEventListener('touchstart', function () { wake(); }, { passive: true });
  window.addEventListener('pointerdown', function () { wake(); }, { passive: true });
  window.addEventListener('focusin', function (e) {
    if (document.getElementById('hud').contains(e.target)) wake(true);
  });
  wake();
}

if (window.THREE) start();
else {
  document.getElementById('fallback').style.display = 'grid';
  document.getElementById('curtain').style.display = 'none';
}
})();
</script>
</body>
</html>
