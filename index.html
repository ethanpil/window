<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0d">
<title>A window, somewhere</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0a0b;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    -webkit-font-smoothing: antialiased;
    touch-action: none;
  }
  #gl, #fx {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  }
  #fx { pointer-events: none; }
  #vig {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(130% 100% at 50% 44%, rgba(0,0,0,0) 42%, rgba(0,0,0,.34) 78%, rgba(0,0,0,.62) 100%);
    mix-blend-mode: multiply;
  }
  #curtain {
    position: fixed; inset: 0; background: #0a0a0b; pointer-events: none;
    transition: opacity 620ms ease;
  }
  #curtain.gone { opacity: 0; }

  /* ---- controls: a small brass plate resting at the bottom of the room ---- */
  #hud {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: stretch;
    gap: 6px;
    padding: 9px 16px 8px;
    border-radius: 2px;
    background: rgba(16,15,14,.5);
    --hudbg: #1b1917;
    border: 1px solid rgba(214,199,170,.16);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    backdrop-filter: blur(9px) saturate(.9);
    -webkit-backdrop-filter: blur(9px) saturate(.9);
    color: #ddd3c2;
    opacity: 0;
    pointer-events: none;
    transition: opacity 900ms ease;
    z-index: 5;
    width: min(96vw, 1040px);
  }
  #hud.awake, #hud:focus-within { opacity: 1; pointer-events: auto; transition: opacity 200ms ease; }
  #hud .row {
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 7px 13px;
  }
  /* The description changes length with every seed. On its own line it cannot
     push the controls around, and each control is sized for its longest label
     so toggling one never nudges its neighbours. */
  #hud .row.desc { padding-bottom: 1px; }
  #hud .row.controls button { text-align: left; display: inline-flex; align-items: center; gap: 7px; }
  #hud .row.controls button svg { width: 13px; height: 13px; flex: none; opacity: .85; }
  #hud .row.controls button:hover svg { opacity: 1; }
  #bNew    { min-width: 11.5ch; }
  #bShuffle{ min-width: 12.5ch; }
  #bPanes  { min-width: 14.5ch; }
  #bQual   { min-width: 21.5ch; }
  #bAuto   { min-width: 14.5ch; font-variant-numeric: tabular-nums; }
  #bSound  { min-width: 14.5ch; }
  #bMotion { min-width: 15.5ch; }
  #bCopy, #bCode { min-width: 0; }
  #hud .row.sub {
    justify-content: space-between; flex-wrap: wrap;
    gap: 6px 10px;
    padding-top: 6px;
    border-top: 1px solid rgba(214,199,170,.12);
  }
  #hud .grp { display: inline-flex; align-items: center; gap: 8px; }
  #hud .grp.right { margin-left: auto; }
  #codeval {
    font: 400 10.5px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .05em; color: #e6dcc8; user-select: all; -webkit-user-select: all;
  }
  #paste {
    position: fixed; inset: 0; z-index: 8; display: grid; place-items: center;
    background: rgba(8,8,9,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  #paste[hidden] { display: none; }
  #paste .box {
    width: min(92vw, 520px); padding: 16px 18px 14px; border-radius: 2px;
    background: rgba(22,21,19,.96); border: 1px solid rgba(214,199,170,.22);
    box-shadow: 0 18px 50px rgba(0,0,0,.5); color: #ddd3c2;
  }
  #paste label { display: block; font-size: 13px; font-style: italic; margin-bottom: 8px; }
  #pasteIn {
    width: 100%; font: 400 12.5px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #efe6d4; background: rgba(0,0,0,.35); border: 1px solid rgba(214,199,170,.28);
    border-radius: 2px; padding: 8px 9px; outline: none;
  }
  #pasteIn:focus { border-color: #d8c9a4; }
  #paste .acts { display: flex; gap: 14px; justify-content: flex-end; margin-top: 10px; }
  #pasteMsg { font-size: 11.5px; color: #d9a08e; min-height: 1.2em; margin-top: 4px; }
  .lbl {
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    opacity: .48; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #hud .row.sub button { font-size: 10.5px; opacity: .8; }
  #hud.notools .row.controls { display: none; }
  #bPin.pinned .pinhead { fill: currentColor; }
  #bPin.pinned { color: #f0e4c8; }
  #bTools[aria-expanded="false"] { opacity: .55; }
  .iconbtn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 3px; min-width: 0; border-bottom: 0; line-height: 0;
  }
  .iconbtn svg { width: 14px; height: 14px; display: block; }
  #bPick svg { transition: transform 320ms ease; }
  #bPick[aria-expanded="true"] { color: #fff5e2; }
  #bPick[aria-expanded="true"] svg { transform: rotate(60deg); }
  .iconbtn:hover, .iconbtn:focus-visible { color: #fff5e2; border-bottom: 0; }
  .iconbtn.done { color: #b9d6a8; }
  #hud .row.sub button:hover { opacity: 1; }
  #note {
    font-size: 13.5px; letter-spacing: .01em; color: #cfc3ad; font-style: italic;
    white-space: normal; text-align: center; max-width: 100%;
  }
  #note b { font-weight: 400; font-style: normal; color: #efe6d4; }
  .rule { width: 1px; height: 20px; background: rgba(214,199,170,.2); flex: none; }
  button {
    font-family: inherit; font-size: 13px; color: #cfc3ad;
    background: none; border: 0; padding: 4px 2px; cursor: pointer;
    border-bottom: 1px solid transparent;
  }
  button:hover, button:focus-visible { color: #fff5e2; border-bottom-color: rgba(216,201,164,.55); outline: none; }
  #hud small { font-size: 11px; opacity: .55; }

  @media (prefers-reduced-motion: reduce) { #curtain { transition: none; } }
  #pick {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(146px, 1fr));
    gap: 8px 14px; padding: 10px 14px 6px; margin: 6px 6px 0;
    border-top: 1px solid rgba(214,199,170,.12);
  }
  #hud:not(.awake) #pick { display: none; }
  #pick[hidden] { display: none; }
  #pick label {
    display: flex; flex-direction: column; gap: 3px;
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    opacity: .55; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #pick select {
    font-family: inherit; font-size: 12px; letter-spacing: 0; text-transform: none;
    color: #e6dcc8; background: rgba(28,26,24,.9);
    border: 1px solid rgba(214,199,170,.22); border-radius: 2px;
    padding: 3px 4px; outline: none; opacity: 1;
  }
  #pick select:focus { border-color: #d8c9a4; }
  #pick > button { align-self: end; min-width: 8ch; }
  #err {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    max-width: min(920px, 92vw); padding: 8px 12px; z-index: 9;
    font: 11.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #f3d9c9; background: rgba(60,18,12,.88); border: 1px solid rgba(255,170,140,.35);
    border-radius: 2px; white-space: pre-wrap; word-break: break-word; cursor: pointer;
  }
  #err[hidden] { display: none; }
  #fallback {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    color: #cfc3ad; padding: 32px; font-size: 16px; line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<div id="vig"></div>
<div id="curtain"></div>

<div id="hud">
  <div class="row desc"><span id="note" aria-live="polite"></span></div>
  <div class="row controls" id="rowControls">
    <button id="bNew" title="Open a different window (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg><span>new view</span></button>
    <button id="bShuffle" title="Same scene, new arrangement"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg><span>reshuffle</span></button>
    <button id="bPanes" title="Show or hide the glazing bars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="12" y1="3" x2="12" y2="21"/></svg><span>panes: on</span></button>
    <button id="bQual" title="Detail level"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg><span>detail: auto</span></button>
    <button id="bAuto" title="Change the view on a timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg><span>auto: off</span></button>
    <button id="bSound" title="Ambient sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>sound: off</span></button>
    <button id="bMotion" title="View drifts with the pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg><span>motion: on</span></button>
  </div>
  <div class="row sub">
    <span class="grp">
      <button id="bPin" class="iconbtn" aria-pressed="false" aria-label="Keep this bar on screen" title="Keep this bar on screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="pinhead" d="M9.5 3h5v5l3 3.2v2h-11v-2L9.5 8V3z"/><path d="M12 13.2V21"/></svg></button>
      <button id="bRefresh" class="iconbtn" aria-label="New view" title="A new view (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg></button>
      <button id="bTools" class="iconbtn" aria-expanded="true" aria-controls="rowControls" aria-label="Show or hide the controls" title="Show or hide the controls"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button id="bPick" class="iconbtn" aria-expanded="false" aria-controls="pick" aria-label="Choose the ingredients" title="Choose the ingredients yourself"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18M3 13h18M3 19h18"/><circle cx="9" cy="7" r="2.3" fill="var(--hudbg)"/><circle cx="16" cy="13" r="2.3" fill="var(--hudbg)"/><circle cx="7" cy="19" r="2.3" fill="var(--hudbg)"/></svg></button>
    </span>
    <span class="grp right">
      <span class="lbl">Ingredients-Seed:</span>
      <span id="codeval" title="Everything that decides this scene, and the seed"></span>
      <button id="bCopy" class="iconbtn" aria-label="Copy the Ingredients-Seed" title="Copy the Ingredients-Seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button id="bPaste" class="iconbtn" aria-label="Paste an Ingredients-Seed" title="Paste an Ingredients-Seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 13h6M9 17h4"/></svg></button>
    </span>
  </div>
  <div id="pick" hidden>
    <label>landscape<select id="selBiome"></select></label>
    <label>weather<select id="selWeather"></select></label>
    <label>light<select id="selTime"></select></label>
    <label>window<select id="selWindow"></select></label>
    <label>frame<select id="selFinish"></select></label>
    <label>night<select id="selNight"><option value="">allowed</option><option value="off">never</option></select></label>
    <label>clock<select id="selClock"><option value="">from the seed</option><option value="live">my local time</option></select></label>
    <label>view<select id="selView"><option value="">window</option><option value="open">window open</option><option value="bare">no window at all</option></select></label>
    <label>season<select id="selSeason"></select></label>
    <button id="bClear">clear all</button>
  </div>
</div>

<noscript><div style="position:fixed;inset:0;display:grid;place-items:center;color:#cfc3ad;
  font:16px/1.6 Georgia,serif;text-align:center;padding:32px">
  This window is drawn with JavaScript, which is currently turned off.</div></noscript>

<div id="paste" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="pasteLbl">
    <label id="pasteLbl" for="pasteIn">Paste an Ingredients-Seed, or a seed</label>
    <input id="pasteIn" spellcheck="false" autocomplete="off" placeholder="2032518e88dc13480000-3fa9c21e">
    <div class="acts"><button id="pasteGo">open</button><button id="pasteNo">cancel</button></div>
    <div id="pasteMsg"></div>
  </div>
</div>
<div id="err" hidden></div>
<div id="fallback">This window needs WebGL, and your browser isn&rsquo;t offering it.<br>Try a different browser, or enable hardware acceleration.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* Anything that goes wrong is written to the screen, so it can be read and
   reported. Shader failures come through console.error, so that is hooked too. */
var ERRLOG = [];
function showError(msg) {
  msg = String(msg || '').slice(0, 600);
  if (ERRLOG.indexOf(msg) >= 0) return;
  ERRLOG.push(msg);
  var el = document.getElementById('err');
  if (!el) return;
  el.textContent = ERRLOG.slice(-4).join('\n\n') + '\n\n(click to dismiss)';
  el.hidden = false;
}
window.addEventListener('error', function (e) {
  showError((e.message || 'error') + (e.filename ? '' : '') + (e.lineno ? '  @' + e.lineno + ':' + (e.colno || 0) : ''));
});
window.addEventListener('unhandledrejection', function (e) {
  showError('unhandled: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
(function () {
  var orig = console.error;
  console.error = function () {
    try { showError(Array.prototype.map.call(arguments, function (a) { return typeof a === 'string' ? a : (a && a.message) || String(a); }).join(' ')); } catch (x) {}
    return orig.apply(console, arguments);
  };
})();
document.addEventListener('DOMContentLoaded', function () {
  var el = document.getElementById('err');
  if (el) el.addEventListener('click', function () { el.hidden = true; });
});

/* ============================================================
   1. seeded randomness
   ============================================================ */
function xmur3(str) {
  var h = 1779033703 ^ str.length;
  for (var i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return h >>> 0;
  };
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function RNG(seedStr) {
  var seedFn = xmur3(String(seedStr));
  var r = mulberry32(seedFn());
  var api = {
    f: r,
    range: function (a, b) { return a + r() * (b - a); },
    int: function (a, b) { return Math.floor(a + r() * (b - a + 1)); },
    pick: function (arr) { return arr[Math.floor(r() * arr.length)]; },
    chance: function (p) { return r() < p; },
    sign: function () { return r() < 0.5 ? -1 : 1; },
    gauss: function () {
      var u = 0, v = 0;
      while (u === 0) u = r();
      while (v === 0) v = r();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307 * v);
    },
    weighted: function (pairs) {
      var total = 0, i;
      for (i = 0; i < pairs.length; i++) total += pairs[i][1];
      var x = r() * total;
      for (i = 0; i < pairs.length; i++) { x -= pairs[i][1]; if (x <= 0) return pairs[i][0]; }
      return pairs[pairs.length - 1][0];
    },
    sub: function (tag) { return RNG(seedStr + '/' + tag); }
  };
  return api;
}

/* integer hash → value noise, used for terrain + textures */
function ihash(x, y, s) {
  var h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 362437);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  var x0 = Math.floor(x), y0 = Math.floor(y);
  var fx = x - x0, fy = y - y0;
  var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  var a = ihash(x0, y0, s), b = ihash(x0 + 1, y0, s);
  var c = ihash(x0, y0 + 1, s), d = ihash(x0 + 1, y0 + 1, s);
  return (a + (b - a) * sx) + ((c + (d - c) * sx) - (a + (b - a) * sx)) * sy;
}
function fbm2(x, y, s, oct) {
  var v = 0, amp = 0.5, f = 1, norm = 0;
  for (var i = 0; i < oct; i++) {
    v += vnoise(x * f, y * f, s + i * 131) * amp;
    norm += amp; amp *= 0.5; f *= 2.02;
  }
  return (v / norm) * 2 - 1;
}
/* tileable fbm on a square grid, for repeating canvas textures */
function tnoise(x, y, period, s) {
  var x0 = Math.floor(x), y0 = Math.floor(y);
  var fx = x - x0, fy = y - y0;
  var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  var xa = ((x0 % period) + period) % period, ya = ((y0 % period) + period) % period;
  var xb = (xa + 1) % period, yb = (ya + 1) % period;
  var a = ihash(xa, ya, s), b = ihash(xb, ya, s);
  var c = ihash(xa, yb, s), d = ihash(xb, yb, s);
  var t = a + (b - a) * sx;
  return t + ((c + (d - c) * sx) - t) * sy;
}
function tileFBM(size, seed, octaves, basePeriod) {
  var out = new Float32Array(size * size);
  var amp = 1, norm = 0, o, y, x, p, f;
  for (o = 0; o < octaves; o++) {
    p = basePeriod * Math.pow(2, o);
    f = p / size;
    for (y = 0; y < size; y++) {
      for (x = 0; x < size; x++) {
        out[y * size + x] += tnoise(x * f, y * f, p, seed + o * 977) * amp;
      }
    }
    norm += amp; amp *= 0.52;
  }
  for (var i = 0; i < out.length; i++) out[i] /= norm;
  return out;
}

   ============================================================ */
/* A seed is 32 bits written as hex. Up to eight hex characters are accepted
   and padded on the left; anything else is not a seed. */
function seedHex(str) {
  str = String(str == null ? '' : str).replace(/\s+/g, '');
  if (!/^[0-9a-f]{1,8}$/i.test(str)) return null;
  return ('00000000' + str.toLowerCase()).slice(-8);
}
function randomSeed() {
  var v;
  try { var a = new Uint32Array(1); window.crypto.getRandomValues(a); v = a[0]; }
  catch (e) { v = (Math.random() * 4294967296) >>> 0; }
  return ('00000000' + v.toString(16)).slice(-8);
}

function makeFinishTexture(fin, R) {
  var S = 256, c = cnv(S, S), g = c.getContext('2d');
  g.fillStyle = fin.col; g.fillRect(0, 0, S, S);
  var col = new THREE.Color(fin.col);

    for (var i = 0; i < 190; i++) {
      var y = R.f() * S;
      var d = R.range(-0.22, 0.14);
      var cc = col.clone().offsetHSL(0, 0, d * 0.35);

      g.lineWidth = R.range(0.6, 3.4);
      g.beginPath();
      g.moveTo(0, y);
      g.bezierCurveTo(S * 0.33, y + R.range(-8, 8), S * 0.66, y + R.range(-8, 8), S, y + R.range(-5, 5));

    for (var j = 0; j < 3000; j++) {
      g.fillStyle = 'rgba(255,255,255,' + (R.f() * 0.05) + ')';
      g.fillRect(R.f() * S, R.f() * S, 1.6, 1);
    }
    var lg = g.createLinearGradient(0, 0, S, S);
    lg.addColorStop(0, 'rgba(255,255,255,0.08)');
    lg.addColorStop(0.5, 'rgba(0,0,0,0.06)');
    lg.addColorStop(1, 'rgba(255,255,255,0.05)');
    g.fillStyle = lg; g.fillRect(0, 0, S, S);

    for (var k = 0; k < 6000; k++) {
      g.fillStyle = 'rgba(' + (R.f() < 0.5 ? '0,0,0,' : '255,255,255,') + (R.f() * 0.045) + ')';
      g.fillRect(R.f() * S, R.f() * S, 2, 2);

    var wear = fin.wear;
    for (var m = 0; m < 34 * wear; m++) {

      g.lineWidth = R.range(0.5, 1.3);

function makeWallTexture(P, R, wallW, wallH) {
  var S = 512, c = cnv(S, S), g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, S, S);
  /* plaster grain */
  var f = tileFBM(128, R.int(1, 99999), 4, 8);
  var im = g.getImageData(0, 0, S, S);
  for (var y = 0; y < S; y++) {
    for (var x = 0; x < S; x++) {
      var n = f[((y >> 2) % 128) * 128 + ((x >> 2) % 128)];
      var v = 210 + n * 46;
      var i = (y * S + x) * 4;
      im.data[i] = v; im.data[i + 1] = v; im.data[i + 2] = v; im.data[i + 3] = 255;
    }

  var px = function (wx) { return (wx / wallW + 0.5) * S; };
  var py = function (wy) { return (0.5 - (wy - P.win.cy) / wallH) * S; };

  var gy0 = py(P.win.cy + P.win.h / 2), gy1 = py(P.win.cy - P.win.h / 2);

}

function makeGlassTexture(R) {
  /* what a pane actually shows of the room: a broad soft sheet of light
     from one side, brighter toward the top, and nothing sharp */
  var S = 256, c = cnv(S, S), g = c.getContext('2d');

/* A soft shoulder so highlights (sun, glitter, snow) roll off instead of
   clipping, a slight lift in the shadows, and a touch more saturation. */
var GLSL_TONE = "vec3 tone(vec3 c){ c = 1.0 - exp(-c * 1.42); float l = dot(c, vec3(0.30, 0.59, 0.11)); return mix(vec3(l), c, 1.08); }";

  'uniform sampler2D uShadowMap; uniform vec2 uShadowOrigin, uShadowScale;',
  'float baked(vec2 xz){ return texture2D(uShadowMap, (xz - uShadowOrigin) * uShadowScale).r; }',
  'float fogAmt(float d, float density){ float f = density * d; return 1.0 - exp(-f*f); }',
  'uniform float uHazeK;',
  'vec3 hazeToward(vec3 fogCol, vec3 viewDir, vec3 sunDir, vec3 sunCol){ float f = pow(max(dot(viewDir, normalize(sunDir)), 0.0), 3.0) * uHazeK; return fogCol + sunCol * f * 0.12; }',

  'const float SHADOW_WAVELENGTH = 0.0295;  // radians per metre',
  'const float SHADOW_DRIFT = 0.082;        // radians per second',
  'float cloudShade(vec2 p, float t){',
  '  float v = sin(p.x*SHADOW_WAVELENGTH + t*SHADOW_DRIFT) * sin(p.y*0.0261 - t*0.067);',

      } catch (e2) {}
    }

    return this.mem;
  },
  write: function () {
    var json = JSON.stringify(this.mem || {});
    try { window.localStorage.setItem(this.key, json); return 'local'; } catch (e) {}
    try {
      document.cookie = 'windowprefs=' + encodeURIComponent(json) + ';path=/;max-age=31536000;SameSite=Lax';

  set: function (k, v) { this.read(); this.mem[k] = v; return this.write(); },
  get: function (k, dflt) { var o = this.read(); return o[k] === undefined ? dflt : o[k]; }

/* ============================================================
   7. the world
   ============================================================ */
var App = {};

/* The page may be running somewhere the URL can't be touched (a sandboxed
   iframe, a file:// document). Seeds still work; they just live in memory. */
function readSeedFromUrl() {
  try {
    var q = new URLSearchParams(location.search);
    var code = q.get('code');
    if (code) { var d = decodeScene(code); if (d) { App.pendingT = d.t; App.qAuto = d.qAuto; App.qTier = d.qTier; App.clearPanes = d.panes; return d.seed; } }
    var sd = q.get('seed');
    return sd && parseSeed(sd).valid ? sd : null;
  } catch (e) { return null; }
}
function writeSeedToUrl(seed) {
  try {
    var code = App.P ? encodeScene() : null;
    history.replaceState({}, '', code ? '?code=' + code : '?seed=' + encodeURIComponent(seed));
    App.urlOk = true;
  } catch (e) {
    App.urlOk = false;
  }
}

function disposeDeep(obj, seen) {
  seen = seen || App._disposed || (App._disposed = []);
  var once = function (t) {
    if (!t || seen.indexOf(t) >= 0) return;
    seen.push(t);
    if (t.userData && t.userData.cacheKey) return;   /* shared across worlds */
    t.dispose();
  };
  obj.traverse(function (n) {
    if (n.geometry) n.geometry.dispose();
    var mats = n.material ? (Array.isArray(n.material) ? n.material : [n.material]) : [];
    for (var i = 0; i < mats.length; i++) {
      var m = mats[i], k;
      for (k in m) { if (m[k] && m[k].isTexture) once(m[k]); }
      if (m.uniforms) {
        for (k in m.uniforms) {
          var v = m.uniforms[k] && m.uniforms[k].value;
          if (v && v.isTexture) once(v);
        }
      }
      m.dispose();
    }
  });
}

function clearWorld() {
  var scene = App.scene;
  if (!scene) return;
  App._disposed = [];
  while (scene.children.length) {
    var c = scene.children[0];
    scene.remove(c);
    disposeDeep(c);
  }
  App.sky = App.terrain = App.grass = App.birdMesh = App.water = null;
  App.rain = App.snow = App.room = App.glass = App.glassMat = null;
  App.dust = App.falls = App.leaves = App.visitor = App.shadows = null;
  App.visitorInfo = null;
  App.flowerMeshes = App.propMeshes = null;
}

function buildWorld(seed) {
  clearWorld();
  var P = buildParams(seed);
  App.P = P;
  App.locks = P.locks;                     /* keep the dropdowns in step */
  applyView();

  var scene = App.scene;
  App._shadows = [];
  App._features = [];
  App._cardMat = null;
  sizeWindow(P, window.innerWidth / window.innerHeight);
  var R = RNG(P.base + '/build' + (P.nonce ? '/' + P.nonce : ''));
  var H = makeHeightField(P);
  App.H = H;
  if (P.waterY != null) {
    P.shoreZ = -30;
    for (var sz = -4; sz > -260; sz -= 2) {
      if (H(0, sz) < P.waterY) { P.shoreZ = sz; break; }
    }
  }
  /* how high does this land actually reach in view? snow and rock follow from that */
  var maxH = 0;
  for (var mz = -20; mz > -700; mz -= 22) {
    for (var mx = -420; mx <= 420; mx += 28) {
      var hh = H(mx, mz);
      if (hh > maxH) maxH = hh;
    }
  }
  P.rockLine = P.rockFrac != null ? maxH * P.rockFrac : 1e6;
  P.snowLine = P.snowFrac != null ? maxH * P.snowFrac : 1e6;

  var U = {
    uTime:      { value: 0 },
    uWind:      { value: P.windBase },
    uGust:      { value: 0.5 },
    uWindDir:   { value: new THREE.Vector2(Math.cos(P.windAngle), Math.sin(P.windAngle)) },
    uSunDir:    { value: new THREE.Vector3(0, 0.6, -0.8) },
    uSunCol:    { value: new THREE.Color(0xffffff) },
    uAmbCol:    { value: new THREE.Color(0x808080) },
    uFogCol:    { value: new THREE.Color(0xc8d8e4) },
    uFogDensity:{ value: P.weather.fogD * P.hazeMul },
    uShadow:    { value: P.weather.shadow },
    uSnow:      { value: P.baseSnow || 0 },
    uSnowCol:   { value: new THREE.Color(0xeef2f7) },
    uCamPos:    { value: new THREE.Vector3() },
    uHazeK:     { value: 1.0 },
    uShadowMap: { value: (function () {
      var t = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1, THREE.RGBAFormat);
      t.needsUpdate = true; return t;
    })() },
    uShadowOrigin: { value: new THREE.Vector2(SHADOW.x0, SHADOW.z0) },
    uShadowScale: { value: new THREE.Vector2(1 / (SHADOW.x1 - SHADOW.x0), 1 / (SHADOW.z1 - SHADOW.z0)) }
  };
  App.U = U;

  buildSky(scene, P, R, U);
  buildTerrain(scene, P, R, U, H);
  H = App.Hm;                              /* the drawn surface, for everything that follows */
  App.H = H;
  buildWater(scene, P, R, U);
  buildGrass(scene, P, R, U, H);
  buildFlowers(scene, P, R, U, H);
  buildProps(scene, P, R, U, H);
  buildClutter(scene, P, R, U, H);
  buildCritters(scene, P, R, U, H);
  buildLandmark(scene, P, R, U, H);
  if (P.hasCamp && P.oasisX != null) {
    /* a few tents pitched at the water's edge, with a fire going */
    var tb = { pos: [], nor: [], idx: [], rib: [] };
    pushCone(tb, 0, 0, 0, 0.62, 1.0, 4);
    var ttpl = finishGeo(tb);
    var tmat = solidMat(U, R.pick(['#c8b48c', '#b8a179', '#8d7d5e']), { rib: 0, grain: 0, spines: 0 });
    var tents = [], tg = 0;
    while (tents.length < R.int(2, 5) && tg < 200) {
      tg++;
      var ta = R.range(0, 6.283), tr = P.oasisW * R.range(0.75, 1.15);
      var tx = P.oasisX + Math.cos(ta) * tr, tz = P.oasisZ + Math.sin(ta) * tr;
      if (H(tx, tz) < P.waterY + 0.4) continue;
      var ts = R.range(2.4, 3.6);
      tents.push([tx, H(tx, tz), tz, ts, R.range(0, 6.283), 1, 1]);
      App._shadows.push([tx, H(tx, tz), tz, ts * 0.5, 0.8, ts]);
    }
    if (tents.length) {
      instanceSolid(scene, ttpl, tents, tmat);
      buildSmoke(scene, P, R, U, tents[0][0] + 4, tents[0][1] + 0.5, tents[0][2] + 3, 4.5);
    }
  }
  if ((P.terrainKind || P.biome.terrain) === 'cascade') buildCascadeFall(scene, P, R, U, H);
  buildBoundaries(scene, P, R, U, H);
  buildHerd(scene, P, R, U, H);
  buildWaterLife(scene, P, R, U, H);
  buildRidges(scene, P, R, U);
  buildFlyers(scene, P, R, U, H);
  buildMotes(scene, P, R, U, H);
  buildDust(scene, P, R, U, H);
  buildFalls(scene, P, R, U, H);
  buildBirds(scene, P, R, U);
  buildVisitors(scene, P, R, U, H);
  buildPrecip(scene, P, R, U);
  buildRoom(scene, P, U);

  var sun = new THREE.DirectionalLight(0xffffff, 0.85);
  scene.add(sun); scene.add(sun.target);
  App.sun = sun;
  var fill = new THREE.DirectionalLight(0xffffff, 0.55);
  fill.position.set(0.4, 0.55, 1);
  scene.add(fill);
  App.fill = fill;
  var amb = new THREE.AmbientLight(0xffffff, 0.34);
  scene.add(amb);
  App.amb = amb;

  updateWeather(App.t || 0);
  applyShadowMap(bakeShadows(P, H, U.uSunDir.value));
  FX.init(P, R);
  Sound.reset(P);
  App.t = App.pendingT != null ? App.pendingT : R.range(0, 500);
  App.pendingT = null;

  writeSeedToUrl(P.seed);                  /* now that the clock is set, the code is complete */
  App.elapsed = 0;
  App.nextFlash = null; App.flash = 0; App.flashAgain = null;
  App.wetness = P.weather.rain > 0 ? 1 : (R.f() < 0.18 ? R.range(0.4, 1) : 0);
  App.bowTarget = 0; App.skyU.uBow.value = 0;
  layout();
  updateHUD(P);
  updateWeather(App.t);
}

function start() {
  var canvas = document.getElementById('gl');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: canvas, antialias: true, alpha: false,
      powerPreference: 'high-performance', stencil: false, depth: true
    });
  } catch (e) { renderer = null; }
  if (!renderer) {
    document.getElementById('fallback').style.display = 'grid';
    document.getElementById('curtain').style.display = 'none';
    return;
  }
  App.renderer = renderer;
  try { App.maxAniso = Math.min(16, renderer.capabilities.getMaxAnisotropy() || 4); } catch (e) { App.maxAniso = 4; }
  renderer.setClearColor(0x0a0a0b, 1);

  App.scene = new THREE.Scene();
  App.camera = new THREE.PerspectiveCamera(52, 1, 0.3, 7000);
  App.clock = new THREE.Clock();
  App.quality = 0;
  App.frameAvg = 16;
  App.lastChange = 0;
  App.urlOk = false;
  App.elapsed = 0;
  App.clearPanes = !!Prefs.get('panes', false);
  App.autoMin = Prefs.get('autoMin', 0);
  App.pinned = !!Prefs.get('pinned', false);
  App.showTools = Prefs.get('tools', true);
  App.wantSound = !!Prefs.get('sound', false);
  App.noNight = false;
  App.liveClock = false;
  App.sashOpen = false;
  App.bare = false;
  App.sashAngle = 0;
  App.locks = { biome: null, weather: null, time: null, window: null, finish: null,
                season: null, view: null, night: null };
  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  App.reduceMotion = !!(rm && rm.matches);
  App.mouseMotion = App.reduceMotion ? false : !!Prefs.get('motion', true);
  if (rm && rm.addEventListener) rm.addEventListener('change', function (e) {
    App.reduceMotion = e.matches;
    if (e.matches) { App.mouseMotion = false; App.pointer.tx = 0; App.pointer.ty = 0; }
    updateHUD(App.P);
  });
  App.qTier = clamp(Prefs.get('qTier', 1), 0, QUALITY.length - 1);
  App.qAuto = Prefs.get('qAuto', true);
  App.qChanges = 0;
  App.qSettle = 0;
  App.pointer = { x: 0, y: 0, tx: 0, ty: 0 };

  window.addEventListener('resize', layout);
  window.addEventListener('pointermove', function (e) {
    if (App.mouseMotion) {
      App.pointer.tx = (e.clientX / window.innerWidth - 0.5) * 2;
      App.pointer.ty = (e.clientY / window.innerHeight - 0.5) * 2;
    }
    wake();
  }, { passive: true });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) App.clock.getDelta();
  });
  bindUI();
  document.getElementById('hud').classList.toggle('notools', !App.showTools);
  document.getElementById('bTools').setAttribute('aria-expanded', App.showTools ? 'true' : 'false');

  /* a stored "sound on" cannot start itself: browsers want a gesture first */
  if (App.wantSound) {
    var arm = function () {
      window.removeEventListener('pointerdown', arm);
      window.removeEventListener('keydown', arm);
      if (!Sound.on) { Sound.toggle(); updateHUD(App.P); }
    };
    window.addEventListener('pointerdown', arm);
    window.addEventListener('keydown', arm);
  }

  buildWorld(readSeedFromUrl() || randomSeed());

  /* first frame, then lift the curtain */
  renderFrame();
  requestAnimationFrame(function () {
    document.getElementById('curtain').classList.add('gone');
  });
  loop();
}

/* ---------- terrain height ---------- */
function ridged(x, y, s, oct) {
  var v = 0, amp = 0.5, f = 1, norm = 0;
  for (var i = 0; i < oct; i++) {
    var n = 1 - Math.abs(vnoise(x * f, y * f, s + i * 131) * 2 - 1);
    v += n * n * amp; norm += amp; amp *= 0.5; f *= 2.03;
  }
  return v / norm;
}

function makeHeightField(P) {
  var s = P.terrainSeed, amp = P.hillAmp, f = P.hillFreq, far = P.farHills;
  var kind = P.terrainKind || P.biome.terrain;

  if (kind === 'beach') {
    var drop = P.beachDrop, run = P.shoreRun;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var out = smoothstep(-10, -10 - run, z);           /* 0 at the dune, 1 out to sea */
      var h = -out * drop;
      h += fbm2(x * 0.045, z * 0.045, s, 3) * 0.45 * (1 - out) * smoothstep(3, 20, d);
      h += fbm2(x * 0.012, z * 0.012, s + 41, 2) * 0.9 * (1 - out * 0.7) * smoothstep(2, 30, d);
      h += fbm2(x * 0.03 + 9.1, z * 0.03, s + 77, 2) * 0.8 * out;   /* wobble the waterline */
      return h;
    };
  }
  if (kind === 'dunes') {
    var da = P.duneAmp, mesa = P.mesaH;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var near = smoothstep(4, 40, d);
      var h = (ridged(x * f * 0.8, z * f * 0.8, s, 4) * 2 - 0.85) * da * near;
      var m = ridged(x * f * 0.10, z * f * 0.10, s + 7, 4);
      m = Math.pow(m, 2.1);
      var step = Math.floor(m * 3) / 3 + (m * 3 - Math.floor(m * 3)) * 0.18;  /* stepped mesas */
      h += step * mesa * smoothstep(70, 430, d);
      h += ridged(x * f * 0.03, z * f * 0.03, s + 303, 3) * mesa * 0.8 * smoothstep(320, 950, d);
      return h;
    };
  }
  if (kind === 'cliff') {
    var edge = P.cliffEdge, drop2 = P.cliffDrop, amp2 = P.cliffAmp, cph = P.cliffPhase;
    /* The coastline swings in and out, so headlands run past the window and you
       see their faces in profile. A straight edge just reads as "land stops". */
    var coastAt = function (x) {
      var c = -edge + Math.sin(x * 0.017 + cph) * amp2
        + Math.sin(x * 0.041 - cph * 0.7) * amp2 * 0.35
        + fbm2(x * 0.008, 4.2, s + 71, 2) * amp2 * 0.5;
      /* however the coast swings, the house is never on the edge of it */
      return Math.min(c, -12 - Math.abs(x) * 0.1);
    };
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var c = coastAt(x);
      var lip = smoothstep(c - 9, c + 3, z);              /* 1 on the clifftop, 0 out at sea */
      var h = -drop2 * (1 - lip);
      h += fbm2(x * 0.02, z * 0.02, s, 3) * 1.4 * lip * smoothstep(3, 26, d);
      h += fbm2(x * 0.006, z * 0.006, s + 13, 2) * 4.0 * lip * smoothstep(2, 34, d);
      return h;
    };
  }
  if (kind === 'terrace') {
    var stepH = P.stepH, stepW = P.stepW, tilt2 = P.terraceTilt;
    /* how far up the hill a point sits, in metres, with the contour wandering */
    var runRaw = function (x, z) {
      return (-z) * P.terraceGrade + x * tilt2 + fbm2(x * 0.0045, z * 0.0045, s + 5, 2) * 11.0;
    };
    /* shift the whole staircase so the house sits in the middle of a tread,
       never with a riser at the sill */
    var frac0 = runRaw(0, 0) / stepW; frac0 -= Math.floor(frac0);
    var shift = (0.5 - frac0) * stepW;
    var runAt = function (x, z) { return runRaw(x, z) + shift; };
    var band0 = Math.floor(runAt(0, 0) / stepW);
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var band = Math.floor(runAt(x, z) / stepW);
      var h = (band - band0) * stepH;
      h += fbm2(x * 0.06, z * 0.06, s, 2) * 0.07;          /* the paddy surface is not glass */
      h += Math.pow(ridged(x * 0.0032, z * 0.0032, s + 29, 3), 1.4) * far * 1.2 * smoothstep(320, 900, d);
      return h;
    };
  }
  if (kind === 'slope') {
    var grade = P.slopeGrade, sdir = P.slopeDir;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var along = -z * Math.cos(sdir) + x * Math.sin(sdir);
      var h = along * grade;
      h += fbm2(x * f, z * f, s, 4) * amp * 1.4;
      h += fbm2(x * f * 0.2, z * f * 0.2, s + 44, 3) * far * 0.7 * smoothstep(60, 400, d);
      return h * smoothstep(2, 20, d);
    };
  }
  if (kind === 'salt') {
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var h = fbm2(x * 0.03, z * 0.03, s, 2) * 0.045
            + fbm2(x * 0.004, z * 0.004, s + 3, 2) * 0.10;
      h += Math.pow(ridged(x * 0.0028, z * 0.0028, s + 19, 3), 1.6) * far * 2.4 * smoothstep(420, 950, d);
      return h;
    };
  }
  if (kind === 'lake') {
    var ldrop = P.beachDrop, lrun = P.shoreRun, lfar = P.lakeFar;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var out = smoothstep(-4.5, -4.5 - lrun, z);
      var h = -out * ldrop;
      h += fbm2(x * 0.03, z * 0.03, s, 3) * 0.5 * (1 - out) * smoothstep(3, 22, d);
      h += fbm2(x * 0.011, z * 0.011, s + 41, 2) * 1.1 * (1 - out * 0.8) * smoothstep(2, 30, d);
      /* the far shore, closing the water in */
      h += Math.pow(ridged(x * 0.0042, z * 0.0042, s + 88, 4), 1.3) * far * 2.2 * smoothstep(lfar, lfar + 260, d);
      return h;
    };
  }
  if (kind === 'river') {
    var hw = P.riverW, dep = P.riverDepth, bend = P.riverBend, ph = P.riverPhase, tilt = P.riverTilt, off = P.riverOffset;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      /* 'off' was redeclared below, which hoisted it and made cx NaN, so every
         river valley had no terrain at all. The channel distance gets its own name. */
      var cx = off + bend * (Math.sin(z * 0.0055 + ph) - Math.sin(ph)) + tilt * z;
      var side = Math.abs(x - cx);
      var chan = 1 - smoothstep(hw * 0.65, hw * 1.4, side);
      var h = fbm2(x * f, z * f, s, 4) * amp * smoothstep(4, 40, d);
      h -= dep * chan;
      h += smoothstep(hw * 1.1, hw * 3.4, side) * far * 0.5 * smoothstep(30, 300, d);
      h += Math.pow(ridged(x * 0.005, z * 0.005, s + 17, 4), 1.4) * far * 1.4 * smoothstep(240, 780, d);
      return h;
    };
  }
  if (kind === 'gorge') {
    /* a deep flowing river between steep banks, with the land level on top */
    var gw = P.gorgeW, gd = P.gorgeDepth, gph = P.gorgePhase, gb = P.gorgeBend;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var cx = gb * (Math.sin(z * 0.0032 + gph) - Math.sin(gph));
      var side = Math.abs(x - cx);
      var cut = 1 - smoothstep(gw * 0.55, gw * 1.5, side);
      var h = fbm2(x * f * 0.7, z * f * 0.7, s, 3) * amp * 0.5 * smoothstep(6, 60, d);
      h -= gd * cut;
      /* the rim rises a little either side, then rolls away */
      h += smoothstep(gw * 1.2, gw * 2.6, side) * (1 - smoothstep(gw * 5.0, gw * 11.0, side)) * gd * 0.16;
      h += Math.pow(ridged(x * 0.0035, z * 0.0035, s + 31, 4), 1.5) * far * 1.1 * smoothstep(300, 900, d);
      return h;
    };
  }
  if (kind === 'canyon') {
    /* stepped walls dropping to a floor, cut by side canyons */
    var cw = P.canyonW, cd = P.canyonDepth, cph = P.canyonPhase, cb = P.canyonBend, steps = P.canyonSteps;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var cx = cb * (Math.sin(z * 0.0026 + cph) - Math.sin(cph)) + Math.sin(z * 0.011 + cph * 2) * cw * 0.10;
      var side = Math.abs(x - cx);
      /* side canyons bite into the wall at intervals */
      var bite = Math.pow(Math.max(0, Math.sin(z * 0.017 + cph * 1.7)), 6) * cw * 0.55;
      var edge = cw + bite;
      var t = clamp((side - edge) / Math.max(edge * 1.9, 1), 0, 1);
      /* terraced: a staircase of benches rather than a smooth slope */
      var stair = (Math.floor(t * steps) + smoothstep(0.62, 1.0, (t * steps) % 1)) / steps;
      var h = -cd * (1 - stair);
      h += fbm2(x * 0.02, z * 0.02, s + 5, 3) * 1.6;
      h += fbm2(x * 0.09, z * 0.09, s + 9, 2) * 0.5 * (0.3 + t);
      h += smoothstep(0.92, 1.0, t) * far * 0.9 * smoothstep(200, 800, d);
      return h;
    };
  }
  if (kind === 'cascade') {
    var segs = P.fallSegs, notch = P.fallNotch, poolZ = P.poolZ;
    var topY = P.fallTopY, topZ = P.fallTopZ, massifH = P.massifH, massifRun = P.massifRun;
    /* the height of the mountain face at this depth, following the staircase */
    var faceAt = function (z) {
      if (z > poolZ) return -1.4;
      for (var i = 0; i < segs.length; i++) {
        var g = segs[i];
        if (z <= g.z0 && z > g.z1) {
          var t = (g.z0 - z) / Math.max(g.z0 - g.z1, 0.001);
          /* a pitch is steepest in its middle, so its lip and foot are rounded */
          var e = g.drop ? t * t * (3 - 2 * t) : t;
          return g.y0 + (g.y1 - g.y0) * e;
        }
      }
      /* above the top of the fall the mountain keeps climbing */
      var u = clamp((topZ - z) / massifRun, 0, 1);
      return topY + massifH * (1 - Math.pow(1 - u, 1.7));
    };
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var side = Math.abs(x - P.fallX);
      var face = faceAt(z);
      /* the gully the water has cut: deep in the middle, flaring at the edges */
      var gully = 1 - smoothstep(notch * 0.45, notch * 1.9, side);
      var h = face - gully * P.gullyDepth * clamp((poolZ - z) / 30, 0, 1);
      /* the valley floor in front, with the plunge pool at the foot of the fall */
      if (z > poolZ) {
        h = -1.4 + fbm2(x * 0.05, z * 0.05, s, 3) * 0.7;
        h -= 1.4 * (1 - smoothstep(0, 26, Math.abs(z - (poolZ + 12)))) * (1 - smoothstep(0, 30, side));
      }
      /* the walls either side of the gully climb away from it */
      var flank = smoothstep(notch * 1.2, notch * 5.5, side) * (1 - smoothstep(0, 40, Math.max(0, z - poolZ)));
      h += flank * (massifH * 0.28 + fbm2(x * 0.02, z * 0.02, s + 23, 3) * 12);
      h += fbm2(x * 0.09, z * 0.09, s + 3, 3) * 1.6 * smoothstep(poolZ + 12, poolZ - 20, z);
      h += fbm2(x * 0.013, z * 0.013, s + 17, 3) * amp * 0.5 * smoothstep(10, 90, d);
      h += Math.pow(ridged(x * 0.0035, z * 0.0035, s + 41, 4), 1.4) * far * 1.3 * smoothstep(massifRun * 0.8, massifRun * 2.4, -z);
      return h;
    };
  }
  if (kind === 'oasis') {
    /* dunes all around, a hollow with water in the middle of them */
    var ow = P.oasisW, ox2 = P.oasisX, oz2 = P.oasisZ;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var od = Math.sqrt((x - ox2) * (x - ox2) + (z - oz2) * (z - oz2));
      var bowl = 1 - smoothstep(ow * 0.35, ow * 1.25, od);
      /* the dunes must not fill the hollow, or the oasis has no water in it:
         they are flattened out as the bowl deepens */
      var open = 1 - bowl;
      var h = ridged(x * 0.011, z * 0.011, s, 4) * amp * 2.4 * smoothstep(8, 70, d) * open;
      h += fbm2(x * 0.035, z * 0.035, s + 11, 3) * 0.9 * open;
      h -= bowl * 9.0;
      h += smoothstep(ow * 1.1, ow * 2.4, od) * (1 - smoothstep(ow * 4.0, ow * 9.0, od)) * 2.2;
      h += Math.pow(ridged(x * 0.004, z * 0.004, s + 41, 3), 1.3) * far * 1.5 * smoothstep(260, 820, d);
      return h;
    };
  }
  if (kind === 'skyline') {
    /* the street far below: level, with the grid of blocks cut into it */
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      return -P.storey + fbm2(x * 0.02, z * 0.02, s, 2) * 0.4 + smoothstep(600, 2000, d) * far * 0.6;
    };
  }
  if (kind === 'marsh') {
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var h = (fbm2(x * 0.055, z * 0.055, s, 3) * 0.5
            + fbm2(x * 0.013, z * 0.013, s + 23, 3) * 1.15
            + fbm2(x * 0.004, z * 0.004, s + 61, 2) * 1.0) * smoothstep(2, 30, d);
      h += 0.35 * (1 - smoothstep(0, 26, d));            /* a low dry bank under the window */
      h += Math.pow(ridged(x * 0.0035, z * 0.0035, s + 9, 3), 1.3) * far * 1.6 * smoothstep(230, 700, d);
      return h;
    };
  }
  if (kind === 'alpine') {
    var pk = P.peakH;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var near = smoothstep(5, 44, d);
      var h = fbm2(x * f, z * f, s, 4) * amp * near;
      var r1 = Math.pow(ridged(x * f * 0.085, z * f * 0.085, s + 11, 5), 1.55);
      h += r1 * pk * smoothstep(60, 470, d);
      var r2 = Math.pow(ridged(x * f * 0.026 + 5.3, z * f * 0.026, s + 213, 4), 1.4);
      h += r2 * pk * 1.35 * smoothstep(300, 1000, d);
      return h;
    };
  }
  if (kind === 'fjord') {
    var ch = P.channelW, wh = P.wallH;
    return function (x, z) {
      var d = Math.sqrt(x * x + z * z);
      var ax = Math.abs(x);
      var ramp = smoothstep(22, 95, d);
      var wall = smoothstep(ch * 0.45, ch * 1.3, ax);
      var rough = 0.55 + 0.45 * ridged(x * 0.0045 + 1.7, z * 0.0045, s, 4);
      var h = wall * wh * rough * ramp;
      h -= 5.5 * smoothstep(16, 70, d) * (1 - wall);        /* the channel floor */
      h += fbm2(x * 0.016, z * 0.016, s + 31, 3) * 3.2 * ramp;
      h += Math.pow(ridged(x * 0.004, z * 0.004, s + 91, 4), 1.3) * wh * 0.75 * smoothstep(330, 780, d);
      return h;
    };
  }
  /* rolling meadow */
  return function (x, z) {
    var d = Math.sqrt(x * x + z * z);
    var near = smoothstep(5, 46, d);
    var h = fbm2(x * f, z * f, s, 4) * amp * near;
    h += fbm2(x * f * 0.18 + 31.7, z * f * 0.18 - 12.3, s + 51, 3) * far * smoothstep(55, 420, d);
    h += fbm2(x * f * 0.055 - 7.1, z * f * 0.055 + 4.4, s + 707, 2) * far * 1.5 * smoothstep(260, 900, d);
    return h;
  };
}

/* ---------- sky ---------- */
function buildSky(scene, P, R, U) {
  var geo = new THREE.SphereGeometry(3000, 32, 20);
  var uni = {
    uZenith: { value: new THREE.Color(0x3f7ec9) },
    uHorizon: { value: new THREE.Color(0xc3daea) },
    uSunCol: { value: new THREE.Color(0xfff2d8) },
    uSunDir: U.uSunDir,
    uSunVis: { value: 1 },
    uBow: { value: 0 },
    uNight: { value: 0 },
    uMoonDir: { value: new THREE.Vector3(0, 0.6, -0.8) },
    uMoonPhase: { value: R.range(0.15, 1.0) },
    uTime: U.uTime,
    uCover: { value: P.weather.cover },
    uSoft: { value: P.weather.soft },
    uCloudOp: { value: P.weather.op },
    uCloudL: { value: new THREE.Color(0xffffff) },
    uCloudD: { value: new THREE.Color(0xa7b1bf) },
    uScale: { value: R.range(0.030, 0.062) },
    uOff1: { value: new THREE.Vector2() },
    uOff2: { value: new THREE.Vector2() },
    uCloudTex: { value: (function () {
      var cseed = R.int(1, 99999);
      return cached('cloud|' + cseed + '|' + Q().tex, function () { return makeCloudTexture(cseed, Q().tex); });
    })() }
  };
  App.skyU = uni;
  var mat = new THREE.ShaderMaterial({
    uniforms: uni,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: true,      /* drawn last among opaques: early-z skips covered pixels */
    fog: false,
    vertexShader: [
      'varying vec3 vDir;',
      'void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform vec3 uZenith, uHorizon, uSunCol, uSunDir, uCloudL, uCloudD, uMoonDir;',
      'uniform float uTime, uCover, uSoft, uCloudOp, uScale, uSunVis, uNight, uMoonPhase, uBow;',
      'float starHash(vec3 c){ return fract(sin(dot(c, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }',
      'uniform vec2 uOff1, uOff2;',
      'uniform sampler2D uCloudTex;',
      'varying vec3 vDir;',
      'void main(){',
      '  vec3 d = normalize(vDir);',
      '  float h = max(d.y, 0.0);',
      '  vec3 sky = mix(uHorizon, uZenith, pow(h, 0.62));',
      '  sky = mix(sky, uHorizon * 0.86, smoothstep(0.0, -0.14, d.y));',
      '  float sd = max(dot(d, normalize(uSunDir)), 0.0);',
      '  float ang = acos(clamp(sd, -1.0, 1.0));',
      '  float disk = 1.0 - smoothstep(0.0085, 0.017, ang);',
      /* Mie: a broad warm glow spreads from the sun, strongest low in the sky */
      '  sky += uSunCol * (pow(sd, 220.0) * 0.55 + pow(sd, 12.0) * 0.16 + pow(sd, 3.0) * 0.10 * (1.2 - h) + disk * 1.5) * uSunVis;',
      '  sky = mix(sky, uHorizon * 1.04, smoothstep(0.30, 0.0, d.y) * 0.45);',
      '  if (uNight > 0.01) {',
      /* stars live in a coarse 3D lattice so they hold still as the view drifts */
      '    vec3 sc = floor(d * 260.0);',
      '    float h = starHash(sc);',
      '    float mag = smoothstep(0.9958, 1.0, h);',
      '    float twinkle = 0.65 + 0.35 * sin(uTime * (1.0 + h * 3.0) + h * 40.0);',
      '    vec3 tint = mix(vec3(0.75, 0.83, 1.0), vec3(1.0, 0.92, 0.78), starHash(sc + 7.0));',
      '    sky += tint * mag * twinkle * uNight * smoothstep(-0.02, 0.16, d.y) * 1.5;',
      /* the moon, with a terminator so it shows a phase */
      '    float md = dot(d, normalize(uMoonDir));',
      '    float mAng = acos(clamp(md, -1.0, 1.0));',
      '    float disc = 1.0 - smoothstep(0.020, 0.030, mAng);',
      '    vec3 up = normalize(cross(normalize(uMoonDir), vec3(0.0, 1.0, 0.0)));',
      '    float across = dot(normalize(d - normalize(uMoonDir) * md), up);',
      '    float lit = step(across, uMoonPhase * 2.0 - 1.0 + 0.55);',
      '    sky += vec3(0.95, 0.94, 0.88) * disc * mix(0.10, 1.35, lit) * uNight;',
      '    sky += vec3(0.55, 0.60, 0.72) * pow(max(md, 0.0), 90.0) * 0.35 * uNight;',
      '  }',
      '  float band = smoothstep(0.005, 0.20, d.y);',
      '  vec2 p = d.xz / max(d.y, 0.055);',
      '  vec2 uv = p * uScale;',
      /* the deck: two octaves at one height */
      '  float n = texture2D(uCloudTex, uv * 0.55 + uOff1).r * 0.58',
      '          + texture2D(uCloudTex, uv * 1.37 + uOff2).r * 0.42;',
      /* a lower, faster, darker scud in front of it: the parallax is in the
         different drift rates and the different projection scale */
      '  vec2 uvLo = p * uScale * 1.9 + uOff2 * 2.6 + vec2(0.27, 0.71);',
      '  float nLo = texture2D(uCloudTex, uvLo).r;',
      '  float scud = smoothstep(uCover + 0.22, uCover + 0.40, nLo) * band * 0.55 * uCloudOp * smoothstep(0.02, 0.35, d.y);',
      '  float cov = smoothstep(uCover, uCover + uSoft, n) * band * uCloudOp;',
      '  float thick = smoothstep(uCover - 0.06, uCover + 0.34, n);',
      /* sample the cloud again a little toward the sun; where density falls
         off in that direction we are on the lit face, else in its own shadow */
      '  vec2 toSun = normalize(uSunDir.xz + vec2(1e-4)) * 0.011;',
      '  float n2 = texture2D(uCloudTex, uv * 0.55 + uOff1 + toSun).r * 0.58',
      '           + texture2D(uCloudTex, uv * 1.37 + uOff2 + toSun * 2.5).r * 0.42;',
      '  float litFace = smoothstep(-0.03, 0.09, n - n2) * uSunVis;',
      '  vec2 uvHi = p * uScale * 0.36 + uOff1 * 0.55 + vec2(0.61, 0.13);',
      '  float nHi = texture2D(uCloudTex, uvHi).r;',
      '  float cirrus = smoothstep(uCover + 0.14, uCover + 0.36, nHi) * band * 0.5 * uCloudOp;',
      '  sky = mix(sky, mix(uCloudL, uSunCol, 0.12) * 1.02, cirrus);',
      '  vec3 cc = mix(uCloudL, uCloudD, thick * 0.92);',
      '  cc = mix(cc * 0.86, cc * 1.10 + uSunCol * 0.08, litFace);',
      '  cc += uSunCol * pow(sd, 7.0) * 0.30 * (1.0 - thick) * uSunVis;',
      '  sky = mix(sky, cc, clamp(cov, 0.0, 1.0));',
      '  sky = mix(sky, uCloudD * 0.82, scud);',
      /* A rainbow stands opposite the sun at forty-two degrees, so it only
         shows when the sun is low, behind you, and there is still rain in the
         air. Red outside, violet in, with a fainter second bow beyond it. */
      '  if (uBow > 0.001) {',
      '    float ca = dot(d, -normalize(uSunDir));',
      '    float ang = degrees(acos(clamp(ca, -1.0, 1.0)));',
      '    float band = smoothstep(40.0, 41.2, ang) * (1.0 - smoothstep(42.4, 43.6, ang));',
      '    float t2 = clamp((ang - 40.6) / 2.2, 0.0, 1.0);',
      '    vec3 bow = vec3(0.55 + 0.45 * cos((t2 - 0.05) * 6.2832), 0.5 + 0.5 * cos((t2 - 0.38) * 6.2832), 0.5 + 0.5 * cos((t2 - 0.72) * 6.2832));',
      '    float band2 = smoothstep(51.0, 52.4, ang) * (1.0 - smoothstep(54.0, 55.6, ang));',
      '    float t3 = 1.0 - clamp((ang - 51.7) / 2.8, 0.0, 1.0);',
      '    vec3 bow2 = vec3(0.55 + 0.45 * cos((t3 - 0.05) * 6.2832), 0.5 + 0.5 * cos((t3 - 0.38) * 6.2832), 0.5 + 0.5 * cos((t3 - 0.72) * 6.2832));',
      '    float above = smoothstep(-0.02, 0.10, d.y);',
      '    sky += (bow * band * 0.30 + bow2 * band2 * 0.10) * uBow * above;',
      '  }',
      '  gl_FragColor = vec4(sky, 1.0);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  var sky = new THREE.Mesh(geo, mat);
  sky.renderOrder = 900;
  sky.frustumCulled = false;
  scene.add(sky);
  App.sky = sky;
}

/* ---------- terrain ---------- */
function buildTerrain(scene, P, R, U, H) {
  /* An even grid wastes vertices on the horizon and starves the foreground, so
     this one is warped: about a metre across near the window, tens of metres out. */
  var SIZE = 4800, SEG = Q().grid;
  var pos = [], idx = [], i, j;
  var warp = function (u) {
    var a = Math.abs(u);
    return (u < 0 ? -1 : 1) * (0.028 * a + 0.972 * a * a * a) * SIZE * 0.5;
  };
  var axis = [];
  for (i = 0; i <= SEG; i++) axis.push(warp((i / SEG) * 2 - 1));
  for (j = 0; j <= SEG; j++) {
    for (i = 0; i <= SEG; i++) {
      var x = axis[i], z = axis[j];
      pos.push(x, H(x, z), z);
    }
  }
  for (j = 0; j < SEG; j++) {
    for (i = 0; i < SEG; i++) {
      var a = j * (SEG + 1) + i, b = a + 1, c = a + SEG + 1, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  /* a sampler of the mesh itself, bilinear across the warped grid: from here on,
     anything placed on the ground uses this, so a tree at 300 m sits on the
     surface you can see rather than on a bump the mesh never drew */
  (function () {
    var find = function (v) { var lo = 0, hi = SEG; while (hi - lo > 1) { var m = (lo + hi) >> 1; if (axis[m] <= v) lo = m; else hi = m; } return lo; };
    App.Hm = function (x, z) {
      if (x <= axis[0] || x >= axis[SEG] || z <= axis[0] || z >= axis[SEG]) return H(x, z);
      var i = find(x), j = find(z);
      var tx = (x - axis[i]) / (axis[i + 1] - axis[i]), tz = (z - axis[j]) / (axis[j + 1] - axis[j]);
      var a = pos[(j * (SEG + 1) + i) * 3 + 1], b = pos[(j * (SEG + 1) + i + 1) * 3 + 1];
      var c = pos[((j + 1) * (SEG + 1) + i) * 3 + 1], d = pos[((j + 1) * (SEG + 1) + i + 1) * 3 + 1];
      return (a * (1 - tx) + b * tx) * (1 - tz) + (c * (1 - tx) + d * tx) * tz;
    };
  })();
  var uni = {
    uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
    uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale, uSnow: U.uSnow,
    uSnowCol: U.uSnowCol,
    uTex: { value: (function () {
      var gseed = R.int(1, 99999);
      return cached('ground|' + P.grass.name + '|' + gseed + '|' + Q().tex + '|' + P.patchiness.toFixed(3),
        function () { return makeGroundTexture(P, gseed, Q().tex); });
    })() },
    uTip: { value: new THREE.Color(P.grass.tip) },
    uCoverCol: { value: new THREE.Color(P.grass.cb || P.grass.base)
      .lerp(new THREE.Color(P.grass.ct || P.grass.tip), 0.62) },
    uCamPos: U.uCamPos,
    uRock: { value: new THREE.Color(P.rockCol) },
    uHigh: { value: new THREE.Color(P.highCol) },
    uRockLine: { value: P.rockLine != null ? P.rockLine : 1e6 },
    uSnowLine: { value: P.snowLine != null ? P.snowLine : 1e6 },
    uWaterY: { value: P.waterY != null ? P.waterY : -1e6 },
    uWet: { value: (P.terrainKind || P.biome.terrain) === 'beach' ? 1.0 : 0.0 },
    uPaddy: { value: (P.terrainKind || P.biome.terrain) === 'terrace' ? 1.0 : 0.0 },
    /* the planted rows carry on past the last plant, drawn into the ground on
       the same spacing and angle, so they run to the horizon */
    uRowSp: { value: (P.rowSpacing && P.coverRows) ? P.rowSpacing : 0.0 },
    uRowDir: { value: new THREE.Vector2(Math.cos(P.rowAngle || 0), Math.sin(P.rowAngle || 0)) },
    uRowCol: { value: new THREE.Color(P.rowColour || P.grass.ct || P.grass.tip) },
    uRowSoil: { value: new THREE.Color(P.grass.cb || P.grass.base) },
    /* horizontal beds of rock, each its own shade, laid through the walls */
    uPathW: { value: P.pathKind ? P.pathW : 0.0 },
    uPathX: { value: P.pathX || 0 },
    uPathBend: { value: P.pathBend || 0 },
    uPathPh: { value: P.pathPhase || 0 },
    uPathGauge: { value: P.pathGauge || 0.0 },
    uPathCol: { value: new THREE.Color(P.grass.soil) },
    uStrata: { value: P.strata || 0 },
    uStrataLo: { value: -(P.canyonDepth || 60) },
    uStrataHi: { value: 16 },
    uZenith: App.skyU.uZenith, uHorizon: App.skyU.uHorizon,
    uSkyCloud: App.skyU.uCloudTex, uSkyScale: App.skyU.uScale,
    uSkyCover: App.skyU.uCover, uSkySoft: App.skyU.uSoft, uSkyOff: App.skyU.uOff1,
    uCloudL: App.skyU.uCloudL, uCloudD: App.skyU.uCloudD
  };
  var mat = new THREE.ShaderMaterial({
    extensions: { derivatives: true },
    uniforms: uni,
    vertexShader: [
      'varying vec3 vW; varying vec3 vN; varying float vFog;',
      'uniform float uFogDensity;',
      GLSL_COMMON,
      'void main(){',
      '  vW = position; vN = normalize(normal);',
      '  vec4 mv = modelViewMatrix * vec4(position,1.0);',
      '  vFog = fogAmtH(-mv.z, uFogDensity, position.y);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uTex; uniform vec3 uSunDir, uSunCol, uAmbCol, uFogCol, uSnowCol, uTip;',
      'uniform vec3 uRock, uHigh, uCoverCol;',
      'uniform float uTime, uShadow, uSnow, uRockLine, uSnowLine, uWaterY, uWet, uPaddy, uRowSp;',
      'uniform vec2 uRowDir; uniform vec3 uRowCol, uRowSoil;',
      'uniform float uStrata, uStrataLo, uStrataHi;',
      'uniform float uPathW, uPathX, uPathBend, uPathPh, uPathGauge; uniform vec3 uPathCol;',
      'float pathAmt(vec3 w){',
      '  if (uPathW < 0.01) return 0.0;',
      '  float cx = uPathX + uPathBend * (sin(w.z * 0.0042 + uPathPh) - sin(uPathPh));',
      '  float off = abs(w.x - cx);',
      '  if (uPathGauge > 0.01) off = min(abs(off - uPathGauge * 0.5), abs(off + uPathGauge * 0.5));',
      '  float e = fwidth(w.x) * 0.5;',
      '  return 1.0 - smoothstep(uPathW - e, uPathW * 1.5 + e, off);',
      '}',
      'float hs(float p){ return fract(sin(p * 91.317) * 43758.545); }',
      'uniform vec3 uCamPos, uZenith, uHorizon, uCloudL, uCloudD;',
      'uniform float uSkyScale, uSkyCover, uSkySoft; uniform vec2 uSkyOff; uniform sampler2D uSkyCloud;',
      'varying vec3 vW; varying vec3 vN; varying float vFog;',
      GLSL_COMMON,
      'void main(){',
      '  if (vW.z > -0.18) discard;                       /* nothing of the outside exists indoors */',
      '  vec3 c = texture2D(uTex, vW.xz * 0.038).rgb;',
      '  c = mix(c, texture2D(uTex, vW.xz * 0.0052 + vec2(0.31)).rgb, 0.5);',
      /* close up, a third octave of grain so the foreground is not a smooth wash */
      '  float near = 1.0 - smoothstep(6.0, 26.0, length(uCamPos - vW));',
      /* sampled unconditionally: inside a per-pixel branch the mip level is
         undefined and some GPUs pick a different one every frame */
      '  vec3 fine = texture2D(uTex, vW.xz * 0.62 + vec2(0.77)).rgb;',
      '  vec3 grit = texture2D(uTex, vW.xz * 2.10 + vec2(0.19)).rgb;',
      '  if (near > 0.01) {',
      '    c = mix(c, c * (0.72 + 0.56 * fine.g), near * 0.55);',
      '    float grazing = 1.0 - smoothstep(0.15, 0.55, abs(normalize(uCamPos - vW).y));',
      '    c = mix(c, c * (0.82 + 0.38 * grit.r), near * 0.34 * (1.0 - grazing * 0.55));',
      '  }',
      /* hand over from blades to ground across the band where the blades are
         shrinking away, so there is no seam */
      '  float handover = smoothstep(11.0, 34.0, length(uCamPos - vW));',
      '  c = mix(c, uCoverCol * (0.72 + 0.5 * c.g), handover * 0.80);',
      '  float far = smoothstep(30.0, 240.0, length(vW.xz));',
      '  c = mix(c, mix(c, uTip * 0.82, 0.35), far);',
      /* bumpiness close in. Sampled unconditionally — inside a branch the mip
         level is undefined and some drivers pick a different one every frame. */
      '  float e = 0.06;',
      '  float hx = texture2D(uTex, (vW.xz + vec2(e, 0.0)) * 0.62 + vec2(0.77)).g - fine.g;',
      '  float hz = texture2D(uTex, (vW.xz + vec2(0.0, e)) * 0.62 + vec2(0.77)).g - fine.g;',
      '  vec3 N2 = normalize(vN + vec3(-hx, 0.0, -hz) * 1.6 * near);',
      '  if (uRowSp > 0.01) {',
      '    float perp = dot(vW.xz, uRowDir);',
      '    float band = abs(fract(perp / uRowSp + 0.5) - 0.5) * 2.0;',
      /* band-limited, so rows blur to an average once finer than a pixel
         rather than turning to moire near the horizon */
      '    float kRow = 1.0 - smoothstep(0.30, 0.85, fwidth(perp) / uRowSp);',
      '    float onRow = 1.0 - smoothstep(0.18, 0.62, band);',
      /* the drawn rows come up under the planted ones and take over as they
         thin out, so there is no line where one stops and the other starts */
      '    float grow = smoothstep(12.0, 26.0, length(uCamPos - vW));',
      '    c = mix(c, mix(uRowSoil, uRowCol, onRow), grow * kRow * 0.72);',
      '  }',
      '  float onPath = pathAmt(vW);',
      '  if (onPath > 0.001) c = mix(c, uPathCol * (0.86 + 0.24 * fine.r), onPath * 0.88);',
      '  if (uStrata > 0.5) {',
      '    float u = (vW.y - uStrataLo) / max(uStrataHi - uStrataLo, 1.0);',
      '    float band = floor(u * uStrata);',
      '    float tone1 = hs(band), tone2 = hs(band + 41.0);',
      /* each bed a different colour and hardness; the harder ones stand proud */
      '    vec3 tint = mix(vec3(1.02, 0.86, 0.70), vec3(0.86, 0.90, 1.02), tone1);',
      '    tint = mix(tint, vec3(1.04, 0.98, 0.84), tone2 * 0.6);',
      '    float kS = 1.0 - smoothstep(0.30, 0.85, fwidth(u) * uStrata);',
      '    float edge = 1.0 - smoothstep(0.0, 0.10, abs(fract(u * uStrata) - 0.5) * 2.0 - 0.82);',
      '    float on = smoothstep(0.10, 0.35, clamp(1.0 - vN.y, 0.0, 1.0)) * kS;',
      '    c = mix(c, c * tint * (0.90 + 0.24 * tone2), on * 0.80);',
      '    c *= 1.0 - 0.20 * edge * on;',
      '  }',
      '  float slope = clamp(1.0 - vN.y, 0.0, 1.0);',
      '  c = mix(c, uRock * (0.85 + 0.3 * texture2D(uTex, vW.xz * 0.02).r),',
      '          smoothstep(uRockLine, uRockLine + 22.0, vW.y) * (0.35 + 0.65 * smoothstep(0.12, 0.5, slope)));',
      '  c = mix(c, uRock * 0.92, smoothstep(0.45, 0.78, slope) * 0.75);',
      '  c = mix(c, uHigh, smoothstep(uSnowLine, uSnowLine + 34.0, vW.y) * (1.0 - smoothstep(0.30, 0.62, slope)));',
      '  c = mix(c, c * 0.60, smoothstep(uWaterY + 1.1, uWaterY + 0.05, vW.y) * uWet);',
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(vW.xz, uTime)) * mix(0.30, 1.0, baked(vW.xz));',
      '  float diff = max(dot(N2, normalize(uSunDir)), 0.0);',
      '  vec3 lit = c * (uAmbCol * 1.15 + uSunCol * diff * 1.25 * sh);',
      '  float up = smoothstep(0.55, 0.95, vN.y);',
      /* a thin fall lies in the hollows first; a deep one covers everything */
      '  float want = uSnow * (0.35 + 0.65 * up);',
      '  float lie = texture2D(uTex, vW.xz * 0.011 + vec2(0.5)).r * 0.6 + texture2D(uTex, vW.xz * 0.09).r * 0.25;',
      '  float laid = smoothstep(0.42, 0.62, lie + want * 1.25 - 0.55);',
      /* hollows go a little blue, the crust has a fine grain, drifts read in the light */
      '  vec3 snowLit = uSnowCol * (0.68 + 0.32 * diff) * (0.93 + 0.11 * fine.g) * (0.96 + 0.08 * texture2D(uTex, vW.xz * 0.21 + vec2(0.31)).r);',
      '  snowLit = mix(snowLit, snowLit * vec3(0.90, 0.94, 1.04), (1.0 - diff) * 0.6);',
      '  lit = mix(lit, snowLit, laid * min(1.0, want * 1.5));',
      '  lit = mix(lit, lit * vec3(0.88, 0.94, 1.10), vFog * 0.55);',
      /* flooded paddies: level treads mirror the sky, which is what makes a
         terrace read as a rice terrace rather than a stepped lawn */
      '  if (uPaddy > 0.5) {',
      '    float level = 1.0 - smoothstep(0.02, 0.10, slope);',
      '    vec3 still = mix(uFogCol, uZenith, 0.45) * 0.92;',
      '    lit = mix(lit, mix(lit * 0.7, still, 0.8), level * 0.55);',
      '  }',
      '  vec3 fogC = hazeToward(uFogCol, normalize(vW - uCamPos), uSunDir, uSunCol);',
      '  gl_FragColor = vec4(mix(lit, fogC, vFog), 1.0);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  scene.add(m);
  App.terrain = m;
}


/* ---------- water: sea with a swell, or a still fjord channel ---------- */
function buildWater(scene, P, R, U) {
  if (P.waterY == null) return;
  var geo = new THREE.PlaneGeometry(5200, 5200, 1, 1);
  geo.rotateX(-Math.PI / 2);
  var kind = P.waterKind;
  var sea = kind === 'sea';
  var flow = kind === 'flow';
  var marshy = (P.terrainKind || P.biome.terrain) === 'marsh';
  var uni = {
    uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
    uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uCamPos: U.uCamPos, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
    uDeep: { value: new THREE.Color(
      sea ? R.pick(['#0d4f6e', '#0a4a63', '#123f5c'])
      : marshy ? R.pick(['#3c4232', '#454a35', '#383d2e'])
      : flow ? R.pick(['#2c4a4a', '#274murk', '#2f5150'].map(function (v) { return v.replace('murk', '546'); }))
      : R.pick(['#22363f', '#1d3038', '#27404a'])) },
    uShallow: { value: new THREE.Color(
      sea ? R.pick(['#2fb3b8', '#43c2bd', '#28a5ae'])
      : marshy ? R.pick(['#5a6142', '#646a49'])
      : flow ? R.pick(['#4a6f66', '#54786c'])
      : R.pick(['#3a5a63', '#33525c'])) },
    /* a marsh or river has no straight shoreline to shade against */
    uShoreZ: { value: (sea && P.shoreZ != null) ? P.shoreZ : (P.waterKind === 'still' && !marshy ? P.shoreZ : -1e5) },
    uFoam: { value: sea ? 1.0 : 0.0 },
    uChop: { value: sea ? 1.0 : (flow ? 0.7 : (marshy ? 0.18 : (kind === 'mirror' ? 0.05 : 0.4))) },
    uSwell: { value: R.range(0.19, 0.32) },
    uFlowDir: { value: new THREE.Vector2(0, flow ? (P.flowDown || 1) : 0) },
    uFlowRate: { value: flow ? R.range(0.9, 2.2) : 0 },
    uStreak: { value: flow ? 1.0 : 0.0 },
    uMirror: { value: kind === 'mirror' ? 1.0 : 0.0 },
    uZenith: App.skyU.uZenith, uHorizon: App.skyU.uHorizon,
    uSkyCloud: App.skyU.uCloudTex, uSkyScale: App.skyU.uScale,
    uSkyCover: App.skyU.uCover, uSkySoft: App.skyU.uSoft,
    uSkyOff: App.skyU.uOff1, uCloudL: App.skyU.uCloudL, uCloudD: App.skyU.uCloudD
  };
  var mat = new THREE.ShaderMaterial({
    uniforms: uni,
    vertexShader: [
      'varying vec3 vW;',
      'void main(){ vW = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform vec3 uDeep, uShallow, uSunDir, uSunCol, uAmbCol, uFogCol, uCamPos;',
      'uniform float uTime, uFogDensity, uShoreZ, uFoam, uChop, uSwell, uShadow, uFlowRate, uStreak;',
      'uniform vec2 uFlowDir, uSkyOff;',
      'uniform float uMirror, uSkyScale, uSkyCover, uSkySoft;',
      'uniform vec3 uZenith, uHorizon, uCloudL, uCloudD;',
      'uniform sampler2D uSkyCloud;',
      'varying vec3 vW;',
      GLSL_COMMON,
      'void main(){',
      '  vec2 p = vW.xz;',
      '  float t = uTime;',
      '  float dCam = length(uCamPos - vW);',
      '  vec3 v = normalize(uCamPos - vW);',
      '  vec3 sd = normalize(uSunDir);',
      '  float dz = vW.z - uShoreZ;',
      '  float shallow = 1.0 - smoothstep(-90.0, -6.0, dz);',
      '  vec3 col = mix(uDeep, uShallow, clamp(shallow, 0.0, 1.0));',
      /* the horizon washes in at a grazing angle: static, smooth, no sampling */
      '  float fres = pow(1.0 - max(v.y, 0.0), 3.0);',
      '  col = mix(col, uFogCol * 1.05, clamp(fres * 0.72, 0.0, 0.72));',
      '  if (uMirror > 0.5) col = mix(col, uFogCol * 1.10 + uSunCol * 0.06, 0.70);',
      /* one broad, soft pool of light under the sun, not a field of sparkles */
      '  vec3 hv = normalize(v + sd);',
      '  col += uSunCol * pow(max(hv.y, 0.0), 14.0) * 0.16;',
      '  col *= 0.72 + 0.5 * uAmbCol.g;',
      '  if (uFoam > 0.5) {',
      '    float ph = t * uSwell - dz * 0.20 + sin(p.x * 0.031) * 0.9 + sin(p.x * 0.0071 + 1.3) * 1.4;',
      '    float crest = smoothstep(0.40, 0.96, sin(ph));',
      '    float band = smoothstep(-34.0, -3.0, dz);',
      '    float foam = crest * band;',
      '    foam += smoothstep(-3.0, 0.2, dz) * (0.55 + 0.45 * sin(t * 0.47));',
      '    col = mix(col, vec3(0.92, 0.96, 0.97), clamp(foam, 0.0, 0.88) * (1.0 - smoothstep(60.0, 140.0, dCam)));',
      '  }',
      '  gl_FragColor = vec4(mix(col, hazeToward(uFogCol, -v, uSunDir, uSunCol), fogAmt(dCam, uFogDensity)), 1.0);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.position.y = P.waterY;
  m.frustumCulled = false;
  scene.add(m);
  App.water = m;
}

/* ---------- grass ---------- */
function bladeTemplate(bands) {
  /* bands tapering rings plus a tip; more bands means a blade that curves
     instead of creasing */
  var n = Math.max(2, bands || 3);
  var pos = [], uvs = [], idx = [], i;
  for (i = 0; i < n; i++) {
    var t = i / n;
    var y = Math.pow(t, 0.88);
    var w = 0.5 * (1 - Math.pow(t, 1.55)) * (1 - t * 0.10);
    pos.push(-w, y, 0); uvs.push(0, y);
    pos.push(w, y, 0); uvs.push(1, y);
  }
  pos.push(0, 1, 0); uvs.push(0.5, 1);
  for (i = 0; i < n - 1; i++) {
    var o = i * 2;
    idx.push(o, o + 1, o + 3, o, o + 3, o + 2);
  }
  idx.push((n - 1) * 2, (n - 1) * 2 + 1, n * 2);
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

function buildGrass(scene, P, R, U, H) {
  var COUNT = Math.round(P.coverCount * Q().grassMul);
  if (!P.coverCount) { App.grass = null; App.grassMax = 0; return; }   /* bare ground is a valid landscape */
  var tpl = bladeTemplate(Q().segs);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = tpl.index;
  geo.setAttribute('position', tpl.attributes.position);
  geo.setAttribute('uv', tpl.attributes.uv);

  var iPos = new Float32Array(COUNT * 3);
  var iAttr = new Float32Array(COUNT * 4);
  var iAttr2 = new Float32Array(COUNT * 2);

  var order = [];
  var i, n = 0;
  var clumps = [];
  for (i = 0; i < 420; i++) {
    var ca = R.range(-1.28, 1.28), cr = 1.4 + Math.pow(R.f(), 1.7) * 30;
    clumps.push([Math.sin(ca) * cr, -Math.cos(ca) * cr, R.range(0.6, 1.35)]);
  }
  var guard = 0;
  while (n < COUNT && guard < COUNT * 12) {
    guard++;
    var x, z, hMul = 1;
    if (R.f() < 0.55) {
      var c = clumps[Math.floor(R.f() * clumps.length)];
      x = c[0] + R.gauss() * 1.5;
      z = c[1] + R.gauss() * 1.5;
      hMul = c[2];
    } else {
      var a = R.range(-1.30, 1.30);
      var r = 1.1 + Math.pow(R.f(), P.coverRows ? 1.45 : 1.75) * (P.coverRows ? 52 : 32);
      x = Math.sin(a) * r; z = -Math.cos(a) * r;
    }
    if (P.rowSpacing && P.coverRows) {
      /* snap sideways onto the nearest planted row */
      var A = P.rowAngle;
      var perp = x * Math.cos(A) + z * Math.sin(A);
      var snap = Math.round(perp / P.rowSpacing) * P.rowSpacing + R.gauss() * 0.10;
      x += (snap - perp) * Math.cos(A);
      z += (snap - perp) * Math.sin(A);
    }
    var dist = Math.sqrt(x * x + z * z);
    if (dist < 1.0 || dist > (P.coverRows ? 54 : 35)) continue;
    if (P.pathKind && onPathAt(P, x, z) > R.f() * 0.55) continue;
    /* thin patches and the odd bare spot: a field is not a carpet */
    var thin = fbm2(x * 0.045 + 3.1, z * 0.045, P.terrainSeed + 5, 2);
    if (thin < -0.48 && R.f() < 0.85 && !P.rowSpacing) continue;
    if (z > -0.6) continue;
    if (P.waterY != null) {
      var gh = H(x, z);
      /* reeds stand in the shallows; grass keeps its feet dry */
      if (gh < P.waterY + (P.coverWet ? -0.30 : 0.25)) continue;
      if (P.coverMinH && gh < P.waterY + P.coverMinH) continue;
    }
    var ang = Math.abs(Math.atan2(x, -z));
    if (ang > 1.30) continue;
    order.push([x, z, hMul]);
    n++;
  }
  /* shuffle so trimming the instance count thins evenly rather than clipping a region */
  for (i = order.length - 1; i > 0; i--) {
    var j = Math.floor(R.f() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  COUNT = order.length;
  for (i = 0; i < COUNT; i++) {
    var o = order[i];
    var px = o[0], pz = o[1];
    var d2 = Math.sqrt(px * px + pz * pz);
    iPos[i * 3] = px;
    iPos[i * 3 + 1] = H(px, pz) - 0.02;
    iPos[i * 3 + 2] = pz;
    var hgt = P.grassHeight * o[2] * (0.55 + R.f() * 0.9) * (0.78 + 0.32 * (fbm2(px * 0.05, pz * 0.05, P.terrainSeed + 9, 2) * 0.5 + 0.5));
    hgt *= 1 + smoothstep(8, 30, d2) * 0.45;   /* fatten distant blades so the field stays dense */
    iAttr[i * 4] = hgt;
    iAttr[i * 4 + 1] = (0.017 + R.f() * 0.014) * P.coverWidth * (1 + smoothstep(10, 30, d2) * 1.3);
    iAttr[i * 4 + 2] = R.range(0, 6.283);
    iAttr[i * 4 + 3] = R.f();
    /* the flutter phase is shared over about a hand's breadth, then drifts:
       neighbours stir alike, blades a stride apart do not */
    iAttr2[i * 2] = px * 3.1 + pz * 2.6 + R.range(-1.1, 1.1);
    iAttr2[i * 2 + 1] = P.grassLean * R.range(0.62, 1.4);
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.setAttribute('iAttr2', new THREE.InstancedBufferAttribute(iAttr2, 2));
  geo.instanceCount = COUNT;

  var uni = {
    uTime: U.uTime, uWind: U.uWind, uGust: U.uGust, uWindDir: U.uWindDir,
    uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
    uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
    uSnow: U.uSnow, uSnowCol: U.uSnowCol,
    uBase: { value: new THREE.Color(P.grass.cb || P.grass.base) },
    uTip: { value: new THREE.Color(P.rowColour || P.grass.ct || P.grass.tip) },
    uDry: { value: new THREE.Color(P.grass.dry) },
    uFar0: { value: P.coverRows ? 26.0 : 14.0 },
    uFar1: { value: P.coverRows ? 53.0 : 32.0 }
  };
  var mat = new THREE.ShaderMaterial({
    uniforms: uni,
    side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr; attribute vec2 iAttr2;',
      'uniform float uTime, uWind, uGust, uFogDensity, uShadow, uSnow, uFar0, uFar1;',
      'uniform vec2 uWindDir;',
      'uniform vec3 uSunDir, uSunCol, uAmbCol, uFogCol, uBase, uTip, uDry, uSnowCol;',
      'varying vec3 vColor;',
      GLSL_COMMON,
      'void main(){',
      /* Per instance, not per vertex, so the whole blade shrinks together.
         A blade narrower than a pixel cannot be drawn without flickering, so
         instead of shading it more carefully we stop drawing it and let the
         ground carry the far field. */
      '  float dCam = length(iPos - cameraPosition);',
      '  float far = smoothstep(uFar0, uFar1, dCam);',
      '  float yN = position.y;',
      /* under real snow the grass is gone; a light fall leaves short pale stubs */
      '  float bury = smoothstep(0.12, 0.50, uSnow);',
      '  float h = iAttr.x * (1.0 - bury * 0.94) * (1.0 - far);',
      '  float w = iAttr.y * (1.0 - far * far);',
      '  float rot = iAttr.z;',
      '  float c = cos(rot), s = sin(rot);',
      '  vec3 lp = vec3(position.x * w, yN * h, 0.0);',
      '  lp.z += iAttr2.y * 0.20 * h * yN * yN;',
      '  float wave = sin(dot(iPos.xz, uWindDir) * 0.22 - uTime * 1.55 + iAttr2.x * 0.6);',
      '  float wave2 = sin(dot(iPos.xz, uWindDir) * 0.061 - uTime * 0.62 + 2.1);',
      /* two turbulence rhythms, on the blade's own clock */
      '  float flut = sin(uTime * 2.7 + iAttr2.x) * 0.30 + sin(uTime * 1.25 + iAttr2.x * 1.7) * 0.22;',
      '  float drive = uWind * (0.46 + 0.95 * uGust) * iAttr2.y;',
      '  float gust = max(0.55 + 0.40 * wave + 0.30 * wave2, 0.0);',       /* what the whole field feels */
      '  float shape = max(gust + flut, 0.0);',                             /* plus what this blade does */
      '  float bf = drive * shape * 0.45;',
      '  bf = bf / (1.0 + bf);',
      '  float bend = bf * h * 0.8 * yN * yN * (1.0 - bury * 0.7);',
      '  float gustBend = (drive * gust * 0.45) / (1.0 + drive * gust * 0.45) * h * 0.8;',
      '  vec3 rp = vec3(lp.x * c - lp.z * s, lp.y, lp.x * s + lp.z * c);',
      '  rp.xz += uWindDir * bend;',
      '  rp.y -= bend * bend * 0.55;',
      '  vec3 wp = iPos + rp;',
      /* the lighting normal leans with the gust, not the flutter: light rolls across
         the field in waves without any blade flickering on its own */
      '  vec3 N = normalize(vec3(-s, 0.62, c) + vec3(uWindDir.x, 0.0, uWindDir.y) * gustBend * 1.6 * (1.0 - far));',
      '  vec3 sd = normalize(uSunDir);',
      '  float diff = max(dot(N, sd), 0.0);',
