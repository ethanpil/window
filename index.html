  var mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
  App.propMeshes.push(mesh);
}

/* Small lights seen from afar: street lamps along the pavements, red
   obstacle lights on tall roofs. pts[i] = [x, y, z, size m, r, g, b, mode]
   mode 0 a lamp, lit at night and on dark days; 1 an aviation light, always
   on, blinking with all the others. Each keeps to at least a few pixels and
   gives up brightness as it grows past its size, so it neither vanishes nor
   swells with distance. */
function buildGlows(scene, U, pts) {
  if (!pts.length) return;
  var quad = new THREE.PlaneGeometry(1, 1);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index;
  geo.setAttribute('position', quad.attributes.position);
  geo.setAttribute('uv', quad.attributes.uv);
  var n = pts.length, iPos = new Float32Array(n * 3), iGlow = new Float32Array(n * 4), iMode = new Float32Array(n * 2);
  for (var i = 0; i < n; i++) {
    var p = pts[i];
    iPos[i * 3] = p[0]; iPos[i * 3 + 1] = p[1]; iPos[i * 3 + 2] = p[2];
    iGlow[i * 4] = p[3]; iGlow[i * 4 + 1] = p[4]; iGlow[i * 4 + 2] = p[5]; iGlow[i * 4 + 3] = p[6];
    iMode[i * 2] = p[7]; iMode[i * 2 + 1] = p[8] || 0;
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iGlow', new THREE.InstancedBufferAttribute(iGlow, 4));
  geo.setAttribute('iMode', new THREE.InstancedBufferAttribute(iMode, 2));
  geo.instanceCount = n;
  var mat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uCamPos: U.uCamPos, uNight: App.skyU.uNight, uSunCol: U.uSunCol, uFogDensity: U.uFogDensity },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iGlow; attribute vec2 iMode;',
      'uniform vec3 uCamPos, uSunCol; uniform float uTime, uNight, uFogDensity;',
      'varying vec2 vUv; varying vec3 vC;',
      GLSL_COMMON,
      'void main(){',
      '  vec3 toCam = uCamPos - iPos; float d = length(toCam); toCam /= d;',
      '  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), toCam));',
      '  vec3 up = cross(toCam, right);',
      '  float s = max(iGlow.x, d * 0.0042);',
      '  float dim = 1.0 - smoothstep(0.25, 0.80, dot(uSunCol, vec3(0.30, 0.59, 0.11)));',
      '  float on = iMode.x < 0.5 ? max(uNight, dim * 0.5) : (0.25 + 0.75 * uNight) * (0.3 + 0.7 * step(0.75, fract(uTime / 2.0 + iMode.y)));',
      '  vec4 mv = modelViewMatrix * vec4(iPos, 1.0);',
      '  vC = iGlow.yzw * on * clamp(iGlow.x * iGlow.x / (s * s), 0.18, 1.0) * (1.0 - fogAmt(-mv.z, uFogDensity) * 0.85);',
      '  vec3 p = iPos + (right * position.x + up * position.y) * s;',
      '  vUv = uv;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);',
      /* unlit (a lamp by day): put it outside the view, so it costs no pixels */
      '  if (on < 0.002) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec2 vUv; varying vec3 vC;',
      'void main(){',
      '  float r = length(vUv - 0.5) * 2.0;',
      '  float k = exp(-r * r * 5.0) * (1.0 - smoothstep(0.8, 1.0, r));',
      '  gl_FragColor = vec4(vC * k, 1.0);',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.userData.noTrim = true;              /* the beacons are last in the list: trimming put them out first */
  m.renderOrder = 8;
  scene.add(m);
  App.propMeshes.push(m);
}

/* Street trees down the pavements, a lamp every 26 m (where the ground
   draws its pool of light), and the city's traffic: moving lanes and
   parked cars on four to six streets round the view. C: cityPlan. Streets
   are named by the grid line they run down: an x street at gx = (k + 0.5)
   pitch runs along the grid's z. */
function cityStreets(scene, P, R, U, H, C, opt) {
  var SR = RNG(P.base + '/build/streets' + (P.nonce ? '/' + P.nonce : ''));
  var tSeed = SR.int(1, 9999);
  var half = C.pitch * 0.5, kerb = C.bw * 0.5 + C.sk, lampIn = C.sk - 0.7;
  var near = function (x, z) { return Math.sqrt(x * x + z * z); };
  var inRing = function (gx, gz) {
    /* a street is drawn where either block beside it is in the city */
    var w = C.toWorld(gx, gz), d = near(w[0], w[1]);
    return d >= C.streetStart && d <= C.end;
  };
  var y = function (x, z) { return opt.flat != null ? opt.flat : H(x, z); };
  /* lamps: the same places as the ground's pools (see buildTerrain) */
  var glows = [], trees = [], reach = opt.reach;
  var nb = Math.ceil(reach / C.pitch) + 1;
  for (var axis = 0; axis < 2; axis++) {
    for (var k = -nb; k <= nb; k++) {
      var line = (k + 0.5) * C.pitch;                    /* the street's centre line */
      for (var sd = -1; sd <= 1; sd += 2) {
        /* sd: which pavement. The block on the -side has this pavement on
           its + edge, where the ground's stagger is 0; the other, 13 m. */
        var off = line + sd * (C.sw * 0.5 - lampIn), st = sd < 0 ? 0 : 13;
        var treesHere = ihash(k * 7 + axis, sd + 3, tSeed) < (opt.trees || 0);
        var treeOff = line + sd * (C.sw * 0.5 - C.sk * 0.45);
        for (var a = -reach; a <= reach; a += 26) {
          var al = Math.round(a / 26) * 26 - st;
          var g = axis ? [al, off] : [off, al];
          var bc = axis ? [al, line + sd * half] : [line + sd * half, al];
          if (!inRing(bc[0], bc[1])) continue;
          var w = C.toWorld(g[0], g[1]);
          if (near(w[0], w[1]) > reach || w[1] > 30) continue;
          var gy = y(w[0], w[1]);
          if (P.waterY != null && gy < P.waterY + 0.8) continue;
          glows.push([w[0], gy + 7.5, w[1], 0.55, 1.0, 0.80, 0.56, 0]);
        }
        if (!treesHere) continue;
        for (var b = -reach; b <= reach; b += 9) {
          /* not across a junction: the along coordinate in its block */
          var inBlk = b - Math.round(b / C.pitch) * C.pitch;
          if (Math.abs(inBlk) > C.bw * 0.5 - 2) continue;
          var g2 = axis ? [b + SR.range(-0.6, 0.6), treeOff] : [treeOff, b + SR.range(-0.6, 0.6)];
          var bc2 = axis ? [Math.round(b / C.pitch) * C.pitch, line + sd * half] : [line + sd * half, Math.round(b / C.pitch) * C.pitch];
          if (!inRing(bc2[0], bc2[1])) continue;
          var w2 = C.toWorld(g2[0], g2[1]);
          var d2 = near(w2[0], w2[1]);
          if (d2 > opt.treeReach || w2[1] > 10) continue;
          var ty = y(w2[0], w2[1]);
          if (P.waterY != null && ty < P.waterY + 0.8) continue;
          trees.push([w2[0], ty - 0.1, w2[1], SR.range(0.85, 1.25), SR.range(0, 6.283), SR.range(0.9, 1.15), 1]);
        }
      }
    }
  }
  buildGlows(scene, U, glows.concat(opt.beacons || []));
  if (trees.length) {
    var T = { pos: [], nor: [], idx: [], rib: [] };
    pushCyl(T, 0, 0, 0, 0.16, 0.11, 3.0, 6);
    var trunk = finishGeo(T);
    /* a lumpy ball of leaves, its corners shared (an icosphere comes
       unindexed: thousands of crowns would each run 240 vertices, not 42) */
    var ico = new THREE.IcosahedronGeometry(1, 1), cp = ico.attributes.position, key = {}, upos = [], cidx = [];
    for (var vi = 0; vi < cp.count; vi++) {
      var vx = cp.getX(vi), vy = cp.getY(vi), vz = cp.getZ(vi);
      var kk = Math.round(vx * 1e4) + ',' + Math.round(vy * 1e4) + ',' + Math.round(vz * 1e4);
      if (key[kk] === undefined) {
        key[kk] = upos.length / 3;
        var nn = 1 + 0.16 * fbm2(vx * 2.1 + 3, vz * 2.1 + vy * 1.7, 77, 2);
        upos.push(vx * 2.4 * nn, 4.6 + vy * 2.1 * nn, vz * 2.4 * nn);
      }
      cidx.push(key[kk]);
    }
    ico.dispose();
    var crown = new THREE.BufferGeometry();
    crown.setAttribute('position', new THREE.Float32BufferAttribute(upos, 3));
    crown.setIndex(cidx);
    crown.computeVertexNormals();
    crown.setAttribute('rib', new THREE.Float32BufferAttribute(new Float32Array(upos.length / 3), 1));
    var leaf = new THREE.Color(P.seasonKey === 'autumn' ? '#8a6230' : (P.seasonKey === 'spring' ? '#4f6d34' : '#3f5a2e'));
    var bare = P.seasonKey === 'winter';
    if (bare) leaf.set('#4b4038');
    instanceSolid(scene, trunk, trees, solidMat(U, '#4a3f35', { rib: 0, grain: 0, spines: 0, aoH: 0.4 }));
    /* in winter the crown is bare twigs: the same mass, brown and thin */
    instanceSolid(scene, crown, trees, solidMat(U, '#' + leaf.getHexString(), { rib: 0, grain: 3, spines: 0, aoH: 0, body2: '#' + leaf.clone().multiplyScalar(bare ? 1.15 : 1.35).getHexString() }));
    for (var ti2 = 0; ti2 < trees.length; ti2 += 1)
      App._shadows.push([trees[ti2][0], trees[ti2][1], trees[ti2][2], 2.4 * trees[ti2][3], bare ? 0.35 : 0.85, 6.5 * trees[ti2][3] * trees[ti2][5]]);
  }
  /* traffic */
  var streets = opt.traffic || [];
  var mv = C.sw * 0.5 - C.sk - 2.2, wide = C.sw - 2 * C.sk >= 12;
  var lanesM = wide ? [mv * 0.25, mv * 0.75, -mv * 0.25, -mv * 0.75] : [mv * 0.5, -mv * 0.5];
  var park = C.sw * 0.5 - C.sk - 1.1;
  for (var si = 0; si < streets.length; si++) {
    var s = streets[si], ax = s[0], ln = (s[1] + 0.5) * C.pitch;

    var o0 = ax ? C.toWorld(-s[2], ln) : C.toWorld(ln, -s[2]);
    var dir = ax ? C.toWorld(1, 0) : C.toWorld(0, 1);
    var oy = y(o0[0], o0[1]);
    buildTraffic(scene, P, SR, U, {
      x: o0[0], y: oy, z: o0[1], len: opt.len, dir: dir,
      lanes: lanesM, spacing: SR.range(60, 130) / Math.sqrt(Math.max(P.trafficRate || 1, 0.5)), rate: P.trafficRate || 1, speed: [11, 14],
      parked: [park, -park], parkLen: opt.parkLen,
      skip: (function (s2) {
        return function (a) {
          var at = a + s2;              /* along, in the grid frame */
          var ib = at - Math.round(at / C.pitch) * C.pitch;
          return Math.abs(ib) > C.bw * 0.5 - 3;

}

/* The view down from a tower: blocks on a street grid, some above the window
   and some below, with traffic in the streets far beneath. */
function buildBlocks(scene, P, R, U, H) {
  var C = cityPlan(P), bw = C.bw, sw = C.sw, pitch = C.pitch, ga = C.ga;
  var ca = C.ca, sa = C.sa;
  var items = [], roofs = [], reach = 12;
  var street = function () { return -P.storey; };
  /* every block cut into lots built to the pavement, at mixed heights, with
     a tower on a podium here and there; the block you are in is your own */
  for (var bx = -reach; bx <= reach; bx++) {
    for (var bz = -reach; bz <= 2; bz++) {
      var gx = bx * pitch, gz = bz * pitch, w = C.toWorld(gx, gz);
      var d = Math.sqrt(w[0] * w[0] + w[1] * w[1]);
      if (d < pitch * 0.75 || d > 1500) continue;
      var hgt = Math.pow(R.f(), 2.0) * P.towerMax + R.range(8, 26);
      if (R.f() < 0.05) hgt = P.towerMax * R.range(1.0, 1.5);
      cityBlock(C, R, gx, gz, hgt, street, items, roofs);
    }
  }
  cityMesh(scene, P, R, U, items);
  buildRoofs(scene, P, R, U, roofs);
  /* Traffic on four streets running away from the window and two across
     it, parked cars down the kerbs, trees down the pavements, and the
     lamps and roof lights that carry the night. */
  cityStreets(scene, P, R, U, H, C, {
    flat: -P.storey, reach: 1000, treeReach: 650, trees: 0.65, len: 2400, parkLen: 900,
    traffic: [[0, -2, 400], [0, -1, 400], [0, 0, 400], [0, 1, 400], [1, -1, 0], [1, -2, 0]],
    beacons: cityBeacons(items)

}

/* The water, laid on the same profile the rock was cut from, so it runs down
   the mountainside rather than hanging in front of it. One continuous ribbon:
   it free-falls down the pitches and spreads over the benches. */
function buildCascadeFall(scene, P, R, U, H) {
  var segs = P.fallSegs, notch = P.fallNotch, fx = P.fallX;
  var STEPS = 90;
  var pts = [];
  /* walk the profile from the top of the fall down to the pool */
  var total = 0;
  for (var i = segs.length - 1; i >= 0; i--) {
    var g = segs[i];
    for (var k = 0; k < STEPS / segs.length; k++) {
      var t = k / (STEPS / segs.length);
      var e = g.drop ? (1 - t) * (1 - t) * (3 - 2 * (1 - t)) : (1 - t);
      var z = g.z1 + (g.z0 - g.z1) * t;
      var y = g.y0 + (g.y1 - g.y0) * e;
      /* A pitch narrows as it falls and the water gathers speed; a bench
         spreads. The sheet used to reach almost the full width of the notch,
         which is wider than the floor of the gully it is meant to run in, so
         its edges lay out on the open hillside with nothing to sit in and
         simply faded out over the grass. Keep it inside its channel. */
      var w = notch * (g.drop ? (0.24 + 0.11 * t) : (0.30 + 0.13 * t));
      pts.push({ z: z, y: y, w: w, drop: g.drop });
    }
  }
  /* where it meets the pool it spreads, but not to twice the width of the
     channel above it: that one point splayed the foot of the fall out
     across the open ground */
  pts.push({ z: P.poolZ + 6, y: P.waterY + 0.15, w: notch * 0.52, drop: 0 });
  for (var q = 1; q < pts.length; q++)
    total += Math.hypot(pts[q].z - pts[q - 1].z, pts[q].y - pts[q - 1].y);

  /* How far the sheet stands off the rock differed between a pitch and a
     bench, and it switched the moment one became the other. The step forward
     is 1m while the water only advances about 1m a point, so at every join
     the sheet folded back toward the hill and out again: the fall came down
     the mountain in a zigzag. Blend the two across the join instead. */
  for (var m2 = 0; m2 < pts.length; m2++) {
    var acc = 0, cnt = 0;
    for (var d2 = -4; d2 <= 4; d2++) {
      var j2 = m2 + d2;
      if (j2 < 0 || j2 >= pts.length) continue;
      acc += pts[j2].drop ? 1 : 0; cnt++;

    pts[m2].dropF = acc / cnt;
  }
  var pos = [], uv = [], idx = [], drops = [], run = 0, lastZ = -1e9;
  for (var m = 0; m < pts.length; m++) {
    var pt = pts[m];
    if (m > 0) run += Math.hypot(pt.z - pts[m - 1].z, pt.y - pts[m - 1].y);
    if (m > 0 && pt.z <= pts[m - 1].z) pt.z = pts[m - 1].z + 0.2;
    /* sit just clear of the rock: out of the gully floor and toward the viewer */
    var lift = 0.35 + 0.55 * pt.dropF;
    var out = 0.5 + 1.0 * pt.dropF;
    /* each edge rides the rock beneath it, so the sheet leans with the gully
       and never cuts into its walls */
    var zz2 = pt.z + out;
    if (zz2 <= lastZ) zz2 = lastZ + 0.05;      /* always run toward the window */
    lastZ = zz2;
    var yL = Math.min(Math.max(pt.y, H(fx - pt.w, zz2) + lift * 0.5), H(fx - pt.w, zz2) + lift + 1.6);
    var yR = Math.min(Math.max(pt.y, H(fx + pt.w, zz2) + lift * 0.5), H(fx + pt.w, zz2) + lift + 1.6);
    pos.push(fx - pt.w, yL, zz2);
    pos.push(fx + pt.w, yR, zz2);
    var v = run / Math.max(total, 1);
    uv.push(0, v, 1, v);
    drops.push(pt.dropF, pt.dropF);
    if (m < pts.length - 1) {
      var o = m * 2;
      idx.push(o, o + 1, o + 2, o + 1, o + 3, o + 2);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setAttribute('aDrop', new THREE.Float32BufferAttribute(drops, 1));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow,
      uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
      uLen: { value: total }
    },
    extensions: { derivatives: true },
    /* The eye looks along the slope, not across it, so the rock kept coming up
       in front of the sheet even though the water rides two metres above it.
       That cut the fall into horizontal bands. Bias the water toward the eye
       in depth rather than in space: it still goes behind anything properly in
       front of it, such as the trees on the near bank. */
    polygonOffset: true, polygonOffsetFactor: -8, polygonOffsetUnits: -16,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    vertexShader: [
      'attribute float aDrop;',
      'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze; varying float vDrop;',
      'uniform float uFogDensity, uShadow, uTime; uniform vec3 uSunDir, uSunCol, uAmbCol, uFogCol;',
      GLSL_COMMON,
      'void main(){ vUv = uv; vDrop = aDrop;',
      '  vec4 wp = modelMatrix * vec4(position, 1.0);',
      /* lit like the rock it runs over: in the gully's shade it is grey */
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.15, 1.0, baked(wp.xz));',
      '  vTint = uAmbCol * 1.35 + uSunCol * 0.95 * sh;',
      '  vec4 mv = viewMatrix * wp;',
      '  vFog = fogAmt(-mv.z, uFogDensity);',
      '  vHaze = hazeAt(uFogCol, normalize(wp.xyz - cameraPosition), uSunDir, uSunCol, vFog);',
      '  gl_Position = projectionMatrix * mv; }'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform float uTime, uLen; varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze; varying float vDrop;',
      'float h1(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.545); }',
      /* Value noise. Read with the fall stretched against the width, it draws
         threads rather than blobs. The old pattern cut the sheet into thirty
         columns and gave each one a single brightness across its whole width,
         so it could only ever read as a row of vertical bars. */
      'float vn(vec2 p){',
      '  vec2 i = floor(p), f = fract(p);',
      '  f = f * f * (3.0 - 2.0 * f);',
      '  return mix(mix(h1(i), h1(i + vec2(1.0, 0.0)), f.x),',
      '             mix(h1(i + vec2(0.0, 1.0)), h1(i + vec2(1.0, 1.0)), f.x), f.y);',
      '}',
      'void main(){',
      '  float d = vUv.y;',                       /* 0 at the head, 1 in the pool */
      /* The water gathers speed as it drops. That has to come from the shape
         of the fall coordinate, never from scaling uTime by depth: with
         y - uTime * (0.8 + 1.1 * d) the phase of the pattern is
         d * (k - 1.87 * uTime), whose sign turns over at uTime = k / 1.87.
         For a fall of eighty metres that is three seconds after the view
         opens, and from then on the water ran upward for ever. Raising d to
         a power under one makes the threads quicken as they descend and
         cannot change their direction. */
      '  float x = vUv.x * 6.0 + sin(d * 5.0 + uTime * 0.3) * 0.4;',
      '  float y = pow(d, 0.62) * uLen * 0.075;',
      '  float n1 = vn(vec2(x, y - uTime * 1.9));',
      '  float n2 = vn(vec2(x * 2.1 + 4.3, y * 2.3 - uTime * 4.6));',
      '  float n3 = vn(vec2(x * 4.4 + 9.7, y * 4.8 - uTime * 9.8));',
      /* a thread finer than a pixel would only crawl, so let it average out */
      '  float px = fwidth(x);',
      '  float k2 = 1.0 - smoothstep(0.25, 0.80, px * 2.1);',
      '  float k3 = 1.0 - smoothstep(0.25, 0.80, px * 4.4);',
      '  float w = n1 * 0.50 + mix(0.5, n2, k2) * 0.32 + mix(0.5, n3, k3) * 0.18;',
      /* three noises summed bunch about a half, which is a flat wash. Open the
         middle of the range back out so the threads read. */
      '  w = clamp((w - 0.30) * 2.6, 0.0, 1.0);',
      /* whole over the lip, fraying into threads the further it falls */
      '  float veil = smoothstep(mix(0.10, 0.40, d), mix(0.42, 0.80, d), w);',
      /* the sheet feathers to nothing at either edge, and the edges wander:
         a fall is never ruled straight */
      '  float ew = vn(vec2(y * 0.35, 3.1)), ew2 = vn(vec2(y * 0.35, 8.7));',
      '  float body = smoothstep(0.0, 0.08 + 0.16 * ew, vUv.x) * smoothstep(1.0, 0.92 - 0.16 * ew2, vUv.x);',
      /* white water where it lands, and a little breaking over the lip. This
         was the other way about, so the froth gathered at the head. */
      '  float froth = max(smoothstep(0.76, 1.0, d), smoothstep(0.05, 0.0, d) * 0.6);',
      /* Over a pitch it is a white veil of threads. Over a bench it slides
         on the rock: dark and glassy, broken only by streaks of white where
         it riffles. Painted white all the way down, it read as paper steps. */
      '  float riff = smoothstep(0.55, 0.9, w);',
      '  vec3 cDrop = mix(vec3(0.60, 0.70, 0.78), vec3(1.0), clamp(w * 0.85 + froth * 0.9, 0.0, 1.0));',
      '  vec3 cBench = mix(vec3(0.16, 0.22, 0.25), vec3(0.92, 0.95, 0.96), clamp(riff * 0.75 + froth * 0.8, 0.0, 1.0));',
      '  vec3 c = mix(cBench, cDrop, vDrop);',
      '  float a = body * mix(mix(0.50 + 0.40 * riff, 0.30 + 0.70 * veil, vDrop), 1.0, froth * 0.9);',
      '  gl_FragColor = vec4(tone(mix(c * vTint * 0.55, vHaze, vFog * 0.7)), a * (1.0 - vFog * 0.6));',
      '}'
    ].join('\n')
  });
  var mesh = new THREE.Mesh(geo, mat);
  mesh.frustumCulled = false;
  mesh.renderOrder = 4;
  scene.add(mesh);
  App.propMeshes.push(mesh);

  /* spray at the foot of every pitch, not just the bottom */
  for (var si = 0; si < segs.length; si++) {
    if (!segs[si].drop) continue;
    var g2 = segs[si];
    buildSmoke(scene, P, R, U, fx, g2.y0 + 1.0, g2.z0 + 3, notch * (0.9 + si * 0.25) * P.mistPower);
  }
}

/* Bands of colour laid through the canyon walls. */
function strataUniforms(P) {
  return {
    uStrata: { value: P.strata || 0 },
    uStrataTop: { value: 14 },
    uStrataBot: { value: -(P.canyonDepth || 60) }

}

/* ---------- field boundaries ----------
   Hedges, walls, fences and shelter belts running across the land. These are
   what turn an expanse into fields, and they fill the middle distance, which
   is otherwise nearly empty. Each is one instanced mesh along a seeded line. */
var BOUNDARY_KINDS = {
  hedge:    { biomes: ['meadow', 'farmland', 'hayfield', 'orchard', 'blossom', 'flowerfield', 'lavender', 'river', 'lakefront', 'autumn'], w: 5 },
  wall:     { biomes: ['moor', 'alpine', 'terraces', 'tundra', 'meadow', 'hayfield', 'cliffcoast', 'fjord'], w: 4 },
  fence:    { biomes: ['meadow', 'hayfield', 'farmland', 'savanna', 'oasis', 'river', 'moor', 'canyon'], w: 4 },
  shelter:  { biomes: ['farmland', 'hayfield', 'orchard', 'blossom', 'meadow', 'lavender'], w: 3 }
};
function boundaryPost(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  pushBox(B, 0, 0.55, 0, 0.055, 0.55, 0.055, 0);
  return finishGeo(B);
}
function boundaryRail(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  pushBox(B, 0, 0.72, 0, 1.0, 0.045, 0.03, 0);
  pushBox(B, 0, 0.44, 0, 1.0, 0.045, 0.03, 0);
  return finishGeo(B);
}
function boundaryStone(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  /* a course of rough stones, narrowing toward the top */
  for (var c = 0; c < 4; c++) {
    var y = 0.13 + c * 0.24, half = 0.30 - c * 0.045;
    var n = 3;
    for (var i = 0; i < n; i++) {
      var t = (i + 0.5) / n - 0.5;
      pushBox(B, t * 1.7 + R.range(-0.06, 0.06), y, R.range(-0.03, 0.03),
              0.9 / n * R.range(0.8, 1.05), 0.12, half, R.range(-0.12, 0.12));
    }
  }
  pushBox(B, 0, 1.06, 0, 0.9, 0.06, 0.18, 0);            /* the capping course */
  return finishGeo(B);
}
/* A length of hedge, one unit long along x (a little over, so neighbours
   overlap), one high, about half as deep: straight-sided, rounded on top,
   its surface pushed in and out by a lumpy noise that repeats along its
   length, so lengths laid end to end meet without a step. Light and leaf
   come from solidMat's foliage grain. */
function hedgeTemplate(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  var prof = [[-0.27, 0], [-0.30, 0.30], [-0.29, 0.62], [-0.22, 0.86], [-0.10, 0.98], [0, 1.0],
              [0.10, 0.98], [0.22, 0.86], [0.29, 0.62], [0.30, 0.30], [0.27, 0]];
  var rings = 9, L = 1.12, k, i;
  var ph = [], fr = [];
  for (k = 0; k < 4; k++) { ph.push(R.range(0, 6.283)); fr.push(R.int(1, 3)); }
  for (i = 0; i <= rings; i++) {
    var u = i / rings, x = (u - 0.5) * L;
    for (k = 0; k < prof.length; k++) {
      var a = k / (prof.length - 1);
      /* periodic in u, so both ends of every length carry the same bumps */
      var n = 0.07 * Math.sin(6.283 * fr[0] * u + ph[0] + a * 5.1) + 0.05 * Math.sin(6.283 * fr[1] * u + ph[1] + a * 9.7)

      var py = prof[k][1], pz = prof[k][0];
      var top = smoothstep(0.5, 1.0, py);
      B.pos.push(x, Math.max(py + n * top * 0.9, py > 0 ? 0.02 : 0), pz * (1 + n * 1.4));
      B.nor.push(0, pz === 0 ? 1 : 0.4, pz);
      B.rib.push(a);

    var a0 = i * m + k, b0 = a0 + m;

/* Hedges laid along lines as continuous lengths: lines is a list of
   {x, z, ca, sa, half} (a point, the direction, the half length). Their own
   stream, so they move nothing else. */
function buildHedgeLines(scene, P, U, H, lines, hgt, HR) {
  var forms = [hedgeTemplate(HR), hedgeTemplate(HR), hedgeTemplate(HR)], parts = [[], [], []];
  for (var L = 0; L < lines.length; L++) {
    var ln = lines[L], h = hgt * HR.range(0.85, 1.15), step = h * 0.98;
    var gapAt = HR.range(0, 1), gapW = HR.range(0.02, 0.06);     /* a gate */

    for (var t = -ln.half; t <= ln.half; t += step) {
      var x = ln.x + ln.ca * t, z = ln.z + ln.sa * t;
      if (z > -6) continue;
      var d = Math.sqrt(x * x + z * z);
      if (d < 12 || d > 430) continue;
      if (Math.abs((t + ln.half) / (2 * ln.half) - gapAt) < gapW) continue;
      if (P.waterY != null && H(x, z) < P.waterY + 0.3) continue;
      if (P.pathKind && onPathAt(P, x, z) > 0.3) continue;
      if (P.clearKind && clearAt(P, x, z + 1.5) > 0) continue;
      if (slopeAt(H, x, z) > 0.55) continue;

      if (d < 240) App._shadows.push([x, y, z, h * 0.45, 0.7, h * 0.9]);
    }

  var col = new THREE.Color(P.seasonKey === 'winter' ? '#3f4430' : (P.seasonKey === 'autumn' ? '#4c4a2a' : '#34482a')).multiplyScalar(P.treeTint || 1);
  var mat = solidMat(U, '#' + col.getHexString(), { rib: 0, grain: 3, spines: 0, aoH: 0.5,
    body2: P.seasonKey === 'autumn' ? '#7a5a2c' : '#5b6e3a' });
  for (var f = 0; f < 3; f++) if (parts[f].length) instanceSolid(scene, forms[f], parts[f], mat);
}
function buildBoundaries(scene, P, R, U, H) {
  if (P.waterY != null && P.biome.terrain === 'cascade') return;
  var opts = [];
  for (var k in BOUNDARY_KINDS) if (BOUNDARY_KINDS[k].biomes.indexOf(P.biomeKey) >= 0) {

  if (R.f() < 0.7) for (var j = 0; j < R.int(1, 2); j++)
    lines.push({ a: mainA + Math.PI / 2 + R.range(-0.22, 0.22), d: R.range(30, 240) * (R.f() < 0.5 ? -1 : 1) });

  var posts = [], rails = [], stones = [], bushes = [], trees = [], hedges = [];
  for (var L = 0; L < lines.length; L++) {
    var ln = lines[L], ca = Math.cos(ln.a), sa = Math.sin(ln.a);
    /* the line's own origin, offset sideways from the window */
    var ox = -sa * ln.d, oz = ca * ln.d;
    var step = kind === 'fence' ? 2.6 : (kind === 'wall' ? 1.7 : (kind === 'shelter' ? 7.5 : 2.1));

      '  vHaze = hazeAt(uFogCol, normalize(p - cameraPosition), uSunDir, uSunCol, vFog);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform sampler2D uMap;',
      'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
      'void main(){',
      '  vec4 t = texture2D(uMap, vUv);',
      '  if (t.a < 0.25) discard;',
      '  gl_FragColor = vec4(tone(mix(t.rgb * vTint, vHaze, vFog)), smoothstep(0.3, 0.7, t.a));',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  scene.add(m);
  App.propMeshes.push(m);
  /* A soft shadow on the ground under each animal, walking with it: a baked
     caster would stay where the animal started. Flat on the ground and seen
     at a grazing angle, so it blends rather than dithering. */
  var sq = new THREE.PlaneGeometry(1, 1);
  sq.rotateX(-Math.PI / 2);
  var sgeo = new THREE.InstancedBufferGeometry();
  sgeo.index = sq.index;
  sgeo.setAttribute('position', sq.attributes.position);
  sgeo.setAttribute('uv', sq.attributes.uv);
  sgeo.setAttribute('iPos', geo.attributes.iPos);
  sgeo.setAttribute('iAttr', geo.attributes.iAttr);
  sgeo.setAttribute('iGrad', geo.attributes.iGrad);
  sgeo.instanceCount = made;
  var smat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uCamPos: U.uCamPos, uSunDir: U.uSunDir, uShadow: U.uShadow,
      uFogDensity: U.uFogDensity, uSpeed: { value: Hd.speed }
    },
    transparent: true, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr; attribute vec2 iGrad;',
      'uniform float uTime, uSpeed, uFogDensity, uShadow;',
      'uniform vec3 uCamPos, uSunDir;',
      'varying vec2 vUv; varying float vA;',
      'float fogAmt(float d, float density){ float f = density * d; return 1.0 - exp(-f*f); }',
      WANDER,
      'void main(){',
      '  float size = iAttr.x, ph = iAttr.y, rate = iAttr.z;',
      '  float t = uTime * uSpeed * rate + ph;',
      '  vec3 wp = wander(iPos, iGrad, t, ph);',
      '  vec3 toCam = normalize(vec3(uCamPos.x - wp.x, 0.0, uCamPos.z - wp.z));',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      /* long along the body, which always lies across the view, and pushed a
         little away from a low sun */
      '  vec3 sd = normalize(uSunDir);',
      '  vec2 push = -sd.xz / max(sd.y, 0.35) * size * 0.18;',
      '  vec3 lp = right * position.x * size * 0.80 + toCam * position.z * size * 0.34;',
      '  vec3 p = wp + lp + vec3(push.x, 0.03, push.y);',
      /* stronger in sunshine, still there as a darker patch under cloud */
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vA = mix(0.20, 0.45, smoothstep(0.0, 0.2, sd.y) * (1.0 - uShadow)) * (1.0 - fogAmt(-mv.z, uFogDensity));',
      '  vUv = uv;',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec2 vUv; varying float vA;',
      'void main(){',
      '  float r = length((vUv - 0.5) * 2.0);',
      '  gl_FragColor = vec4(0.0, 0.0, 0.0, vA * (1.0 - smoothstep(0.35, 1.0, r)));',
      '}'
    ].join('\n')
  });
  var sm = new THREE.Mesh(sgeo, smat);
  sm.frustumCulled = false;
  scene.add(sm);
  App.propMeshes.push(sm);
  P.herdKind = kind;
  P.herdCount = made;
}

/* ---------- life on the water ----------
   A moored boat, ducks paddling, a heron standing still in the shallows. Water
   surfaces were completely bare. */
function makeWaterLifeTexture(kind) {
  var S = 96, c = cnv(S, S), g = c.getContext('2d');
  if (kind === 'duck') {
    g.fillStyle = '#4a4038';
    g.beginPath(); g.ellipse(S * 0.48, S * 0.58, S * 0.22, S * 0.12, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(S * 0.70, S * 0.44, S * 0.085, S * 0.09, 0, 0, 6.283); g.fill();
    g.fillStyle = '#2e5a3e';
    g.beginPath(); g.ellipse(S * 0.70, S * 0.42, S * 0.075, S * 0.078, 0, 0, 6.283); g.fill();
    g.fillStyle = '#c8a233';
    g.beginPath(); g.ellipse(S * 0.80, S * 0.47, S * 0.055, S * 0.028, 0.2, 0, 6.283); g.fill();
    g.fillStyle = '#6e6055';
    g.beginPath(); g.ellipse(S * 0.38, S * 0.55, S * 0.13, S * 0.07, -0.2, 0, 6.283); g.fill();
  } else { /* heron: tall, still, patient */
    g.strokeStyle = '#8e9298'; g.lineWidth = S * 0.035; g.lineCap = 'round';
    g.beginPath(); g.moveTo(S * 0.46, S * 0.95); g.lineTo(S * 0.47, S * 0.62); g.stroke();
    g.beginPath(); g.moveTo(S * 0.54, S * 0.95); g.lineTo(S * 0.53, S * 0.62); g.stroke();
    g.fillStyle = '#a9adb2';
    g.beginPath(); g.ellipse(S * 0.50, S * 0.56, S * 0.15, S * 0.11, -0.1, 0, 6.283); g.fill();
    g.strokeStyle = '#a9adb2'; g.lineWidth = S * 0.055;
    g.beginPath(); g.moveTo(S * 0.53, S * 0.50); g.quadraticCurveTo(S * 0.62, S * 0.36, S * 0.56, S * 0.22); g.stroke();
    g.fillStyle = '#b6babf';
    g.beginPath(); g.ellipse(S * 0.56, S * 0.19, S * 0.055, S * 0.045, 0, 0, 6.283); g.fill();
    g.fillStyle = '#d8b03a';
    g.beginPath(); g.moveTo(S * 0.60, S * 0.18); g.lineTo(S * 0.78, S * 0.21); g.lineTo(S * 0.60, S * 0.22); g.fill();
    g.fillStyle = '#3a4048';
    g.beginPath(); g.ellipse(S * 0.44, S * 0.55, S * 0.09, S * 0.06, 0.2, 0, 6.283); g.fill();
  }
  return tex(c, false);
}
function boatGeo(R) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  var len = R.range(1.5, 2.2);
  /* a hull as a shallow shell, pointed at both ends */
  var segs = 9;
  for (var i = 0; i < segs; i++) {
    var t = i / (segs - 1) - 0.5;
    var w = (1 - t * t * 3.4) * 0.42;
    if (w < 0.04) continue;
    pushBox(B, t * len, 0.12, 0, len / segs * 0.6, 0.13, w, 0);
  }
  pushBox(B, 0, 0.26, 0, len * 0.16, 0.04, 0.36, 0);        /* a thwart */
  pushBox(B, len * 0.30, 0.26, 0, len * 0.12, 0.04, 0.30, 0);
  return finishGeo(B);
}
function buildWaterLife(scene, P, R, U, H) {
  if (P.waterY == null || !P.biome.water) return;
  if (P.biome.water === 'sea' || P.biome.water === 'mirror') return;
  var wy = P.waterY;
  /* find open water somewhere ahead */
  var spots = [], guard = 0;
  while (spots.length < 40 && guard < 1200) {
    guard++;
    var wlim = visibleHalfAngle(P) * 0.88;
    var a = R.range(-wlim, wlim), rr = R.range(14, 130);
    var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
    if (H(x, z) < wy - 0.35) spots.push([x, z]);
  }
  if (spots.length < 6) return;

  /* a boat, moored or drifting */
  if (R.f() < 0.5) {
    var bs = spots[R.int(0, spots.length - 1)];
    var bmat = solidMat(U, R.pick(['#7a6448', '#8d6f4e', '#5f5a54', '#a8452f', '#3f5a72']), { rib: 0, grain: 1, spines: 0, barkN: 26, barkPlate: 9 });
    instanceSolid(scene, boatGeo(R), [[bs[0], wy - 0.10, bs[1], R.range(1.6, 2.6), R.range(0, 6.283), 1, 1]], bmat);
    P.hasBoat = true;
    App._features.push(['boat', bs[0], bs[1]]);
  }

  var kinds = [];
  if (R.f() < 0.7) kinds.push('duck');
  if (/marsh|lakefront|river|oasis/.test(P.biomeKey) && R.f() < 0.55) kinds.push('heron');
  for (var ki = 0; ki < kinds.length; ki++) {
    var kind = kinds[ki];
    var n = kind === 'duck' ? R.int(3, 9) : R.int(1, 2);
    var quad = new THREE.PlaneGeometry(1, 1);
    quad.translate(0, 0.5, 0);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);
    var iPos = new Float32Array(n * 3), iAttr = new Float32Array(n * 4), made = 0;
    /* ducks keep loosely together; herons stand alone at the edge */
    var cen = spots[R.int(0, spots.length - 1)];
    for (var i = 0; i < n; i++) {
      var s2 = kind === 'duck'
        ? [cen[0] + R.gauss() * 4.5, cen[1] + R.gauss() * 4.5]
        : spots[R.int(0, spots.length - 1)];
      if (kind === 'heron' && H(s2[0], s2[1]) < wy - 1.1) continue;   /* it needs to stand */
      iPos[made * 3] = s2[0];
      iPos[made * 3 + 1] = kind === 'heron' ? Math.max(H(s2[0], s2[1]), wy - 0.5) : wy - 0.04;
      iPos[made * 3 + 2] = s2[1];
      iAttr[made * 4] = kind === 'duck' ? R.range(0.30, 0.42) : R.range(1.0, 1.25);
      iAttr[made * 4 + 1] = R.range(0, 6.283);
      iAttr[made * 4 + 2] = kind === 'duck' ? R.range(0.5, 1.0) : R.range(0.05, 0.12);
      iAttr[made * 4 + 3] = R.f() < 0.5 ? 1 : -1;
      made++;
    }
    if (!made) continue;
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
    geo.instanceCount = made;
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uCamPos: U.uCamPos, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
        uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK,
        uMap: { value: makeWaterLifeTexture(kind) },
        uSwim: { value: kind === 'duck' ? 1.0 : 0.0 }
      },
      alphaTest: 0.25, side: THREE.DoubleSide,
      vertexShader: [
        'attribute vec3 iPos; attribute vec4 iAttr;',
        'uniform float uTime, uFogDensity, uSwim;',
        'uniform vec3 uCamPos, uSunDir, uSunCol, uAmbCol, uFogCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
        GLSL_COMMON,
        'void main(){',
        '  float size = iAttr.x, ph = iAttr.y, rate = iAttr.z, face = iAttr.w;',
        '  float t = uTime * rate * 0.10 + ph;',
        '  vec3 wp = iPos;',
        /* ducks paddle in slow arcs and bob; a heron barely moves at all */
        '  wp.x += (sin(t) * 2.6 + sin(t * 0.43 + ph) * 1.5) * uSwim;',
        '  wp.z += (cos(t * 0.77 + ph) * 2.2 + cos(t * 0.31) * 1.2) * uSwim;',
        '  wp.y += sin(uTime * 0.5 + ph) * 0.012 * uSwim;',
        '  vec3 toCam = normalize(vec3(uCamPos.x - wp.x, 0.0, uCamPos.z - wp.z));',
        '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam)) * face;',
        '  vec3 lp = right * position.x * size * 1.1 + vec3(0.0, position.y * size, 0.0);',
        '  vec3 p = wp + lp;',
        '  vTint = uAmbCol * 1.1 + uSunCol * 0.85 * max(uSunDir.y, 0.0);',
        '  vUv = uv;',
        '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
        '  vFog = fogAmt(-mv.z, uFogDensity);',
        '  vHaze = hazeAt(uFogCol, normalize(p - cameraPosition), uSunDir, uSunCol, vFog);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
        GLSL_TONE,
        'uniform sampler2D uMap;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying vec3 vHaze;',
        'void main(){',
        '  vec4 t = texture2D(uMap, vUv);',
        '  if (t.a < 0.25) discard;',
        '  gl_FragColor = vec4(tone(mix(t.rgb * vTint, vHaze, vFog)), smoothstep(0.3, 0.7, t.a));',
        '}'
      ].join('\n')
    });
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
    P.waterLife = (P.waterLife || '') + kind + ' ';
  }
}

/* ---------- roofs, for the view down from a tower ----------
   Seen from above, roofs are most of what there is, and they were flat lids. */
function buildRoofs(scene, P, R, U, items) {
  var B = { pos: [], nor: [], idx: [], rib: [] };
  pushCyl(B, 0, 0, 0, 0.5, 0.42, 1.0, 12);            /* a timber water tank */
  pushCone(B, 0, 1.0, 0, 0.55, 0.30, 12);
  for (var l = 0; l < 4; l++) {
    var la = l * 1.5708 + 0.785;
    pushBox(B, Math.cos(la) * 0.38, -0.55, Math.sin(la) * 0.38, 0.045, 0.55, 0.045, 0);
  }
  var tank = finishGeo(B);
  var C = { pos: [], nor: [], idx: [], rib: [] };
  pushBox(C, 0, 0.5, 0, 0.5, 0.5, 0.5, 0);            /* a plant room */
  var hut = finishGeo(C);
  var D = { pos: [], nor: [], idx: [], rib: [] };
  pushCyl(D, 0, 0, 0, 0.035, 0.02, 1.0, 6);           /* an aerial */
  pushBox(D, 0, 0.62, 0, 0.02, 0.02, 0.24, 0);
  pushBox(D, 0, 0.80, 0, 0.02, 0.02, 0.17, 0);
  var mast = finishGeo(D);
  var E = { pos: [], nor: [], idx: [], rib: [] };
  pushCyl(E, 0, 0, 0, 0.5, 0.36, 0.12, 8);            /* a spire on a drum */
  pushCone(E, 0, 0.12, 0, 0.36, 0.88, 8);
  var spireG = finishGeo(E);

  var tanks = [], huts = [], masts = [], spires = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var top = it[1] + it[3] * it[5];                  /* base + width * (height/width) */
    var w = it[3] * 0.5;
    var d = Math.sqrt(it[0] * it[0] + it[2] * it[2]);
    if (it.spire) spires.push([it[0], top, it[2], it.spire * 1.1, it[4], R.range(2.5, 5.5), 1]);
    if (d > 700) continue;
    var r = R.f();
    /* placed in the building's own frame, turned with it, and kept inside
       the roof's edge: offsets in world x and z put plant rooms in mid-air
       off the corner of a turned tower */
    var hw = w, hd = it[3] * it[6] * 0.5, rc = Math.cos(it[4]), rs = Math.sin(it[4]);
    var onRoof = function (fx, fz, rx, rz) {
      var lx = fx * Math.max(hw - rx, 0), lz = fz * Math.max(hd - rz, 0);
      return [it[0] + lx * rc - lz * rs, it[2] + lx * rs + lz * rc];
    };
    var fx1 = R.range(-0.8, 0.8), fz1 = R.range(-0.8, 0.8), tr = R.range(0, 6.283);
    var ts = Math.min(R.range(2.6, 4.6), hw * 0.8, hd * 0.8);
    /* the tank stands on its legs, which reach 1.1 of its size below it */
    var tp = onRoof(fx1, fz1, ts * 0.55, ts * 0.55);
    if (r < 0.30) tanks.push([tp[0], top + ts * 1.1, tp[1], ts, tr, 1, 1]);
    var fx2 = R.range(-1, 1), fz2 = R.range(-1, 1), hsy2 = R.range(0.5, 1.0);
    var hs2 = Math.min(R.range(3, 7), hw * 1.6), hsz2 = Math.min(R.range(0.7, 1.4), hd * 1.6 / hs2);
    var hp = onRoof(fx2, fz2, hs2 * 0.5, hs2 * hsz2 * 0.5);
    if (r > 0.25 && r < 0.75) huts.push([hp[0], top, hp[1], hs2, it[4], hsy2, hsz2]);
    var mp = onRoof(R.range(-0.9, 0.9), R.range(-0.9, 0.9), 0.5, 0.5), ms = R.range(4, 11), mr = R.range(0, 6.283);
    if (r > 0.7) masts.push([mp[0], top, mp[1], ms, mr, 1, 1]);
    /* air-handling units and condensers, a few to a roof */
    var nac = R.int(0, 4);
    for (var q = 0; q < 4; q++) {
      var as = R.range(1.4, 3.2), asz = R.range(0.6, 1.6), ap = onRoof(R.range(-1, 1), R.range(-1, 1), as * 0.5, as * asz * 0.5);
      if (q < nac && as < hw * 1.5 && as * asz < hd * 1.5) huts.push([ap[0], top, ap[1], as, it[4], R.range(0.35, 0.6), asz]);
    }
  }
  var mt = solidMat(U, '#8a7a62', { rib: 0, grain: 1, spines: 0, barkN: 20, barkPlate: 6 });
  var mh = solidMat(U, '#9a9a98', { rib: 0, grain: 0, spines: 0, body2: '#7d7d7b' });
  var mm = solidMat(U, '#6f7276', { rib: 0, grain: 0, spines: 0 });
  if (tanks.length) instanceSolid(scene, tank, tanks, mt);
  if (huts.length) instanceSolid(scene, hut, huts, mh);
  if (masts.length) instanceSolid(scene, mast, masts, mm);
  if (spires.length) instanceSolid(scene, spireG, spires, solidMat(U, '#8d9296', { rib: 0, grain: 0, spines: 0, aoH: 0 }));
}

/* ---------- ridges stacked into the distance ----------
   Real distance comes in layers, each paler and bluer than the one in front.
   A single fading noise field cannot do that; these can. */
function buildRidges(scene, P, R, U) {
  if (P.biomeKey === 'penthouse') return;
  /* dry country weathers into mesas and buttes: flat caps, steep sides,
     scree spreading at the foot */
  var mesa = ARID[P.biomeKey] && P.biomeKey !== 'savanna';
  var snowy = !mesa && (P.seasonKey === 'winter' || P.biomeKey === 'alpine' || P.biomeKey === 'fjord' || P.biomeKey === 'tundra');
  var layers = R.int(2, 4);
  for (var i = 0; i < layers; i++) {
    /* Beyond the terrain's own relief (it reaches 2400 m) so the two do not
       interleave, and inside the sky sphere (3000 m) or the sky would be
       nearer than the ridge and cover it. */
    var dist = Math.min(2900, 2480 + i * R.range(90, 150));
    var height = dist * R.range(0.035, 0.075) * (1 + i * 0.22);
    /* 512 segments: at 128 each was 60 m wide and the skyline kinked */
    var segs = 512, width = dist * 3.2;
    var g = new THREE.PlaneGeometry(width, height * 2.4, segs, 1);
    var pos = g.attributes.position;
    var seed = R.int(1, 9999), rough = R.range(0.5, 1.0);
    var v, top = [];
    for (v = 0; v <= segs; v++) {
      var x = pos.getX(v);
      /* the skyline: a ridged profile with a few summits standing above it */
      var n = ridged(x * 0.0016 + seed, seed * 0.1, seed, 4);
      var n2 = fbm2(x * 0.0005, seed * 0.3, seed + 7, 2);
      var y = (n * 0.75 + Math.abs(n2) * 0.55) * height * rough - height * 0.15;
      if (mesa) {
        /* terraced: each band rises in a short cliff and runs flat */
        var stp = height * 0.34, u = (y + height * 0.15) / stp, f = u - Math.floor(u);
        y = (Math.floor(u) + smoothstep(0.72, 0.92, f) + 0.12 * Math.min(f, 0.72) / 0.72) * stp - height * 0.15;
      }
      top.push(y);
    }
    var slope = new Float32Array(pos.count), dx = width / segs;
    for (v = 0; v <= segs; v++) {
      pos.setY(v, top[v]);
      pos.setY(v + segs + 1, -height * 1.4);
      var s = (top[Math.min(segs, v + 1)] - top[Math.max(0, v - 1)]) / (2 * dx);
      slope[v] = slope[v + segs + 1] = s;
    }
    g.setAttribute('aSlope', new THREE.BufferAttribute(slope, 1));
    g.computeVertexNormals();
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uFogCol: U.uFogCol, uSunCol: U.uSunCol, uSunDir: U.uSunDir, uHazeK: U.uHazeK,
        uAmbCol: U.uAmbCol, uZenith: App.skyU.uZenith,
        uDepth: { value: Math.min(0.62 + i * 0.12, 0.92) },
        uHeight: { value: height },
        uSnowCap: { value: snowy ? 0.55 : 2.0 },
        /* each layer its own faint cast, from its own seed, not a new draw */
        uHue: { value: new THREE.Vector3(1 + ((seed % 7) - 3) * 0.008, 1, 1 - ((seed % 5) - 2) * 0.010) }
      },
      side: THREE.DoubleSide, depthWrite: true, transparent: true,
      extensions: { derivatives: true },
      vertexShader: [
        'attribute float aSlope;',
        'varying vec3 vW; varying float vTop; varying float vSlope;',
        'void main(){ vec4 wp = modelMatrix * vec4(position, 1.0); vW = wp.xyz; vTop = position.y; vSlope = aSlope;',
        '  gl_Position = projectionMatrix * viewMatrix * wp; }'
      ].join('\n'),
      fragmentShader: [
        GLSL_TONE,
        'uniform vec3 uFogCol, uFogAway, uSunCol, uSunDir, uAmbCol, uZenith, uHue; uniform float uDepth, uHazeK, uHeight, uSnowCap;',
        'varying vec3 vW; varying float vTop; varying float vSlope;',
        'float rh(float p){ return fract(sin(p * 127.1) * 43758.5453); }',
        'float rn(float p){ float i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(rh(i), rh(i + 1.0), f); }',
        'void main(){',
        /* the horizon behind them, warm toward the sun and cool away (horizonAt) */
        '  vec3 vd = normalize(vW - cameraPosition);',
        '  float wAz = dot(normalize(vd.xz + vec2(1e-5)), normalize(uSunDir.xz + vec2(1e-5))) * 0.5 + 0.5;',
        '  vec3 hor = mix(uFogAway, uFogCol, smoothstep(0.0, 1.0, wAz));',
        '  float hN = vTop / uHeight;',                       /* 0 near the foot, ~1 at the summits */
        /* A face of its own: the profile's slope turns it toward or away from
           the sun, and gullies run down it. The gullies fade once they are
           finer than a pixel. */
        '  float gq = vW.x * 0.018;',
        '  float kG = 1.0 - smoothstep(0.30, 0.85, fwidth(gq));',
        '  float gully = (rn(gq) - 0.5) * 1.6 * kG;',
        '  vec3 n = normalize(vec3(-(vSlope * 2.5 + gully), 0.55, 1.0));',
        '  vec3 sd = normalize(uSunDir);',
        '  float sunK = clamp(dot(uSunCol, vec3(0.30, 0.59, 0.11)) * 1.4, 0.0, 1.0);',
        '  float shade = mix(1.0, 0.80 + 0.45 * max(dot(n, sd), 0.0), sunK);',
        /* the land under the air: darker and a little bluer than the horizon,
           white above the snow line */
        '  vec3 land = hor * vec3(0.62, 0.68, 0.78) * uHue;',
        '  float snow = smoothstep(uSnowCap, uSnowCap + 0.12, hN + gully * 0.08);',
        '  land = mix(land, hor * vec3(1.10, 1.12, 1.16), snow);',
        '  land *= shade;',
        /* the valleys hold the haze; summits stand clearer */
        '  float haze = uDepth * mix(1.0, 0.82, smoothstep(-0.6, 1.0, hN));',
        '  vec3 c = mix(land, hor, haze);',
        '  float f = pow(max(dot(vd, sd), 0.0), 3.0) * uHazeK;',
        '  c += uSunCol * f * 0.06;',
        '  gl_FragColor = vec4(tone(c), 1.0);',
        '}'
      ].join('\n')
    });
    var m = new THREE.Mesh(g, mat);
    m.position.set(0, height * 0.15, -dist);
    m.renderOrder = 890 + i;                    /* behind the land, in front of the sky */
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
  }
}
/* ---------- motes: specks turning in the light just outside the glass ----------
   These used to be drawn on the overlay above everything, which put them in
   front of the frame and made them look like they were in the room. As part of
   the scene they are occluded by the mullions like anything else. */
function buildMotes(scene, P, R, U, H) {
  if (App.reduceMotion) return;
  var N = Math.round(90 * (Q().precipMul || 1));
  var quad = new THREE.PlaneGeometry(1, 1);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = quad.index; geo.setAttribute('position', quad.attributes.position); geo.setAttribute('uv', quad.attributes.uv);
  var iPos = new Float32Array(N * 3), iAttr = new Float32Array(N * 4);
  for (var i = 0; i < N; i++) {
    var a = R.range(-1.15, 1.15), r = 4.5 + Math.pow(R.f(), 1.4) * 16;
    var x = Math.sin(a) * r, z = -Math.cos(a) * r;
    iPos[i * 3] = x;
    iPos[i * 3 + 1] = H(x, z) + R.range(0.2, 3.4);
    iPos[i * 3 + 2] = z;
    iAttr[i * 4] = R.range(0.012, 0.030);       /* size */
    iAttr[i * 4 + 1] = R.range(0, 6.283);       /* phase */
    iAttr[i * 4 + 2] = R.range(0.10, 0.34);     /* drift speed */
    iAttr[i * 4 + 3] = R.range(0.5, 1.0);       /* brightness */
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.instanceCount = N;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uCamPos: U.uCamPos, uWind: U.uWind, uWindDir: U.uWindDir,
      uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uFogCol: U.uFogCol
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr;',
      'uniform float uTime, uWind, uFogDensity;',
      'uniform vec2 uWindDir; uniform vec3 uCamPos, uSunDir, uSunCol, uAmbCol, uFogCol;',
      'varying vec2 vUv; varying float vA;',
      GLSL_COMMON,
      'void main(){',
      '  float t = uTime * iAttr.z + iAttr.y;',
      '  vec3 wp = iPos;',
      '  wp.x += sin(t * 0.7) * 0.5 + sin(t * 0.23 + iAttr.y) * 0.9;',
      '  wp.y += sin(t * 0.41 + iAttr.y * 1.7) * 0.35;',
      '  wp.z += cos(t * 0.53) * 0.6;',
      '  wp.xz += uWindDir * uWind * 0.3;',
      '  wp.z = min(wp.z, -3.0);',
      '  vec3 toCam = normalize(uCamPos - wp);',
      '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',
      '  vec3 up = normalize(cross(toCam, right));',
      '  float size = iAttr.x;',
      '  vec3 p = wp + right * position.x * size + up * position.y * size;',
      /* a speck only shows when it catches the light nearly edge-on to the sun */
      '  float glint = pow(max(dot(toCam, normalize(uSunDir)), 0.0), 3.0);',
      '  vA = iAttr.w * (0.10 + 0.90 * glint) * (0.35 + 0.65 * length(uSunCol));',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vA *= 1.0 - fogAmt(-mv.z, uFogDensity);',
      '  vUv = uv;',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec2 vUv; varying float vA;',
      'void main(){',
      '  float d = length(vUv - 0.5) * 2.0;',
      '  float core = 1.0 - smoothstep(0.0, 1.0, d);',
      '  float a = core * vA * 0.55;',
      '  if (a < 0.004) discard;',
      '  gl_FragColor = vec4(vec3(1.0, 0.97, 0.90) * a, a);',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  m.renderOrder = 7;
  scene.add(m);
  App.propMeshes.push(m);
}

/* ---------- small life ----------
   A lizard holds still for half a minute, then darts a body-length or two
   and holds again. A scorpion does the same, slower. It is all on a
   per-creature clock in the vertex shader, so nothing runs on the CPU. */
function makeCritterTexture(kind) {
  var S = 64, c = cnv(S, S), g = c.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'lizard') {
    g.fillStyle = '#6d6a4c'; g.strokeStyle = '#6d6a4c';
    g.beginPath(); g.ellipse(S * 0.42, S * 0.5, S * 0.18, S * 0.075, 0, 0, 6.283); g.fill();
    g.beginPath(); g.ellipse(S * 0.64, S * 0.5, S * 0.07, S * 0.055, 0, 0, 6.283); g.fill();
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(S * 0.25, S * 0.5); g.quadraticCurveTo(S * 0.12, S * 0.46, S * 0.04, S * 0.56); g.stroke();
    g.lineWidth = 2;
    var legs = [[0.34, -1, -0.6], [0.34, 1, -0.6], [0.52, -1, 0.5], [0.52, 1, 0.5]];
    for (var q = 0; q < legs.length; q++) { var l = legs[q];
      g.beginPath(); g.moveTo(S * l[0], S * 0.5); g.lineTo(S * (l[0] + l[2] * 0.06), S * (0.5 + l[1] * 0.14)); g.lineTo(S * (l[0] + l[2] * 0.02), S * (0.5 + l[1] * 0.20)); g.stroke(); }
    g.fillStyle = '#4a4834';
    for (var d = 0; d < 6; d++) { g.beginPath(); g.arc(S * (0.28 + d * 0.06), S * 0.5, 1.2, 0, 6.283); g.fill(); }
  } else {
    g.fillStyle = '#3a2f24'; g.strokeStyle = '#3a2f24';
    g.beginPath(); g.ellipse(S * 0.5, S * 0.5, S * 0.14, S * 0.07, 0, 0, 6.283); g.fill();
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(S * 0.36, S * 0.5); g.quadraticCurveTo(S * 0.18, S * 0.5, S * 0.14, S * 0.3);
    g.quadraticCurveTo(S * 0.13, S * 0.2, S * 0.2, S * 0.2); g.stroke();
    g.lineWidth = 2;
    for (var lg = 0; lg < 4; lg++) for (var sd = -1; sd <= 1; sd += 2) {
      var x0 = S * (0.42 + lg * 0.05);
      g.beginPath(); g.moveTo(x0, S * 0.5); g.lineTo(x0 + S * 0.02, S * (0.5 + sd * 0.13)); g.lineTo(x0 + S * 0.05, S * (0.5 + sd * 0.17)); g.stroke();
    }
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(S * 0.62, S * 0.46); g.lineTo(S * 0.74, S * 0.36); g.lineTo(S * 0.80, S * 0.40); g.stroke();
    g.beginPath(); g.moveTo(S * 0.62, S * 0.54); g.lineTo(S * 0.74, S * 0.64); g.lineTo(S * 0.80, S * 0.60); g.stroke();
  }
  return tex(c, false);
}

function buildCritters(scene, P, R, U, H) {
  /* Lizards bask by day; scorpions hunt by night and hide from the sun. At
     night there were no critters at all (and none of the builder's stream
     is drawn then, so the night's scorpions come from a stream of their
     own); by day the scorpions' draws are still taken, and nothing built. */
  if (!P.biome.critters || P.weather.rain > 0.3) return;
  var dark = P.timeA === 'night';
  if (dark && !/desert|canyon|oasis/.test(P.biomeKey)) return;
  if (dark) R = RNG(P.base + '/build/critters/night' + (P.nonce ? '/' + P.nonce : ''));
  var kinds = dark ? [['scorpion', R.int(1, 3)]] : [['lizard', R.int(1, 3)], ['scorpion', R.chance(0.6) ? 1 : 0]];
  for (var ki = 0; ki < kinds.length; ki++) {
    var kind = kinds[ki][0], n = kinds[ki][1];
    if (!n) continue;
    var quad = new THREE.PlaneGeometry(1, 1); quad.rotateX(-Math.PI / 2);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index; geo.setAttribute('position', quad.attributes.position); geo.setAttribute('uv', quad.attributes.uv);
    var iPos = new Float32Array(n * 3), iAttr = new Float32Array(n * 4), iDart = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) {
      var a = R.range(-0.9, 0.9), rr = R.range(2.2, 9);
      var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
      iPos[i * 3] = x; iPos[i * 3 + 1] = H(x, z) + 0.035; iPos[i * 3 + 2] = z;
      iAttr[i * 4] = kind === 'lizard' ? R.range(0.16, 0.24) : R.range(0.09, 0.13);
      iAttr[i * 4 + 1] = R.range(0, 1);
      iAttr[i * 4 + 2] = kind === 'lizard' ? R.range(22, 48) : R.range(30, 70);
      iAttr[i * 4 + 3] = kind === 'lizard' ? 0.35 : 1.4;
      var da = R.range(0, 6.283), dl = kind === 'lizard' ? R.range(0.5, 1.2) : R.range(0.25, 0.5);
      iDart[i * 3] = Math.cos(da) * dl; iDart[i * 3 + 1] = da; iDart[i * 3 + 2] = Math.sin(da) * dl;
    }
    if (kind === 'scorpion' && !dark) { quad.dispose(); geo.dispose(); continue; }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
    geo.setAttribute('iDart', new THREE.InstancedBufferAttribute(iDart, 3));
    geo.instanceCount = n;
    var mat = new THREE.ShaderMaterial({
      uniforms: { uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol, uMap: { value: makeCritterTexture(kind) } },
      transparent: true, depthWrite: false, alphaTest: 0.02, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
      vertexShader: [
        'attribute vec3 iPos; attribute vec4 iAttr; attribute vec3 iDart;',
        'uniform float uTime; uniform vec3 uSunDir, uSunCol, uAmbCol;',
        'varying vec2 vUv; varying vec3 vTint;',
        'void main(){',
        '  float len = iAttr.x, period = iAttr.z, dur = iAttr.w;',
        '  float t = uTime + iAttr.y * period;',
        '  float cyc = floor(t / period);',
        '  float ph = clamp((t - cyc * period) / dur, 0.0, 1.0);',
        '  float ease = ph * ph * (3.0 - 2.0 * ph);',
        '  float dir = mod(cyc, 2.0) < 0.5 ? 1.0 : -1.0;',
        '  float from = dir > 0.0 ? 0.0 : 1.0;',
        '  float at = from + dir * ease;',
        '  vec3 wp = iPos + vec3(iDart.x, 0.0, iDart.z) * at;',
        '  float heading = iDart.y + (dir > 0.0 ? 0.0 : 3.14159);',
        '  float c = cos(heading), s = sin(heading);',
        '  vec3 lp = vec3(position.x * c - position.z * s, 0.0, position.x * s + position.z * c) * len;',
        '  vTint = uAmbCol * 1.1 + uSunCol * max(uSunDir.y, 0.0) * 1.1;',
        '  vUv = uv;',
        '  gl_Position = projectionMatrix * modelViewMatrix * vec4(wp + lp, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: [
        GLSL_TONE,
        'uniform sampler2D uMap; varying vec2 vUv; varying vec3 vTint;',
        'void main(){ vec4 t = texture2D(uMap, vUv); if (t.a < 0.02) discard;',
        '  gl_FragColor = vec4(tone(t.rgb * vTint), t.a); }'
      ].join('\n')
    });
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
  }
}

/* ---------- near-field clutter ----------
   Everything within a dozen metres is where the eye actually lands, so it gets
   its own scatter of stones, litter and tufts lying flat on the ground. */
function makeSprayTexture(kind, P, R) {
  /* a hand's span of twig: many small leaves at 256 square, so a card no
     longer shows a dozen leaves the size of plates */
  var S = 256, c = cnv(S, S), g = c.getContext('2d');
  var base, lite, lw = 0.038, ll = 0.064, n = 125;
  if (kind === 'pine') { base = new THREE.Color('#1f3a2a').multiplyScalar(P.treeTint); lite = base.clone().lerp(new THREE.Color('#7fa066'), 0.5); lw = 0.013; ll = 0.085; n = 150; }
  else if (kind === 'olive') { base = new THREE.Color('#6f7d5c'); lite = new THREE.Color('#b9c2a0'); lw = 0.017; ll = 0.054; n = 140; }
  else if (kind === 'blossom') { base = new THREE.Color(P.blossomCol || '#f2d3de'); lite = new THREE.Color('#ffffff'); lw = 0.023; ll = 0.028; n = 150; }
  else if (kind === 'acacia') { base = new THREE.Color('#4e5a2e').multiplyScalar(P.treeTint); lite = base.clone().lerp(new THREE.Color('#b3ba78'), 0.5); lw = 0.012; ll = 0.022; n = 180; }
  else { base = new THREE.Color(P.leafDark || P.grass.base).multiplyScalar(0.9 * P.treeTint); lite = new THREE.Color(P.leafLight || P.grass.tip).multiplyScalar(0.95 * P.treeTint); }
  /* twigs radiating from the middle, then the leaves on top of them */
  g.strokeStyle = '#4b3a2b'; g.lineWidth = 3.0; g.lineCap = 'round';
  for (var tw = 0; tw < 5; tw++) {
    var ta = R.f() * 6.283, tl = S * R.range(0.22, 0.42);
    g.beginPath(); g.moveTo(S * 0.5, S * 0.5); g.lineTo(S * 0.5 + Math.cos(ta) * tl, S * 0.5 + Math.sin(ta) * tl); g.stroke();
  }
  leafSpray(g, S / 2, S / 2, S * 0.44, base.clone().multiplyScalar(0.7), lite, Math.round(n * 2.4), S * lw * 0.62, S * ll * 0.62, R);
  return tex(c, false);
}

var CLUTTER_GRAVEL = { desert: 1, canyon: 1, saltflat: 1, coast: 1, oasis: 1 };
function makeClutterTexture(kind, P, R) {
  var S = 128, c = cnv(S, S), g = c.getContext('2d');
  var rgb = function (col) {
    return 'rgb(' + Math.round(col.r * 255) + ',' + Math.round(col.g * 255) + ',' + Math.round(col.b * 255) + ')';
  };
  /* Desert stones are dark with varnish, a few pale with quartz, and small:
     a pebble a few centimetres across, not a hand-sized orange blob. */
  var varnish = function (G) {
    var t = R.f();
    var col = t < 0.55 ? new THREE.Color('#3a2a20').lerp(new THREE.Color('#5a4434'), R.f())
      : (t < 0.85 ? new THREE.Color(P.rockCol).lerp(new THREE.Color('#4a3a2e'), R.range(0.3, 0.7))
      : new THREE.Color('#b5a898').lerp(new THREE.Color(P.grass.soil), R.range(0, 0.4)));
    return col.offsetHSL(0, R.range(-0.04, 0.02), R.range(-0.05, 0.04));
  };
  if (CLUTTER_GRAVEL[P.biomeKey] && P.biomeKey !== 'coast' && kind !== 'litter') {
    /* drawn from a stream of their own; the builder's stream still takes
       the draws the old painting took, so everything after it, the clock
       included, stays where it was */
    for (var burn = kind === 'stones' ? 49 : 280; burn > 0; burn--) R.f();
    R = RNG(P.base + '/clutter/' + kind);
    for (var vp = 0; vp < (kind === 'stones' ? 46 : 70); vp++) {
      var vx = R.range(0.08, 0.92) * S, vy = R.range(0.08, 0.92) * S;
      var vw = S * (kind === 'stones' ? R.range(0.012, 0.05) : R.range(0.008, 0.026)), vh = vw * R.range(0.55, 0.95), va = R.range(0, 3.14);
      var vc = varnish();
      g.fillStyle = rgb(vc.clone().multiplyScalar(0.55));
      g.beginPath(); g.ellipse(vx + vw * 0.2, vy + vh * 0.25, vw, vh, va, 0, 6.283); g.fill();
      g.fillStyle = rgb(vc);
      g.beginPath(); g.ellipse(vx, vy, vw, vh, va, 0, 6.283); g.fill();
      g.fillStyle = rgb(vc.clone().multiplyScalar(1.35));
      g.beginPath(); g.ellipse(vx - vw * 0.25, vy - vh * 0.28, vw * 0.45, vh * 0.38, va, 0, 6.283); g.fill();
    }
  } else if (kind === 'stones') {
    var rc = new THREE.Color(P.rockCol);
    for (var i = 0; i < 7; i++) {
      var x = R.range(0.2, 0.8) * S, y = R.range(0.2, 0.8) * S;
      var w = S * R.range(0.07, 0.17), h = w * R.range(0.6, 1.0);
      var col = rc.clone().offsetHSL(0, R.range(-0.05, 0.05), R.range(-0.14, 0.16));
      g.fillStyle = rgb(col);
      g.beginPath(); g.ellipse(x, y, w, h, R.range(0, 3.14), 0, 6.283); g.fill();
      g.fillStyle = rgb(col.clone().multiplyScalar(1.22));
      g.beginPath(); g.ellipse(x - w * 0.22, y - h * 0.24, w * 0.5, h * 0.42, 0, 0, 6.283); g.fill();
    }
  } else if (kind === 'litter') {
    if (P.season.blossom && P.blossomCol) {
      var pc = new THREE.Color(P.blossomCol).lerp(new THREE.Color(P.grass.base), 0.35);
      for (var j = 0; j < 70; j++) {
        var pcc = pc.clone().offsetHSL(0, 0, R.range(-0.08, 0.06));
        g.fillStyle = 'rgba(' + Math.round(pcc.r * 255) + ',' + Math.round(pcc.g * 255) + ',' + Math.round(pcc.b * 255) + ',' + R.range(0.55, 0.85) + ')';
        g.save();
        g.translate(R.f() * S, R.f() * S); g.rotate(R.f() * 6.283);
        g.beginPath(); g.ellipse(0, 0, S * R.range(0.012, 0.022), S * R.range(0.009, 0.015), 0, 0, 6.283); g.fill();
        g.restore();
      }
    } else {
      var lc = new THREE.Color(P.leafDark || P.leafLight || P.grass.dry).lerp(new THREE.Color(P.grass.soil), 0.25);
      for (var j2 = 0; j2 < 26; j2++) {
        g.fillStyle = rgb(lc.clone().offsetHSL(R.range(-0.05, 0.05), R.range(-0.1, 0.1), R.range(-0.15, 0.12)));
        g.save();
        g.translate(R.f() * S, R.f() * S); g.rotate(R.f() * 6.283);
        g.beginPath(); g.ellipse(0, 0, S * R.range(0.03, 0.065), S * R.range(0.012, 0.028), 0, 0, 6.283); g.fill();
        g.restore();
      }
    }
  } else if (CLUTTER_GRAVEL[P.biomeKey]) {
    /* nothing grows flat on sand or bare rock: small dark stones and grit
       (the coast; the desert's are drawn above) */
    var gc = new THREE.Color(P.rockCol).lerp(new THREE.Color(P.grass.soil), 0.35);
    for (var gp = 0; gp < 40; gp++) {
      var gx = R.range(0.1, 0.9) * S, gy = R.range(0.1, 0.9) * S, gw = S * R.range(0.012, 0.04);
      var gcol = gc.clone().offsetHSL(0, R.range(-0.05, 0.03), R.range(-0.16, 0.04));
      g.fillStyle = rgb(gcol);
      g.beginPath(); g.ellipse(gx, gy, gw, gw * R.range(0.6, 0.95), R.range(0, 3.14), 0, 6.283); g.fill();
    }
  } else { /* tuft: a low rosette of leaves seen from above, darker than the
              blade tips and a little see-through so it reads as a plant on the
              ground rather than a pale blotch */
    var tc = new THREE.Color(P.grass.cb || P.grass.base).lerp(new THREE.Color(P.grass.ct || P.grass.tip), 0.45);
    g.globalAlpha = 0.82;
    for (var k = 0; k < 22; k++) {
      var a = R.f() * 6.283, len = S * R.range(0.14, 0.30);
      g.fillStyle = rgb(tc.clone().offsetHSL(0, 0, R.range(-0.16, 0.04)));
      g.save(); g.translate(S / 2, S / 2); g.rotate(a);
      g.beginPath(); g.ellipse(len * 0.55, 0, len * 0.55, S * R.range(0.035, 0.06), 0, 0, 6.283); g.fill();
      g.restore();
    }
  }
  return tex(c, false);
}

function buildClutter(scene, P, R, U, H) {
  if ((P.terrainKind || P.biome.terrain) === 'salt') return;
  var kinds = ['stones', 'tufts'];
  if (P.leafFall || P.seasonKey === 'autumn') kinds.push('litter');
  var perKind = Math.round(520 * Q().propMul);
  for (var ki = 0; ki < kinds.length; ki++) {
    var kind = kinds[ki];
    var quad = new THREE.PlaneGeometry(1, 1);
    quad.rotateX(-Math.PI / 2);                 /* lying flat on the ground */
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);
    var items = [], guard = 0;
    while (items.length < perKind && guard < perKind * 25) {
      guard++;
      var a = R.range(-1.30, 1.30);
      var rr = 1.6 + Math.pow(R.f(), 1.9) * 17;   /* everything inside ~19 m */
      var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
      if (z > -0.9) continue;
      if (P.waterY != null && H(x, z) < P.waterY + 0.2) continue;
      /* a worn path is where nothing low grows */
      if (kind === 'tufts' && P.pathKind && onPathAt(P, x, z) > 0.3) continue;
      if (P.pathKind === 'lane' && onPathAt(P, x, z) > 0.05) continue;   /* a road is kept clear */
      if (kind !== 'litter' && P.clearKind && P.clearKind < 3 && clearAt(P, x, z + 0.4) > 0.05) continue;
      var csz = R.range(0.22, 0.85) * (kind === 'tufts' && !CLUTTER_GRAVEL[P.biomeKey] ? 1.5 : 1);
      var crot = R.range(0, 6.283);
      /* the stones are painted lit from the upper left of their card; turn
         each card so that side faces the sun, with a little scatter */
      if (kind === 'stones') crot = Math.atan2(-Math.cos(P.sunAz), Math.sin(P.sunAz)) - Math.atan2(-0.74, -0.67) + (crot - 3.14) * 0.11;
      items.push([x, H(x, z) + 0.03, z, csz, crot]);
    }
    /* a sand sea is sand: a stone here and there, no more (thinned after
       the fact, so the builder's stream is drawn as before) */
    if (P.erg || P.oasisW) items = items.filter(function (it) { return ihash(Math.round(it[0] * 10), Math.round(it[2] * 10), 77) < (P.erg ? 0.15 : 0.3); });
    if (!items.length) continue;
    var iPos = new Float32Array(items.length * 3);
    var iAttr = new Float32Array(items.length * 2);
    for (var i = 0; i < items.length; i++) {
      iPos[i * 3] = items[i][0]; iPos[i * 3 + 1] = items[i][1]; iPos[i * 3 + 2] = items[i][2];
      iAttr[i * 2] = items[i][3]; iAttr[i * 2 + 1] = items[i][4];
    }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 2));
    geo.instanceCount = items.length;
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
        uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
        uSnow: U.uSnow, uSnowCol: U.uSnowCol, uCamPos: U.uCamPos,
        uMap: { value: makeClutterTexture(kind, P, R) }
      },
      /* lying flat and seen at a grazing angle, these are mostly partial alpha;
         blended, their edges are smooth and hold still. Dithered, they sparkle. */
      transparent: true, depthWrite: false, alphaTest: 0.02, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4,
      vertexShader: [
        'attribute vec3 iPos; attribute vec2 iAttr;',
        'uniform float uTime, uFogDensity, uShadow, uSnow;',
        'uniform vec3 uSunDir, uSunCol, uAmbCol, uSnowCol, uCamPos;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying float vNear;',
        GLSL_COMMON,
        'void main(){',
        '  float sc = iAttr.x, rot = iAttr.y;',
        '  float c = cos(rot), s = sin(rot);',
        '  float dN = length(iPos - cameraPosition);',
        '  float keep = (1.0 - smoothstep(11.0, 18.0, dN)) * (1.0 - smoothstep(0.15, 0.45, uSnow));',
        '  vec3 lp = vec3(position.x * c - position.z * s, 0.0, position.x * s + position.z * c) * sc * keep;',
        '  vec3 wp = iPos + lp;',
        '  vec2 bk = bakedRG(wp.xz);',
        '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.03, 1.0, bk.x);',
        '  float diff = max(uSunDir.y, 0.0);',
        '  vec3 L = uAmbCol * 1.1 * bk.y + uSunCol * diff * 1.15 * sh;',
        '  vTint = mix(L, uSnowCol * L * 0.82, uSnow * 0.8);',
        '  vUv = uv;',
        '  vNear = 1.0;',
        '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
        '  vFog = fogAmt(-mv.z, uFogDensity);',
        '  gl_Position = projectionMatrix * mv;',
        '}'
      ].join('\n'),
      fragmentShader: [
      GLSL_TONE,
        'uniform sampler2D uMap; uniform vec3 uFogCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint; varying float vNear;',
        'void main(){',
        '  vec4 t = texture2D(uMap, vUv);',
        '  if (t.a < 0.25) discard;',
        '  gl_FragColor = vec4(mix(t.rgb * vTint, uFogCol, vFog), t.a);',
        '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
      ].join('\n')

    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.propMeshes.push(m);
  }
}

/* ---------- props: trees, palms, cacti, rocks, bushes ---------- */
/* the same curve the ground shader draws, so plants and paint agree */
/* Distance from the path's centre line, measured square to the line. The
   path has its own frame: it passes through (pathX, pathZ) heading pathAng
   off straight ahead; u runs along it, v across. pathAmt in the terrain
   shader is the same sum, term for term. */
function pathOff(P, x, z) {
  var sa = Math.sin(P.pathAng), ca = Math.cos(P.pathAng);
  var dx = x - P.pathX, dz = z - P.pathZ;
  var u = dx * sa - dz * ca, v = dx * ca + dz * sa;
  var vc = P.pathBend * (Math.sin(u * 0.0042 + P.pathPhase) - Math.sin(P.pathPhase))
         + P.pathBend2 * (Math.sin(u * P.pathK2 + P.pathPhase2) - Math.sin(P.pathPhase2));
  var dv = P.pathBend * 0.0042 * Math.cos(u * 0.0042 + P.pathPhase)
         + P.pathBend2 * P.pathK2 * Math.cos(u * P.pathK2 + P.pathPhase2);
  return Math.abs(v - vc) / Math.sqrt(1 + dv * dv);
}
function onPathAt(P, x, z) {
  if (!P.pathKind) return 0;
  var off = pathOff(P, x, z);
  if (P.pathGauge > 0.01) off = Math.min(Math.abs(off - P.pathGauge * 0.5), Math.abs(off + P.pathGauge * 0.5));
  return 1 - smoothstep(P.pathW, P.pathW * 1.5, off);
}

/* The kept ground in front of the house (P.clearKind, see buildParams): a
   strip along the wall out to P.clearD, its far edge straight for gravel and
   wandering for a lawn, a yard or a marsh bank. 1 inside, 0 beyond. The
   terrain shader's clearAmt() is the same curve. */
var CLEAR_EDGE = [[0, 0], [0.25, 0.25], [0, 0.06], [0.8, 0.6], [1.6, 0.9]];   /* [wobble, softness] by kind */
function clearAt(P, x, z) {
  if (!P.clearKind) return 0;
  var k = CLEAR_EDGE[P.clearKind];
  var edge = -P.clearD + k[0] * (Math.sin(x * 0.31 + 0.7) + 0.6 * Math.sin(x * 0.83 + 2.1));
  return smoothstep(edge - k[1], edge + k[1], z);
}

/* How far round to plant. Only about 36 degrees either side can be seen
   through the glass, and things were spread evenly over 70, so most of every
   count stood behind the wall. A margin is kept for the bare view, a wider
   screen and the parallax of a moving head; the world is not rebuilt when
   the window is resized, so never narrower than about 50 degrees. */
function scatterLim(P) { return clamp(visibleHalfAngle(P) * 1.3, 0.9, 1.22); }

/* gradient of the ground, rise over run, from the drawn surface */
function slopeAt(H, x, z) {
  var e = 1.5;
  return Math.sqrt(Math.pow(H(x + e, z) - H(x - e, z), 2) + Math.pow(H(x, z + e) - H(x, z - e), 2)) / (2 * e);
}

/* How each kind grows when it is not planted in rows. Trees stand in copses
   (n members spread sigma metres about a centre) drawn to hollows and water;
   bushes in small clumps; creosote spaces itself out, each plant's roots
   claiming the ground around it, so it is laid down by dart throwing with a
   minimum gap of space times its size. maxSlope is rise over run. */
var SCATTER = {
  broadleaf: { n: [3, 15], sigma: [8, 25], wet: 1, maxSlope: 0.65 },
  pine:      { n: [4, 15], sigma: [8, 22], wet: 0.5, maxSlope: 0.75 },
  acacia:    { n: [1, 4], sigma: [6, 16], wet: 0.5, maxSlope: 0.5 },
  palm:      { n: [2, 7], sigma: [4, 11], wet: 1, maxSlope: 0.45 },
  shrub:     { n: [2, 6], sigma: [2, 5], wet: 0.5, maxSlope: 0.45 },
  deadbush:  { n: [1, 3], sigma: [2, 4], wet: 0, maxSlope: 0.45 },
  brittlebush: { n: [2, 8], sigma: [1.5, 4], wet: 0, maxSlope: 0.4 },
  creosote:  { space: 2.6, maxSlope: 0.4 }
};
/* The edge of a wood seen across the fields: not a row of identical trees
   on an arc with sky between them, but trees bunched along a wandering line
   a few deep, and behind and between them more crowns sunk to their
   shoulders, a dark band of wood that closes the gaps. Items carry a fourth
   number, how far the card is sunk as a share of its size. */
function treelineItems(P, H, spec, lim, lineR, S) {
  var items = [], n = Math.round(spec.count * S.range(5, 7)), seed = S.int(1, 99999);
  var bend = S.range(0.08, 0.22);
  for (var i = 0, guard = 0; i < n && guard < n * 4; guard++) {
    var a = S.range(-lim, lim);
    /* clumps and the odd gap: density follows a noise along the line */
    var dens = fbm2(a * 4.0, 1.3, seed, 2);
    if (S.f() > 0.55 + dens * 0.9) continue;
    var rr = lineR * (1 + fbm2(a * 2.2, 5.1, seed + 7, 2) * bend * 2) + S.gauss() * 9;
    var x = Math.sin(a) * rr, z = -Math.cos(a) * rr;
    if (!plantable(P, H, x, z, 0)) continue;
    var band = S.f() < 0.4;
    /* the band stands a little behind the front trees */
    if (band) { x *= 1.04; z *= 1.04; }
    items.push([x, z, S.range(spec.size[0], spec.size[1]) * (band ? 1.15 : 1), band ? S.range(0.30, 0.45) : 0]);
    i++;
  }
  return items;
}

function scatterGroups(P, H, spec, grow, lim, S) {
  var items = [], guard = 0, r0 = spec.r[0], r1 = spec.r[1];
  var fits = function (x, z, sz, gap) {
    var a = Math.atan2(x, -z), r = Math.sqrt(x * x + z * z);
    if (Math.abs(a) > lim || r < r0 * 0.7 || r > r1 * 1.1) return false;
    if (!plantable(P, H, x, z, grow.maxSlope)) return false;
    if ((spec.kind === 'pine' || spec.kind === 'broadleaf') && P.snowLine != null
        && H(x, z) > P.snowLine * S.range(0.6, 0.95)) return false;
    for (var k = 0; k < items.length; k++) {
      var dx = items[k][0] - x, dz = items[k][1] - z, need = (items[k][2] + sz) * gap;
      if (dx * dx + dz * dz < need * need) return false;
    }
    return true;
  };
  var polar = function () {
    var a = S.range(-lim, lim), rr = r0 + Math.pow(S.f(), 1.35) * (r1 - r0);
    return [Math.sin(a) * rr, -Math.cos(a) * rr];
  };
  /* Along a dry wash the water that soaks in after a flood feeds a line of
     plants on either bank: three or four times as many there as out on the
     plain (the wash's edge, where onPathAt runs 0.15 to 0.55). */
  var bank = function (x, z) {
    if (P.pathKind !== 'wash') return 1;
    var o = onPathAt(P, x, z);
    return o > 0.15 && o < 0.55 ? 1 : 0.28;
  };
  if (grow.space) {
    while (items.length < spec.count && guard < spec.count * 60) {
      guard++;
      var q = polar(), sz = S.range(spec.size[0], spec.size[1]);
      if (S.f() > bank(q[0], q[1])) continue;
      if (fits(q[0], q[1], sz, grow.space * 0.5)) items.push([q[0], q[1], sz]);
    }
    return items;
  }
  while (items.length < spec.count && guard < spec.count * 12) {
    guard++;
    var c = polar();
    /* a copse would rather stand in a hollow, or by water, than on a rise */
    var hc = H(c[0], c[1]);
    var hollow = (H(c[0] + 25, c[1]) + H(c[0] - 25, c[1]) + H(c[0], c[1] + 25) + H(c[0], c[1] - 25)) * 0.25 - hc;
    var wet = P.waterY != null ? 1 - smoothstep(1.0, 6.0, hc - P.waterY) : 0;
    if (S.f() > (0.45 + clamp(hollow * 0.25, -0.3, 0.4) + wet * 0.5 * grow.wet) * (0.4 + 0.6 * bank(c[0], c[1]) * 1.6)) continue;
    var n = S.int(grow.n[0], grow.n[1]), sig = S.range(grow.sigma[0], grow.sigma[1]);
    var base = S.range(spec.size[0], spec.size[1]);
    for (var m = 0; m < n * 3 && n > 0 && items.length < spec.count; m++) {
      var x = c[0] + S.gauss() * sig, z = c[1] + S.gauss() * sig;
      var sz = clamp(base * S.range(0.78, 1.18), spec.size[0], spec.size[1]);
      if (!fits(x, z, sz, 0.32)) continue;
      items.push([x, z, sz]);
      n--;
