      '    vec2 pu = pathUV(vW);',
      '    float fr = max(fwidth(vW.x), fwidth(vW.z));',
      '    float hw = uPathW + (vn(vec2(pu.x * 0.35, 3.1)) - 0.5) * 0.35 + (vn(vec2(pu.x * 1.7, 9.2)) - 0.5) * 0.14;',
      '    float onR = clamp((hw - pu.y) / fr + 0.5, 0.0, 1.0);',
      '    float verge = clamp((hw + 1.0 - pu.y) / fr + 0.5, 0.0, 1.0) * (1.0 - onR);',
      '    float kAg = 1.0 - smoothstep(0.30, 0.85, fr * 6.0);',
      '    float ag = mix(0.5, h2(floor(vW.xz * 6.0)), kAg);',
      '    vec3 tar = vec3(0.17, 0.17, 0.175) * (0.80 + 0.28 * ag + 0.30 * (dirt - 0.5) + 0.2 * (c2.g - cM.g));',
      '    float lcR = abs(pu.y - 0.5 * uPathW);',
      '    tar *= 1.0 + 0.10 * bandAA(lcR, 0.55, 1.15, fr) - 0.08 * bandAA(lcR, 0.0, 0.40, fr);',
      '    tar = mix(tar, vec3(0.62, 0.62, 0.60) * (0.75 + 0.25 * ag), sqAA(pu.x, 9.0, 0.33, fr) * bandAA(pu.y, 0.0, 0.06, fr) * 0.85);',
      '    c = mix(c, c * vec3(0.70, 0.68, 0.62), verge * 0.8);',
      '    c = mix(c, tar, onR);',
      '    onPath = 0.0;',
      '  }',
      /* a dry wash is floored with sand and gravel the floods have sorted
         and the sun bleached, paler than the ground it cuts */
      '  vec3 pathC = mix(uPathCol * (0.80 + 0.36 * dirt), mix(vec3(0.80, 0.74, 0.64), uPathCol, 0.3) * (0.82 + 0.30 * dirt + 0.16 * grit.r * near), uWash);',
      '  if (onPath > 0.001) c = mix(c, pathC, onPath * 0.88);',
      /* A city's streets, on its grid: asphalt with paler polished wheel tracks
         and oil down the lanes, a gutter, painted centre and lane lines,
         zebra crossings set back from each junction and a stop line, paved
         pavements with a pale kerb, paved block interiors and now and then a
         green courtyard. Every line is box-filtered by its footprint. No
         texture is read in here: the noise is what was fetched above. At
         night the street lamps lay pools of light along the pavements. */
      '  float pool = 0.0;',
      '  if (uCityOn > 0.5) {',
      '    vec2 gq = vec2(vW.x * uCity.x + vW.z * uCity.y, -vW.x * uCity.y + vW.z * uCity.x);',
      '    vec2 blk = floor(gq / uCity.z + 0.5), lq = gq - blk * uCity.z, sg = sign(lq);',
      '    vec2 e = abs(lq) - 0.5 * uCity.w;',
      '    float zone = max(cityBlk(blk), max(step(0.0, e.x) * cityBlk(blk + vec2(sg.x, 0.0)),',
      '                 max(step(0.0, e.y) * cityBlk(blk + vec2(0.0, sg.y)), step(0.0, min(e.x, e.y)) * cityBlk(blk + sg))));',
      '    zone *= smoothstep(uWaterY + 0.6, uWaterY + 1.0, vW.y);',
      '    float sw = uCity2.x, sk = uCity2.y, rw = sw - 2.0 * sk, mid = 0.5 * sw;',
      '    bool ns = e.x > e.y;',
      '    float ac = ns ? e.x : e.y, al = ns ? gq.y : gq.x, ot = ns ? e.y : e.x;',
      '    float fq = max(fwidth(gq.x), fwidth(gq.y));',
      '    float kAgg = 1.0 - smoothstep(0.30, 0.85, fq * 6.0);',
      '    float agg = mix(0.5, h2(floor(vW.xz * 6.0)), kAgg);',
      '    float dc = abs(ac - mid), wide = step(12.0, rw);',
      '    float lw = mix(rw * 0.5, rw * 0.25, wide), lc = abs(fract(dc / lw) * lw - 0.5 * lw);',
      '    vec3 road = vec3(0.115, 0.117, 0.122) * (0.80 + 0.28 * agg + 0.30 * (dirt - 0.5) + 0.25 * (c2.g - cM.g));',
      '    road *= (1.0 + 0.10 * bandAA(lc, 0.55, 1.15, fq) - 0.10 * bandAA(lc, 0.0, 0.40, fq)) * (1.0 - 0.22 * bandAA(ac, sk, sk + 0.45, fq));',
      '    float inter = smoothstep(-fq, fq, ot);',
      '    float centre = mix(sqAA(al, 9.0, 0.38, fq) * bandAA(dc, 0.0, 0.075, fq), bandAA(dc, 0.07, 0.19, fq), wide);',
      '    float laneL = wide * sqAA(al + 3.0, 9.0, 0.33, fq) * bandAA(abs(dc - lw), 0.0, 0.07, fq);',
      '    float zeb = bandAA(ot, -4.6, -1.2, fq);',
      '    float stripes = sqAA(ac - sk - 0.3, 1.1, 0.5, fq) * zeb;',
      '    float appr = abs(step(mid, ac) - step(0.0, sg.x * sg.y));',
      '    float stopL = bandAA(ot, -5.9, -5.45, fq) * appr;',
      '    float mk = clamp((centre + laneL) * (1.0 - zeb) * (1.0 - inter) + stripes + stopL * (1.0 - inter), 0.0, 1.0) * step(sk, ac);',
      '    road = mix(road, vec3(0.60, 0.60, 0.58) * (0.78 + 0.25 * agg), mk * 0.92);',
      /* pavement slabs a metre and a half square, a kerb of pale stone */
      '    vec3 pav = vec3(0.43, 0.42, 0.40) * (0.88 + 0.22 * dirt + 0.10 * (fine.g - 0.5) * kAgg);',
      '    float jt = max(1.0 - sqAA(al, 1.5, 0.94, fq), 1.0 - sqAA(ac, 1.5, 0.94, fq));',
      '    pav *= 1.0 - 0.22 * jt;',
      '    vec3 plaza = vec3(0.37, 0.36, 0.34) * (0.86 + 0.26 * dirt) * (1.0 - 0.16 * max(1.0 - sqAA(gq.x, 3.0, 0.97, fq), 1.0 - sqAA(gq.y, 3.0, 0.97, fq)));',
      '    float court = step(h2(blk + 11.0), 0.14) * smoothstep(-2.5, -3.5, ac);',
      '    plaza = mix(plaza, uCityPark * (0.70 + 0.45 * dirt) * (1.0 - 0.45 * smoothstep(0.55, 0.75, vn(gq * 0.11 + blk))), court);',
      '    vec3 cc = mix(pav, road, clamp((ac - sk) / fq + 0.5, 0.0, 1.0));',
      '    cc = mix(cc, vec3(0.58, 0.57, 0.54) * (0.85 + 0.2 * agg), bandAA(ac, sk - 0.18, sk, fq));',
      /* the ring of blocks just short of the city keeps its own ground
         inside the kerb: a park or a garden with a street round it */
      '    float inB = clamp(-ac / fq + 0.5, 0.0, 1.0), built = step(uCityBuilt, length(blk * uCity.z));',
      '    cc = mix(cc, plaza, inB);',
      '    c = mix(c, cc, zone * (1.0 - inB * (1.0 - built)));',
      /* lamps every 26 m down each pavement, staggered across the street */
      '    float la = (fract((al + 13.0 * step(0.0, ns ? sg.x : sg.y)) / 26.0) - 0.5) * 26.0, lx = ac - sk + 0.7;',
      '    float r2 = la * la + lx * lx;',
      '    pool = zone * step(-2.0, ac) * (exp(-r2 / 50.0) * 0.45 + exp(-r2 / 9.0) * 0.8);',
      '  }',
      /* the kept ground: a lawn mown in stripes, pale gravel, a bare yard, or a
         damp bank. The stripes fade once finer than a pixel. */
      '  float inClear = clearAmt(vW);',
      '  if (inClear > 0.001) {',
      '    float kM = 1.0 - smoothstep(0.30, 0.85, fwidth(vW.x) * 0.56);',
      '    vec3 lawn = uCoverCol * (0.80 + 0.30 * fine.g) * (1.0 + 0.07 * sin(vW.x * 3.49) * kM);',
      '    vec3 gravel = mix(vec3(0.60, 0.58, 0.54), uPathCol, 0.35) * (0.74 + 0.30 * dirt + 0.22 * grit.r * near);',
      '    vec3 yard = uPathCol * (0.82 + 0.34 * dirt);',
      '    vec3 kept = uClear.w < 1.5 ? lawn : (uClear.w < 2.5 ? gravel : (uClear.w < 3.5 ? yard : c * 0.80));',
      '    c = mix(c, kept, inClear * (uClear.w < 1.5 ? 0.55 : 0.9));',
      '  }',
      /* Desert pavement: the wind has taken the fines and left the stones,
         packed edge to edge and dark with varnish, in patches between bare
         sandy ground. Stones a few centimetres across on a jittered lattice,
         averaged to their mean tone once smaller than a pixel. */
      '  if (uPave > 0.5) {',
      '    vec2 pq = vW.xz * 21.0, pc = floor(pq), pf = fract(pq) - 0.5;',
      '    float pa = h2(pc + 5.1), pr = 0.24 + 0.18 * h2(pc + 9.7);',
      '    vec2 pj = (vec2(h2(pc + 1.3), h2(pc + 2.9)) - 0.5) * 0.28;',
      '    float kP = 1.0 - smoothstep(0.30, 0.85, max(fwidth(pq.x), fwidth(pq.y)));',
      '    float peb = mix(0.42, (1.0 - smoothstep(pr - 0.07, pr + 0.07, length(pf - pj))) * step(0.3, pa), kP);',
      '    vec3 varn = mix(vec3(0.17, 0.11, 0.08), vec3(0.42, 0.36, 0.30), pa * pa) * (0.9 + 0.2 * dirt);',
      '    float pv = smoothstep(0.38, 0.62, cM.g * 0.6 + c2.r * 0.5 + dirt * 0.3 - 0.2) * (1.0 - onPath) * (1.0 - smoothstep(0.10, 0.25, slope0));',
      '    c = mix(c, varn, peb * pv * 0.85);',
      '    c *= 1.0 - 0.10 * pv * kP * (1.0 - peb);',
      '  }',
      /* Beds of rock (bedTable), each its own colour, with a darker parting
         between them; the heights wander a little so the lines are not
         ruled. The walls were shaped from the same table, so a cliff is a
         hard bed and a bench sits on one. The parting fades with footprint. */
      '  vec3 bedC = uRock; float bedOn = 0.0, hardB = 0.0;',
      /* A salt pan dries into polygons a metre or two across, their edges
         pushed up into pale ridges by the crystals growing under them, with
         a hairline crack along each. Cellular (the two nearest of a jittered
         set of points), faded out once a polygon is a few pixels across. */
      '  float saltH = 0.0;',
      '  if (uSalt > 0.5) {',
      '    vec2 sp = vW.xz / 1.5 + vec2(0.37 * sin(vW.z * 0.21), 0.37 * sin(vW.x * 0.19));',
      '    vec2 sc = floor(sp), sf = fract(sp);',
      '    float d1 = 8.0, d2 = 8.0;',
      '    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {',
      '      vec2 sg = vec2(float(i), float(j));',
      '      float dd = length(sg + vec2(h2(sc + sg), h2(sc + sg + 19.7)) * 0.8 + 0.1 - sf);',
      '      if (dd < d1) { d2 = d1; d1 = dd; } else if (dd < d2) { d2 = dd; }',
      '    }',
      '    float se = d2 - d1, fe = fwidth(sp.x) + fwidth(sp.y);',
      '    float kC = 1.0 - smoothstep(0.12, 0.45, fe);',
      '    float rim = 1.0 - smoothstep(0.0, 0.16 + fe, se);',
      '    float crack = 1.0 - smoothstep(0.0, 0.02 + fe * 0.5, se);',
      '    saltH = rim * kC * 0.035;',
      '    c = mix(c, c * (1.10 + 0.08 * h2(sc)), mix(0.18, rim, kC) * 0.7);',
      '    c *= 1.0 - kC * (0.18 * crack + 0.05 * h2(sc + 3.3));',
      '  }',
      '  if (uStrata > 0.5) {',
      '    float yb = vW.y + 0.3 * sin(vW.x * 0.011 + 1.3) + 0.25 * sin(vW.z * 0.017 + 0.4);',
      '    float partD = 1e3;',
      '    for (int i = 0; i < 16; i++) {',
      '      if (yb > uBedY[i]) { bedC = uBedC[i]; hardB = uBedH[i]; }',
      '      partD = min(partD, abs(yb - uBedY[i]));',
      '    }',
      '    float kS = 1.0 - smoothstep(0.30, 0.85, fwidth(yb) * 1.5);',
      '    bedOn = smoothstep(0.05, 0.22, slope0) * step(uBedY[0], yb);',
      '    bedC = mix(bedC, uRock * 1.15, 0.3);',
      '    c = mix(c, bedC * (0.90 + 1.2 * (c2.g - cM.g) + 0.2 * (dirt - 0.5)), bedOn * 0.9);',
      '    c *= 1.0 - 0.24 * (1.0 - smoothstep(0.0, 0.3 + 1.5 * fwidth(yb), partD)) * kS * bedOn;',
      '  }',
      '  float slope = slope0;',
      /* Rock. Soil does not hold much past forty degrees, so steep ground is
         bare rock wherever it is, and above the rock line on gentler slopes
         too; below steep faces the rubble they shed lies as paler scree.
         The rock is textured from the side (two taps, blended by which way
         the face looks) instead of the ground texture stretched down it,
         with gullies running down the fall line and darker joints. */
      '  float steep = smoothstep(0.17, 0.34, slope + (c2.g - cM.g) * 0.5);',
      '  float high = smoothstep(uRockLine - 8.0, uRockLine + 22.0, vW.y);',
      '  float rockW = max(max(steep * 0.92, high * (0.35 + 0.65 * smoothstep(0.08, 0.28, slope))), high * uSalt) * (1.0 - uSand);',
      /* one tap, projected on the face itself: across it horizontally, and
         up it, stretched down the fall line so it draws gullies */
      '  vec2 fN = normalize(vN.xz + vec2(1e-4, 0.0));',
      /* bedded rock is laminated across the face, not grooved down it */
      '  vec2 bb = texture2D(uTex, vec2(dot(vW.xz, vec2(-fN.y, fN.x)), vW.y) * mix(vec2(0.031, 0.012), vec2(0.009, 0.075), uStrata) + vec2(0.4, 0.1)).gr;',
      '  float rmod = bb.x;',
      '  float gully = smoothstep(0.08, 0.2, bb.x - bb.y);',
      '  vec3 rockC = (uStrata > 0.5 ? bedC * mix(1.06, 0.90, hardB) : uRock) * (0.70 + 0.65 * rmod) * (1.0 - 0.26 * gully) * (1.0 - 0.22 * smoothstep(0.42, 0.22, rmod));',
      /* desert varnish: dark streaks down the cliffs where water runs off
         the rim, heaviest on the hard beds; their mean once too fine */
      '  if (uStrata > 0.5) {',
      '    vec2 vq = vec2(dot(vW.xz, vec2(-fN.y, fN.x)) * 0.32, vW.y * 0.028 + hardB * 3.7);',
      '    float kV = 1.0 - smoothstep(0.30, 0.85, max(fwidth(vq.x), fwidth(vq.y)) * 2.0);',
      '    float vs = mix(0.22, smoothstep(0.5, 0.8, vn(vq) * 0.7 + vn(vq * 3.1 + 5.0) * 0.3), kV);',
      '    rockC = mix(rockC, vec3(0.12, 0.075, 0.05), vs * 0.6 * (0.45 + 0.55 * hardB));',
      '  }',
      '  c = mix(c, rockC, rockW);',
      '  float scree = smoothstep(0.05, 0.13, slope) * (1.0 - steep) * max(high, smoothstep(uRockLine - 40.0, uRockLine, vW.y) * 0.6) * step(uRockLine, 1e5);',
      '  c = mix(c, uRock * 1.12 * (0.82 + 0.36 * dirt), scree * 0.55);',
      /* the rock has relief: a gentle bump from the same side texture, by
         its screen-space slope (no extra fetch), only where rock shows */
      '  vec3 dpx = dFdx(vW), dpy = dFdy(vW);',
      '  float hb = rmod * 7.0;',
      '  vec3 r1 = cross(dpy, vN), r2 = cross(vN, dpx);',
      '  float det = dot(dpx, r1);',
      '  vec3 sg = sign(det) * (dFdx(hb) * r1 + dFdy(hb) * r2);',
      '  vec3 Nb = normalize(abs(det) * vN - sg);',
      '  N2 = normalize(mix(N2, Nb, rockW * 0.8 * step(1e-9, abs(det))));',
      '  if (uSalt > 0.5) {',
      '    vec3 sgS = sign(det) * (dFdx(saltH) * r1 + dFdy(saltH) * r2);',
      '    N2 = normalize(mix(N2, normalize(abs(det) * vN - sgS), 0.8 * step(1e-9, abs(det))));',
      '  }',
      '  c = mix(c, uHigh, smoothstep(uSnowLine, uSnowLine + 34.0, vW.y) * (1.0 - smoothstep(0.30, 0.62, slope)));',
      /* The canyon's inner channel, on the same curve as the heightfield,
         drawn here rather than cut into a mesh too coarse to hold it: a
         river of silty water with bars of pale sand and gravel standing in
         it, or a dry wash of the same bleached gravel. Edges by footprint. */
      '  float rivM = 0.0, rivS = 0.0;',
      '  if (uCan1.w > 0.5) {',
      '    float ca_ = vW.x * uCan1.x - vW.z * uCan1.y, cp_ = vW.x * uCan1.y + vW.z * uCan1.x + uCan1.z;',
      '    float cxA = uCan2.x * (sin(ca_ * 0.0026 + uCan2.y) - sin(uCan2.y)) + sin(ca_ * 0.011 + uCan2.y * 2.0) * uCan1.w * 0.10;',
      '    float dq = abs(cp_ - cxA - sin(ca_ * 0.0071 + uCan2.w) * max(uCan1.w - uCan2.z * 1.6, 0.0) * 0.6);',
      '    float fq = fwidth(dq) + 0.05;',
      '    float onFloor = 1.0 - smoothstep(0.6, 2.0, vW.y - uFloorY);',
      '    float bar = smoothstep(0.58, 0.72, vn(vec2(ca_ * 0.016, cp_ * 0.05) + 3.3)) * smoothstep(0.2, 0.7, dq / uCan2.z);',
      '    float chanD = dq / uCan2.z + 0.15 * (vn(vec2(ca_ * 0.03, 1.7)) - 0.5);',
      '    float wash = (1.0 - smoothstep(1.05 - fq / uCan2.z, 1.05 + fq / uCan2.z, chanD)) * onFloor;',
      '    c = mix(c, mix(vec3(0.80, 0.74, 0.64), uPathCol, 0.3) * (0.80 + 0.36 * dirt), wash * 0.85);',
      '    rivM = uRiver * onFloor * (1.0 - smoothstep(0.85 - fq / uCan2.z, 0.85 + fq / uCan2.z, chanD)) * (1.0 - bar);',
      '    c *= 1.0 - 0.35 * uRiver * wash * (1.0 - rivM);',          /* the wet margin */
      '    rivS = vn(vec2(ca_ * 0.05 - uTime * 0.7, cp_ * 0.45)) * (1.0 - smoothstep(0.3, 0.85, fwidth(ca_) * 0.05));',
      '  }',
      /* The shore. Ground the water has just left, or laps over, is dark with
         it and takes a sheen of sky (below), in a band whose width wanders
         along the water and is widest on a beach; the bed under the surface
         is darker still, and the water drawn over it does the rest. On the
         sea the last of each wave runs up the sand as a lace of foam, and the
         highest of them leave a dark line of wrack. */
      '  float above = vW.y - uWaterY;',
      '  float eY = fwidth(vW.y);',
      '  float shore = 1.0 - smoothstep(0.0, (0.35 + 0.8 * dirt) * (1.0 + uBeach * 0.6), above);',
      '  float under = 1.0 - smoothstep(-0.06, 0.02, above);',
      '  float runUp = 0.10 + 0.26 * (0.5 + 0.5 * sin(uTime * 0.47 + vW.x * 0.05));',
      '  float lace = uSwash * (1.0 - smoothstep(0.0, 0.05 + eY, abs(above - runUp))) * smoothstep(0.35, 0.7, dirt) * (1.0 - under);',
      '  float wrack = uSwash * (1.0 - smoothstep(0.0, 0.04 + eY, abs(above - 0.44 - 0.06 * dirt))) * (1.0 - smoothstep(0.02, 0.12, eY));',
      '  c *= (1.0 - 0.36 * shore - 0.16 * under) * (1.0 - 0.35 * wrack);',
      '  c = mix(c, vec3(0.86, 0.89, 0.89), lace * 0.75);',
      /* After rain the ground darkens (water fills the pores) and takes a sheen
         of sky at a glancing angle; level ground holds puddles. The mirror is
         the sky only, on the geometric normal, not the bumped one, which
         would sparkle. The puddle mask reuses the snow-lie noise fetch. */
      '  float lieN = texture2D(uTex, vW.xz * 0.011 + vec2(0.5)).r;',
      '  float pud = uWet * uPuddle * smoothstep(0.975, 0.995, vN.y) * smoothstep(0.60, 0.66, lieN);',
      '  c *= 1.0 - uWet * 0.32 - pud * 0.25;',
      '  vec2 bk = bakedRG(vW.xz);',
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(vW.xz, uTime)) * mix(0.03, 1.0, bk.x);',
      '  float diff = max(dot(N2, normalize(uSunDir)), 0.0);',
      '  vec3 light = bk.y * hemi(N2, uAmbCol * 1.15) + uSunCol * diff * 1.25 * sh;',
      '  vec3 lit = c * light;',
      '  lit += c * vec3(1.0, 0.80, 0.56) * pool * uNight * 1.8;',
      /* looking into a low sun across grass, the blades glow with it */
      '  lit += uSunCol * uTip * pow(max(dot(normalize(vW - uCamPos), normalize(uSunDir)), 0.0), 4.0) * graze * fieldK * 0.35 * sh * (1.0 - uSnow);',
      '  vec3 Vw = normalize(uCamPos - vW), Rw = reflect(-Vw, vN);',
      '  vec3 skyR = mix(horizonAt(Rw, uFogCol, uSunDir), uZenith, smoothstep(0.0, 0.6, Rw.y));',
      '  float Fw = 0.02 + 0.98 * pow(1.0 - max(dot(vN, Vw), 0.0), 5.0);',
      /* dry sand is brightest looking down-sun (each grain hides its own
         shadow): a broad glow round the shadow of your own head */
      '  lit *= 1.0 + uSand * 0.22 * pow(max(dot(Vw, normalize(uSunDir)), 0.0), 6.0) * sh * (1.0 - uWet);',
      /* the canyon river: silt-coloured water, the sky in it by Fresnel, a
         glint, and slow streaks drifting downstream */
      '  if (rivM > 0.001) {',
      '    vec3 Rr = reflect(-Vw, vec3(0.0, 1.0, 0.0));',
      '    vec3 skyW = mix(horizonAt(Rr, uFogCol, uSunDir), uZenith, smoothstep(0.0, 0.6, Rr.y));',
      '    float Fr = 0.02 + 0.98 * pow(1.0 - max(Vw.y, 0.0), 5.0);',
      '    vec3 body = uRiverCol * (0.85 + 0.25 * rivS) * (bk.y * hemi(vec3(0.0, 1.0, 0.0), uAmbCol) + uSunCol * max(uSunDir.y, 0.0) * sh);',
      '    vec3 wat = mix(body, skyW, Fr * 0.85) + uSunCol * pow(max(dot(Rr, normalize(uSunDir)), 0.0), 60.0) * sh * 0.5;',
      '    lit = mix(lit, wat, rivM);',
      '  }',
      '  lit = mix(lit, skyR, max(uWet * mix(Fw * 0.5, 0.7, pud), shore * (1.0 - under) * Fw * 0.45));',
      '  float up = smoothstep(0.55, 0.95, vN.y);',
      /* a thin fall lies in the hollows first; a deep one covers everything */
      '  float want = uSnow * (0.35 + 0.65 * up);',
      '  float lie = lieN * 0.6 + texture2D(uTex, vW.xz * 0.09).r * 0.25;',
      '  float laid = smoothstep(0.42, 0.62, lie + want * 1.25 - 0.55);',
      /* hollows go a little blue, the crust has a fine grain, drifts read in the light.
         Lit like everything else (scaled so a clear midday matches the old flat
         white), so snow takes cloud and tree shadow, the dusk colour, and the night */
      '  vec3 snowLit = uSnowCol * light * 0.82 * (0.93 + 0.11 * fine.g) * (0.96 + 0.08 * texture2D(uTex, vW.xz * 0.21 + vec2(0.31)).r);',
      '  snowLit = mix(snowLit, snowLit * vec3(0.90, 0.94, 1.04), (1.0 - diff) * 0.6);',
      '  lit = mix(lit, snowLit, laid * min(1.0, want * 1.5) * (1.0 - under));',
      /* flooded paddies: level treads mirror the sky, which is what makes a
         terrace read as a rice terrace rather than a stepped lawn */
      /* Past about forty metres the mesh cannot carry the steps and they melt
         into the slope they stand on, and the hillside read as a plain field.
         The risers lie on contours a tread's height apart (the melted slope
         passes through each riser half way up it), so the bunds are drawn on
         those contours and the treads between them hold water. Band-limited:
         where the contours crowd under a pixel the hill takes the average.
         Close in, where the mesh draws the real steps, the drawn bunds would
         only trace its grid, so they come in beyond it. */
      '  if (uPaddy > 0.5) {',
      '    float tu = vW.y / uStepH;',
      '    float kT = 1.0 - smoothstep(0.30, 0.85, fwidth(tu));',
      '    float bund = (1.0 - smoothstep(0.08, 0.22, abs(fract(tu) - 0.5))) * kT * smoothstep(22.0, 48.0, length(vW.xz));',
      '    float level = max(1.0 - smoothstep(0.02, 0.10, slope), kT * smoothstep(40.0, 90.0, length(vW.xz))) * (1.0 - bund);',
      '    vec3 still = mix(uFogCol, uZenith, 0.45) * 0.92;',
      '    lit = mix(lit, mix(lit * 0.7, still, 0.8), level * 0.55);',
      '    lit *= 1.0 - 0.38 * bund;',
      '  }',
      /* the mirage: ground seen within half a degree of the horizon, past
         four hundred metres, shows the sky just above it, broken along its
         length (uMirage, from updateWeather) */
      '  if (uMirage > 0.01) {',
      /* the ray must graze the ground itself: up a slope there is none */
      '    float dip = dot(normalize(uCamPos - vW), normalize(vN));',
      '    float mir = uMirage * smoothstep(400.0, 900.0, dC) * smoothstep(-0.0004, 0.0012, dip) * (1.0 - smoothstep(0.004, 0.010, dip))',
      '      * smoothstep(0.985, 0.998, vN.y) * (1.0 - smoothstep(6.0, 14.0, vW.y - uCamPos.y));',
      '    mir *= 0.55 + 0.45 * vn(vec2(atan(vW.x - uCamPos.x, uCamPos.z - vW.z) * 160.0, 3.7));',
      '    lit = mix(lit, mix(uFogCol, uZenith, 0.3), mir * 0.85);',
      '  }',
      '  vec3 fogC = hazeAt(uFogCol, normalize(vW - uCamPos), uSunDir, uSunCol, vFog);',
      '  gl_FragColor = vec4(mix(lit, fogC, vFog), 1.0);',
      '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  scene.add(m);
  App.terrain = m;
}


/* ---------- water: sea with a swell, or a still fjord channel ---------- */
function buildWater(scene, P, R, U) {
  if (P.waterY == null) return;
  var geo = new THREE.PlaneGeometry(5200, 5200, 1, 1);
  geo.rotateX(-Math.PI / 2);
  var kind = P.waterKind;
  var sea = kind === 'sea';
  var flow = kind === 'flow';
  var mirror = kind === 'mirror';
  var marshy = (P.terrainKind || P.biome.terrain) === 'marsh';
  /* How high the land stands round the water, seen from the water: the rise
     over run of the highest ground beyond the near shore, averaged across the
     view. Below that line still water mirrors hills and banks, not sky; a
     gorge river is walled in and mirrors almost none of it. */
  var rim = 0, nRim = 0;
  for (var ai = -4; ai <= 4; ai++) {
    var az = ai * 0.17, d0 = -1, best = 0;
    for (var dd = 6; dd < 2300; dd *= 1.12) {
      var hy = App.Hm(Math.sin(az) * dd, -Math.cos(az) * dd) - P.waterY;
      if (d0 < 0) { if (hy < 0) d0 = dd; continue; }
      best = Math.max(best, hy / (dd - d0 + 20));
    }
    if (d0 > 0) { rim += best; nRim++; }
  }
  rim = nRim ? clamp(rim / nRim, 0.004, 0.7) : 0.01;
  var uni = {
    uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
    uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uCamPos: U.uCamPos, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
    uWindDir: U.uWindDir, uGust: U.uGust, uRim: { value: rim },
    /* the colour the water itself scatters back, deep and over a shallow bed;
       a peat marsh is near black, a river carries silt */
    uDeep: { value: new THREE.Color(
      sea ? R.pick(['#0b3f58', '#093a4f', '#10354d'])
      : marshy ? R.pick(['#141a14', '#181d15', '#121712'])
      : flow ? R.pick(['#1f3433', '#203a36', '#24393a'])
      : R.pick(['#13262d', '#11232a', '#162b33'])) },
    uShallow: { value: new THREE.Color(
      sea ? R.pick(['#2a9aa0', '#36a8a6', '#2390a0'])
      : marshy ? R.pick(['#2e3322', '#33372a'])
      : flow ? R.pick(['#3b5a4e', '#425f50'])
      : R.pick(['#2c4a4c', '#294548'])) },
    /* how fast light dies in it, per metre: clear sea, a lake, a silty river,
       a marsh stained with peat */
    uAbs: { value: sea ? 0.35 : (marshy ? 2.6 : (flow ? 1.3 : (mirror ? 0.3 : 0.7))) },
    uFoam: { value: sea ? 1.0 : 0.0 },
    uChop: { value: sea ? 1.0 : (flow ? 0.7 : (marshy ? 0.18 : (mirror ? 0.05 : 0.4))) },
    uSwell: { value: R.range(0.19, 0.32) },
    uFlowDir: { value: new THREE.Vector2(0, flow ? (P.flowDown || 1) : 0) },
    uFlowRate: { value: flow ? R.range(0.9, 2.2) : 0 },
    uStreak: { value: flow ? 1.0 : 0.0 },
    uMirror: { value: mirror ? 1.0 : 0.0 },
    uZenith: App.skyU.uZenith, uCloudL: App.skyU.uCloudL, uCloudD: App.skyU.uCloudD
  };
  /* A desert river is thick with silt, green-brown and opaque a hand down,
     and it runs down the canyon, not across the view */
  if ((P.terrainKind || P.biome.terrain) === 'canyon') {
    uni.uFlowDir.value.set(Math.sin(P.canyonAng || 0), -Math.cos(P.canyonAng || 0));
    uni.uDeep.value.set(ihash(1, 2, P.terrainSeed) < 0.5 ? '#3b3a26' : '#40382a');
    uni.uShallow.value.set(ihash(3, 4, P.terrainSeed) < 0.5 ? '#7a6e48' : '#86744e');
    uni.uAbs.value = 2.4;
  }
  var mat = new THREE.ShaderMaterial({
    extensions: { derivatives: true },
    uniforms: uni,
    /* blended, so it thins to nothing over the last few centimetres of depth
       and the shore is wet ground going under rather than a hard seam */
    transparent: true,
    vertexShader: [
      'varying vec3 vW;',
      'void main(){',
      /* world position: the plane is lifted to the water level by its
         mesh, and seen from its own y = 0 every river in a gorge was viewed
         at a glancing angle and mirrored the horizon */
      '  vW = (modelMatrix * vec4(position, 1.0)).xyz;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform vec3 uDeep, uShallow, uSunDir, uSunCol, uAmbCol, uFogCol, uCamPos, uZenith, uCloudL, uCloudD;',
      'uniform float uTime, uFoam, uChop, uSwell, uShadow, uFlowRate, uStreak, uMirror, uAbs, uGust, uRim, uFogDensity;',
      'uniform vec2 uFlowDir, uWindDir;',
      'varying vec3 vW;',
      GLSL_COMMON,
      'float bl(float ph){ return 1.0 - smoothstep(0.30, 0.85, fwidth(ph) * 0.159); }',
      /* the slope of one train of waves, deep-water speed for its length,
         faded out once a crest is finer than a pixel */
      'vec2 wv(vec2 p, vec2 dir, float lam, float slope, float t){',
      '  float k = 6.2832 / lam;',
      '  float ph = dot(p, dir) * k - sqrt(9.8 * k) * t;',
      '  return dir * slope * cos(ph) * bl(ph);',
      '}',
      'void main(){',
      '  vec2 p = vW.xz;',
      '  float t = uTime;',
      '  vec3 toC = uCamPos - vW;',
      '  float dCam = length(toC);',
      '  vec3 v = toC / dCam;',
      '  vec3 sd = normalize(uSunDir);',
      '  float depth = waterDepth(p);',
      /* a salt flat is a film over the crust; out past the baked map its
         depth is unknown, and it is a film there too */
      '  depth = mix(depth, min(depth, 0.12), uMirror);',
      /* Three trains of ripples off the wind (along the current on a river),
         and on the sea a long swell running in. Each is a few centimetres in
         the metre of slope: enough to break the mirror, not to sparkle. */
      '  vec2 fd = normalize(mix(uWindDir, uFlowDir, uStreak) + vec2(1e-4, 0.0));',
      '  vec2 d2 = vec2(fd.x * 0.80 - fd.y * 0.60, fd.x * 0.60 + fd.y * 0.80);',
      '  vec2 d3 = vec2(fd.x * 0.87 + fd.y * 0.50, -fd.x * 0.50 + fd.y * 0.87);',
      '  float ch = uChop * (0.65 + 0.5 * uGust);',
      /* the current drags streaks of slack and broken water downstream: the
         cloud texture stretched along the flow and carried with it */
      '  float streak = texture2D(uSkyCloud, vec2(p.x * 0.045, (p.y - uFlowDir.y * uFlowRate * t) * 0.007)).r;',
      '  ch *= mix(1.0, 0.35 + 1.3 * smoothstep(0.25, 0.75, streak), uStreak);',
      /* the crests are bent by a slow warp so the trains do not run as ruled lines */
      '  vec2 pw = p + vec2(sin(p.y * 0.21 + p.x * 0.07) + sin(p.y * 0.047 - p.x * 0.031) * 1.7, sin(p.x * 0.19 - p.y * 0.05) + sin(p.x * 0.041 + p.y * 0.029) * 1.7) * 1.3;',
      '  vec2 d4 = vec2(-d2.y, d2.x) * 0.5 + d3 * 0.866, d5 = vec2(d3.y, -d3.x) * 0.6 + d2 * 0.8;',
      '  vec2 g = wv(pw, fd, 3.3, 0.034 * ch, t) + wv(pw, d2, 1.9, 0.030 * ch, t) + wv(pw * 1.13, d3, 0.95, 0.028 * ch, t)',
      '         + wv(pw * 0.93, d4, 1.37, 0.022 * ch, t) + wv(pw * 1.07, d5, 2.6, 0.022 * ch, t);',
      '  vec2 ps = p + vec2(sin(p.y * 0.013) * 9.0 + sin(p.y * 0.051 + p.x * 0.02) * 4.0, sin(p.x * 0.021) * 6.0);',
      '  g += (wv(ps, vec2(0.0, 1.0), 21.0, 0.018, t * 0.55) + wv(ps, vec2(0.38, 0.92), 13.0, 0.013, t * 0.6)) * uFoam;',
      '  g *= 1.0 - smoothstep(150.0, 600.0, dCam);',
      '  vec3 N = normalize(vec3(-g.x, 1.0, -g.y));',
      '  float ndv = max(dot(N, v), 0.02);',
      '  vec3 r = reflect(-v, N); r.y = abs(r.y);',
      '  float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);',
      '  vec3 sky = skyMirror(r, uFogCol, uSunDir, uZenith, uCloudL, uCloudD);',
      /* low reflections are of the land round about: its colour, hazed */
      '  vec3 land = mix(uGroundCol * 1.3, horizonAt(r, uFogCol, uSunDir), 0.35);',
      '  sky = mix(land, sky, smoothstep(uRim * 0.55, uRim * 1.2 + 0.004, r.y));',
      '  vec2 bk = bakedRG(p);',
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(p, t)) * mix(0.03, 1.0, bk.x);',
      /* what comes up out of the water: its own colour, lit, and the bed
         through it, thinned by Beer-Lambert along the refracted path */
      '  float cosT = sqrt(max(1.0 - (1.0 - v.y * v.y) / 1.77, 0.04));',
      '  float T = exp(-uAbs * depth / cosT);',
      '  vec3 body = mix(uShallow, uDeep, smoothstep(0.0, 5.0, depth)) * (uAmbCol * 0.95 + uSunCol * max(sd.y, 0.0) * 0.45 * sh);',
      /* The sun on it: the facets that tip the sun at the eye, from a slope
         spread wider than the ripples that are drawn (the ones too fine to
         draw are still there). Toward a low sun that spread stretches into
         a broad path of light rather than a field of sparkles. */
      '  float sig = 0.018 + ch * (0.025 + 0.06 * smoothstep(10.0, 300.0, dCam));',
      '  vec3 hv = normalize(v + sd);',
      '  float nh = max(dot(N, hv), 0.05), nh2 = nh * nh;',
      '  float D = exp(-(1.0 - nh2) / (nh2 * 2.0 * sig * sig)) / (6.2832 * sig * sig * nh2 * nh2);',
      '  float Fh = 0.02 + 0.98 * pow(1.0 - max(dot(hv, v), 0.0), 5.0);',
      '  vec3 glint = uSunCol * sh * min(D * Fh / (4.0 * ndv), 8.0) * smoothstep(-0.02, 0.06, sd.y) * step(0.0, dot(N, sd));',
      '  float keep = (1.0 - F) * T;',          /* how much of the bed shows */
      '  float a = 1.0 - keep;',
      '  vec3 col = (F * sky + glint + (1.0 - F) * (1.0 - T) * body) / max(a, 0.02);',
      /* foam, lit like everything else: breakers over the shelving sea bed
         and a wash at its edge; a small lap at a lake or river margin */
      '  vec3 foamC = vec3(0.92, 0.95, 0.96) * (uAmbCol * 1.15 + uSunCol * max(sd.y, 0.0) * 1.1 * sh);',
      '  float bph = t * uSwell * 6.2832 * 0.16 + depth * 1.6 + sin(p.x * 0.031) * 0.9 + sin(p.x * 0.0071 + 1.3) * 1.4;',
      '  float crest = smoothstep(0.40, 0.96, sin(bph)) * smoothstep(0.25, 0.6, depth) * (1.0 - smoothstep(1.5, 4.5, depth));',
      '  float wash = (1.0 - smoothstep(0.02, 0.35, depth)) * (0.55 + 0.45 * sin(t * 0.47 + p.x * 0.05));',
      '  float foam = (crest * bl(bph) * 0.85 + wash) * uFoam;',
      '  float lph = depth * 55.0 - t * 1.4 + sin(p.x * 0.7 + p.y * 0.5) * 1.5;',
      '  foam += (1.0 - uFoam) * (1.0 - smoothstep(0.03, 0.22, depth)) * smoothstep(0.6, 0.95, sin(lph)) * bl(lph) * clamp(uChop * 0.9, 0.0, 0.4);',
      '  foam = clamp(foam, 0.0, 0.9) * (1.0 - smoothstep(60.0, 160.0, dCam));',
      '  col = mix(col, foamC, foam); a = max(a, foam);',
      /* a film thinner than a few centimetres is wet ground, which the
         terrain draws: no seam where water meets land */
      '  a *= smoothstep(0.0, 0.06, depth);',
      /* per pixel: the plane is one quad kilometres across, and haze worked
         out at its corners and spread across it came to half everywhere */
      '  float fogF = fogAmtH(dCam, uFogDensity, vW.y);',
      '  col = mix(col, hazeAt(uFogCol, -v, uSunDir, uSunCol, fogF), fogF);',
      '  gl_FragColor = vec4(tone(col), a);',
      '}'
    ].join('\n')
  });
  var m = new THREE.Mesh(geo, mat);
  m.position.y = P.waterY;
  m.frustumCulled = false;
  /* first of the blended things, straight after the solid world, so a boat,
     spray or mist drawn later lies over it rather than under it */
  m.renderOrder = -1;
  scene.add(m);
  App.water = m;
}

/* ---------- grass ---------- */
function bladeTemplate(bands, ear) {
  /* Rings up the blade plus a tip. A blade of grass runs nearly parallel and
     closes only near its end; the old one tapered from the root like a spike.
     A cereal has extra rings at the top, where the ear swells (the shader
     widens them). More bands means a blade that curves instead of creasing. */
  var n = Math.max(2, bands || 3), ts = [], i;
  if (ear) ts = [0, 0.32, 0.6, 0.70, 0.76, 0.88];
  else for (i = 0; i < n; i++) ts.push(i / n);
  var pos = [], uvs = [], idx = [];
  for (i = 0; i < ts.length; i++) {
    var t = ts[i];
    var y = ear ? t : Math.pow(t, 0.88);
    var w = 0.5 * (1 - Math.pow(t, 4));
    pos.push(-w, y, 0); uvs.push(0, y);
    pos.push(w, y, 0); uvs.push(1, y);
  }
  n = ts.length;
  pos.push(0, 1, 0); uvs.push(0.5, 1);
  for (i = 0; i < n - 1; i++) {
    var o = i * 2;
    idx.push(o, o + 1, o + 3, o, o + 3, o + 2);
  }
  idx.push((n - 1) * 2, (n - 1) * 2 + 1, n * 2);
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  return g;
}

/* How each cover grows. Grass stands in tussocks: a dozen or so blades from
   one crown, a hand or two across, sharing a height and a colour and leaning
   out from the middle; between them, single blades. Heather and lavender are
   low domed bushes of short stems with their flowers in a band at the top;
   a cereal is a few tillers to a plant with an ear on each, maize a stalk of
   broad leaves arching out. [share in tussocks, blades, spread m, dome, lean out] */
function coverHabit(P) {
  if (P.biomeKey === 'lavender') return { tuft: 1.0, n: [16, 26], sig: [0.15, 0.22], dome: 0.6, out: 0.7 };
  if (P.coverStyle === 'heather') return { tuft: 0.95, n: [16, 28], sig: [0.10, 0.20], dome: 0.55, out: 0.55 };
  if (P.coverStyle === 'reeds') return { tuft: 0.7, n: [8, 18], sig: [0.10, 0.22], dome: 0.15, out: 0.2 };
  if (P.crop) {
    if (P.crop.name === 'maize') return { tuft: 1.0, n: [5, 8], sig: [0.03, 0.05], dome: 0.1, out: 1.0 };
    if (P.crop.name === 'strawberries') return { tuft: 1.0, n: [7, 12], sig: [0.06, 0.10], dome: 0.4, out: 0.8 };
    return { tuft: 1.0, n: [3, 6], sig: [0.025, 0.045], dome: 0.05, out: 0.15 };
  }
  /* dry-country grass grows in tight separate tussocks with bare ground
     between, never as a sward */
  if (P.biomeKey === 'desert' || P.biomeKey === 'canyon') return { tuft: 0.95, n: [10, 22], sig: [0.05, 0.10], dome: 0.3, out: 0.65 };
  return { tuft: 0.45, n: [8, 18], sig: [0.08, 0.16], dome: 0.25, out: 0.4 };
}

function buildGrass(scene, P, R, U, H) {
  var COUNT = Math.round(P.coverCount * Q().grassMul);
  if (!P.coverCount) { App.grass = null; App.grassMax = 0; return; }   /* bare ground is a valid landscape */
  /* a stream of its own: the count depends on the detail setting, and with
     the builder's stream that shifted everything built after the grass */
  var GR = RNG(P.base + '/build/grass' + (P.nonce ? '/' + P.nonce : ''));
  var hab = coverHabit(P);
  var ear = !!(P.crop && (P.crop.name === 'wheat' || P.crop.name === 'barley'));
  var tpl = bladeTemplate(Q().segs, ear);
  var geo = new THREE.InstancedBufferGeometry();
  geo.index = tpl.index;
  geo.setAttribute('position', tpl.attributes.position);
  geo.setAttribute('uv', tpl.attributes.uv);

  /* each blade's brightness follows the ground it grows from: the terrain's
     own colour texture, at the broad scale the terrain shows it, so blades
     and ground share their patches */
  var gImg = null, gW = 0, gMean = 0.3;
  try {
    var gc = App.terrain.material.uniforms.uTex.value.image;
    gW = gc.width;
    gImg = gc.getContext('2d').getImageData(0, 0, gW, gW).data;
    var acc = 0;
    for (var gi = 0; gi < gImg.length; gi += 4 * 61) acc += gImg[gi] * 0.3 + gImg[gi + 1] * 0.59 + gImg[gi + 2] * 0.11;
    gMean = Math.max(acc / Math.ceil(gImg.length / (4 * 61)), 1);
  } catch (e) { gImg = null; }
  var groundLum = function (x, z) {
    if (!gImg) return 1;
    var u = x * 0.0052 + 0.31, v = z * 0.0052 + 0.31;
    u -= Math.floor(u); v -= Math.floor(v);
    var o = ((Math.floor((1 - v) * gW) % gW) * gW + Math.floor(u * gW) % gW) * 4;
    return clamp((gImg[o] * 0.3 + gImg[o + 1] * 0.59 + gImg[o + 2] * 0.11) / gMean, 0.72, 1.3);
  };

  var blades = [];
  var i, n = 0;
  var clumps = [];
  for (i = 0; i < 420; i++) {
    var ca = GR.range(-1.28, 1.28), cr = 1.4 + Math.pow(GR.f(), 1.7) * 30;
    clumps.push([Math.sin(ca) * cr, -Math.cos(ca) * cr, GR.range(0.6, 1.35)]);
  }
  /* can a blade grow here? */
  var ok = function (x, z) {
    var dist = Math.sqrt(x * x + z * z);
    if (dist < 1.0 || dist > (P.coverRows ? 54 : 35)) return 0;
    if (z > -0.6) return 0;
    if (Math.abs(Math.atan2(x, -z)) > 1.30) return 0;
    if (P.pathKind && onPathAt(P, x, z) > GR.f() * 0.55) return 0;
    if (P.erg && duneAt(P.dune, x, z) > P.dune.hd * 0.18) return 0;
    /* an oasis grows by its water; on the sand round it, a rare tussock */
    if (P.oasisW && H(x, z) > P.waterY + 4.5 && GR.f() > 0.02) return 0;
    var hm = 1;
    /* the kept ground under the window: mown short, or nothing grows on it */
    if (P.clearKind) {

    iPos[i * 3 + 2] = pz;

/* ---------- flowers ---------- */
function buildFlowers(scene, P, R, U, H) {
  if (!P.flowerCount) return;
  App.flowerMeshes = [];
  var perSpecies = Math.floor(P.flowerCount / P.species.length);
  for (var si = 0; si < P.species.length; si++) {
    var sp = P.species[si];
    var COUNT = perSpecies;
    var quad = new THREE.PlaneGeometry(1, 1);
    quad.translate(0, 0.5, 0);
    var geo = new THREE.InstancedBufferGeometry();
    geo.index = quad.index;
    geo.setAttribute('position', quad.attributes.position);
    geo.setAttribute('uv', quad.attributes.uv);

    var iPos = new Float32Array(COUNT * 3);
    var iAttr = new Float32Array(COUNT * 3);
    var iVar = new Float32Array(COUNT * 2);
    var patches = [];
    for (var p = 0; p < 26; p++) {
      var pa = R.range(-1.14, 1.14), pr = 1.8 + Math.pow(R.f(), 1.5) * (Math.min(P.flowerReach || 44, 36) - 6);
      patches.push([Math.sin(pa) * pr, -Math.cos(pa) * pr, R.range(0.8, 3.4)]);
    }
    var made = 0, guard = 0;
    while (made < COUNT && guard < COUNT * 40) {
      guard++;
      var x, z;
      if (R.f() < 0.75) {
        var pc = patches[Math.floor(R.f() * patches.length)];
        x = pc[0] + R.gauss() * pc[2];
        z = pc[1] + R.gauss() * pc[2];
      } else {
        var a = R.range(-1.14, 1.14), r = 1.8 + Math.pow(R.f(), 1.6) * (Math.min(P.flowerReach || 44, 36) - 4);
        x = Math.sin(a) * r; z = -Math.cos(a) * r;
      }
      if (P.rowSpacing) {
        var A2 = P.rowAngle;
        var pp2 = x * Math.cos(A2) + z * Math.sin(A2);
        var sn2 = Math.round(pp2 / P.rowSpacing) * P.rowSpacing + R.gauss() * 0.09;
        x += (sn2 - pp2) * Math.cos(A2);
        z += (sn2 - pp2) * Math.sin(A2);
      }
      var d = Math.sqrt(x * x + z * z);
      if (d < 1.4 || d > Math.min(P.flowerReach || 44, 36) || z > -1.0) continue;
      if (Math.abs(Math.atan2(x, -z)) > 1.15) continue;
      if (P.pathKind && onPathAt(P, x, z) > 0.3) continue;   /* trodden flat */
      if (P.clearKind && clearAt(P, x, z + 0.4) > 0.1) continue;   /* mown, or not grown */
      if (P.waterY != null) {
      var gh = H(x, z);
      /* reeds stand in the shallows; grass keeps its feet dry */
      if (gh < P.waterY + (P.coverWet ? -0.30 : 0.25)) continue;
      if (P.coverMinH && gh < P.waterY + P.coverMinH) continue;
    }
      iPos[made * 3] = x;
      iPos[made * 3 + 1] = H(x, z);
      iPos[made * 3 + 2] = z;
      /* no swelling with distance: big far flowers read as pom-poms */
      var sz = R.range(sp.size[0], sp.size[1]) * (P.flowerScale || 1);
      iAttr[made * 3] = sz;
      iAttr[made * 3 + 1] = x * 3.1 + z * 2.6 + R.range(-1.1, 1.1);
      iAttr[made * 3 + 2] = R.range(0.7, 1.25);
      var vr = R.f(); var variant = vr < 0.45 ? 0 : (vr < 0.75 ? 1 : (vr < 0.9 ? 2 : 3));
      iVar[made * 2] = variant + (R.f() < 0.5 ? 4 : 0);
      iVar[made * 2 + 1] = R.range(-0.22, 0.22);
      made++;
    }
    geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
    geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 3));
    geo.setAttribute('iVar', new THREE.InstancedBufferAttribute(iVar, 2));
    geo.instanceCount = made;

    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: U.uTime, uWind: U.uWind, uGust: U.uGust, uWindDir: U.uWindDir,
        uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
        uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale, uSnow: U.uSnow,

        'uniform float uTime, uWind, uGust, uFogDensity, uShadow, uSnow;',
        'uniform vec2 uWindDir; uniform vec3 uCamPos, uSunDir, uSunCol, uAmbCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint;',
        GLSL_COMMON,
        'void main(){',
        '  float dF = length(iPos - cameraPosition);',
        '  float gone = smoothstep(20.0, 34.0, dF);',
        '  float size = iAttr.x * (1.0 - uSnow * 0.55) * (1.0 - gone);',
        '  if (uSnow > 0.30) size = 0.0;',
        '  vec3 toCam = normalize(vec3(uCamPos.x - iPos.x, 0.0, uCamPos.z - iPos.z));',
        '  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), toCam));',

        '  float wave = gustWave(iPos.xz, uWindDir, uTime, 0.22, 1.55, iAttr.y * 0.6);',
        '  float flut = sin(uTime * 2.3 + iAttr.y) * 0.24 + sin(uTime * 1.1 + iAttr.y * 1.6) * 0.12;',
        '  float drive = uWind * (0.46 + 0.95 * uGust) * iAttr.z;',
        '  float bf = drive * max(0.55 + 0.4 * wave + flut, 0.0) * 0.45;',
        '  bf = bf / (1.0 + bf);',
        '  float bend = bf * size * 1.1 * position.y * position.y * (1.0 - gone);',
        '  vec3 wp = iPos + lp;',
        '  wp.xz += uWindDir * bend;',
        '  float vi = mod(iVar.x, 4.0); float flip = step(3.5, iVar.x);',
        '  float ux = mix(uv.x, 1.0 - uv.x, flip);',
        '  vUv = vec2((vi + ux) * 0.25, uv.y);',
        '  vec2 bk = bakedRG(wp.xz);',
        '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(wp.xz, uTime)) * mix(0.03, 1.0, bk.x);',
        '  vTint = uAmbCol * 0.85 * bk.y + uSunCol * 0.75 * sh;',

      GLSL_TONE,
        'uniform sampler2D uMap; uniform vec3 uFogCol;',
        'varying vec2 vUv; varying float vFog; varying vec3 vTint;',
        'void main(){',
        '  vec4 t = texture2D(uMap, vUv);',
        '  if (t.a < 0.02) discard;',
        '  gl_FragColor = vec4(mix(t.rgb * vTint, uFogCol, vFog), t.a);',
        '  gl_FragColor.rgb = tone(gl_FragColor.rgb);',
      '}'
      ].join('\n')
    });
    mat.uniforms.uFogCol = U.uFogCol;
    var m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    scene.add(m);
    App.flowerMeshes.push(m);
  }
}


/* ---------- cacti, built as actual geometry ----------
   A saguaro is a ribbed column with arms that elbow out and turn up. Painted on
   a flat billboard it always reads as cardboard, so these are real tubes. */
function pushTube(B, path, radii, seg, ribs) {
  var start = B.pos.length / 3, i, j;
  var rn = ribs ? ribs.n : 0, ra = ribs ? ribs.amp : 0;
  /* A flute the ring cannot resolve aliases into a coarser, faceted one: 16

     samples for the ribs asked for. */
  if (rn) seg = Math.min(64, Math.max(seg, rn * 4));

  var T = new THREE.Vector3(), N = new THREE.Vector3(), Bi = new THREE.Vector3(), prev = null;
  for (i = 0; i < path.length; i++) {
    var a = path[Math.max(i - 1, 0)], b = path[Math.min(i + 1, path.length - 1)];
    T.set(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    if (T.lengthSq() < 1e-9) T.set(0, 1, 0);
    T.normalize();
    if (prev) {
      /* Carry the frame along the path. Built afresh from a fixed axis it
         swings through 140 degrees in one ring where a limb turns from level
         to upright, which shears the tube apart at the elbow. */
      N.copy(prev).addScaledVector(T, -prev.dot(T));
      if (N.lengthSq() < 1e-10) { ref.set(Math.abs(T.y) > 0.94 ? 1 : 0, Math.abs(T.y) > 0.94 ? 0 : 1, 0); N.crossVectors(ref, T); }
    } else {
      ref.set(Math.abs(T.y) > 0.94 ? 1 : 0, Math.abs(T.y) > 0.94 ? 0 : 1, 0);

function instanceSolid(scene, tpl, items, mat) {
  var geo = new THREE.InstancedBufferGeometry();

  geo.setAttribute('rib', tpl.attributes.rib);
  var iPos = new Float32Array(items.length * 3);
  var iAttr = new Float32Array(items.length * 4);

    iPos[i * 3] = items[i][0]; iPos[i * 3 + 1] = items[i][1]; iPos[i * 3 + 2] = items[i][2];
    iAttr[i * 4] = items[i][3];
    iAttr[i * 4 + 1] = items[i][4];
    iAttr[i * 4 + 2] = items[i][5] == null ? 1 : items[i][5];
    iAttr[i * 4 + 3] = items[i][6] == null ? 1 : items[i][6];

  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));

  geo.userData.shape = tpl.userData && tpl.userData.shape;

     a wall's stone, a tower's tank, a rock each has its shadow baked and
     often a partner mesh (the pole's wires, the trunk's crown), so dropping
     the tail of the list left wires on nothing and shadows of nothing */

}

/* ---------- drystone walls along field edges ---------- */
function buildWalls(scene, P, R, U, H, spec) {

  /* streets reach out past the city proper: a ring road round the park, or
     two rings of suburban streets lined with houses */
  C.streetStart = pent ? -1e4 : C.start - C.pitch * (P.cityFront === 'houses' ? 2.6 : 0.6);
  /* grid frame <-> world */
  C.toWorld = function (gx, gz) { return [gx * C.ca - gz * C.sa, gx * C.sa + gz * C.ca]; };
  C.toGrid = function (x, z) { return [x * C.ca + z * C.sa, -x * C.sa + z * C.ca]; };
  P._city = C;
  return C;
}

/* Facade families. A building's face is drawn from what it is: 0 a glass
   curtain wall, 1 brick with punched windows, 2 precast concrete with ribbon
   glazing, 3 stone, 4 a plant room (louvres, no windows). Storey heights in
   metres; cityMesh draws the windows to the same numbers, and every box is
   cut to a whole number of storeys (plus a lobby on the street and a parapet
   on top) so no window is cut off at a roofline. */
var CITY_FLOOR = [3.8, 3.2, 3.6, 3.4, 4.0];
var CITY_LOBBY = 5.2, CITY_PARAPET = 1.2;
var CITY_WALLS = [
  ['#4f6470', '#3d4a52', '#5e6262', '#465a66', '#5a5448'],
  ['#8a4e3a', '#9a5c44', '#b8a07f', '#7c6c5e', '#6e3f33', '#a46a4c'],
  ['#a9a59c', '#918e88', '#b7b0a3', '#9d968a'],
  ['#bcb19a', '#a99f8b', '#c6bda9', '#8f897d'],
  ['#7d7f80', '#6c6e70', '#8a8984']
];
var CITY_GLASS = [
  ['#3a5c6a', '#2e4f4b', '#5a5045', '#7a8790', '#30465c', '#44606e'],
  ['#273036', '#2c3236'], ['#2d363d', '#33393e'], ['#2a3036', '#2f3337'], ['#2b2f33']
];
function cityHeight(type, h, onStreet) {
  var lob = onStreet ? CITY_LOBBY : 0, fh = CITY_FLOOR[type];
  return lob + Math.max(1, Math.round((h - lob - CITY_PARAPET) / fh)) * fh + CITY_PARAPET;
}

/* One block of a city, filled. A tall block is a tower: a podium built out
   to the pavement, a shaft set back from it, a setback or two near the top
   and a crown of plant. Otherwise the block is cut into two to six lots, each
   built to its lot line at its own height, now and then one left open as a
   plaza. Boxes go to out (see cityMesh), roofs that carry plant and tanks to
   roofs, and every box into App._boxes for the shadow bake.
   gx, gz: the block's centre in the grid frame; y(gx, gz, hx, hz): street
   level under a footprint, or null where it may not be built (water). */
function cityBlock(C, R, gx, gz, hgt, y, out, roofs) {
  var half = C.bw * 0.5;
  var tower = hgt > 55 && R.f() < 0.85, whole = R.f() < 0.5;
  var lotsX = R.int(1, 3), lotsZ = R.int(1, 2);
  var cuts = function (n) {
    var w = [], s = 0, i;
    for (i = 0; i < 3; i++) { w.push(R.range(0.7, 1.3)); }
    for (i = 0; i < n; i++) s += w[i];
    var e = [-half], a = -half;
    for (i = 0; i < n; i++) { a += w[i] / s * C.bw; e.push(a); }
    return e;
  };
  var ex = cuts(lotsX), ez = cuts(lotsZ);
  var lots = [];
  if (tower) {
    if (whole) lots.push([gx, gz, half, half, 1]);
    else {
      /* the tower on half the block, a lot or two of lower building beside it */
      var sx = R.f() < 0.5 ? -1 : 1, split = R.range(0.48, 0.62) * C.bw;
      lots.push([gx + sx * (half - split * 0.5), gz, split * 0.5, half, 1]);
      var rest = C.bw - split, nz2 = R.int(1, 2);
      for (var q = 0; q < nz2; q++)
        lots.push([gx - sx * (half - rest * 0.5), gz - half + C.bw * (q + 0.5) / nz2, rest * 0.5, half / nz2, 0]);
    }
  } else {
    for (var ix = 0; ix < lotsX; ix++) for (var iz = 0; iz < lotsZ; iz++)
      lots.push([gx + (ex[ix] + ex[ix + 1]) * 0.5, gz + (ez[iz] + ez[iz + 1]) * 0.5, (ex[ix + 1] - ex[ix]) * 0.5, (ez[iz + 1] - ez[iz]) * 0.5, 0]);
  }
  for (var li = 0; li < lots.length; li++) {
    var lt = lots[li], open = R.f() < 0.07;
    var base = y(lt[0], lt[1], lt[2], lt[3]);
    if (base == null || (open && !lt[4])) continue;
    cityBuilding(C, R, lt, base, lt[4] ? hgt : Math.max(9, Math.min(hgt * R.range(0.45, 1.25), 72)), out, roofs);
  }
}

function cityBuilding(C, R, lt, y, hgt, out, roofs) {
  var seed = R.f(), tower = lt[4] && hgt > 55;
  var wt = tower ? R.weighted([[0, 6], [2, 2], [3, 1.2], [1, 0.6]]) : R.weighted([[1, 4.5], [3, 2], [2, 2.5], [0, 1]]);
  var pt = R.weighted([[3, 3], [0, 3], [1, 2], [2, 2]]);
  var cWall = function (t) { var c = new THREE.Color(R.pick(CITY_WALLS[t])); return c.multiplyScalar(R.range(0.9, 1.1)); };
  var cGlass = function (t) { return new THREE.Color(R.pick(CITY_GLASS[t])); };
  var box = function (hx, hz, y0, h, t, wall, glass, top) {
    var w = C.toWorld(lt[0], lt[1]);
    var it = [w[0], y + y0, w[1], hx * 2, C.ga, h / (hx * 2), hz / hx, seed, t, y0, wall, glass];
    out.push(it);
    App._boxes.push([w[0], w[1], hx, hz, C.ga, y + y0 + h]);
    if (top) roofs.push(it);
    return it;
  };
  /* built to the lot line, less a hand's width so neighbours do not share a face */
  var hx = lt[2] - 0.15, hz = lt[3] - 0.15;
  var ins = R.range(2, 6), nSet = R.int(1, 2), fTop = R.range(0.15, 0.25), crownH = R.range(4, 9), spire = R.f() < 0.2;
  var sbIn = [R.range(1.5, 4), R.range(1.5, 4)], pod = R.range(14, 26), pent = R.f() < 0.35;
  if (!tower) {
    var h = cityHeight(wt, hgt, true), wl = cWall(wt), gl = cGlass(wt);
    var b0 = box(hx, hz, 0, h, wt, wl, gl, !pent || h < 18);
    /* a set-back top storey */
    if (pent && h >= 18 && hx > 6 && hz > 6) box(hx - 2.5, hz - 2.5, h, CITY_FLOOR[wt] + CITY_PARAPET, wt, wl, gl, true);
    return b0;
  }
  /* podium, shaft, setbacks, crown */
  var hp = cityHeight(pt, pod, true);
  box(hx, hz, 0, hp, pt, cWall(pt), cGlass(pt), true);
  /* no pencils: a shaft at least a fourteenth as wide each way as it is tall */
  var sx = Math.max(Math.min(hx - ins, R.range(13, 24)), 7), sz = Math.max(Math.min(hz - ins, R.range(13, 24)), 7);
  hgt = Math.min(hgt, Math.min(sx, sz) * 14);
  var rise = Math.max(hgt - hp, 20);
  var sw = cWall(wt), sg = cGlass(wt);
  var hMain = cityHeight(wt, rise * (1 - fTop), false), at = hp;
  box(sx, sz, at, hMain, wt, sw, sg, false);
  at += hMain;
  for (var k = 0; k < nSet; k++) {
    var nx = sx - sbIn[k], nz = sz - sbIn[k];
    if (nx < 5 || nz < 5) break;
    sx = nx; sz = nz;
    var hs = cityHeight(wt, rise * fTop / nSet, false);
    box(sx, sz, at, hs, wt, sw, sg, false);
    at += hs;
  }
  /* the crown: a plant room set in from the top, or a spire */
  var cx = Math.max(sx - R.range(2, 5), 3), cz = Math.max(sz - R.range(2, 5), 3);
  var crown = box(cx, cz, at, crownH, 4, cWall(4), cGlass(4), false);
  if (spire) crown.spire = Math.min(cx, cz);
  crown.beacon = at + crownH > 90;                  /* metres above its street */
  return crown;
}

/* Houses at their real size: two storeys, eaves at five and a half metres,
   the ridge at eight to ten. Four kinds: a gabled house, a hipped one, an L
   with a wing to the back, a short terrace of three. Built in metres, front
   (an eaves side) toward +z; roofs and chimneys are trim (rib 1) for the
   two-tone roof colour. */
function houseTemplates() {
  var mk = function (fn) {
    var B = { pos: [], nor: [], idx: [], rib: [] }, trims = [];
    fn(B, function (f) { var a = B.rib.length; f(); trims.push([a, B.rib.length]); });
    for (var t = 0; t < trims.length; t++) for (var k = trims[t][0]; k < trims[t][1]; k++) B.rib[k] = 1;
    return finishGeo(B);
  };
  return [
    { w: 10, d: 8, top: 9.0, g: mk(function (B, roof) {
      pushBox(B, 0, 2.7, 0, 5, 2.7, 4, 0);
      pushGableEnds(B, 0, 5.4, 0, 5, 4.45, 3.6);
      roof(function () { pushGableRoof(B, 0, 5.4, 0, 5, 4, 3.6, 0.45); pushBox(B, 2.6, 8.3, -1.0, 0.35, 1.1, 0.5, 0); });
    }) },
    { w: 11, d: 9, top: 8.6, g: mk(function (B, roof) {
      pushBox(B, 0, 2.8, 0, 5.5, 2.8, 4.5, 0);
      roof(function () { pushHipRoof(B, 0, 5.6, 0, 5.5, 4.5, 3.0, 0.5); pushBox(B, -2.2, 7.9, 0.8, 0.35, 1.0, 0.5, 0); });
    }) },
    { w: 10, d: 13.5, top: 8.8, g: mk(function (B, roof) {
      pushBox(B, 0, 2.7, 2.75, 5, 2.7, 3.75, 0);
      pushGableEnds(B, 0, 5.4, 2.75, 5, 4.15, 3.4);
      pushBox(B, -2, 2.7, -3.5, 3, 2.7, 3.2, 0);
      roof(function () {
        pushGableRoof(B, 0, 5.4, 2.75, 5, 3.75, 3.4, 0.4);
        pushHipRoof(B, -2, 5.4, -3.5, 3, 3.2, 2.6, 0.4);
      });
    }) },
    { w: 19.5, d: 9, top: 9.4, g: mk(function (B, roof) {
      pushBox(B, 0, 3.0, 0, 9.75, 3.0, 4.5, 0);
      pushGableEnds(B, 0, 6.0, 0, 9.75, 4.85, 3.4);
      roof(function () {
        pushGableRoof(B, 0, 6.0, 0, 9.75, 4.5, 3.4, 0.35);
        pushBox(B, -3.25, 9.0, 0, 0.5, 0.9, 0.35, 0); pushBox(B, 3.25, 9.0, 0, 0.5, 0.9, 0.35, 0);
      });
    }) }
  ];
}

/* The neighbourhood in front of the city: houses on the blocks short of it,
   set back five to eight metres from the pavement and facing the street,
   with gardens behind. */
function buildCityHouses(scene, P, U, H, C) {
  var HR = RNG(P.base + '/build/houses' + (P.nonce ? '/' + P.nonce : ''));
  var T = houseTemplates();
  var roofCol = HR.pick(['#3d3d42', '#55392e', '#4a4643', '#5b4033']);
  /* three finishes: render, brick, painted boards */
  var mats = [
    solidMat(U, HR.pick(['#d6cbb8', '#cbbfa8', '#e0d8c8', '#c9c2b4']), { rib: 0, grain: 0, spines: 0, twoTone: 1, body2: roofCol, aoH: 0.4, facade: { kind: 2, win: 0.85, bay: 2.6, roof: 0, doorW: 1.0, doorH: 2.1 } }),
    solidMat(U, HR.pick(['#8f5a44', '#7d4c3a', '#9a6a52']), { rib: 0, grain: 0, spines: 0, twoTone: 1, body2: roofCol, aoH: 0.4, facade: { kind: 4, win: 0.85, bay: 2.6, roof: 0, doorW: 1.0, doorH: 2.1 } }),
    solidMat(U, HR.pick(['#b7c0bf', '#c9c3b2', '#a9b4ae']), { rib: 0, grain: 0, spines: 0, twoTone: 1, body2: roofCol, aoH: 0.4, facade: { kind: 0, win: 0.8, bay: 2.4, roof: 0, doorW: 1.0, doorH: 2.1 } })
  ];
  var groups = {};
  var sides = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  var nb = Math.ceil(C.start / C.pitch) + 1, lim = Math.max(visibleHalfAngle(P) * 1.25, 0.9);
  for (var bx = -nb; bx <= nb; bx++) for (var bz = -nb; bz <= 0; bz++) {
    var gx = bx * C.pitch, gz = bz * C.pitch, w0 = C.toWorld(gx, gz), d0 = Math.sqrt(w0[0] * w0[0] + w0[1] * w0[1]);
    if (d0 < C.streetStart || d0 >= C.start || Math.abs(Math.atan2(w0[0], -w0[1])) > lim) continue;
    var L = Math.max(C.bw * 0.5 - 14, 6);
    for (var si = 0; si < 4; si++) {
      var n = sides[si], t = [-n[1], n[0]];
      var a = -L;
      while (true) {
        var ti = HR.int(0, 3), tp = T[ti], sb = HR.range(5, 8);
        if (a + tp.w > L) break;
        var ac = a + tp.w * 0.5, inn = C.bw * 0.5 - sb - tp.d * 0.5;
        var cx = gx + n[0] * inn + t[0] * ac, cz = gz + n[1] * inn + t[1] * ac;
        a += tp.w + HR.range(3, 7);
        var w = C.toWorld(cx, cz), rot = Math.atan2(-n[0], n[1]) + C.ga;
        var c = Math.cos(rot), s = Math.sin(rot), lo = 1e9, wet = false;
        for (var q = 0; q < 4; q++) {
          var lx = (q & 1 ? 0.5 : -0.5) * tp.w, lz = (q & 2 ? 0.5 : -0.5) * tp.d;
          var y = H(w[0] + lx * c - lz * s, w[1] + lx * s + lz * c);
          if (P.waterY != null && y < P.waterY + 0.8) wet = true;
          lo = Math.min(lo, y);
        }
        if (wet) continue;
        var mi = HR.int(0, 2), key = ti + '_' + mi;
        (groups[key] = groups[key] || []).push([w[0], lo - 0.3, w[1], 1, rot, 1, 1]);
        App._boxes.push([w[0], w[1], tp.w * 0.5, tp.d * 0.5, rot, lo + tp.top * 0.8]);
      }
    }
  }
  for (var k in groups) {
    var parts = k.split('_');
    instanceSolid(scene, T[+parts[0]].g, groups[k], mats[+parts[1]]);
  }
}

/* ---------- a city ----------
   The skyline seen from outside it: blocks on the grid inside the city's
   ring, each filled by cityBlock, drawn by cityMesh with a window grid
   computed per face. At night the lit windows carry the whole scene. */
function buildCity(scene, P, R, U, H) {
  var C = cityPlan(P);
  /* the near neighbourhood: houses and gardens before the city proper */
  if (P.cityFront === 'houses') buildCityHouses(scene, P, U, H, C);
  /* how wide across the view the city runs: no wider than can be seen, or
     most of it stands behind the wall, but never under 0.9 rad a side (like
     scatterLim, and the houses and poles), so a narrow opening's city still
     fills a wide screen */
  var spread = Math.min(R.range(0.9, 1.25), Math.max(visibleHalfAngle(P) * 1.2, 0.9));
  var items = [], roofs = [];
  /* the lowest ground under a footprint, or null if any of it is in water */
  var footY = function (gx, gz, hx, hz) {
    var lo = 1e9;
    for (var q = 0; q < 5; q++) {
      var lx = q === 4 ? 0 : (q & 1 ? hx : -hx), lz = q === 4 ? 0 : (q & 2 ? hz : -hz);
      var w = C.toWorld(gx + lx, gz + lz), y = H(w[0], w[1]);
      if (P.waterY != null && y < P.waterY + 1) return null;
      lo = Math.min(lo, y);
    }
    return lo - 0.6;
  };
  /* Block by block on the grid, inside the city's ring: the middle of the
     ring carries the towers; its near and far edges stay lower. */
  var nb = Math.ceil(C.end / C.pitch) + 1;
  for (var bx = -nb; bx <= nb; bx++) for (var bz = -nb; bz <= 1; bz++) {
    var gx = bx * C.pitch, gz = bz * C.pitch, w = C.toWorld(gx, gz);
    var d = Math.sqrt(w[0] * w[0] + w[1] * w[1]);
    if (d < C.start || d > C.end || Math.abs(Math.atan2(w[0], -w[1])) > spread) continue;
    var f = (d - C.start) / (C.end - C.start), mid = 1.0 - Math.abs(f - 0.55) * 1.6;
    var tall = R.f() < (0.08 + mid * 0.42);
    var hgt = tall ? R.range(90, 260) * (0.6 + mid * 0.5) : R.range(18, 60);
    cityBlock(C, R, gx, gz, hgt, footY, items, roofs);
  }
  cityMesh(scene, P, R, U, items);
  buildRoofs(scene, P, R, U, roofs);
  /* street lamps through the city, and red lights on its tall roofs */
  cityStreets(scene, P, R, U, H, C, { reach: C.end, treeReach: C.start, trees: 0.7, beacons: cityBeacons(items) });
}

/* Red obstacle lights on the corners of every roof over 90 m. */
function cityBeacons(items) {
  var out = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (!it.beacon) continue;
    var top = it[1] + it[3] * it[5], hx = it[3] * 0.5 - 0.4, hz = it[3] * it[6] * 0.5 - 0.4;
    var c = Math.cos(it[4]), s = Math.sin(it[4]);
    for (var q = 0; q < 2; q++) {
      var lx = q ? hx : -hx, lz = q ? hz : -hz;
      out.push([it[0] + lx * c - lz * s, top + 0.6, it[2] + lx * s + lz * c, 2.0, 3.0, 0.24, 0.12, 1, 0]);
    }
  }
  return out;
}

/* the instanced block mesh, shared by the distant skyline and the view down
   from a tower. items[i] = [x, y, z, width, rot, h/w, d/w, seed, family,
   height of its base above the street, wall colour, glass colour] */
function cityMesh(scene, P, R, U, items) {
  var box = new THREE.BoxGeometry(1, 1, 1);
  box.translate(0, 0.5, 0);
  if (!items.length) return;

  var geo = new THREE.InstancedBufferGeometry();
  geo.index = box.index;
  geo.setAttribute('position', box.attributes.position);
  geo.setAttribute('normal', box.attributes.normal);
  /* Nearest first: the view never moves, so drawn front to back the depth
     test throws away the hidden faces of everything behind before they are
     shaded. Unsorted, each pixel of a dense city was shaded several times. */
  items = items.slice().sort(function (p, q) { return (p[0] * p[0] + p[2] * p[2]) - (q[0] * q[0] + q[2] * q[2]); });
  var n = items.length;
  var iPos = new Float32Array(n * 3), iAttr = new Float32Array(n * 4), iInfo = new Float32Array(n * 4);
  var iCol = new Float32Array(n * 3), iGlass = new Float32Array(n * 3);
  for (var k = 0; k < n; k++) {
    var it = items[k];
    iPos[k * 3] = it[0]; iPos[k * 3 + 1] = it[1]; iPos[k * 3 + 2] = it[2];
    iAttr[k * 4] = it[3]; iAttr[k * 4 + 1] = it[4]; iAttr[k * 4 + 2] = it[5]; iAttr[k * 4 + 3] = it[6];
    iInfo[k * 4] = it[7]; iInfo[k * 4 + 1] = it[8]; iInfo[k * 4 + 2] = it[9]; iInfo[k * 4 + 3] = 0;
    iCol[k * 3] = it[10].r; iCol[k * 3 + 1] = it[10].g; iCol[k * 3 + 2] = it[10].b;
    iGlass[k * 3] = it[11].r; iGlass[k * 3 + 1] = it[11].g; iGlass[k * 3 + 2] = it[11].b;
  }
  geo.setAttribute('iPos', new THREE.InstancedBufferAttribute(iPos, 3));
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.setAttribute('iInfo', new THREE.InstancedBufferAttribute(iInfo, 4));
  geo.setAttribute('iCol', new THREE.InstancedBufferAttribute(iCol, 3));
  geo.setAttribute('iGlass', new THREE.InstancedBufferAttribute(iGlass, 3));
  geo.instanceCount = n;

  var S = App.skyU;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
      uNight: S.uNight, uZenith: S.uZenith, uCloudL: S.uCloudL, uCloudD: S.uCloudD,
      uLit: { value: new THREE.Color(R.pick(['#ffd9a0', '#ffe6bd', '#ffcf8a'])) },
      uCitySeed: { value: R.range(0, 100) }
    },
    extensions: { derivatives: true },
    vertexShader: [
      'attribute vec3 iPos; attribute vec4 iAttr; attribute vec4 iInfo; attribute vec3 iCol; attribute vec3 iGlass;',
      'uniform float uFogDensity;',
      'varying vec3 vN; varying vec3 vL; varying float vFog; varying vec3 vSize; varying vec3 vW;',
      'varying vec4 vInfo; varying vec3 vCol; varying vec3 vGlass;',
      GLSL_COMMON,
      'void main(){',
      '  float w = iAttr.x, rot = iAttr.y;',
      '  vec3 sz = vec3(w, w * iAttr.z, w * iAttr.w);',
      '  vec3 lp = position * sz;',
      '  float c = cos(rot), s2 = sin(rot);',
      '  vec3 wp = iPos + vec3(lp.x * c - lp.z * s2, lp.y, lp.x * s2 + lp.z * c);',
      '  vN = normalize(vec3(normal.x * c - normal.z * s2, normal.y, normal.x * s2 + normal.z * c));',
      '  vL = position; vSize = sz; vW = wp;',
      '  vInfo = iInfo; vCol = iCol; vGlass = iGlass;',
      '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
      '  vFog = fogAmtH(-mv.z, uFogDensity, wp.y);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform vec3 uSunDir, uSunCol, uAmbCol, uFogCol, uLit, uZenith, uCloudL, uCloudD;',
      'uniform float uNight, uTime, uShadow, uCitySeed;',
      'varying vec3 vN; varying vec3 vL; varying float vFog; varying vec3 vSize; varying vec3 vW;',
      'varying vec4 vInfo; varying vec3 vCol; varying vec3 vGlass;',
      'float h21(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }',

  scene.add(m);
  App.propMeshes.push(m);

/* ---------- a lighthouse beacon, turning ---------- */
function buildBeacon(scene, P, R, U, x, y, z, sz) {
  var quad = new THREE.PlaneGeometry(1, 1);
  var mat = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uCamPos: U.uCamPos, uNight: App.skyU.uNight,

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    vertexShader: [
      'uniform vec3 uCamPos, uOrigin; uniform float uScale, uTime, uNight;',
      'varying vec2 vUv; varying float vA;',
      'void main(){',

      '  float sweep = pow(max(sin(uTime * 0.78), 0.0), 8.0);',

  m.renderOrder = 8;

  App.propMeshes.push(m);
}

/* A bridge across the gorge, in one of four styles, with cars crossing it.

  P.bridgeSpan = span; P.bridgeW = deckW; P.bridgeTh = th; P.bridgeRoad = roadHalf * 2;

  for (i = 0; i < trims.length; i += 2) for (var t2 = trims[i]; t2 < trims[i + 1]; t2++) B.rib[t2] = 1;

function buildBridge(scene, P, R, U, H) {
  var col = { suspension: '#9aa2a6', arch: '#8e9498', girder: '#6f5a4a', stone: '#a3968a' }[P.bridgeKind];
  /* no foot to darken: the bridge's origin is its deck, not the ground */
  var mat = solidMat(U, col, { rib: 0, grain: 0, spines: 0, body2: '#36373a', twoTone: 1, aoH: 0 });
  var geo = bridgeGeo(P, R, H);
  var at = [[0, P.bridgeDeck, P.bridgeZ, 1, 0, 1, 1]];
  instanceSolid(scene, geo, at, mat);
  instanceSolid(scene, P.bridgeLines, at, solidMat(U, '#d9d7d0', { rib: 0, grain: 0, spines: 0, aoH: 0 }));
  /* the banks are earth grown over with grass */
  var bank = new THREE.Color(P.grass.base).lerp(new THREE.Color(P.grass.soil), 0.35);
  instanceSolid(scene, P.bridgeBank, at, solidMat(U, '#' + bank.getHexString(), { rib: 0, grain: 0, spines: 0, aoH: 0 }));
  var glows = [];
  for (var li = 0; li < P.bridgeLamps.length; li++) {
    var lp = P.bridgeLamps[li];
    glows.push([lp[0], P.bridgeDeck + lp[1], P.bridgeZ + lp[2], 1.1, 1.6, 1.3, 0.9, 0]);
  }
  buildGlows(scene, U, glows);
  App._shadows.push([0, P.bridgeDeck, P.bridgeZ, P.bridgeSpan * 0.22, 0.75, 2]);
  buildTraffic(scene, P, R, U, {
    x: 0, y: P.bridgeDeck + P.bridgeTh * 0.5, z: P.bridgeZ, len: P.bridgeRoad, dir: [1, 0],
    lanes: [-P.bridgeW * 0.22, P.bridgeW * 0.22], rate: P.trafficRate, speed: [20, 25]
  });
}

/* Vehicles along a straight road through o.x, o.z running along o.dir (a
   unit vector in the ground plane), o.len long, one lane at each offset in
   o.lanes across it (a positive offset runs with o.dir, a negative one
   against it). Speeds are in metres a second, one per lane, so cars in a
   lane never run through each other. o.parked: offsets of kerbside lanes of
   parked cars, o.parkLen of them along the middle of the road, nose to tail
   six to eight metres apart with gaps, none across a junction (o.skip(along)
   says where one is). A car is two boxes, a body and a glazed cabin set in
   on it; a lorry a cab and a box; and a dark patch under each for the
   shadow it stands in. */
function buildTraffic(scene, P, R, U, o) {
  var lanes = o.lanes.length;
  var perLane = Math.max(3, Math.round(o.spacing ? o.len / o.spacing : o.rate * 7));
  var cars = [];
  for (var L = 0; L < lanes; L++) {
    var laneSpeed = R.range(o.speed[0], o.speed[1]);
    for (var i = 0; i < perLane; i++)
      cars.push([o.lanes[L], o.lanes[L] >= 0 ? 1 : -1, laneSpeed, (i + R.range(-0.35, 0.35)) / perLane]);
  }
  var parked = o.parked || [];
  for (var pk = 0; pk < parked.length; pk++) {
    for (var a = -o.parkLen * 0.5; a < o.parkLen * 0.5; a += R.range(6, 8)) {
      if (R.f() < 0.35 || (o.skip && o.skip(a))) continue;
      cars.push([parked[pk], parked[pk] >= 0 ? 1 : -1, 0, a / o.len + 0.5]);
    }
  }
  var N = cars.length;
  /* the template: three unit boxes, told apart by aPart (0 lower body, 1
     cabin or cargo box, 2 the shadow), shaped per vehicle in the shader */
  var tpl = new THREE.BoxGeometry(1, 1, 1);
  var tp = tpl.attributes.position.array, tn = tpl.attributes.normal.array, ti = tpl.index.array;
  var pos = [], nor = [], part = [], idx = [];
  for (var pt = 0; pt < 3; pt++) {
    var base = pos.length / 3;
    for (var v = 0; v < tp.length; v++) { pos.push(tp[v]); nor.push(tn[v]); }
    for (var v2 = 0; v2 < tp.length / 3; v2++) part.push(pt);
    for (var v3 = 0; v3 < ti.length; v3++) idx.push(ti[v3] + base);
  }
  tpl.dispose();
  var geo = new THREE.InstancedBufferGeometry();
  geo.setIndex(idx);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('aPart', new THREE.Float32BufferAttribute(part, 1));
  var iAttr = new Float32Array(N * 4), iCol = new Float32Array(N * 3), iLane = new Float32Array(N * 4);
  var carCols = ['#c8ccd0', '#2f3438', '#8d2f2a', '#2c4a72', '#c9a23a', '#3e6b46', '#d8d2c4', '#6a6d70', '#1d1f22', '#e8e6e0', '#5b6168'];
  for (var m = 0; m < N; m++) {
    var truck = R.f() < (cars[m][2] > 0 ? 0.16 : 0.05);
    iAttr[m * 4] = truck ? R.range(7, 11) : R.range(3.9, 4.9);       /* length */
    iAttr[m * 4 + 1] = truck ? R.range(2.6, 3.4) : R.range(1.4, 1.6); /* height */
    iAttr[m * 4 + 2] = truck ? R.range(2.4, 2.55) : R.range(1.75, 1.95); /* width */
    iAttr[m * 4 + 3] = cars[m][3];                                      /* start along the line */
    var c = new THREE.Color(truck ? R.pick(['#d8d2c4', '#8d8f92', '#2f3438', '#e6e4de']) : R.pick(carCols));
    iCol[m * 3] = c.r; iCol[m * 3 + 1] = c.g; iCol[m * 3 + 2] = c.b;
    iLane[m * 4] = cars[m][0];
    iLane[m * 4 + 1] = cars[m][1];                                      /* which way it faces */
    iLane[m * 4 + 2] = cars[m][2];                                      /* metres a second */
    iLane[m * 4 + 3] = truck ? 1 : 0;
  }
  geo.setAttribute('iAttr', new THREE.InstancedBufferAttribute(iAttr, 4));
  geo.setAttribute('iCol', new THREE.InstancedBufferAttribute(iCol, 3));
  geo.setAttribute('iLane', new THREE.InstancedBufferAttribute(iLane, 4));
  geo.instanceCount = N;
  var mat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uSunDir: U.uSunDir, uSunCol: U.uSunCol, uAmbCol: U.uAmbCol,
      uFogCol: U.uFogCol, uFogDensity: U.uFogDensity, uHazeK: U.uHazeK, uCamPos: U.uCamPos,
      uShadow: U.uShadow, uShadowMap: U.uShadowMap, uShadowOrigin: U.uShadowOrigin, uShadowScale: U.uShadowScale,
      uNight: App.skyU.uNight,
      uOrigin: { value: new THREE.Vector3(o.x || 0, o.y, o.z) },
      uDir: { value: new THREE.Vector2(o.dir[0], o.dir[1]).normalize() },
      uLen: { value: o.len }
    },
    extensions: { derivatives: true },
    vertexShader: [
      'attribute vec4 iAttr; attribute vec3 iCol; attribute vec4 iLane; attribute float aPart;',
      'uniform float uTime, uFogDensity, uLen, uShadow, uNight;',
      'uniform vec2 uDir;',
      'uniform vec3 uOrigin, uCamPos, uSunDir, uSunCol, uAmbCol, uFogCol;',
      'varying vec3 vCol; varying float vFog; varying vec3 vHaze; varying vec3 vLoc; varying float vEnd; varying float vPart; varying vec3 vNl; varying vec2 vKind;',
      GLSL_COMMON,
      'void main(){',
      '  float dir = iLane.y, truck = iLane.w;',
      '  float u = fract(iAttr.w + uTime * iLane.z / uLen * dir + 1.0);',
      '  float along = (u - 0.5) * uLen;',
      '  vec2 across = vec2(-uDir.y, uDir.x);',
      /* each part's box within the vehicle (x along it, y up, z across),
         as fractions of length, height and width */
      '  vec3 lo = vec3(-0.5, 0.10, -0.5), hi = vec3(0.5, 0.52, 0.5);',
      '  if (aPart > 0.5 && aPart < 1.5) { lo = mix(vec3(-0.30, 0.52, -0.42), vec3(-0.5, 0.10, -0.5), truck); hi = mix(vec3(0.20, 1.0, 0.42), vec3(0.24, 1.0, 0.5), truck); }',
      '  if (aPart < 0.5) { lo = mix(lo, vec3(0.27, 0.10, -0.47), truck); hi = mix(hi, vec3(0.5, 0.80, 0.47), truck); }',
      '  if (aPart > 1.5) { lo = vec3(-0.53, 0.0, -0.56); hi = vec3(0.53, 0.012, 0.56); }',
      /* facing back down the road: the same shape mirrored (bounds, not a
         negative scale, which would turn the faces inside out) */
      '  if (dir < 0.0) { float t0 = lo.x; lo.x = -hi.x; hi.x = -t0; }',
      '  vec3 q = mix(lo, hi, position + 0.5);',
      '  vec3 lp = q * vec3(iAttr.x, iAttr.y, iAttr.z);',
      '  vec2 xz = uOrigin.xz + uDir * (along + lp.x) + across * (iLane.x + lp.z);',
      '  vec3 p = vec3(xz.x, uOrigin.y + lp.y + 0.02, xz.y);',
      '  vec2 nxz = uDir * normal.x + across * normal.z;',
      '  vec3 n = normalize(vec3(nxz.x, normal.y, nxz.y));',
      '  float diff = max(dot(n, normalize(uSunDir)), 0.0);',
      '  float sh = mix(1.0 - uShadow, 1.0, cloudShade(xz, uTime)) * mix(0.03, 1.0, baked(xz));',
      '  vCol = iCol * (hemi(n, uAmbCol * 1.1) + uSunCol * diff * 1.05 * sh);',
      /* paint and glass catch the sky on their tops */
      '  vCol += uFogCol * 0.10 * smoothstep(0.5, 0.9, n.y);',
      '  vCol = mix(vCol, vec3(0.025) * (1.0 + uAmbCol), step(1.5, aPart));',
      /* which end this face is: +1 the front, -1 the back, 0 a side */
      '  vEnd = normal.x * dir; vKind = vec2(truck, step(0.1, iLane.z));',
      '  vLoc = position; vPart = aPart; vNl = normal;',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  vFog = fogAmtH(-mv.z, uFogDensity, p.y);',
      '  vHaze = hazeAt(uFogCol, normalize(p - cameraPosition), uSunDir, uSunCol, vFog);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      GLSL_TONE,
      'uniform float uNight;',
      'varying vec3 vCol; varying float vFog; varying vec3 vHaze; varying vec3 vLoc; varying float vEnd; varying float vPart; varying vec3 vNl; varying vec2 vKind;',
      'void main(){',
      '  vec3 c = vCol;',
      /* A car's cabin is glass all round below its roof; a lorry's cab is
         glazed in its upper half and its box is blank. A dark band of tyres
         and sill runs along the foot of the body. */
      '  float truck = vKind.x, p0 = 1.0 - step(0.5, vPart), p1 = step(0.5, vPart) * step(vPart, 1.5);',
      '  float wall = 1.0 - step(0.5, abs(vNl.y));',
      '  float fw = fwidth(vLoc.y);',
      '  float pane = mix(smoothstep(-0.42 - fw, -0.30 + fw, vLoc.y) * (1.0 - smoothstep(0.32 - fw, 0.42 + fw, vLoc.y)),',
      '                   smoothstep(0.0 - fw, 0.08 + fw, vLoc.y) * (1.0 - smoothstep(0.38 - fw, 0.46 + fw, vLoc.y)) * (1.0 - step(0.5, -vEnd)), truck);',
      '  float glass = mix(p1, p0, truck) * wall * pane;',
      '  c = mix(c, vec3(0.05, 0.06, 0.07) + vHaze * 0.18, glass * 0.92);',
      '  float lowK = mix(p0, p0 + p1, truck);',
      '  c *= 1.0 - 0.75 * lowK * wall * (1.0 - smoothstep(mix(-0.30, -0.40, truck), mix(-0.18, -0.30, truck), vLoc.y));',
      /* A pair of lamps at each end: warm white headlights in front, red
         tail lights behind, lit while the vehicle is moving. Once a lamp is
         under a pixel it fades to its share of the end face, so it cannot
         flicker. */
      '  float front = smoothstep(0.5, 0.9, vEnd), back = smoothstep(0.5, 0.9, -vEnd);',
      '  float onLamp = mix(p0, p0 * front + p1 * back, truck);',
      '  vec2 lq = vec2((abs(vLoc.z) - 0.33) / 0.11, (vLoc.y - mix(0.22, -0.26, truck)) / mix(0.13, 0.07, truck));',
      '  float d = length(lq), fd = fwidth(d);',
      '  float spot = 1.0 - smoothstep(0.7 - fd, 1.0 + fd, d);',
      '  spot = mix(spot, 0.12, smoothstep(0.6, 2.5, fd)) * onLamp * vKind.y;',
      '  c += (vec3(1.0, 0.92, 0.76) * 2.4 * front + vec3(1.0, 0.10, 0.06) * 1.5 * back) * spot * uNight;',
      '  gl_FragColor = vec4(tone(mix(c, vHaze, vFog)), 1.0);',
      '}'
